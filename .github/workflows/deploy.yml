name: Build & Deploy Louise Pro

# Runs on every push to main. Builds the precompiled dist/ and deploys
# it via GitHub Pages. Before this takes effect, change the repo's
# Settings -> Pages -> Source from "Deploy from a branch" to
# "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one deploy at a time. cancel-in-progress:true — se duas runs
# disparam quase juntas pro mesmo push (visto 2x: v11.9.117 e o redeploy
# vazio seguinte — provável corrida entre um push manual e o hook de
# auto-push do fim de turno), a run mais velha é cancelada de forma limpa
# em vez de deixar as duas competirem pelo mesmo deploy do GitHub Pages,
# onde uma delas falhava com erro real (não cancelamento). Como cada run
# builda o MESMO commit, cancelar a mais velha nunca perde trabalho —
# a run nova reproduz o mesmo dist/ e termina o deploy sozinha.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    # No nível do JOB pra que o `if` do step de deploy consiga ler (um `env` declarado
    # dentro do próprio step só existe DEPOIS que a condição já foi avaliada).
    env:
      FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install build deps
        working-directory: build
        run: npm install --no-audit --no-fund

      - name: Build dist/
        run: node build/build.mjs

      - name: Sanity check output
        run: |
          # Check that expected files exist in dist/. The build.mjs itself
          # errors hard if the JSX block can't be found or compiled, so we
          # trust its output here and don't regex over dist/index.html
          # (which contains changelog text with literal examples of
          # `<script type="text/babel">` and `@babel/standalone`).
          test -f dist/index.html
          test -f dist/manifest.json
          test -f dist/sw.js
          test -f dist/firebase-messaging-sw.js
          test -d dist/js
          test -d dist/assets

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # v11.9.147: deploy PARALELO pro Firebase Hosting (louise-pro.web.app).
      # Fase de transição: os 2 endereços servem a mesma versão enquanto o William troca os
      # atalhos dos 2 iPhones. Depois disso o Pages sai e este vira o único.
      # O step é CONDICIONAL ao secret existir — sem ele o CI segue verde e só publica no
      # Pages, em vez de falhar o build inteiro por causa de credencial ausente.
      - name: Deploy to Firebase Hosting (se o secret estiver configurado)
        if: ${{ env.FIREBASE_SA != '' }}
        run: |
          printf '%s' "$FIREBASE_SA" > "$RUNNER_TEMP/fb-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/fb-sa.json"
          npx --yes firebase-tools@latest deploy --only hosting --project louise-pro --non-interactive
          rm -f "$RUNNER_TEMP/fb-sa.json"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
