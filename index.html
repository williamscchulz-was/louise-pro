    {/* ─────────────────────────────────────────────
        v11.9.4 RELATÓRIO SEMANAL (4 semanas)
        Agregação Mon-Sun de cada semana com tendências.
        ─────────────────────────────────────────────*/}
    {(()=>{try{
      const buckets=[];
      for(let w=3;w>=0;w--){
        const startD=new Date();startD.setDate(startD.getDate()-(w*7)-6);
        const endD=new Date();endD.setDate(endD.getDate()-(w*7));
        const wDates=[];
        for(let i=0;i<7;i++){const d=new Date(startD);d.setDate(d.getDate()+i);wDates.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`)}
        const wSet=new Set(wDates);
        const wEntries=entries.filter(e=>wSet.has(e.date));
        const sleepsMain=wEntries.filter(e=>e.type==="sleep"&&e.durationMin&&!(e.id||"").endsWith("_b"));
        const napsRawW=wEntries.filter(e=>e.type==="nap"&&e.durationMin&&!(e.id||"").endsWith("_b"));
        const bottlesW=wEntries.filter(e=>e.type==="bottle");
        const diapersW=wEntries.filter(e=>e.type==="diaper");
        const simetW=wEntries.filter(e=>e.type==="medicine"&&e.name&&/simet/i.test(e.name));
        const daysWithData=new Set(wEntries.map(e=>e.date)).size||1;
        const nightsCount=sleepsMain.length||1;
        // v11.9.20 fix: merge halves cross-midnight ANTES de somar.
        // Antes só contava pré-meia-noite (`_b` filtrado), perdendo o resto da noite.
        // Mesma lógica do engine v11.7.9. Sibling pode estar em entries fora do bucket
        // (next-day quando noite cruza fronteira de semana).
        const mergeSleep=(e)=>{
          const sibling=entries.find(x=>x&&x.id===e.id+"_b");
          if(!sibling)return{dur:e.durationMin||0,wakings:e.wakings||[]};
          return{
            dur:(e.durationMin||0)+(sibling.durationMin||0),
            wakings:(e.wakings||[]).concat(sibling.wakings||[])
          };
        };
        const mergedSleeps=sleepsMain.map(mergeSleep);
        const totalSleepMin=mergedSleeps.reduce((s,m)=>{
          const awake=m.wakings.reduce((a,w)=>a+(w.durationMin||0),0);
          return s+Math.max(0,m.dur-awake);
        },0);
        const totalAwakeMin=mergedSleeps.reduce((s,m)=>s+m.wakings.reduce((a,w)=>a+(w.durationMin||0),0),0);
        const totalWakings=mergedSleeps.reduce((s,m)=>s+m.wakings.length,0);
        // Naps: same merge mas raro cruzar meia-noite. napsW expandido pra incluir merged.
        const napsMerged=napsRawW.map(mergeSleep);
        const napsW=napsRawW; // mantido pra count
        const napTotalMin=napsMerged.reduce((s,m)=>s+m.dur,0);
        buckets.push({
          weekIdx:4-w,
          isCurrent:w===0,
          shortLabel:w===0?(_lang==="en"?"This":"Atual"):`S${4-w}`,
          range:`${startD.getDate()}/${startD.getMonth()+1}–${endD.getDate()}/${endD.getMonth()+1}`,
          daysWithData,
          avgSleep:Math.round(totalSleepMin/nightsCount),
          avgAwake:Math.round(totalAwakeMin/nightsCount),
          avgWakings:Math.round((totalWakings/nightsCount)*10)/10,
          avgNapMin:Math.round(napTotalMin/daysWithData),
          avgNapCount:Math.round((napsW.length/daysWithData)*10)/10,
          avgNapDur:napsW.length?Math.round(napTotalMin/napsW.length):0,
          avgNapLong:napsMerged.length?Math.round(Math.max(...napsMerged.map(m=>m.dur))):0,
          avgMl:Math.round(bottlesW.reduce((s,e)=>s+(e.ml||0),0)/daysWithData),
          avgFeeds:Math.round((bottlesW.length/daysWithData)*10)/10,
          avgDiapers:Math.round((diapersW.length/daysWithData)*10)/10,
          avgPoop:Math.round((diapersW.filter(e=>e.subtype==="dirty"||e.subtype==="both").length/daysWithData)*10)/10,
          avgWet:Math.round((diapersW.filter(e=>e.subtype==="wet"||e.subtype==="both").length/daysWithData)*10)/10,
          totalSimet:simetW.length,
        });
      }
      // Filtra semanas sem dado pra não poluir
      const validBuckets=buckets.filter(b=>b.daysWithData>=1);
      if(validBuckets.length<2)return null;
      const cur=validBuckets[validBuckets.length-1];
      const prev=validBuckets[validBuckets.length-2];
      const pctDiff=(curV,prevV)=>{if(!prevV)return 0;return Math.round(((curV-prevV)/prevV)*100)};
      const Trend=({val,inverse})=>{if(!val||Math.abs(val)<3)return<span style={{fontSize:T.fXS,color:T.dim,fontWeight:600,marginLeft:4}}>≈</span>;const good=inverse?val<0:val>0;return<span style={{display:"inline-flex",alignItems:"center",gap:2,fontSize:T.fXS,fontWeight:700,padding:"1px 5px",borderRadius:5,marginLeft:5,background:good?"rgba(74,222,128,0.1)":"rgba(248,113,113,0.1)",color:good?T.green:"#fca5a5",fontVariantNumeric:"tabular-nums"}}>{val>0?"↑":"↓"} {Math.abs(val)}%</span>};
      const sectionH=({icon,label,col})=><div style={{display:"flex",alignItems:"center",gap:7,margin:"14px 4px 8px",fontSize:T.fSM,color:T.dim,fontWeight:700,textTransform:"uppercase",letterSpacing:0.5}}><Icon name={icon} size={12} color={col}/>{label}</div>;
      // Mini bar chart helper
      const miniBar=(values,col,fmt)=>{
        const mx=Math.max(...values,1);
        return(<><div style={{display:"flex",alignItems:"flex-end",gap:5,height:48,marginTop:8,padding:"0 2px",position:"relative"}}>
          {values.map((v,i)=><div key={i} style={{flex:1,position:"relative"}}>
            <span style={{position:"absolute",bottom:`calc(${Math.max((v/mx)*100,4)}% + 2px)`,left:"50%",transform:"translateX(-50%)",fontSize:T.fXS,fontWeight:700,color:T.sub,fontVariantNumeric:"tabular-nums",whiteSpace:"nowrap",opacity:0.85}}>{v>0?(fmt==="dur"?fmtDur(v).replace(" ",""):v):""}</span>
            <div style={{height:`${Math.max((v/mx)*100,4)}%`,background:`linear-gradient(180deg,${col},${col}30)`,borderRadius:"3px 3px 0 0",opacity:i===values.length-1?1:0.55}}/>
          </div>)}
        </div>
        <div style={{display:"flex",gap:5,marginTop:4,padding:"0 2px"}}>
          {validBuckets.map((b,i)=><span key={i} style={{flex:1,textAlign:"center",fontSize:T.fXS,color:i===validBuckets.length-1?T.accent:T.dim,fontWeight:700,letterSpacing:0.4}}>{b.shortLabel}</span>)}
        </div></>);
      };
      const cardStyle={background:"linear-gradient(180deg,rgba(22,28,60,0.6),rgba(20,26,60,0.45))",border:`1px solid ${T.gBSoft}`,borderRadius:14,padding:"12px 14px 12px",marginBottom:8,boxShadow:T.insetTop};
      const topRow=(ic,col,lab,val,trend)=><div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
        <div style={{width:24,height:24,borderRadius:8,background:`${col}1a`,border:`1px solid ${col}33`,display:"flex",alignItems:"center",justifyContent:"center"}}><Icon name={ic} size={12} color={col}/></div>
        <span style={{fontSize:T.fSM,color:T.dim,textTransform:"uppercase",letterSpacing:0.4,fontWeight:700}}>{lab}</span>
        <span style={{marginLeft:"auto",fontSize:T.fLG,fontWeight:800,color:col,fontVariantNumeric:"tabular-nums",letterSpacing:-0.2}}>{val}{trend}</span>
      </div>;
      const subRow=(k,v)=><div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",fontSize:T.fSM,color:T.sub,fontVariantNumeric:"tabular-nums",marginTop:3}}><span style={{fontWeight:600}}>{k}</span><span style={{fontWeight:700,color:T.text}}>{v}</span></div>;
      // v11.9.21: gera texto compartilhável da semana atual.
      const buildShareText=()=>{
        const lines=[];
        lines.push(_lang==="en"?`Louise · this week (${cur.range})`:`Louise · esta semana (${cur.range})`);
        lines.push("");
        if(cur.avgSleep>0)lines.push(`🌙 ${_lang==="en"?"Sleep":"Sono"}: ${fmtDur(cur.avgSleep)}/${_lang==="en"?"night":"noite"}${cur.avgWakings>0?` · ${cur.avgWakings} ${_lang==="en"?"wakings":"despertares"}`:""}`);
        if(cur.avgNapDur>0)lines.push(`☁️ ${_lang==="en"?"Naps":"Sonecas"}: ${fmtDur(cur.avgNapDur)} × ${cur.avgNapCount}/${_lang==="en"?"day":"dia"} (${fmtDur(cur.avgNapMin)} ${_lang==="en"?"total":"total"})`);
        if(cur.avgMl>0)lines.push(`🍼 ${_lang==="en"?"Bottles":"Mamadeiras"}: ${fmtMl(cur.avgMl)}/${_lang==="en"?"day":"dia"} (${fmtMl(Math.round(cur.avgMl/Math.max(1,cur.avgFeeds)))} × ${cur.avgFeeds}/${_lang==="en"?"day":"dia"})`);
        if(cur.avgDiapers>0)lines.push(`🧷 ${_lang==="en"?"Diapers":"Fraldas"}: ${cur.avgDiapers}/${_lang==="en"?"day":"dia"} (💧${cur.avgWet} 💩${cur.avgPoop})`);
        if(cur.totalSimet>0)lines.push(`💊 ${_lang==="en"?"Simethicone":"Simeticona"}: ${cur.totalSimet}x`);
        return lines.join("\n");
      };
      const onShare=async()=>{
        const text=buildShareText();
        const title=_lang==="en"?"Louise weekly":"Louise · semana";
        try{
          if(navigator.share){
            await navigator.share({title,text});
            Haptic.success();
            return;
          }
        }catch(_){/* user cancelled or unsupported */}
        try{
          await navigator.clipboard.writeText(text);
          alert(_lang==="en"?"Copied to clipboard":"Copiado pra área de transferência");
        }catch(_){alert(_lang==="en"?"Couldn't copy — please screenshot":"Não consegui copiar — tira print")}
      };
      return(<div style={{marginTop:24,marginBottom:8}}>
        <div style={{display:"flex",alignItems:"center",gap:8,padding:"6px 4px 4px",borderTop:`1px solid ${T.gBSoft}`,paddingTop:18}}>
          <h2 style={{fontSize:T.fLG,fontWeight:800,margin:0,letterSpacing:-0.3}}>{_lang==="en"?"Weekly report":"Relatório semanal"}</h2>
          <span style={{fontSize:T.fSM,color:T.dim,fontWeight:600,letterSpacing:0.3}}>{validBuckets.length} {_lang==="en"?"weeks":"semanas"}</span>
          <button aria-label={_lang==="en"?"Share this week":"Compartilhar semana"} onClick={onShare} style={{marginLeft:"auto",width:32,height:32,borderRadius:10,background:"rgba(139,124,246,0.12)",border:"1px solid rgba(139,124,246,0.28)",display:"flex",alignItems:"center",justifyContent:"center"}}>
            <Icon name="share" size={14} color={T.accent}/>
          </button>
        </div>
        <div style={{fontSize:T.fSM,color:T.dim,padding:"0 4px 12px"}}>{_lang==="en"?"Average per day, weekly buckets":"Média por dia, fechado por semana"} · {cur.range}</div>

        {sectionH({icon:"bed",label:_lang==="en"?"Sleep":"Sono",col:T.purple})}
        <div style={cardStyle}>
          {topRow("bed",T.purple,_lang==="en"?"Real sleep/night":"Sono real/noite",fmtDur(cur.avgSleep),<Trend val={pctDiff(cur.avgSleep,prev.avgSleep)}/>)}
          {miniBar(validBuckets.map(b=>b.avgSleep),T.purple,"dur")}
          {cur.avgAwake>0&&subRow(_lang==="en"?"Awake (window)":"Acordada (janela)",fmtDur(cur.avgAwake))}
          {cur.avgWakings>0&&subRow(_lang==="en"?"Wakings/night":"Despertares/noite",`${cur.avgWakings}`)}
        </div>

        {sectionH({icon:"cloud",label:_lang==="en"?"Naps":"Sonecas",col:T.accent})}
        <div style={cardStyle}>
          {/* v11.9.5: metrica principal vira tempo medio POR SONECA (nao por dia). */}
          {topRow("cloud",T.accent,_lang==="en"?"Avg per nap":"Por soneca (média)",cur.avgNapDur>0?fmtDur(cur.avgNapDur):"—",<Trend val={pctDiff(cur.avgNapDur,prev.avgNapDur)}/>)}
          {miniBar(validBuckets.map(b=>b.avgNapDur),T.accent,"dur")}
          {cur.avgNapCount>0&&subRow(_lang==="en"?"Naps/day":"Sonecas/dia",cur.avgNapCount)}
          {cur.avgNapMin>0&&subRow(_lang==="en"?"Total time/day":"Tempo total/dia",fmtDur(cur.avgNapMin))}
          {cur.avgNapLong>0&&subRow(_lang==="en"?"Longest nap":"Soneca mais longa",fmtDur(cur.avgNapLong))}
        </div>

        {sectionH({icon:"bottle",label:_lang==="en"?"Bottles":"Mamadeiras",col:T.green})}
        <div style={cardStyle}>
          {topRow("bottle",T.green,_lang==="en"?"Volume/day":"Volume/dia",fmtMl(cur.avgMl),<Trend val={pctDiff(cur.avgMl,prev.avgMl)}/>)}
          {miniBar(validBuckets.map(b=>b.avgMl),T.green)}
          {cur.avgFeeds>0&&subRow(_lang==="en"?"Feeds/day":"Mamadas/dia",cur.avgFeeds)}
          {cur.avgFeeds>0&&cur.avgMl>0&&subRow(_lang==="en"?"Avg per feed":"Por mamada (média)",fmtMl(Math.round(cur.avgMl/cur.avgFeeds)))}
        </div>

        {sectionH({icon:"diaper",label:_lang==="en"?"Diapers":"Fraldas",col:T.pink})}
        <div style={cardStyle}>
          {topRow("diaper",T.pink,_lang==="en"?"Diapers/day":"Fraldas/dia",cur.avgDiapers,<Trend val={pctDiff(cur.avgDiapers,prev.avgDiapers)}/>)}
          {miniBar(validBuckets.map(b=>b.avgDiapers),T.pink)}
          {cur.avgWet>0&&subRow(_lang==="en"?"💧 Wet/day":"💧 Xixi/dia",cur.avgWet)}
          {cur.avgPoop>0&&subRow(_lang==="en"?"💩 Poop/day":"💩 Cocô/dia",cur.avgPoop)}
        </div>

        {cur.totalSimet>0&&<>
          {sectionH({icon:"medicine",label:_lang==="en"?"Medicines":"Medicamentos",col:T.amber})}
          <div style={cardStyle}>
            {topRow("medicine",T.amber,_lang==="en"?"Simethicone/week":"Simeticona/semana",cur.totalSimet+"x",<Trend val={pctDiff(cur.totalSimet,prev.totalSimet)} inverse={true}/>)}
            {miniBar(validBuckets.map(b=>b.totalSimet),T.amber)}
          </div>
        </>}
      </div>);
    }catch(e){console.warn("[WeeklyReport] render error",e);return null}})()}
  </div>);
});

// HistoryPage memoizado (v11.2) — mesmo motivo do StatsPage.
const HistoryPage = React.memo(function HistoryPage({entries,onDelete,onEdit,activeTimer,lang}){

    if(filter==="feed")return e.type==="bottle"||e.type==="nursing";

    return e.type===filter;

  const dMl=dayE.filter(e=>e.type==="bottle").reduce((s,e)=>s+(e.ml||0),0);
  const dSl=sumRealSleep(dayE);

  const dDiapers=dayE.filter(e=>e.type==="diaper");
  const dWet=dDiapers.filter(e=>e.subtype==="wet"||e.subtype==="both").length;
  const dDirty=dDiapers.filter(e=>e.subtype==="dirty"||e.subtype==="both").length;
  // v11.9.15: header da data em History combina relativo + completo. Ex: "Ontem · 26 abril"
  const dLong=new Date(viewDate+"T12:00").toLocaleDateString(_lang==="pt"?"pt-BR":"en-US",{day:"numeric",month:"long"});
  const dRel=fmtRelDate(viewDate);
  const dLbl=dRel===dLong?dLong:`${dRel} · ${dLong}`;
  const isToday=dateIdx===0;
  // Note: live in-progress bedtime is NOT shown here. It only appears in Home.

  const filters=[{v:"all",l:L("all"),c:T.accent},{v:"feed",l:L("milk"),c:T.green},{v:"sleep",l:L("sleepLabel"),c:T.purple},{v:"diaper",l:typeLabel("diaper",_lang),c:T.pink},{v:"medicine",l:_lang==="en"?"Meds":"Med.",c:T.amber}];
  // Specific type filters (feed/diaper/medicine) → flat chronological list, include

  const listItems=isSpecificFilter

      const bedtime=findContainingBedtime(e,entries);
      return<EntryRow key={e.id} entry={e} lang={lang} onDelete={onDelete} onEdit={onEdit} nightBadge={!!bedtime}/>;
    })
    :filtered.filter(e=>{
      if(e.nightWake)return false;
      // Only hide events contained in a bedtime if that bedtime is actually being rendered
      // on the current viewed day (as SleepBlock). Otherwise the event becomes an invisible
      // orphan — e.g. a night bottle during a bedtime that started the previous day. v10.4.5.
      const cb=findContainingBedtime(e,entries);
      if(cb){
        const renderedHere=cb.date===viewDate&&cb.wakings&&cb.wakings.length>0;
        if(renderedHere)return false;
      }
      return true;
    }).map(e=>(e.type==="sleep"&&e.wakings&&e.wakings.length>0)?<SleepBlock key={e.id} entry={e} lang={lang} onDelete={onDelete} onEdit={onEdit} entries={entries} activeTimer={activeTimer} onSaveTimer={FB.saveTimer} onSaveEntry={FB.addEntry}/>:<EntryRow key={e.id} entry={e} lang={lang} onDelete={onDelete} onEdit={onEdit}/>);
  // v11.9.19: search results agregados por dia, ordenados desc.
  const searchResults=searchActive?(()=>{
    const q=searchQuery.trim().toLowerCase();
    const matches=entries.filter(e=>{
      if(!e)return false;
      const t=(e.type||"").toLowerCase();

    });

    for(const e of matches){if(!byDate[e.date])byDate[e.date]=[];byDate[e.date].push(e)}
    return Object.keys(byDate).sort((a,b)=>b.localeCompare(a)).map(d=>({date:d,items:byDate[d].sort((a,b)=>(b.time||"").localeCompare(a.time||""))}));
  })():null;
  return(<div style={{padding:"calc(16px + env(safe-area-inset-top)) 20px 0"}}>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
      <h2 style={{fontSize:T.fXL,fontWeight:700,margin:0}}>{L("history")}</h2>
      <button aria-label={searchOpen?(_lang==="en"?"Close search":"Fechar busca"):(_lang==="en"?"Search":"Buscar")} onClick={()=>{const v=!searchOpen;setSearchOpen(v);if(!v)setSearchQuery("")}} style={{width:34,height:34,borderRadius:11,background:searchOpen?"rgba(139,124,246,0.15)":"rgba(22,28,60,0.6)",border:`1px solid ${searchOpen?"rgba(139,124,246,0.32)":T.gBSoft}`,display:"flex",alignItems:"center",justifyContent:"center"}}>

    {searchOpen&&<div style={{marginBottom:14}}>
      <div style={{position:"relative"}}>
        <input type="search" autoFocus inputMode="search" placeholder={_lang==="en"?"Search by name, type, ml, dose…":"Buscar por nome, tipo, ml, dose…"} value={searchQuery} onChange={e=>setSearchQuery(e.target.value)} style={{width:"100%",padding:"14px 40px 14px 16px",borderRadius:14,background:"rgba(20,26,60,0.55)",border:`1px solid ${searchActive?"rgba(139,124,246,0.4)":T.gBSoft}`,color:T.text,fontSize:T.fLG,fontWeight:500,outline:"none",WebkitAppearance:"none",appearance:"none",boxShadow:T.insetTop}}/>
        {searchQuery&&<button aria-label={_lang==="en"?"Clear":"Limpar"} onClick={()=>setSearchQuery("")} style={{position:"absolute",right:8,top:"50%",transform:"translateY(-50%)",width:28,height:28,borderRadius:8,background:"rgba(14,18,48,0.6)",border:"none",display:"flex",alignItems:"center",justifyContent:"center",color:T.dim}}><Icon name="x" size={12} color={T.dim}/></button>}
      </div>
      {searchActive&&<div style={{fontSize:T.fSM,color:T.dim,marginTop:8,padding:"0 4px",fontWeight:600,letterSpacing:0.2}}>{searchResults.reduce((s,g)=>s+g.items.length,0)} {_lang==="en"?"results across":"resultados em"} {searchResults.length} {_lang==="en"?"days":"dias"}</div>}
    </div>}
    {searchActive?(<div>
      {searchResults.length===0?<div style={{textAlign:"center",padding:"50px 20px",color:T.dim}}>
        <Icon name="search" size={28} color={T.dim}/>
        <div style={{fontSize:T.fMD,marginTop:10,fontWeight:600}}>{_lang==="en"?"No matches":"Nenhum resultado"}</div>
        <div style={{fontSize:T.fSM,color:T.dim,marginTop:4}}>{_lang==="en"?"Try a different term":"Tente um termo diferente"}</div>
      </div>:searchResults.map(g=>(<div key={g.date} style={{marginBottom:18}}>
        <div style={{fontSize:T.fSM,fontWeight:700,color:T.dim,letterSpacing:0.6,textTransform:"uppercase",marginBottom:8,padding:"0 4px"}}>{fmtRelDate(g.date)} <span style={{color:T.sub,fontWeight:500,letterSpacing:0,textTransform:"none",marginLeft:4}}>· {g.items.length} {_lang==="en"?(g.items.length===1?"item":"items"):(g.items.length===1?"item":"itens")}</span></div>
        {g.items.map(e=>(e.type==="sleep"&&e.wakings&&e.wakings.length>0)?<SleepBlock key={e.id} entry={e} lang={lang} onDelete={onDelete} onEdit={onEdit} entries={entries} activeTimer={activeTimer} onSaveTimer={FB.saveTimer} onSaveEntry={FB.addEntry}/>:<EntryRow key={e.id} entry={e} lang={lang} onDelete={onDelete} onEdit={onEdit}/>)}
      </div>))}
    </div>):(<>
    {/* Date navigator card */}
    <div style={{background:"linear-gradient(180deg,rgba(22,28,60,0.55),rgba(20,26,60,0.4))",borderRadius:20,border:`1px solid ${T.gBSoft}`,padding:"18px 18px 16px",marginBottom:14,boxShadow:T.insetTop}}>
      <div style={{display:"flex",alignItems:"center",gap:12}}>
        <button onClick={()=>setDateIdx(dateIdx+1)} style={{width:38,height:38,borderRadius:12,background:"rgba(22,28,60,0.6)",border:`1px solid ${T.gBSoft}`,display:"flex",alignItems:"center",justifyContent:"center",boxShadow:T.insetTop}}><Icon name="back" size={14} color={T.sub}/></button>
        <div style={{flex:1,textAlign:"center",position:"relative"}}>
          {/* v11.9.18: tap no header da data abre picker pra jump rápido */}
          <input type="date" value={viewDate} max={todayStr()} onChange={e=>{
            const v=e.target.value;if(!v)return;
            const a=new Date(todayStr()+"T12:00");const b=new Date(v+"T12:00");
            if(isNaN(b))return;
            const diff=Math.max(0,Math.round((a-b)/86400000));
            setDateIdx(diff);
          }} aria-label={_lang==="en"?"Jump to date":"Pular para data"} style={{position:"absolute",inset:0,opacity:0,cursor:"pointer",WebkitAppearance:"none",appearance:"none",border:"none",background:"transparent"}}/>
          {/* v11.9.36: chevron sutil revela que o header é tappable (date picker) */}
          <div style={{fontSize:T.fXL,fontWeight:800,color:isToday?T.accent:T.text,letterSpacing:-0.3,pointerEvents:"none",display:"inline-flex",alignItems:"center",gap:5}}>
            <span>{isToday?L("today"):dLbl}</span>
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" style={{opacity:0.45}}><polyline points="6 9 12 15 18 9"/></svg>
          </div>
          <div style={{display:"flex",justifyContent:"center",gap:10,fontSize:T.fSM,color:T.sub,marginTop:7,flexWrap:"wrap",alignItems:"center"}}>
            {dMl>0&&<span style={{display:"inline-flex",alignItems:"center",gap:4,fontWeight:600,fontVariantNumeric:"tabular-nums"}}><Icon name="bottle" size={11} color={T.green}/>{dMl}ml</span>}
            {dSl>0&&<><span style={{width:3,height:3,borderRadius:"50%",background:T.dim}}/><span style={{display:"inline-flex",alignItems:"center",gap:4,fontWeight:600,fontVariantNumeric:"tabular-nums"}}><Icon name="bed" size={11} color={T.purple}/>{fmtDur(dSl)}</span></>}
            {(dWet>0||dDirty>0)&&<><span style={{width:3,height:3,borderRadius:"50%",background:T.dim}}/><span style={{display:"inline-flex",alignItems:"center",gap:4,color:"#93c5fd",fontWeight:600,fontVariantNumeric:"tabular-nums"}}><Icon name="droplet" size={11} color="#93c5fd"/>{dWet}</span><span style={{display:"inline-flex",alignItems:"center",gap:4,color:"#a16b4a",fontWeight:600,fontVariantNumeric:"tabular-nums"}}><Icon name="poop" size={11} color="#a16b4a"/>{dDirty}</span></>}
            <span style={{width:3,height:3,borderRadius:"50%",background:T.dim}}/>
            <span style={{fontWeight:600,fontVariantNumeric:"tabular-nums"}}>{dayE.length} {L("reg")}</span>
          </div>
        </div>
        <button onClick={()=>setDateIdx(Math.max(0,dateIdx-1))} disabled={isToday} style={{width:38,height:38,borderRadius:12,background:"rgba(22,28,60,0.6)",border:`1px solid ${T.gBSoft}`,display:"flex",alignItems:"center",justifyContent:"center",opacity:isToday?0.3:1,boxShadow:T.insetTop}}><Icon name="forward" size={14} color={T.sub}/></button>
      </div>
    </div>
    {/* Type filters */}
    <div style={{display:"flex",gap:6,marginBottom:14,overflowX:"auto",paddingBottom:2}}>
      {filters.map(f=>{const isActive=filter===f.v;return<button key={f.v} onClick={()=>setFilter(f.v)} style={{padding:"9px 16px",borderRadius:12,fontSize:T.fMD,fontWeight:600,whiteSpace:"nowrap",letterSpacing:-0.1,background:isActive?`linear-gradient(180deg,${f.c}38,${f.c}12)`:"rgba(22,28,60,0.5)",color:isActive?f.c:T.sub,border:`1px solid ${isActive?f.c+"55":T.gBSoft}`,boxShadow:isActive?`0 1px 0 0 rgba(255,255,255,0.1) inset, 0 0 0 1px ${f.c}25, 0 6px 16px -8px ${f.c}50`:T.insetTop}}>{f.l}</button>})}
    </div>
    {filtered.length===0?(<div style={{padding:"48px 24px 20px",textAlign:"center"}}>
      <div style={{width:58,height:58,borderRadius:18,background:"rgba(139,124,246,0.08)",border:"1px solid rgba(139,124,246,0.15)",display:"inline-flex",alignItems:"center",justifyContent:"center",marginBottom:16,color:"rgba(196,181,253,0.5)"}}><Icon name="clock" size={26} color="rgba(196,181,253,0.5)"/></div>
      <div style={{fontSize:T.fLG,fontWeight:700,color:T.heading,letterSpacing:-0.2,marginBottom:6}}>{_lang==="en"?"No events this day":"Nenhum evento neste dia"}</div>
      <div style={{fontSize:T.fMD,color:T.sub,lineHeight:1.55,maxWidth:240,margin:"0 auto"}}>{filter!=="all"?(_lang==="en"?"Try changing the filter or switching to another day.":"Tente mudar o filtro ou ir para outro dia."):(_lang==="en"?"Tap + below to register the first.":"Toque + abaixo para registrar o primeiro.")}</div>
    </div>):listItems}
    </>)}
  </div>);
});

// ── GROWTH PAGE with WHO percentiles ──
// Helper: parse decimal string accepting both comma and dot (pt-BR friendly)
const parseGrowthDecimal=(s)=>{
  if(s===undefined||s===null)return undefined;
  const str=String(s).trim();
  if(!str)return undefined;
  const n=parseFloat(str.replace(",","."));
  return isNaN(n)?undefined:n;
};
// Helper: format number back to display with comma in pt
const formatGrowthVal=(v)=>{
  if(v===undefined||v===null||v==="")return "";
  const s=String(v);
  return _lang==="pt"?s.replace(".",","):s;
};

function GrowthPage({entries,birthDate,profile,onBack,onAddEntry,onDeleteEntry}){
  const growthEntries=entries.filter(e=>e.type==="growth").sort((a,b)=>`${a.date}T${a.time}`.localeCompare(`${b.date}T${b.time}`));
  const age=calcAge(birthDate);
  const ageMonths=age?(age.months+(age.days/30)):0;
  const[showForm,setShowForm]=useState(false);
  const[editingId,setEditingId]=useState(null);
  const[fDate,setFDate]=useState(todayStr());
  const[wK,setWK]=useState("");const[lC,setLC]=useState("");const[hC,setHC]=useState("");

  // Find existing growth entry on a date (excluding current edit target)
  const findByDate=(date,excludeId)=>growthEntries.find(e=>e.date===date&&e.id!==excludeId);
  const mergeTarget=!editingId?findByDate(fDate,null):null;
  const isEdit=!!editingId;

  // Build all data points: birth + entries
  const allPoints=[];
  if(profile.birthWeight||profile.birthLength||profile.birthHead){
    allPoints.push({ageM:0,date:birthDate,weightKg:profile.birthWeight,lengthCm:profile.birthLength,headCm:profile.birthHead,label:_lang==="en"?"Birth":"Nasc.",isBirth:true});
  }
  growthEntries.forEach(e=>{
    const eAge=calcAge(birthDate);
    if(!eAge)return;
    const d1=new Date(birthDate),d2=new Date(e.date);
    const mths=(d2.getFullYear()-d1.getFullYear())*12+d2.getMonth()-d1.getMonth()+(d2.getDate()-d1.getDate())/30;
    allPoints.push({ageM:Math.max(0,mths),date:e.date,weightKg:e.weightKg,lengthCm:e.lengthCm,headCm:e.headCm,label:new Date(e.date+"T12:00").toLocaleDateString(_lang==="pt"?"pt-BR":"en-US",{day:"numeric",month:"short"}),entryId:e.id});
  });
  const latest=allPoints[allPoints.length-1];

  const resetForm=()=>{
    setShowForm(false);setEditingId(null);
    setFDate(todayStr());
    setWK("");setLC("");setHC("");
  };

  const openNew=()=>{
    setEditingId(null);
    setFDate(todayStr());
    setWK("");setLC("");setHC("");
    setShowForm(true);
  };

  const openEdit=(entryId)=>{
    const e=growthEntries.find(g=>g.id===entryId);
    if(!e)return;
    setEditingId(entryId);
    setFDate(e.date);
    setWK(e.weightKg!==undefined?formatGrowthVal(e.weightKg):"");
    setLC(e.lengthCm!==undefined?formatGrowthVal(e.lengthCm):"");
    setHC(e.headCm!==undefined?formatGrowthVal(e.headCm):"");
    setShowForm(true);
  };

  // In edit mode, also consider existing values so empty fields don't fail validation
  const hasAnyValue=()=>{
    const w=parseGrowthDecimal(wK),l=parseGrowthDecimal(lC),h=parseGrowthDecimal(hC);
    if(w!==undefined||l!==undefined||h!==undefined)return true;
    if(isEdit){
      const orig=growthEntries.find(g=>g.id===editingId);
      if(orig&&(orig.weightKg!==undefined||orig.lengthCm!==undefined||orig.headCm!==undefined))return true;
    }
    return false;
  };

  const doSave=()=>{
    const w=parseGrowthDecimal(wK),l=parseGrowthDecimal(lC),h=parseGrowthDecimal(hC);
    if(!hasAnyValue())return;
    let targetEntry;
    if(isEdit){
      const orig=growthEntries.find(g=>g.id===editingId);
      if(!orig)return;
      targetEntry={...orig,date:fDate};
    }else if(mergeTarget){
      targetEntry={...mergeTarget,date:fDate};
    }else{
      targetEntry={type:"growth",date:fDate,time:nowTime(),id:uid()};
    }
    // Apply provided fields (empty fields preserve existing values in merge/edit)
    if(w!==undefined)targetEntry.weightKg=w;
    if(l!==undefined)targetEntry.lengthCm=l;
    if(h!==undefined)targetEntry.headCm=h;
    onAddEntry(targetEntry);
    resetForm();
  };

  const doDelete=()=>{
    if(!editingId)return;
    const msg=_lang==="en"?"Delete this measurement?":"Excluir esta medição?";
    if(!confirm(msg))return;
    if(onDeleteEntry)onDeleteEntry(editingId);
    resetForm();
  };

  // Mini chart for a metric
  function GrowthChart({label,field,table,color}){
    const pts=allPoints.filter(p=>p[field]);
    if(pts.length<1)return null;
    // WHO P3, P50, P97 curves
    const maxAge=Math.max(ageMonths+1,3);
    const whoSteps=[];for(let m=0;m<=maxAge;m+=maxAge/20){
      const lms=interpolateLMS(table,m);
      const z3=lms.M*Math.pow(1+lms.L*lms.S*(-1.88),1/lms.L);
      const z97=lms.M*Math.pow(1+lms.L*lms.S*1.88,1/lms.L);
      whoSteps.push({m,p3:Math.abs(lms.L)>0.001?z3:lms.M*Math.exp(-1.88*lms.S),p50:lms.M,p97:Math.abs(lms.L)>0.001?z97:lms.M*Math.exp(1.88*lms.S)});
    }
    const allVals=[...whoSteps.map(w=>w.p97),...whoSteps.map(w=>w.p3),...pts.map(p=>p[field])];
    const minV=Math.min(...allVals)*0.9,maxV=Math.max(...allVals)*1.05;
    const W=320,H=140;
    const x=m=>10+(m/maxAge)*(W-20);
    const y=v=>H-10-((v-minV)/(maxV-minV))*(H-20);
    const pathStr=(arr,key)=>arr.map((p,i)=>`${i===0?"M":"L"}${x(p.m).toFixed(1)},${y(p[key]).toFixed(1)}`).join(" ");
    return(<div style={{marginBottom:16}}>
      <div style={{fontSize:T.fMD,fontWeight:700,color,marginBottom:6}}>{label}</div>
      <svg width={W} height={H} viewBox={`0 0 ${W} ${H}`} style={{width:"100%",height:"auto",background:T.glass,borderRadius:12,border:`1px solid ${T.gB}`}}>
        <path d={pathStr(whoSteps,"p3")+" L"+x(maxAge)+","+y(whoSteps[whoSteps.length-1].p97)+" "+pathStr([...whoSteps].reverse(),"p97")} fill={`${color}08`} stroke="none"/>
        <path d={pathStr(whoSteps,"p50")} fill="none" stroke={`${color}44`} strokeWidth="1" strokeDasharray="4,3"/>
        <path d={pathStr(whoSteps,"p3")} fill="none" stroke={`${color}22`} strokeWidth="0.5"/>
        <path d={pathStr(whoSteps,"p97")} fill="none" stroke={`${color}22`} strokeWidth="0.5"/>
        {pts.map((p,i)=><circle key={i} cx={x(p.ageM)} cy={y(p[field])} r={4} fill={color} stroke={T.bg1} strokeWidth={2}/>)}
        {pts.length>1&&<path d={pts.map((p,i)=>`${i===0?"M":"L"}${x(p.ageM).toFixed(1)},${y(p[field]).toFixed(1)}`).join(" ")} fill="none" stroke={color} strokeWidth="2"/>}
        <text x={W-4} y={y(whoSteps[whoSteps.length-1].p50)+4} textAnchor="end" fill={`${color}66`} fontSize="8">P50</text>
        <text x={W-4} y={y(whoSteps[whoSteps.length-1].p97)+4} textAnchor="end" fill={`${color}44`} fontSize="7">P97</text>
        <text x={W-4} y={y(whoSteps[whoSteps.length-1].p3)+4} textAnchor="end" fill={`${color}44`} fontSize="7">P3</text>
      </svg>
    </div>);
  }

  // PercentileCard: read-only display now (no quick-add — use the unified form instead)
  function PercentileCard({label,value,unit,table,icon}){
    if(!value)return(<div style={{background:T.glass,borderRadius:14,padding:14,marginBottom:8,border:`1px solid ${T.gB}`,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
      <div style={{display:"flex",alignItems:"center",gap:8}}><Icon name={icon} size={14} color={T.dim}/><span style={{fontSize:T.fMD,fontWeight:600,color:T.dim}}>{label}</span></div>
      <span style={{fontSize:T.fSM,color:T.dim,fontStyle:"italic"}}>{_lang==="en"?"no data yet":"sem dados ainda"}</span>
    </div>);
    const result=getPercentile(value,table,ageMonths);
    const p=result?.percentile;
    const pColor=!p?T.dim:p<3||p>97?T.red:p<15||p>85?T.orange:T.green;
    return(<div style={{background:T.glass,borderRadius:14,padding:14,marginBottom:8,border:`1px solid ${T.gB}`}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
        <div style={{display:"flex",alignItems:"center",gap:8}}><Icon name={icon} size={14} color={pColor}/><span style={{fontSize:T.fMD,fontWeight:700}}>{label}</span></div>
        <span style={{fontSize:T.fXL,fontWeight:800}}>{formatGrowthVal(value)} {unit}</span>
      </div>
      <div style={{display:"flex",alignItems:"center",gap:10}}>
        <div style={{flex:1,height:6,borderRadius:3,background:T.bg3,overflow:"hidden",position:"relative"}}>
          <div style={{position:"absolute",left:"3%",width:1,height:"100%",background:T.dim,opacity:0.3}}/>
          <div style={{position:"absolute",left:"50%",width:1,height:"100%",background:T.dim,opacity:0.5}}/>
          <div style={{position:"absolute",left:"97%",width:1,height:"100%",background:T.dim,opacity:0.3}}/>
          <div style={{position:"absolute",left:`${Math.max(1,Math.min(99,p))}%`,transform:"translateX(-50%)",width:8,height:8,borderRadius:"50%",background:pColor,top:-1,boxShadow:`0 0 6px ${pColor}88`}}/>
        </div>
        <span style={{fontSize:T.fLG,fontWeight:800,color:pColor,minWidth:35,textAlign:"right"}}>P{p}</span>
      </div>
      <div style={{fontSize:T.fSM,color:T.sub,marginTop:4}}>{_lang==="en"?"WHO Median":"Mediana OMS"}: {result.median.toFixed(1)} {unit}</div>
    </div>);
  }

  const inp={...INP_BASE,padding:"15px 12px",borderRadius:14,textAlign:"center"};
  const dateInp={...inp,fontSize:T.fLG,padding:"13px 12px"};

  // Format merge target date for notice (e.g. "13/04")
  const mergeTargetLabel=mergeTarget?new Date(mergeTarget.date+"T12:00").toLocaleDateString(_lang==="pt"?"pt-BR":"en-US",{day:"numeric",month:"short"}):"";
  const editTargetLabel=isEdit?(()=>{
    const e=growthEntries.find(g=>g.id===editingId);
    return e?new Date(e.date+"T12:00").toLocaleDateString(_lang==="pt"?"pt-BR":"en-US",{day:"numeric",month:"long"}):"";
  })():"";

  return(<div style={{padding:"calc(16px + env(safe-area-inset-top)) 20px 0"}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
      <div style={{display:"flex",alignItems:"center",gap:10}}><button onClick={onBack} style={{width:32,height:32,borderRadius:10,background:T.glass,border:`1px solid ${T.gB}`,display:"flex",alignItems:"center",justifyContent:"center"}}><Icon name="back" size={16} color={T.sub}/></button><h2 style={{fontSize:T.fXL,fontWeight:700,margin:0}}>{L("growth")}</h2></div>
      <button onClick={()=>showForm?resetForm():openNew()} style={{padding:"6px 12px",borderRadius:10,background:"rgba(163,230,53,0.1)",border:"1px solid rgba(163,230,53,0.2)",fontSize:T.fMD,fontWeight:700,color:"#a3e635"}}>{showForm?L("cancel"):(_lang==="en"?"+ Measure":"+ Medição")}</button>
    </div>

    {showForm&&<div style={{background:T.glass,borderRadius:14,padding:16,marginBottom:16,border:`1px solid ${T.gB}`}}>
      <div style={{fontSize:T.fMD,fontWeight:700,color:T.sub,marginBottom:12}}>{isEdit?(_lang==="en"?"Edit measurement":"Editar medição"):(_lang==="en"?"New measurement":"Nova medição")}</div>

      {isEdit&&<div style={{padding:"10px 12px",background:"rgba(139,124,246,0.1)",border:"1px solid rgba(139,124,246,0.25)",borderRadius:10,display:"flex",gap:8,alignItems:"center",marginBottom:12}}>
        <Icon name="pencil" size={14} color="#c4b5fd"/>
        <div style={{fontSize:T.fSM,color:T.lilac,lineHeight:1.4,flex:1,fontWeight:600}}>{_lang==="en"?"Editing measurement from":"Editando medição de"} <b>{editTargetLabel}</b></div>
      </div>}

      <Fld label={_lang==="en"?"Date":"Data"}><input type="date" value={fDate} onChange={e=>setFDate(e.target.value)} style={dateInp}/></Fld>

      {mergeTarget&&!isEdit&&<div style={{padding:"10px 12px",background:"rgba(251,191,36,0.08)",border:"1px solid rgba(251,191,36,0.2)",borderRadius:10,display:"flex",gap:8,alignItems:"center",margin:"12px 0"}}>
        <Icon name="zap" size={14} color="#fbbf24"/>
        <div style={{fontSize:T.fSM,color:"#fbbf24",lineHeight:1.4,flex:1}}>{_lang==="en"?<>Measurement already exists on <b>{mergeTargetLabel}</b> — filled fields will <b>update</b> that entry.</>:<>Já existe medição em <b>{mergeTargetLabel}</b> — campos preenchidos irão <b>atualizar</b> essa entrada.</>}</div>
      </div>}

      <div style={{display:"grid",gridTemplateColumns:"minmax(0,1fr) minmax(0,1fr) minmax(0,1fr)",gap:8,marginTop:12,marginBottom:8}}>
        <Fld label={`${L("weight")} (kg)`}><input type="text" inputMode="decimal" placeholder={_lang==="pt"?"4,5":"4.5"} value={wK} onChange={e=>setWK(e.target.value)} style={inp}/></Fld>
        <Fld label={`${_lang==="en"?"Length":"Comp."} (cm)`}><input type="text" inputMode="decimal" placeholder="55" value={lC} onChange={e=>setLC(e.target.value)} style={inp}/></Fld>
        <Fld label={`${L("head")} (cm)`}><input type="text" inputMode="decimal" placeholder="37" value={hC} onChange={e=>setHC(e.target.value)} style={inp}/></Fld>
      </div>

      <div style={{fontSize:T.fSM,color:T.dim,margin:"6px 0 12px",textAlign:"center",lineHeight:1.5}}>
        {_lang==="en"?"Leave blank what wasn't measured · comma or dot":"Deixe em branco os que não foram medidos · vírgula ou ponto"}
      </div>

      <button onClick={doSave} disabled={!hasAnyValue()} style={{width:"100%",padding:12,borderRadius:10,background:hasAnyValue()?"#a3e635":"rgba(139,124,246,0.1)",color:hasAnyValue()?T.bg1:T.dim,fontSize:T.fLG,fontWeight:700,opacity:hasAnyValue()?1:0.6}}>{isEdit?(_lang==="en"?"Update measurement":"Atualizar medição"):(mergeTarget?(_lang==="en"?"Update measurement":"Atualizar medição"):(_lang==="en"?"Save measurement":"Salvar medição"))}</button>

      {isEdit&&<button onClick={doDelete} style={{background:"transparent",border:"none",color:T.red,fontSize:T.fMD,fontWeight:600,padding:10,marginTop:8,width:"100%"}}>{_lang==="en"?"Delete this measurement":"Excluir esta medição"}</button>}
    </div>}

    {/* Percentile cards */}
    {latest&&<div style={{fontSize:T.fSM,color:T.sub,marginBottom:10}}>
      {latest.isBirth?(_lang==="en"?"Birth data":L("birthData")):`${_lang==="en"?"Last":"Últ."}: ${latest.label}`} · {ageMonths.toFixed(1)} {_lang==="en"?"mo":"meses"}
    </div>}
    <PercentileCard label={L("weight")} value={latest?.weightKg} unit="kg" table={WHO_GIRLS.weight} icon="target"/>
    <PercentileCard label={L("length")} value={latest?.lengthCm} unit="cm" table={WHO_GIRLS.length} icon="ruler"/>
    <PercentileCard label={L("head")} value={latest?.headCm} unit="cm" table={WHO_GIRLS.head} icon="target"/>

    {/* Growth charts */}
    {allPoints.length>0&&<>
      <div style={{fontSize:T.fMD,fontWeight:600,color:T.dim,marginTop:16,marginBottom:10,textTransform:"uppercase",letterSpacing:0.8}}>{_lang==="en"?"Growth curves":"Curvas de crescimento"}</div>
      <GrowthChart label={`${L("weight")} (kg)`} field="weightKg" table={WHO_GIRLS.weight} color={T.green}/>
      <GrowthChart label={`${L("length")} (cm)`} field="lengthCm" table={WHO_GIRLS.length} color={T.blue}/>
      <GrowthChart label={`${L("head")} (cm)`} field="headCm" table={WHO_GIRLS.head} color={T.amber}/>
    </>}

    {/* History table (clickable rows, except Birth) */}
    {allPoints.length>0&&<><div style={{fontSize:T.fMD,fontWeight:600,color:T.dim,marginTop:8,marginBottom:10,textTransform:"uppercase",letterSpacing:0.8}}>{_lang==="en"?"History":"Histórico"}</div>
      {[...allPoints].reverse().map((p,i)=>{
        const clickable=!p.isBirth&&p.entryId;
        const rowStyle={display:"flex",alignItems:"center",gap:12,padding:"10px 12px",marginBottom:4,background:T.glass,borderRadius:10,border:`1px solid ${T.gB}`,width:"100%",textAlign:"left",cursor:clickable?"pointer":"default",opacity:p.isBirth?0.75:1};
        const content=<>
          <span style={{fontSize:T.fSM,color:T.sub,minWidth:50,fontWeight:600}}>{p.label}</span>
          <div style={{flex:1,display:"flex",gap:10,fontSize:T.fMD,flexWrap:"wrap"}}>
            {p.weightKg!==undefined&&<span style={{color:T.green,fontWeight:600}}>{formatGrowthVal(p.weightKg)}kg</span>}
            {p.lengthCm!==undefined&&<span style={{color:T.blue,fontWeight:600}}>{formatGrowthVal(p.lengthCm)}cm</span>}
            {p.headCm!==undefined&&<span style={{color:T.amber,fontWeight:600}}>{_lang==="en"?"Head":"Cab."} {formatGrowthVal(p.headCm)}</span>}
          </div>
          {p.isBirth?<span style={{fontSize:T.fXS,color:T.purple,background:"rgba(139,124,246,0.15)",padding:"2px 6px",borderRadius:4,fontWeight:700,letterSpacing:0.5}}>{_lang==="en"?"BIRTH":"NASC."}</span>:<div style={{width:26,height:26,borderRadius:7,background:"rgba(139,124,246,0.1)",border:"1px solid rgba(139,124,246,0.15)",display:"flex",alignItems:"center",justifyContent:"center"}}><Icon name="pencil" size={11} color="#a78bfa"/></div>}
        </>;
        return clickable?<button key={i} onClick={()=>openEdit(p.entryId)} style={rowStyle}>{content}</button>:<div key={i} style={rowStyle}>{content}</div>;
      })}
    </>}
    <div style={{marginTop:16,padding:12,background:T.glass,borderRadius:12,border:`1px solid ${T.gB}`,fontSize:T.fSM,color:T.dim,lineHeight:1.6}}>
      {_lang==="en"?"WHO curves for girls 0-24mo. Dashed line = P50 (median). Band = P3-P97.":"Curvas OMS para meninas 0-24m. Linha tracejada = P50 (mediana). Faixa = P3-P97."}
    </div>
  </div>);
}

// v11.9.61: 12 badges/conquistas pra dar vibe colecionável.
// Cada badge tem check(stats) e progress(stats) — stats agregadas dos entries.
const MILESTONE_BADGES = [
  {key:"first_light",emoji:"\u{1F31F}",label:{pt:"Primeira luz",en:"First light"},check:s=>s.total>=1,progress:s=>({c:Math.min(s.total,1),t:1})},
  {key:"five_lights",emoji:"⭐",label:{pt:"5 conquistas",en:"5 logged"},check:s=>s.total>=5,progress:s=>({c:Math.min(s.total,5),t:5})},
  {key:"ten_lights",emoji:"✨",label:{pt:"10 conquistas",en:"10 logged"},check:s=>s.total>=10,progress:s=>({c:Math.min(s.total,10),t:10})},
  {key:"newborn_pro",emoji:"\u{1F476}",label:{pt:"Recém-nascida",en:"Newborn"},check:s=>s.totalsByCheckup[0]>0&&s.byCheckup[0]>=s.totalsByCheckup[0],progress:s=>({c:s.byCheckup[0]||0,t:s.totalsByCheckup[0]||10})},
  {key:"checkup_6m",emoji:"\u{1F3AF}",label:{pt:"6 meses",en:"6 months"},check:s=>s.totalsByCheckup[6]>0&&s.byCheckup[6]>=s.totalsByCheckup[6],progress:s=>({c:s.byCheckup[6]||0,t:s.totalsByCheckup[6]||5})},
  {key:"checkup_12m",emoji:"\u{1F382}",label:{pt:"1 ano",en:"1 year"},check:s=>s.totalsByCheckup[12]>0&&s.byCheckup[12]>=s.totalsByCheckup[12],progress:s=>({c:s.byCheckup[12]||0,t:s.totalsByCheckup[12]||6})},
  {key:"checkup_24m",emoji:"\u{1F389}",label:{pt:"2 anos",en:"2 years"},check:s=>s.totalsByCheckup[24]>0&&s.byCheckup[24]>=s.totalsByCheckup[24],progress:s=>({c:s.byCheckup[24]||0,t:s.totalsByCheckup[24]||5})},
  {key:"motor_pro",emoji:"\u{1F3C3}",label:{pt:"Atleta",en:"Athlete"},check:s=>{const t=s.totalsByCat.motor_gross+s.totalsByCat.motor_fine;const c=s.byCat.motor_gross+s.byCat.motor_fine;return t>0&&c>=t},progress:s=>({c:s.byCat.motor_gross+s.byCat.motor_fine,t:s.totalsByCat.motor_gross+s.totalsByCat.motor_fine})},
  {key:"chatty",emoji:"\u{1F4AC}",label:{pt:"Tagarela",en:"Chatty"},check:s=>s.totalsByCat.language>0&&s.byCat.language>=s.totalsByCat.language,progress:s=>({c:s.byCat.language||0,t:s.totalsByCat.language||13})},
  {key:"charming",emoji:"\u{1F60A}",label:{pt:"Carismática",en:"Charming"},check:s=>s.totalsByCat.social_emotional>0&&s.byCat.social_emotional>=s.totalsByCat.social_emotional,progress:s=>({c:s.byCat.social_emotional||0,t:s.totalsByCat.social_emotional||22})},
  {key:"thinker",emoji:"\u{1F9E0}",label:{pt:"Pensadora",en:"Thinker"},check:s=>s.totalsByCat.cognitive>0&&s.byCat.cognitive>=s.totalsByCat.cognitive,progress:s=>({c:s.byCat.cognitive||0,t:s.totalsByCat.cognitive||6})},
  {key:"all_done",emoji:"\u{1F3C6}",label:{pt:"Tudo!",en:"All done!"},check:s=>s.allTotal>0&&s.total>=s.allTotal,progress:s=>({c:s.total,t:s.allTotal||54})},
];

// v11.9.56: Marcos de desenvolvimento (Timeline + picker). Dados em window.DEV_MILESTONES
// (~44 itens 0-24m, CDC 2022 + WHO MGRS + SBP) e window.CONCERNING_SIGNS (~17 itens).
// Note: window.MILESTONES (sem DEV_) ja existe em curiosities.js — sao curiosidades
// mensais (2-12m). Namespaces separados pra evitar collision.
// Entries com type:"milestone" guardam: key (chave do DEV_MILESTONES), category, date, note.
function MilestonesPage({entries,birthDate,profile,onBack,onAddEntry,onDeleteEntry}){
  const[confirmDelKey,setConfirmDelKey]=useState(null); // v11.9.65: 2-step inline delete (substitui confirm() nativo)
  const all=window.DEV_MILESTONES||[];
  const allSigns=window.CONCERNING_SIGNS||[];
  const milestoneEntries=entries.filter(e=>e.type==="milestone")
    .sort((a,b)=>`${b.date}T${b.time||"00:00"}`.localeCompare(`${a.date}T${a.time||"00:00"}`));
  const age=calcAge(birthDate);
  const ageMonths=age?.months||0;
  const checkups=[0,2,4,6,9,12,15,18,24];
  const currentCheckup=checkups.filter(c=>c<=ageMonths+1).slice(-1)[0]||2;
  const nextCheckup=checkups.find(c=>c>ageMonths);
  const doneKeys=new Set(milestoneEntries.map(e=>e.key));
  const upcoming=all.filter(m=>
    m.checkupAge>=Math.max(2,currentCheckup-2)&&
    m.checkupAge<=(nextCheckup||currentCheckup+3)&&
    !doneKeys.has(m.key)
  );
  const signs=allSigns.filter(s=>s.checkupAge<=ageMonths+2);
  // v11.9.61: stats agregadas pros badges (count por categoria + checkupAge)
  const badgeStats=useMemo(()=>{
    const byCat={motor_gross:0,motor_fine:0,language:0,social_emotional:0,cognitive:0};
    const byCheckup={0:0,2:0,4:0,6:0,9:0,12:0,15:0,18:0,24:0};
    const totalsByCat={motor_gross:0,motor_fine:0,language:0,social_emotional:0,cognitive:0};
    const totalsByCheckup={0:0,2:0,4:0,6:0,9:0,12:0,15:0,18:0,24:0};
    all.forEach(m=>{
      if(totalsByCat[m.category]!==undefined)totalsByCat[m.category]++;
      if(totalsByCheckup[m.checkupAge]!==undefined)totalsByCheckup[m.checkupAge]++;
    });
    milestoneEntries.forEach(e=>{
      const m=all.find(x=>x.key===e.key);
      if(!m)return;
      if(byCat[m.category]!==undefined)byCat[m.category]++;
      if(byCheckup[m.checkupAge]!==undefined)byCheckup[m.checkupAge]++;
    });
    return{total:milestoneEntries.length,byCat,byCheckup,totalsByCat,totalsByCheckup,allTotal:all.length};
  },[milestoneEntries,all]);
  const badges=MILESTONE_BADGES.map(b=>({...b,earned:b.check(badgeStats),progress:b.progress?b.progress(badgeStats):null}));
  const earnedBadges=badges.filter(b=>b.earned).length;
  const[showAdd,setShowAdd]=useState(false);
  const[showSigns,setShowSigns]=useState(false);
  const[pickedKey,setPickedKey]=useState(null);
  const[pickedDate,setPickedDate]=useState(todayStr());
  const[pickedNote,setPickedNote]=useState("");
  const[pickedCategory,setPickedCategory]=useState("all");
  const[busy,setBusy]=useState(false);
  const picked=pickedKey?all.find(m=>m.key===pickedKey):null;
  const catColors={motor_gross:T.cyan,motor_fine:T.cyan,language:T.amber,social_emotional:T.pink,cognitive:T.accent};
  const catLabels={motor_gross:L("catMotorGross"),motor_fine:L("catMotorFine"),language:L("catLanguage"),social_emotional:L("catSocial"),cognitive:L("catCognitive")};
  // v11.9.58: esconde nav pill enquanto picker aberto (senao Save fica atras)
  useEffect(()=>{
    if(!document.body)return;
    document.body.classList.toggle("milestone-picker-open",showAdd);
    return()=>{document.body.classList.remove("milestone-picker-open")};
  },[showAdd]);
  const saveMilestone=async()=>{
    if(!picked||busy)return;
    setBusy(true);
    Haptic.medium();
    const entry={
      id:`ms-${Date.now()}-${Math.random().toString(36).slice(2,8)}`,
      type:"milestone",
      key:picked.key,
      category:picked.category,
      date:pickedDate,
      time:"12:00",
    };
    if(pickedNote.trim())entry.note=pickedNote.trim();
    try{
      await onAddEntry(entry);
      Haptic.success();
      setShowAdd(false);
      setPickedKey(null);
      setPickedDate(todayStr());
      setPickedNote("");
    }catch(e){Haptic.warning()}
    setBusy(false);
  };
  return(<div style={{position:"fixed",inset:0,zIndex:200,maxWidth:480,margin:"0 auto",background:"radial-gradient(ellipse 140% 55% at 50% 100%, #1a1f52 0%, transparent 70%), radial-gradient(ellipse at 50% 0%, #10153d 0%, #070b1e 65%), #070b1e",overflowY:"auto",overflowX:"hidden",overscrollBehavior:"contain",WebkitOverflowScrolling:"touch",paddingTop:"env(safe-area-inset-top)",paddingBottom:"calc(100px + env(safe-area-inset-bottom))"}}>
    {/* Header */}
    <div style={{display:"flex",alignItems:"center",gap:10,padding:"16px 14px 14px 20px"}}>
      <button aria-label={_lang==="en"?"Back":"Voltar"} onClick={onBack} style={{width:36,height:36,borderRadius:10,background:T.glass,border:`1px solid ${T.gB}`,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}><Icon name="back" size={18} color={T.sub}/></button>
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontSize:T.fXL,fontWeight:800,letterSpacing:-0.2}}>{L("milestonesTitle")}</div>
        <div style={{fontSize:T.fSM,color:T.sub,marginTop:1,fontVariantNumeric:"tabular-nums"}}>{milestoneEntries.length} {L("milestonesDone")} · {ageMonths}m</div>
      </div>
      <button onClick={()=>{setPickedKey(null);setShowAdd(true)}} aria-label={_lang==="en"?"Add milestone":"Adicionar marco"} style={{width:40,height:40,borderRadius:12,background:"linear-gradient(135deg,#facc15,#f59e0b)",border:"none",display:"flex",alignItems:"center",justifyContent:"center",color:"#1a1f2e",fontSize:24,fontWeight:800,boxShadow:"0 4px 14px -4px rgba(250,204,21,0.5)",cursor:"pointer"}}>+</button>
    </div>
    {/* v11.9.61: Conquistas (badges grid) — earned gold glow, locked dim + progress */}
    <div style={{padding:"0 20px 14px"}}>
      <div style={{display:"flex",alignItems:"baseline",justifyContent:"space-between",marginBottom:10}}>
        <span style={{fontSize:T.fSM,fontWeight:800,color:T.accent,textTransform:"uppercase",letterSpacing:1,display:"flex",alignItems:"center",gap:6}}>
          <span style={{fontSize:T.fMD}}>{"\u{1F3C6}"}</span>
          {L("achievementsTitle")}
        </span>
        <span style={{fontSize:T.fXS,color:"#fcd34d",fontWeight:800,fontVariantNumeric:"tabular-nums",letterSpacing:0.3,textTransform:"uppercase"}}>{earnedBadges}/{badges.length} {L("earnedCount")}</span>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8}}>
        {badges.map(b=>{
          const isEarned=b.earned;
          return<div key={b.key} style={{aspectRatio:"1",borderRadius:14,background:isEarned?"radial-gradient(circle at 50% 30%,rgba(250,204,21,0.22),rgba(245,158,11,0.04))":"rgba(20,26,60,0.42)",border:`1px solid ${isEarned?"rgba(250,204,21,0.45)":"rgba(139,124,246,0.12)"}`,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"8px 4px",position:"relative",opacity:isEarned?1:0.35,boxShadow:isEarned?"0 0 14px -2px rgba(250,204,21,0.30)":"none",transition:"opacity .3s ease, box-shadow .3s ease"}}>
            <div style={{fontSize:26,marginBottom:5,filter:isEarned?"drop-shadow(0 0 6px rgba(250,204,21,0.5))":"none",lineHeight:1}}>{b.emoji}</div>
            <div style={{fontSize:T.fXS,fontWeight:800,color:isEarned?"#fcd34d":T.text,textTransform:"uppercase",letterSpacing:0.4,textAlign:"center",lineHeight:1.2,padding:"0 2px"}}>{b.label[_lang]||b.label.en}</div>
            {!isEarned&&b.progress&&<div style={{fontSize:9,color:"rgba(252,211,77,0.65)",marginTop:3,fontWeight:700,fontVariantNumeric:"tabular-nums"}}>{b.progress.c}/{b.progress.t}</div>}
          </div>
        })}
      </div>
    </div>
    {/* Upcoming */}
    {upcoming.length>0&&<div style={{padding:"0 20px 14px"}}>
      <div style={{fontSize:T.fSM,fontWeight:800,color:T.accent,textTransform:"uppercase",letterSpacing:1,marginBottom:10}}>{L("upcomingMilestones")}</div>
      <div style={{display:"flex",flexDirection:"column",gap:8}}>
        {upcoming.slice(0,4).map(m=>{
          const isExpected=m.checkupAge<=ageMonths+1;
          const col=catColors[m.category]||T.accent;
          return<button key={m.key} onClick={()=>{setPickedKey(m.key);setShowAdd(true)}} style={{padding:"10px 12px",borderRadius:12,background:`linear-gradient(135deg,${col}14,${col}06)`,border:`1px solid ${col}28`,display:"flex",alignItems:"center",gap:11,textAlign:"left",cursor:"pointer"}}>
            <div style={{width:32,height:32,borderRadius:9,background:`${col}1a`,border:`1px solid ${col}30`,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
              <Icon name="star" size={15} color={col}/>
            </div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:T.fMD,fontWeight:700,color:T.text,letterSpacing:-0.1}}>{m.label[_lang]||m.label.en}</div>
              <div style={{fontSize:T.fXS,color:T.dim,marginTop:1}}>{isExpected?L("expectedNow"):`${L("expectedAround")} ${m.checkupAge}m`}</div>
            </div>
            <div style={{fontSize:T.fXL,color:col,fontWeight:700,opacity:0.6}}>+</div>
          </button>
        })}
      </div>
    </div>}
    {/* Done timeline */}
    <div style={{padding:"0 20px 14px"}}>
      <div style={{fontSize:T.fSM,fontWeight:800,color:T.accent,textTransform:"uppercase",letterSpacing:1,marginBottom:14}}>{_lang==="en"?"Achieved":"Conquistados"}</div>
      {milestoneEntries.length===0?<div style={{padding:"30px 20px",textAlign:"center",color:T.dim,fontSize:T.fMD,lineHeight:1.5}}>{L("noMilestonesYet")}</div>:
        <div style={{position:"relative",paddingLeft:24}}>
          <div style={{position:"absolute",left:9,top:0,bottom:0,width:1,background:`linear-gradient(180deg,${T.accent}88,${T.accent}11)`}}/>
          {milestoneEntries.map(e=>{
            const m=all.find(x=>x.key===e.key);
            const cat=e.category||m?.category||"social_emotional";
            const col=catColors[cat]||T.accent;
            return<div key={e.id} style={{position:"relative",paddingBottom:16}}>
              <div style={{position:"absolute",left:-19,top:4,width:11,height:11,borderRadius:"50%",background:col,border:"2px solid #070b1e",boxShadow:`0 0 0 1px ${col}88`}}/>
              <div style={{fontSize:T.fXS,fontWeight:800,color:T.accent,textTransform:"uppercase",letterSpacing:0.8,marginBottom:3,fontVariantNumeric:"tabular-nums"}}>{new Date(e.date+"T12:00").toLocaleDateString(_lang==="pt"?"pt-BR":"en-US",{day:"numeric",month:"short",year:"numeric"})}</div>
              <div style={{fontSize:T.fMD,fontWeight:700,color:T.text,letterSpacing:-0.1,display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
                <span>{m?(m.label[_lang]||m.label.en):e.key}</span>
                <span style={{fontSize:T.fXS,fontWeight:700,color:col,padding:"1px 6px",borderRadius:5,background:`${col}1a`,letterSpacing:0.3,textTransform:"uppercase"}}>{catLabels[cat]||""}</span>
              </div>
              {e.note&&<div style={{fontSize:T.fSM,color:T.sub,lineHeight:1.45,marginTop:3}}>{e.note}</div>}
              <button aria-label={confirmDelKey===e.id?(_lang==="en"?"Confirm delete":"Confirmar exclusão"):(_lang==="en"?"Delete":"Excluir")} onClick={()=>{if(confirmDelKey!==e.id){setConfirmDelKey(e.id);if(window.Haptic&&Haptic.warning)Haptic.warning();setTimeout(()=>setConfirmDelKey(prev=>prev===e.id?null:prev),3000);return}setConfirmDelKey(null);onDeleteEntry(e.id)}} style={{fontSize:T.fXS,color:confirmDelKey===e.id?"#fca5a5":T.dim,marginTop:6,padding:"7px 12px",minHeight:36,background:confirmDelKey===e.id?"rgba(248,113,113,0.16)":"transparent",border:confirmDelKey===e.id?"1px solid rgba(248,113,113,0.5)":"1px solid transparent",borderRadius:9,cursor:"pointer",opacity:confirmDelKey===e.id?1:0.6,letterSpacing:0.2,fontWeight:confirmDelKey===e.id?700:500}}>{confirmDelKey===e.id?(_lang==="en"?"Tap to confirm":"Tocar p/ confirmar"):(_lang==="en"?"delete":"excluir")}</button>
            </div>
          })}
        </div>
      }
    </div>
    {/* Concerning signs collapsible */}
    {signs.length>0&&<div style={{padding:"0 20px 14px"}}>
      <button onClick={()=>setShowSigns(!showSigns)} style={{width:"100%",padding:"12px 14px",borderRadius:12,background:"rgba(20,26,60,0.32)",border:`1px solid ${T.gBSoft}`,display:"flex",alignItems:"center",gap:10,textAlign:"left",cursor:"pointer"}}>
        <Icon name="zap" size={16} color="#fb923c"/>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:T.fSM,fontWeight:700,color:T.text}}>{L("concerningSigns")}</div>
          <div style={{fontSize:T.fXS,color:T.dim,marginTop:1}}>{signs.length} {_lang==="en"?"items":"itens"}</div>
        </div>
        <div style={{transform:showSigns?"rotate(180deg)":"rotate(0)",transition:"transform .2s",color:T.dim,flexShrink:0}}>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2"><path d="M6 9l6 6 6-6"/></svg>
        </div>
      </button>
      {showSigns&&<div style={{marginTop:8,padding:"12px 14px",borderRadius:12,background:"rgba(251,146,60,0.06)",border:"1px solid rgba(251,146,60,0.18)"}}>
        <div style={{fontSize:T.fXS,color:T.dim,lineHeight:1.5,marginBottom:10,fontStyle:"italic"}}>{L("concerningSignsHelp")}</div>
        {signs.map(s=><div key={s.key} style={{display:"flex",alignItems:"flex-start",gap:8,padding:"6px 0",borderTop:"1px solid rgba(251,146,60,0.10)"}}>
          <span style={{color:"#fb923c",fontSize:T.fSM,fontWeight:800,marginTop:0}}>•</span>
          <span style={{fontSize:T.fSM,color:T.text,lineHeight:1.45,flex:1}}>{s.label[_lang]||s.label.en}</span>
        </div>)}
      </div>}
    </div>}
    {/* Source footer */}
    <div style={{padding:"10px 20px 20px",fontSize:T.fXS,color:T.dim,textAlign:"center",lineHeight:1.5}}>
      {L("source")}: CDC "Learn the Signs. Act Early." (Fev 2022) · WHO MGRS · SBP
    </div>
    {/* v11.9.60: Add picker — centrado vertical (era bottom sheet em v11.9.56) */}

                  <div style={{width:6,height:32,borderRadius:3,background:col,flexShrink:0}}/>

          <Fld label={_lang==="en"?"Date":"Data"}>
            <input type="date" value={pickedDate} onChange={e=>setPickedDate(e.target.value)} max={todayStr()} style={{width:"100%",padding:"14px 12px",background:"rgba(14,18,48,0.7)",border:`1px solid ${T.gBSoft}`,borderRadius:12,color:T.text,fontSize:T.fLG,fontWeight:700,textAlign:"center",fontVariantNumeric:"tabular-nums",outline:"none",colorScheme:"dark",boxSizing:"border-box"}}/>
          </Fld>
          <Fld label={L("addNote")}>
            <textarea value={pickedNote} onChange={e=>setPickedNote(e.target.value)} rows={3} placeholder={_lang==="en"?"e.g. smiled when I came in the room":"Ex: sorriu quando entrei no quarto"} style={{width:"100%",padding:"12px 14px",background:"rgba(14,18,48,0.7)",border:`1px solid ${T.gBSoft}`,borderRadius:12,color:T.text,fontSize:T.fMD,outline:"none",resize:"none",fontFamily:"inherit",boxSizing:"border-box"}}/>

    </div>}
  </div>);
}

// ── BACKUP SECTION (v11.2) ──
// Aparece no Profile entre "View growth" e "Louise Pro version". Duas operações:
// 1) Exportar: gera JSON + dispara download (browser salva em Files/iCloud/Downloads).
// 2) Importar: file picker → confirmação explícita → restaura.
// Também faz auto-export silencioso pra IndexedDB a cada 24h pra ter snapshot local recente
// independente do Firestore. Mostra "Último backup há Xh" em todas chamadas (manual ou auto).
const BACKUP_KEY = "lp_last_backup_at";
function fmtBackupAgo(ts, lang){
  if(!ts) return lang==="en"?"never":"nunca";
  const diffMin = Math.floor((Date.now()-ts)/60000);
  if(diffMin<1) return lang==="en"?"just now":"agora";
  if(diffMin<60) return `${diffMin}min`;
  const h = Math.floor(diffMin/60);
  if(h<24) return `${h}h`;
  const d = Math.floor(h/24);
  return lang==="en"?`${d}d ago`:`${d}d atrás`;
}
function downloadJSON(obj, filename){
  const blob = new Blob([JSON.stringify(obj, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{document.body.removeChild(a); URL.revokeObjectURL(url)},100);
}
function BackupSection(){
  // v11.4: backup vai pro Firestore (`config/backups/latest`, doc \u00fanico que sobrescreve).
  // Compartilhado entre os 2 devices do casal. Fallback de download local disponível pra
  // belt-and-suspenders. Auto-backup 24h no App root j\u00e1 usa saveBackup.
  const[backupMeta,setBackupMeta]=useState(null); // {updatedAt, size}
  const[busy,setBusy]=useState(false);
  const[msg,setMsg]=useState("");
  const fileRef=useRef(null);
  // Pega \u00faltimo backup do Firestore ao abrir Profile
  useEffect(()=>{
    (async()=>{
      try{
        // v11.9.0: loadBackupMeta lê só {updatedAt,size} (~80B) em vez do snapshot full (~900KB).
        const m=await FB.loadBackupMeta();
        if(m)setBackupMeta({updatedAt:m.updatedAt,size:m.size});
      }catch(e){/* offline, sem acesso — mostra "nunca" */}
    })();
  },[]);
  const lastAt=backupMeta?new Date(backupMeta.updatedAt).getTime():0;
  // "Fazer backup agora" — salva no Firestore (compartilhado entre os 2 devices).
  // v11.6: tamb\u00e9m marca a data de hoje em `lp_last_backup_date` pra o auto-backup
  // n\u00e3o rodar de novo hoje.
  const onBackupNow=async()=>{
    if(busy)return;
    setBusy(true);setMsg("");
    try{
      const data=await FB.exportAll();
      const result=await FB.saveBackup(data);
      const now=Date.now();
      try{
        localStorage.setItem(BACKUP_KEY,String(now));
        localStorage.setItem("lp_last_backup_date",todayStr());
      }catch(_){}
      setBackupMeta({updatedAt:new Date().toISOString(),size:result.size});
      setMsg(_lang==="en"?"Backup saved to cloud":"Backup salvo na nuvem");
      Haptic.success();
      setTimeout(()=>setMsg(""),3000);
    }catch(e){setMsg((_lang==="en"?"Error: ":"Erro: ")+e.message);Haptic.warning();setTimeout(()=>setMsg(""),5000)}
    setBusy(false);
  };
  // "Restaurar último backup" — pega do Firestore.
  const onRestoreCloud=async()=>{
    if(busy)return;
    if(!backupMeta){setMsg(_lang==="en"?"No cloud backup yet":"Nenhum backup na nuvem ainda");setTimeout(()=>setMsg(""),3000);return}
    if(!confirm(L("importConfirm")))return;
    setBusy(true);setMsg("");
    try{
      const b=await FB.loadBackup();
      if(!b)throw new Error(_lang==="en"?"No backup found":"Nenhum backup encontrado");
      await FB.importAll(b.data);
      setMsg(L("importedOk"));
      Haptic.success();
      setTimeout(()=>{setMsg("");window.location.reload()},1500);
    }catch(err){setMsg(L("importErr")+": "+err.message);Haptic.warning();setTimeout(()=>setMsg(""),5000)}
    setBusy(false);
  };
  // "Baixar cópia local" — fallback pra ter JSON no device.
  const onDownloadLocal=async()=>{
    if(busy)return;
    setBusy(true);setMsg("");
    try{
      const data=await FB.exportAll();
      downloadJSON(data,`louise-backup-${todayStr()}.json`);
      setMsg(_lang==="en"?"Local copy downloaded":"Cópia local baixada");
      Haptic.light();
      setTimeout(()=>setMsg(""),3000);
    }catch(e){setMsg((_lang==="en"?"Error: ":"Erro: ")+e.message);Haptic.warning();setTimeout(()=>setMsg(""),4000)}
    setBusy(false);
  };
  const onImportClick=()=>{fileRef.current?.click()};
  const onImportFile=async(e)=>{
    const f=e.target.files?.[0];if(!f)return;
    if(!confirm(L("importConfirm"))){e.target.value="";return}
    setBusy(true);setMsg("");
    try{
      const txt=await f.text();
      const data=JSON.parse(txt);
      await FB.importAll(data);
      setMsg(L("importedOk"));
      Haptic.success();
      setTimeout(()=>{setMsg("");window.location.reload()},1500);
    }catch(err){setMsg(L("importErr")+": "+err.message);Haptic.warning();setTimeout(()=>setMsg(""),5000)}
    setBusy(false);
    e.target.value="";
  };
  // Pr\u00f3ximo auto-backup: primeiro open do pr\u00f3ximo dia (v11.6).
  let lastBackupDate="";
  try{lastBackupDate=localStorage.getItem("lp_last_backup_date")||""}catch(_){}
  const nextInStr=lastBackupDate===todayStr()?(_lang==="en"?"tomorrow":"amanh\u00e3"):(_lang==="en"?"any moment":"a qualquer momento");
  return(<div style={{marginTop:16,padding:"16px 18px",borderRadius:14,background:"rgba(22,28,60,0.4)",border:`1px solid ${T.gB}`,boxShadow:T.insetTop}}>
    <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
      <div style={{width:32,height:32,borderRadius:9,background:"rgba(52,211,153,0.12)",border:"1px solid rgba(52,211,153,0.28)",display:"flex",alignItems:"center",justifyContent:"center"}}>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6ee7b7" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      </div>
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontSize:T.fMD,fontWeight:700,color:T.text}}>{L("backup")}</div>
        <div style={{fontSize:T.fSM,color:T.sub,fontWeight:600,marginTop:1,fontVariantNumeric:"tabular-nums"}}>{L("lastBackup")}: {fmtBackupAgo(lastAt,_lang)}{lastAt?` \u00b7 ${_lang==="en"?"next auto":"pr\u00f3x. auto"}: ${nextInStr}`:""}</div>
      </div>
    </div>
    <div style={{fontSize:T.fSM,color:T.sub,lineHeight:1.5,marginBottom:12}}>{_lang==="en"?"Automatic backup every 24h to Firestore (shared between devices). Single latest snapshot — each new backup replaces the previous. Local file download available as fallback.":"Backup automático a cada 24h no Firestore (compartilhado entre os 2 devices). Um único snapshot mais recente — cada backup novo substitui o anterior. Download local disponível como segurança extra."}</div>
    <div style={{display:"flex",gap:8,marginBottom:8}}>
      <button onClick={onBackupNow} disabled={busy} style={{flex:1,padding:"11px 12px",borderRadius:11,background:busy?"rgba(52,211,153,0.1)":"linear-gradient(180deg,rgba(52,211,153,0.22),rgba(16,185,129,0.12))",border:"1px solid rgba(52,211,153,0.35)",color:"#6ee7b7",fontSize:T.fMD,fontWeight:700,letterSpacing:-0.1,display:"flex",alignItems:"center",justifyContent:"center",gap:6,opacity:busy?0.6:1}}>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M12 2v6m0 0l-3-3m3 3l3-3M5 12h14a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2z"/></svg>
        {_lang==="en"?"Backup now":"Fazer backup agora"}
      </button>
      <button onClick={onRestoreCloud} disabled={busy||!backupMeta} style={{flex:1,padding:"11px 12px",borderRadius:11,background:"rgba(22,28,60,0.6)",border:`1px solid ${T.gBSoft}`,color:backupMeta?T.text:T.dim,fontSize:T.fMD,fontWeight:700,letterSpacing:-0.1,display:"flex",alignItems:"center",justifyContent:"center",gap:6,opacity:busy||!backupMeta?0.5:1}}>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
        {_lang==="en"?"Restore last":"Restaurar último"}
      </button>
    </div>
    <div style={{display:"flex",gap:8}}>
      <button onClick={onDownloadLocal} disabled={busy} style={{flex:1,padding:"9px 10px",borderRadius:10,background:"transparent",border:`1px dashed ${T.gB}`,color:T.sub,fontSize:T.fSM,fontWeight:600,letterSpacing:-0.05,display:"flex",alignItems:"center",justifyContent:"center",gap:5,opacity:busy?0.6:1}}>
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        {_lang==="en"?"Local copy":"Cópia local"}
      </button>
      <button onClick={onImportClick} disabled={busy} style={{flex:1,padding:"9px 10px",borderRadius:10,background:"transparent",border:`1px dashed ${T.gB}`,color:T.sub,fontSize:T.fSM,fontWeight:600,letterSpacing:-0.05,display:"flex",alignItems:"center",justifyContent:"center",gap:5,opacity:busy?0.6:1}}>
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        {_lang==="en"?"From file":"De arquivo"}
      </button>
      <input ref={fileRef} type="file" accept="application/json,.json" onChange={onImportFile} style={{display:"none"}}/>
    </div>
    {msg&&<div style={{fontSize:T.fSM,color:msg.startsWith("Erro")||msg.toLowerCase().includes("inv")?"#f87171":"#6ee7b7",marginTop:10,textAlign:"center",fontWeight:600}}>{msg}</div>}
  </div>);
}

// ── ERROR BOUNDARY (v11.0) ──
// Última linha de defesa: se qualquer componente der throw durante render,
// em vez de tela branca aparece esse fallback, e o app faz reload em 3s pra
// tentar recuperar. Logs vão pra console pra debug depois.
class ErrorBoundary extends React.Component {
  constructor(props){super(props);this.state={hasError:false,err:null,stack:null}}
  static getDerivedStateFromError(err){return{hasError:true,err:err,stack:(err&&err.stack)||""}}
  componentDidCatch(err,info){
    console.error("[LP] ErrorBoundary caught:",err,info);
    // v11.9.13: persiste o erro em localStorage pra o usu\u00E1rio poder copiar mesmo ap\u00F3s reload.
    try{localStorage.setItem("lp_last_error",JSON.stringify({msg:String(err&&err.message||err),stack:String(err&&err.stack||""),at:new Date().toISOString()}))}catch(_){}
  }
  componentDidUpdate(_,prev){
    if(this.state.hasError&&!prev.hasError){
      // v11.9.13: para o loop infinito de reload. Tenta auto-reload 1x; se falhar de novo,
      // mostra UI est\u00E1tica com erro pra usu\u00E1rio ler/copiar e decidir o que fazer.
      try{
        const tries=parseInt(sessionStorage.getItem("lp_eb_tries")||"0",10)+1;
        sessionStorage.setItem("lp_eb_tries",String(tries));
        if(tries<=1){
          setTimeout(function(){window.location.reload()},2500);
        }
      }catch(_){}
    }
  }
  render(){
    if(this.state.hasError){
      const msg=String(this.state.err&&this.state.err.message||this.state.err||"unknown");
      const stack=String(this.state.stack||"").split("\n").slice(0,6).join("\n");
      let triesShown=0;
      try{triesShown=parseInt(sessionStorage.getItem("lp_eb_tries")||"0",10)}catch(_){}
      const willReload=triesShown<=1;
      const en=(typeof _lang!=="undefined"&&_lang==="en");
      const onCopy=()=>{
        try{
          navigator.clipboard.writeText("Louise Pro error\n\n"+msg+"\n\n"+stack);
          alert(en?"Error copied to clipboard":"Erro copiado pra \u00E1rea de transfer\u00EAncia");
        }catch(_){alert(en?"Couldn't copy \u2014 take a screenshot":"N\u00E3o consegui copiar \u2014 tira print da tela")}
      };
      const onReset=()=>{try{sessionStorage.removeItem("lp_eb_tries")}catch(_){};window.location.reload()};
      return(<div style={{position:"fixed",inset:0,background:"linear-gradient(180deg,#070b1e 0%,#0b1130 100%)",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"flex-start",padding:"calc(env(safe-area-inset-top) + 28px) 22px 28px",overflowY:"auto",WebkitOverflowScrolling:"touch",color:T.heading,fontFamily:"'Outfit',sans-serif"}}>
        <div style={{width:64,height:64,borderRadius:20,background:"rgba(248,113,113,0.1)",border:"1.5px solid rgba(248,113,113,0.25)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:T.f3XL,color:"#f87171",marginBottom:14,boxShadow:"0 0 32px -8px rgba(248,113,113,0.3)"}}>{"\u26A0"}</div>
        <div style={{fontSize:T.f2XL,fontWeight:800,letterSpacing:-0.5,marginBottom:4,textAlign:"center"}}>{"Oops!"}</div>
        <div style={{fontSize:T.fMD,color:"#a3aac8",lineHeight:1.55,marginBottom:14,maxWidth:280,textAlign:"center"}}>{willReload?(en?"Something broke. Reloading\u2026":"Algo quebrou. Tentando recarregar\u2026"):(en?"Something broke and reloading didn't fix it.":"Algo quebrou e o reload n\u00E3o resolveu.")}</div>
        {willReload&&<div style={{width:24,height:24,border:"2.5px solid rgba(139,124,246,0.2)",borderTopColor:"#a78bfa",borderRadius:"50%",animation:"spin 0.9s linear infinite",marginBottom:18}}/>}

        </div>

        </div>
        <style>{"@keyframes spin{to{transform:rotate(360deg)}}"}</style>

    return this.props.children;
  }
}

      sub:h.sub||"",
      type:h.type||"info",
    }));
    // Hash to detect actual changes (title+sub only — ignores order)
    const hash=fresh.map(h=>`${h.key}|${h.sub}`).sort().join("~");
    if(hash===lastHashRef.current)return;
    lastHashRef.current=hash;

        if(merged[idx].sub!==h.sub||merged[idx].title!==h.title){

    {/* Profile: bottom nav agora \u00e9 s\u00f3 o Home circle (v11.7). Cancelar/Salvar migraram pro
        header top do ProfilePage pra n\u00e3o ficar atr\u00e1s do teclado. */}
    {showProfile?<nav style={{position:"fixed",bottom:"calc(8px + env(safe-area-inset-bottom))",left:"50%",transform:"translateX(-50%)",width:"auto",maxWidth:"none",opacity:1,display:"flex",alignItems:"center",gap:8,padding:"0",pointerEvents:"auto",background:"transparent",border:"none",boxShadow:"none",zIndex:250}}>
      <div style={{position:"relative",width:60,height:60,display:"flex",alignItems:"center",justifyContent:"center"}}>
        <div style={{position:"absolute",inset:0,borderRadius:"50%",background:"conic-gradient(from 0deg, #8b7cf6 0%, #e0d4ff 15%, #ffffff 22%, #c4b5fd 35%, #8b7cf6 50%, #5b4aaf 65%, #ffffff 78%, #a78bfa 92%, #8b7cf6 100%)",animation:"mercurySpin 3s linear infinite",willChange:"transform",transformOrigin:"center center"}}/>
        <div style={{position:"absolute",inset:-4,borderRadius:"50%",boxShadow:"0 0 20px rgba(139,124,246,0.55)",pointerEvents:"none"}}/>
        <div style={{position:"absolute",inset:2.5,borderRadius:"50%",background:"linear-gradient(180deg,rgba(14,18,48,0.98),rgba(8,10,28,0.99))"}}/>
        <button aria-label={L("home")} onClick={()=>{setShowProfile(false);setProfileIsDirty(false)}} style={{position:"relative",zIndex:2,width:55,height:55,borderRadius:"50%",background:"transparent",color:T.lilac,border:"none",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",padding:0}}>
          <Icon name="home" size={20} color="#c4b5fd"/>
        </button>
      </div>
    </nav>:<nav style={{position:"absolute",bottom:"calc(8px + env(safe-area-inset-bottom))",left:"50%",transform:"translateX(-50%)",width:"calc(100% - 32px)",maxWidth:360,pointerEvents:"auto",display:"flex",alignItems:"center",justifyContent:"space-around",gap:2,padding:"4px 10px",background:"linear-gradient(180deg,rgba(38,44,90,0.38),rgba(14,18,48,0.62))",backdropFilter:"blur(18px) saturate(180%)",WebkitBackdropFilter:"blur(18px) saturate(180%)",borderRadius:24,border:"1px solid rgba(255,255,255,0.12)",boxShadow:"0 1px 0 0 rgba(255,255,255,0.2) inset, 0 -1px 2px 0 rgba(0,0,0,0.18) inset, 0 8px 24px -8px rgba(0,0,0,0.55)"}}>
      {[{icon:"home",label:L("home"),active:page==="home"&&!showAdd,action:()=>goTo("home")},{icon:"clock",label:L("history"),active:page==="history",action:()=>goTo("history")}].map(n=><button key={n.icon} aria-label={n.label} className="navbtn" onClick={()=>{if(window.Haptic&&Haptic.light)Haptic.light();n.action()}} style={{display:"flex",alignItems:"center",justifyContent:"center",width:46,height:44,borderRadius:18,background:n.active?"rgba(139,124,246,0.22)":"transparent",border:"none",padding:0}}><Icon name={n.icon} size={n.active?18:17} color={n.active?"#ffffff":T.dim}/></button>)}
      <button aria-label={showAdd?L("close"):L("addEvent")} className="navfab" onClick={()=>{if(window.Haptic&&Haptic.light)Haptic.light();setShowAdd(!showAdd);setFormType(null);setPage("home")}} style={{width:44,height:44,borderRadius:18,background:`linear-gradient(180deg,#9b8df8,#7c3aed)`,display:"flex",alignItems:"center",justifyContent:"center",boxShadow:`0 1px 0 0 rgba(255,255,255,0.22) inset, 0 4px 12px -2px ${T.accent}70`,transform:showAdd?"rotate(45deg)":"rotate(0deg)",margin:"-2px 2px",border:"none",padding:0}}><Icon name="plus" size={18} color="#fff"/></button>
      {[{icon:"chart",label:L("stats"),active:page==="stats"||page==="growth",action:()=>goTo("stats")},{icon:"gear",label:L("settings"),active:false,action:()=>setShowProfile(true)}].map(n=><button key={n.icon} aria-label={n.label} className="navbtn" onClick={()=>{if(window.Haptic&&Haptic.light)Haptic.light();n.action()}} style={{display:"flex",alignItems:"center",justifyContent:"center",width:46,height:44,borderRadius:18,background:n.active?"rgba(139,124,246,0.22)":"transparent",border:"none",padding:0}}><Icon name={n.icon} size={n.active?18:17} color={n.active?"#ffffff":T.dim}/></button>)}
    </nav>}
    </>, document.getElementById("nav-host"))}
  </div>);
}

var _ld=document.getElementById('load-debug');if(_ld)_ld.remove();
ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App/></ErrorBoundary>);
