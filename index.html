window.FB = {
  subEntries(cb) {
    return db.collection('entries').orderBy('date','desc').onSnapshot(snap => {
      const data = snap.docs.map(d => ({...d.data(), _docId: d.id}));
      data.sort((a,b) => (`${b.date}T${b.time}`).localeCompare(`${a.date}T${a.time}`));
      cb(data);
    });
  },
  async addEntry(e) { 
    // Remove undefined values (Firestore rejects them)
    const clean = Object.fromEntries(Object.entries(e).filter(([_,v]) => v !== undefined));
    await db.collection('entries').doc(e.id).set(clean); 
  },
  async delEntry(id) { await db.collection('entries').doc(id).delete(); },
  subProfile(cb) { return db.collection('config').doc('profile').onSnapshot(s => cb(s.exists ? s.data() : null)); },

  subMeds(cb) { return db.collection('config').doc('meds').onSnapshot(s => cb(s.exists ? s.data()?.list : null)); },
  async saveMeds(m) { await db.collection('config').doc('meds').set({list:m}); },
  subTimer(cb) { return db.collection('config').doc('active').onSnapshot(s => cb(s.exists ? s.data() : null)); },
  async saveTimer(t) { await db.collection('config').doc('active').set(t||{cleared:true}); },
};

function interpolateLMS(table, ageMonths) {
  if (ageMonths <= table[0][0]) return { L: table[0][1], M: table[0][2], S: table[0][3] };
  if (ageMonths >= table[table.length-1][0]) { const l = table[table.length-1]; return { L: l[1], M: l[2], S: l[3] }; }
  for (let i = 0; i < table.length - 1; i++) {
    if (ageMonths >= table[i][0] && ageMonths <= table[i+1][0]) {
      const t = (ageMonths - table[i][0]) / (table[i+1][0] - table[i][0]);
      return { L: table[i][1]+(table[i+1][1]-table[i][1])*t, M: table[i][2]+(table[i+1][2]-table[i][2])*t, S: table[i][3]+(table[i+1][3]-table[i][3])*t };
    }
  }
  const l = table[table.length-1]; return { L: l[1], M: l[2], S: l[3] };
}

function calcZScore(value, lms) {
  if (!value || !lms) return null;
  const { L, M, S } = lms;
  if (Math.abs(L) < 0.001) return Math.log(value / M) / S;
  return (Math.pow(value / M, L) - 1) / (L * S);
}

function zToPercentile(z) {
  if (z === null) return null;
  // Approximation of standard normal CDF
  return Math.round(100 / (1 + Math.exp(-1.7155277 * z - 0.2716 * z * z * z)));
}

function getPercentile(value, table, ageMonths) {
  const lms = interpolateLMS(table, ageMonths);
  const z = calcZScore(value, lms);
  return { z, percentile: zToPercentile(z), median: lms.M };
}

// Split sleep entry that crosses midnight into two entries
function splitMidnight(entry){
  if(!entry.durationMin || (entry.type!=="sleep"&&entry.type!=="nap")) return [entry];
  const [h,m]=(entry.time||"00:00").split(":").map(Number);
  const startMin=h*60+m;
  const endMin=startMin+entry.durationMin;
  if(endMin<=1440) return [entry]; // doesn't cross midnight
  const beforeMidnight=1440-startMin;
  const afterMidnight=entry.durationMin-beforeMidnight;
  const nextDay=dateOffset(entry.date,1);
  return[
    {...entry, durationMin:beforeMidnight, id:entry.id},
    {...entry, date:nextDay, time:"00:00", durationMin:afterMidnight, id:entry.id+"_b"},
  ];
}

const TYPES={bottle:{label:"Mamadeira",icon:"bottle",color:T.green,bg:T.greenS},nursing:{label:"Amamentação",icon:"breast",color:T.blue,bg:T.blueS},sleep:{label:"Sono",icon:"moon",color:T.purple,bg:T.purpleS},wakeup:{label:"Acordou",icon:"sun",color:T.amber,bg:T.amberS},nap:{label:"Soneca",icon:"cloud",color:T.purple,bg:T.purpleS},nightwaking:{label:"Acordou à noite",icon:"zap",color:T.orange,bg:T.orangeS},diaper:{label:"Fralda",icon:"droplet",color:T.pink,bg:T.pinkS},medicine:{label:"Medicamento",icon:"pill",color:T.amber,bg:T.amberS},temperature:{label:"Temperatura",icon:"thermo",color:T.red,bg:T.redS},pumping:{label:"Extração",icon:"pump",color:T.cyan,bg:T.cyanS},growth:{label:"Crescimento",icon:"ruler",color:"#a3e635",bg:"rgba(163,230,53,0.1)"}};

// ── UI COMPONENTS ──
function Ring({activeTimer,napSug,tick,recentEvents}){
  const sz=250,stk=9,r=(sz-stk*2)/2,circ=2*Math.PI*r,gF=0.14,arc=circ*(1-2*gF),rot=90+gF*360;
  let prog=0,lbl="",sub="",col=T.dim;
  if(activeTimer){const el=Math.max(0,Math.floor((Date.now()-new Date(activeTimer.startTime).getTime())/1000));const mins=Math.floor(el/60);prog=Math.min(mins/(14*60),0.95);lbl=mins<60?`${mins} min`:`${Math.floor(mins/60)}h ${String(mins%60).padStart(2,"0")}m`;sub=activeTimer.type==="nap"?"Soneca":"Dormindo";col=T.purple}
  else if(napSug){prog=napSug.prog;lbl=napSug.rem>0?fmtDur(napSug.rem):"0min";sub=napSug.over?"Hora de dormir":napSug.wind?"Preparar p/ dormir":`Acordado · ${fmtDur(napSug.el)}`;col=napSug.over?T.orange:napSug.wind?T.amber:T.green}
  else{sub="";lbl="—"}
  return(<div style={{position:"relative",width:sz,height:sz,margin:"0 auto"}}><svg width={sz} height={sz}><circle cx={sz/2} cy={sz/2} r={r} fill="none" stroke={T.bg3} strokeWidth={stk} strokeDasharray={`${arc} ${circ-arc}`} strokeLinecap="round" transform={`rotate(${rot} ${sz/2} ${sz/2})`}/>{prog>0.003&&<circle cx={sz/2} cy={sz/2} r={r} fill="none" stroke={col} strokeWidth={stk} strokeDasharray={`${arc*prog} ${circ-arc*prog}`} strokeLinecap="round" transform={`rotate(${rot} ${sz/2} ${sz/2})`} style={{filter:`drop-shadow(0 0 10px ${col}55)`,transition:"stroke-dasharray .5s"}}/>}</svg><div style={{position:"absolute",inset:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}><span style={{fontSize:12,color:T.sub,fontWeight:500,letterSpacing:1.5,textTransform:"uppercase"}}>{sub}</span><span style={{fontSize:38,fontWeight:800,letterSpacing:-1.5,marginTop:4,color:napSug?.over?T.orange:napSug?.wind?T.amber:T.text}}>{lbl}</span>{!activeTimer&&napSug&&napSug.rem>0&&<span style={{fontSize:10,color:T.dim,marginTop:4}}>p/ próxima soneca</span>}</div>{(recentEvents||[]).slice(0,5).map((ev,i)=>{const ang=(rot*Math.PI/180)+(i+1)*(arc/circ*2*Math.PI/6);const x=sz/2+r*Math.cos(ang),y=sz/2+r*Math.sin(ang);const cfg=TYPES[ev.type];if(!cfg)return null;return<div key={ev.id} style={{position:"absolute",left:x-14,top:y-14,width:28,height:28,borderRadius:"50%",background:`${T.bg2}ee`,border:`2px solid ${cfg.color}33`,display:"flex",alignItems:"center",justifyContent:"center",boxShadow:"0 2px 8px rgba(0,0,0,0.3)"}}><Icon name={cfg.icon} size={12} color={cfg.color}/></div>})}</div>);
}

function MlGoalBar({current,goal}){if(!goal||goal<=0)return null;const pct=Math.min(100,(current/goal)*100);const reached=current>=goal;return(<div style={{padding:"0 20px",marginBottom:16}}><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}><div style={{display:"flex",alignItems:"center",gap:6}}><Icon name="target" size={14} color={reached?T.green:T.sub}/><span style={{fontSize:11,fontWeight:600,color:T.sub}}>Meta diária</span></div><span style={{fontSize:12,fontWeight:700,color:reached?T.green:T.text}}>{current} / {goal} ml</span></div><div style={{height:6,borderRadius:3,background:T.bg3,overflow:"hidden"}}><div style={{height:"100%",borderRadius:3,width:`${pct}%`,background:reached?T.green:`linear-gradient(90deg,${T.accent},${T.purple})`,transition:"width .5s"}}/></div></div>)}

function WeeklyCard({entries}){const tw=[],lw=[];for(let i=0;i<7;i++){const d1=dateOffset(todayStr(),-i),d2=dateOffset(todayStr(),-7-i);tw.push(...entries.filter(e=>e.date===d1));lw.push(...entries.filter(e=>e.date===d2))}const tMl=tw.filter(e=>e.type==="bottle").reduce((s,e)=>s+(e.ml||0),0);const lMl=lw.filter(e=>e.type==="bottle").reduce((s,e)=>s+(e.ml||0),0);const tSl=tw.filter(e=>(e.type==="sleep"||e.type==="nap")&&e.durationMin).reduce((s,e)=>s+e.durationMin,0);const lSl=lw.filter(e=>(e.type==="sleep"||e.type==="nap")&&e.durationMin).reduce((s,e)=>s+e.durationMin,0);if(!lMl&&!lSl)return null;const md=lMl>0?Math.round(((tMl-lMl)/lMl)*100):0;const sd=lSl>0?Math.round(((tSl-lSl)/lSl)*100):0;if(!md&&!sd)return null;return(<div style={{padding:"0 20px",marginBottom:16}}><div style={{padding:"12px 16px",borderRadius:14,background:T.glass,border:`1px solid ${T.gB}`,display:"flex",gap:16}}>{md!==0&&<div style={{display:"flex",alignItems:"center",gap:6,flex:1}}><Icon name={md>0?"arrowUp":"arrowDown"} size={14} color={md>0?T.green:T.orange}/><span style={{fontSize:11,color:T.sub}}><span style={{fontWeight:700,color:md>0?T.green:T.orange}}>{Math.abs(md)}%</span> leite vs sem. passada</span></div>}{sd!==0&&<div style={{display:"flex",alignItems:"center",gap:6,flex:1}}><Icon name={sd>0?"arrowUp":"arrowDown"} size={14} color={sd>0?T.green:T.orange}/><span style={{fontSize:11,color:T.sub}}><span style={{fontWeight:700,color:sd>0?T.green:T.orange}}>{Math.abs(sd)}%</span> sono</span></div>}</div></div>)}

function TimerBar({activeTimer,onStop}){const[secs,setSecs]=useState(0);useEffect(()=>{if(!activeTimer)return;const calc=()=>Math.max(0,Math.floor((Date.now()-new Date(activeTimer.startTime).getTime())/1000));setSecs(calc());const iv=setInterval(()=>setSecs(calc()),1000);return()=>clearInterval(iv)},[activeTimer]);if(!activeTimer)return null;return(<div style={{position:"fixed",bottom:"calc(76px + env(safe-area-inset-bottom))",left:"50%",transform:"translateX(-50%)",width:"calc(100% - 32px)",maxWidth:448,padding:"12px 16px",borderRadius:16,background:"rgba(20,26,66,0.92)",border:`1px solid ${T.purple}33`,backdropFilter:"blur(12px)",display:"flex",alignItems:"center",gap:12,zIndex:60,boxShadow:"0 4px 24px rgba(0,0,0,0.4)"}}><div style={{width:36,height:36,borderRadius:10,background:T.purpleS,display:"flex",alignItems:"center",justifyContent:"center"}}><Icon name={activeTimer.type==="nap"?"cloud":"moon"} size={18} color={T.purple}/></div><div style={{flex:1}}><div style={{fontSize:12,fontWeight:600,color:T.sub}}>{activeTimer.type==="nap"?"Soneca":"Sono"}</div><div style={{fontSize:20,fontWeight:800,fontVariantNumeric:"tabular-nums"}}>{fmtTimer(secs)}</div></div><button onClick={onStop} style={{width:40,height:40,borderRadius:12,background:T.purpleS,border:`1px solid ${T.purple}33`,display:"flex",alignItems:"center",justifyContent:"center"}}><Icon name="stop" size={16} color={T.purple}/></button></div>)}

function Toast({message,onUndo,onClose}){useEffect(()=>{const t=setTimeout(onClose,4000);return()=>clearTimeout(t)},[onClose]);return(<div style={{position:"fixed",top:20,left:"50%",transform:"translateX(-50%)",zIndex:300,padding:"10px 16px",borderRadius:14,background:"rgba(20,26,66,0.95)",border:`1px solid ${T.gB}`,backdropFilter:"blur(12px)",display:"flex",alignItems:"center",gap:10,boxShadow:"0 8px 24px rgba(0,0,0,0.5)",animation:"slideDown .3s ease"}}><span style={{fontSize:13,color:T.text}}>{message}</span>{onUndo&&<button onClick={onUndo} style={{padding:"4px 12px",borderRadius:8,background:T.accent,color:"#fff",fontSize:12,fontWeight:700}}>Desfazer</button>}</div>)}

function Sheet({open,onClose,children}){const[vis,setVis]=useState(false),[show,setShow]=useState(false);useEffect(()=>{if(open){setVis(true);requestAnimationFrame(()=>requestAnimationFrame(()=>setShow(true)))}else{setShow(false);const t=setTimeout(()=>setVis(false),350);return()=>clearTimeout(t)}},[open]);if(!vis)return null;return(<div style={{position:"fixed",inset:0,zIndex:100}} onClick={onClose}><div style={{position:"absolute",inset:0,background:"rgba(2,3,10,0.55)",backdropFilter:"blur(12px)",WebkitBackdropFilter:"blur(12px)",opacity:show?1:0,transition:"opacity .35s"}}/><div onClick={e=>e.stopPropagation()} style={{position:"absolute",bottom:0,left:0,right:0,maxWidth:480,margin:"0 auto",background:"rgba(10,14,40,0.78)",backdropFilter:"blur(40px)",WebkitBackdropFilter:"blur(40px)",borderRadius:"28px 28px 0 0",border:"1px solid rgba(100,115,220,0.1)",borderBottom:"none",boxShadow:"0 -8px 40px rgba(0,0,0,0.4), inset 0 1px 0 rgba(140,150,255,0.06)",padding:"8px 0 36px",transform:show?"translateY(0)":"translateY(100%)",transition:"transform .38s cubic-bezier(0.22,1,0.36,1)",maxHeight:"78vh",overflowY:"auto"}}><div style={{width:40,height:4,borderRadius:2,background:"rgba(140,150,255,0.2)",margin:"8px auto 24px"}}/>{children}</div></div>)}

function Modal({open,onClose,children}){const[vis,setVis]=useState(false),[show,setShow]=useState(false);useEffect(()=>{if(open){setVis(true);requestAnimationFrame(()=>requestAnimationFrame(()=>setShow(true)))}else{setShow(false);const t=setTimeout(()=>setVis(false),300);return()=>clearTimeout(t)}},[open]);if(!vis)return null;return(<div style={{position:"fixed",inset:0,zIndex:150,display:"flex",alignItems:"center",justifyContent:"center",padding:24}} onClick={onClose}><div style={{position:"absolute",inset:0,background:"rgba(2,3,10,0.55)",backdropFilter:"blur(12px)",WebkitBackdropFilter:"blur(12px)",opacity:show?1:0,transition:"opacity .35s"}}/><div onClick={e=>e.stopPropagation()} style={{position:"relative",width:"100%",maxWidth:340,background:"rgba(14,18,52,0.85)",backdropFilter:"blur(40px)",WebkitBackdropFilter:"blur(40px)",borderRadius:24,border:"1px solid rgba(100,115,220,0.12)",boxShadow:"0 16px 48px rgba(0,0,0,0.5), inset 0 1px 0 rgba(140,150,255,0.06)",padding:28,transform:show?"scale(1)":"scale(0.92)",opacity:show?1:0,transition:"all .35s cubic-bezier(0.22,1,0.36,1)"}}><button onClick={onClose} style={{position:"absolute",top:16,right:16,padding:4,color:T.dim}}><Icon name="x" size={16} color={T.dim}/></button>{children}</div></div>)}

function Fld({label,children}){return<div style={{marginBottom:18}}><label style={{fontSize:10,color:T.dim,fontWeight:600,marginBottom:6,display:"block",textTransform:"uppercase",letterSpacing:1.2}}>{label}</label>{children}</div>}
function Seg({opts,val,set,color}){return<div style={{display:"flex",gap:6}}>{opts.map(o=><button key={o.v} onClick={()=>set(o.v)} style={{flex:1,padding:"12px 4px",borderRadius:10,fontSize:13,fontWeight:600,background:val===o.v?color:T.glass,color:val===o.v?T.bg1:T.text,border:`1px solid ${val===o.v?color:T.gB}`}}>{o.l}</button>)}</div>}

function EntryRow({entry,onDelete}){const[del,setDel]=useState(false);const cfg=TYPES[entry.type]||{label:entry.type,icon:"star",color:T.text,bg:T.glass};let detail="";if(entry.ml)detail=`${entry.ml} ml`;else if(entry.durationMin)detail=fmtDur(entry.durationMin);else if(entry.subtype)detail=({wet:"Xixi",dirty:"Cocô",both:"Ambos"})[entry.subtype]||"";else if(entry.name)detail=entry.name+(entry.dose?` · ${entry.dose}`:"");else if(entry.value)detail=`${entry.value}°C`;else if(entry.weightKg||entry.lengthCm||entry.headCm){const parts=[];if(entry.weightKg)parts.push(`${entry.weightKg}kg`);if(entry.lengthCm)parts.push(`${entry.lengthCm}cm`);if(entry.headCm)parts.push(`Cab. ${entry.headCm}cm`);detail=parts.join(" · ")}if(entry.type==="nursing"&&entry.side)detail=(detail?detail+" · ":"")+({left:"Esq",right:"Dir",both:"Ambos"}[entry.side]||"");return(<div style={{display:"flex",alignItems:"center",gap:12,padding:"10px 12px",marginBottom:4,background:T.glass,borderRadius:12,borderLeft:`3px solid ${cfg.color}`}}><div style={{width:34,height:34,borderRadius:10,background:cfg.bg,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}><Icon name={cfg.icon} size={16} color={cfg.color}/></div><div style={{flex:1}}><div style={{fontSize:13,fontWeight:600}}>{cfg.label}</div>{detail&&<div style={{fontSize:11,color:T.sub}}>{detail}</div>}</div><div style={{textAlign:"right",flexShrink:0}}><div style={{fontSize:13,fontWeight:600}}>{entry.time}</div><div style={{fontSize:9,color:T.dim}}>{timeSince(entry.date,entry.time)}</div></div>{!del?<button onClick={()=>setDel(true)} style={{padding:4,color:T.dim,opacity:0.4}}><Icon name="x" size={14} color={T.dim}/></button>:<button onClick={()=>onDelete(entry.id)} style={{padding:"4px 8px",borderRadius:6,fontSize:10,fontWeight:700,background:T.red,color:"#fff"}}>Apagar</button>}</div>)}

function AddForm({type,onSave,savedMeds,onSaveMeds}){const cfg=TYPES[type];
  const[date,setDate]=useState(todayStr());
  const[time,setTime]=useState(nowTime());
  const[ml,setMl]=useState("");const[durH,setDurH]=useState("");const[durM,setDurM]=useState("");
  const[diaperT,setDiaperT]=useState("wet");const[medN,setMedN]=useState("");const[medD,setMedD]=useState("");
  const[tempV,setTempV]=useState("");const[side,setSide]=useState("left");const[nurseM,setNurseM]=useState("");
  const[pumpMl,setPumpMl]=useState("");const[weightKg,setWeightKg]=useState("");const[lengthCm,setLengthCm]=useState("");
  const[headCm,setHeadCm]=useState("");const[notes,setNotes]=useState("");const[showML,setShowML]=useState(false);
  const[nMN,setNMN]=useState("");const[nMD,setNMD]=useState("");const mRef=useRef(null);
  useEffect(()=>{if(type==="bottle"&&mRef.current)mRef.current.focus()},[type]);
  const doSave=()=>{const b={type,date,time,notes:notes.trim()||undefined,id:uid()};
    if(type==="bottle"){if(!ml)return;onSave({...b,ml:parseInt(ml)})}
    else if(type==="nursing")onSave({...b,side,durationMin:nurseM?parseInt(nurseM):undefined});
    else if(type==="sleep"||type==="nap"){const t2=(parseInt(durH)||0)*60+(parseInt(durM)||0);if(!t2)return;onSave({...b,durationMin:t2})}
    else if(type==="wakeup"||type==="nightwaking")onSave(b);
    else if(type==="diaper")onSave({...b,subtype:diaperT});
    else if(type==="medicine"){if(!medN.trim())return;onSave({...b,name:medN.trim(),dose:medD.trim()||undefined})}
    else if(type==="temperature"){if(!tempV)return;onSave({...b,value:parseFloat(tempV)})}
    else if(type==="pumping"){if(!pumpMl)return;onSave({...b,ml:parseInt(pumpMl)})}
    else if(type==="growth"){onSave({...b,weightKg:weightKg?parseFloat(weightKg):undefined,lengthCm:lengthCm?parseFloat(lengthCm):undefined,headCm:headCm?parseFloat(headCm):undefined})}
  };
  const inp={width:"100%",padding:"13px 16px",background:"rgba(14,18,48,0.8)",border:`1px solid ${T.gB}`,borderRadius:12,color:T.text,fontSize:15,outline:"none"};
  const isToday=date===todayStr();
  const dateLbl=isToday?"Hoje":new Date(date+"T12:00").toLocaleDateString("pt-BR",{weekday:"short",day:"numeric",month:"short"});
  return(<div style={{paddingBottom:20}}>
    <div style={{display:"flex",alignItems:"center",gap:12,padding:"0 20px 16px"}}>
      <div style={{width:32,height:32,borderRadius:10,background:cfg.bg,display:"flex",alignItems:"center",justifyContent:"center"}}><Icon name={cfg.icon} size={18} color={cfg.color}/></div>
      <span style={{fontSize:17,fontWeight:700}}>{cfg.label}</span>
    </div>
    <div style={{padding:"0 20px"}}>
      {/* Date + Time row */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:18}}>
        <Fld label={"Dia · "+dateLbl}><input type="date" value={date} onChange={e=>setDate(e.target.value)} style={{...inp,colorScheme:"dark"}}/></Fld>
        <Fld label="Horário"><input type="time" value={time} onChange={e=>setTime(e.target.value)} style={{...inp,colorScheme:"dark"}}/></Fld>
      </div>
      {type==="bottle"&&<><Fld label="Quantidade (ml)"><input ref={mRef} type="number" inputMode="numeric" placeholder="0" value={ml} onChange={e=>setMl(e.target.value)} style={{...inp,fontSize:36,fontWeight:800,textAlign:"center",padding:"16px"}}/></Fld>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:20}}>{[50,70,90,100].map(v=><button key={v} onClick={()=>setMl(String(v))} style={{padding:"10px 0",borderRadius:10,fontSize:13,fontWeight:600,background:ml===String(v)?T.green:T.glass,color:ml===String(v)?T.bg1:T.text,border:`1px solid ${ml===String(v)?T.green:T.gB}`}}>{v}</button>)}</div></>}
      {type==="nursing"&&<><Fld label="Lado"><Seg opts={[{v:"left",l:"Esquerdo"},{v:"right",l:"Direito"},{v:"both",l:"Ambos"}]} val={side} set={setSide} color={cfg.color}/></Fld><Fld label="Duração (min)"><input type="number" inputMode="numeric" placeholder="15" value={nurseM} onChange={e=>setNurseM(e.target.value)} style={inp}/></Fld></>}
      {(type==="sleep"||type==="nap")&&<Fld label="Duração"><div style={{display:"flex",gap:10,alignItems:"center"}}><input type="number" inputMode="numeric" placeholder="0" value={durH} onChange={e=>setDurH(e.target.value)} style={{...inp,flex:1,textAlign:"center",fontSize:28,fontWeight:800}}/><span style={{color:T.dim,fontWeight:700}}>h</span><input type="number" inputMode="numeric" placeholder="0" value={durM} onChange={e=>setDurM(e.target.value)} style={{...inp,flex:1,textAlign:"center",fontSize:28,fontWeight:800}}/><span style={{color:T.dim,fontWeight:700}}>m</span></div></Fld>}
      {type==="diaper"&&<Fld label="Tipo"><Seg opts={[{v:"wet",l:"Xixi"},{v:"dirty",l:"Cocô"},{v:"both",l:"Ambos"}]} val={diaperT} set={setDiaperT} color={cfg.color}/></Fld>}
      {type==="medicine"&&<><Fld label="Medicamento"><div style={{display:"flex",gap:8}}><input type="text" placeholder="Nome" value={medN} onChange={e=>setMedN(e.target.value)} style={{...inp,flex:1}}/><button onClick={()=>setShowML(!showML)} style={{width:44,borderRadius:12,background:T.amberS,border:`1px solid ${T.amber}22`,display:"flex",alignItems:"center",justifyContent:"center"}}><Icon name="list" size={18} color={T.amber}/></button></div></Fld>
        {showML&&<div style={{background:T.glass,border:`1px solid ${T.gB}`,borderRadius:14,padding:14,marginBottom:20}}><div style={{fontSize:13,fontWeight:700,marginBottom:12,color:T.sub}}>Medicamentos salvos</div>{savedMeds.map((m,i)=><div key={i} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 12px",background:"rgba(14,18,48,0.5)",borderRadius:10,marginBottom:4}}><button onClick={()=>{setMedN(m.name);setMedD(m.dose||"");setShowML(false)}} style={{flex:1,textAlign:"left"}}><div style={{fontSize:13,fontWeight:600}}>{m.name}</div>{m.dose&&<div style={{fontSize:11,color:T.dim}}>{m.dose}</div>}</button><button onClick={()=>onSaveMeds(savedMeds.filter((_,j)=>j!==i))} style={{padding:"3px 8px",borderRadius:6,background:T.redS}}><Icon name="x" size={12} color={T.red}/></button></div>)}<div style={{marginTop:12,display:"flex",gap:6}}><input placeholder="Nome" value={nMN} onChange={e=>setNMN(e.target.value)} style={{...inp,flex:2,padding:"9px 12px",fontSize:12}}/><input placeholder="Dose" value={nMD} onChange={e=>setNMD(e.target.value)} style={{...inp,flex:1,padding:"9px 12px",fontSize:12}}/><button onClick={()=>{if(!nMN.trim())return;onSaveMeds([...savedMeds,{name:nMN.trim(),dose:nMD.trim()}]);setNMN("");setNMD("")}} style={{width:40,borderRadius:10,background:T.amber,display:"flex",alignItems:"center",justifyContent:"center"}}><Icon name="plus" size={16} color={T.bg1}/></button></div></div>}
        <Fld label="Dose"><input type="text" placeholder="Ex: 3 gotas" value={medD} onChange={e=>setMedD(e.target.value)} style={inp}/></Fld></>}
      {type==="temperature"&&<Fld label="Temperatura (°C)"><input type="number" inputMode="decimal" step="0.1" placeholder="36.5" value={tempV} onChange={e=>setTempV(e.target.value)} style={{...inp,fontSize:36,fontWeight:800,textAlign:"center"}}/></Fld>}
      {type==="pumping"&&<Fld label="Quantidade (ml)"><input type="number" inputMode="numeric" placeholder="0" value={pumpMl} onChange={e=>setPumpMl(e.target.value)} style={{...inp,fontSize:28,fontWeight:800,textAlign:"center"}}/></Fld>}

function HistoryPage({entries,onDelete}){const[dateIdx,setDateIdx]=useState(0);const viewDate=dateOffset(todayStr(),-dateIdx);const dayE=entries.filter(e=>e.date===viewDate);const dMl=dayE.filter(e=>e.type==="bottle").reduce((s,e)=>s+(e.ml||0),0);const dSl=dayE.filter(e=>(e.type==="sleep"||e.type==="nap")&&e.durationMin).reduce((s,e)=>s+e.durationMin,0);const dLbl=new Date(viewDate+"T12:00").toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"});const isToday=dateIdx===0;return(<div style={{padding:"16px 20px 0"}}><h2 style={{fontSize:17,fontWeight:700,marginBottom:16}}>Histórico</h2><div style={{display:"flex",alignItems:"center",gap:8,marginBottom:16}}><button onClick={()=>setDateIdx(dateIdx+1)} style={{width:36,height:36,borderRadius:10,background:T.glass,border:`1px solid ${T.gB}`,display:"flex",alignItems:"center",justifyContent:"center"}}><Icon name="back" size={16} color={T.sub}/></button><div style={{flex:1,textAlign:"center"}}><div style={{fontSize:14,fontWeight:700,color:isToday?T.accent:T.text}}>{isToday?"Hoje":dLbl}</div><div style={{display:"flex",justifyContent:"center",gap:12,fontSize:11,color:T.sub,marginTop:2}}>{dMl>0&&<span>{dMl} ml</span>}{dSl>0&&<span>{fmtDur(dSl)}</span>}<span>{dayE.length} reg.</span></div></div><button onClick={()=>setDateIdx(Math.max(0,dateIdx-1))} disabled={isToday} style={{width:36,height:36,borderRadius:10,background:T.glass,border:`1px solid ${T.gB}`,display:"flex",alignItems:"center",justifyContent:"center",opacity:isToday?0.3:1}}><Icon name="forward" size={16} color={T.sub}/></button></div>{dayE.length===0&&<p style={{color:T.dim,textAlign:"center",padding:40,fontSize:13}}>Nenhum registro neste dia</p>}{dayE.map(e=><EntryRow key={e.id} entry={e} onDelete={onDelete}/>)}</div>)}

// ── GROWTH PAGE with WHO percentiles ──
function GrowthPage({entries,birthDate,profile,onBack,onAddEntry}){
  const growthEntries=entries.filter(e=>e.type==="growth").sort((a,b)=>`${a.date}T${a.time}`.localeCompare(`${b.date}T${b.time}`));
  const age=calcAge(birthDate);
  const ageMonths=age?(age.months+(age.days/30)):0;
  const[showForm,setShowForm]=useState(false);
  const[wK,setWK]=useState("");const[lC,setLC]=useState("");const[hC,setHC]=useState("");

  // Build all data points: birth + entries
  const allPoints=[];
  if(profile.birthWeight||profile.birthLength||profile.birthHead){
    allPoints.push({ageM:0,date:birthDate,weightKg:profile.birthWeight,lengthCm:profile.birthLength,headCm:profile.birthHead,label:"Nasc."});
  }
  growthEntries.forEach(e=>{
    const eAge=calcAge(birthDate);
    if(!eAge)return;
    const d1=new Date(birthDate),d2=new Date(e.date);
    const mths=(d2.getFullYear()-d1.getFullYear())*12+d2.getMonth()-d1.getMonth()+(d2.getDate()-d1.getDate())/30;
    allPoints.push({ageM:Math.max(0,mths),date:e.date,weightKg:e.weightKg,lengthCm:e.lengthCm,headCm:e.headCm,label:new Date(e.date+"T12:00").toLocaleDateString("pt-BR",{day:"numeric",month:"short"})});
  });
  const latest=allPoints[allPoints.length-1];

  const doAdd=()=>{
    if(!wK&&!lC&&!hC)return;
    onAddEntry({type:"growth",date:todayStr(),time:nowTime(),id:uid(),weightKg:wK?parseFloat(wK):undefined,lengthCm:lC?parseFloat(lC):undefined,headCm:hC?parseFloat(hC):undefined});
    setWK("");setLC("");setHC("");setShowForm(false);
  };

  const quickAdd=(field,value)=>{
    const entry={type:"growth",date:todayStr(),time:nowTime(),id:uid()};
    entry[field]=value;
    onAddEntry(entry);
  };

  // Mini chart for a metric
  function GrowthChart({label,field,table,color}){
    const pts=allPoints.filter(p=>p[field]);
    if(pts.length<1)return null;
    // WHO P3, P50, P97 curves
    const maxAge=Math.max(ageMonths+1,3);
    const whoSteps=[];for(let m=0;m<=maxAge;m+=maxAge/20){
      const lms=interpolateLMS(table,m);
      const z3=lms.M*Math.pow(1+lms.L*lms.S*(-1.88),1/lms.L);
      const z97=lms.M*Math.pow(1+lms.L*lms.S*1.88,1/lms.L);
      whoSteps.push({m,p3:Math.abs(lms.L)>0.001?z3:lms.M*Math.exp(-1.88*lms.S),p50:lms.M,p97:Math.abs(lms.L)>0.001?z97:lms.M*Math.exp(1.88*lms.S)});
    }
    const allVals=[...whoSteps.map(w=>w.p97),...whoSteps.map(w=>w.p3),...pts.map(p=>p[field])];
    const minV=Math.min(...allVals)*0.9,maxV=Math.max(...allVals)*1.05;
    const W=320,H=140;
    const x=m=>10+(m/maxAge)*(W-20);
    const y=v=>H-10-((v-minV)/(maxV-minV))*(H-20);
    const pathStr=(arr,key)=>arr.map((p,i)=>`${i===0?"M":"L"}${x(p.m).toFixed(1)},${y(p[key]).toFixed(1)}`).join(" ");
    return(<div style={{marginBottom:16}}>
      <div style={{fontSize:12,fontWeight:700,color,marginBottom:6}}>{label}</div>
      <svg width={W} height={H} viewBox={`0 0 ${W} ${H}`} style={{width:"100%",height:"auto",background:T.glass,borderRadius:12,border:`1px solid ${T.gB}`}}>
        <path d={pathStr(whoSteps,"p3")+" L"+x(maxAge)+","+y(whoSteps[whoSteps.length-1].p97)+" "+pathStr([...whoSteps].reverse(),"p97")} fill={`${color}08`} stroke="none"/>
        <path d={pathStr(whoSteps,"p50")} fill="none" stroke={`${color}44`} strokeWidth="1" strokeDasharray="4,3"/>
        <path d={pathStr(whoSteps,"p3")} fill="none" stroke={`${color}22`} strokeWidth="0.5"/>
        <path d={pathStr(whoSteps,"p97")} fill="none" stroke={`${color}22`} strokeWidth="0.5"/>
        {pts.map((p,i)=><circle key={i} cx={x(p.ageM)} cy={y(p[field])} r={4} fill={color} stroke={T.bg1} strokeWidth={2}/>)}
        {pts.length>1&&<path d={pts.map((p,i)=>`${i===0?"M":"L"}${x(p.ageM).toFixed(1)},${y(p[field]).toFixed(1)}`).join(" ")} fill="none" stroke={color} strokeWidth="2"/>}
        <text x={W-4} y={y(whoSteps[whoSteps.length-1].p50)+4} textAnchor="end" fill={`${color}66`} fontSize="8">P50</text>
        <text x={W-4} y={y(whoSteps[whoSteps.length-1].p97)+4} textAnchor="end" fill={`${color}44`} fontSize="7">P97</text>
        <text x={W-4} y={y(whoSteps[whoSteps.length-1].p3)+4} textAnchor="end" fill={`${color}44`} fontSize="7">P3</text>
      </svg>
    </div>);
  }

  function PercentileCard({label,value,unit,table,icon,field,onQuickAdd}){
    const[adding,setAdding]=useState(false);
    const[val,setVal]=useState("");
    if(!value&&!adding)return(<div style={{background:T.glass,borderRadius:14,padding:14,marginBottom:8,border:`1px solid ${T.gB}`,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
      <div style={{display:"flex",alignItems:"center",gap:8}}><Icon name={icon} size={14} color={T.dim}/><span style={{fontSize:13,fontWeight:600,color:T.dim}}>{label}</span></div>
      <button onClick={()=>setAdding(true)} style={{padding:"6px 12px",borderRadius:8,background:"rgba(163,230,53,0.1)",border:"1px solid rgba(163,230,53,0.2)",fontSize:11,fontWeight:700,color:"#a3e635"}}>+ Registrar</button>
    </div>);
    const result=value?getPercentile(value,table,ageMonths):null;
    const p=result?.percentile;
    const pColor=!p?T.dim:p<3||p>97?T.red:p<15||p>85?T.orange:T.green;
    return(<div style={{background:T.glass,borderRadius:14,padding:14,marginBottom:8,border:`1px solid ${T.gB}`}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
        <div style={{display:"flex",alignItems:"center",gap:8}}><Icon name={icon} size={14} color={pColor}/><span style={{fontSize:13,fontWeight:700}}>{label}</span></div>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          {value&&<span style={{fontSize:18,fontWeight:800}}>{value} {unit}</span>}
          <button onClick={()=>setAdding(!adding)} style={{width:28,height:28,borderRadius:8,background:"rgba(163,230,53,0.1)",border:"1px solid rgba(163,230,53,0.15)",display:"flex",alignItems:"center",justifyContent:"center"}}><Icon name="plus" size={12} color="#a3e635"/></button>
        </div>
      </div>
      {value&&<><div style={{display:"flex",alignItems:"center",gap:10}}>
        <div style={{flex:1,height:6,borderRadius:3,background:T.bg3,overflow:"hidden",position:"relative"}}>
          <div style={{position:"absolute",left:"3%",width:1,height:"100%",background:T.dim,opacity:0.3}}/>
          <div style={{position:"absolute",left:"50%",width:1,height:"100%",background:T.dim,opacity:0.5}}/>
          <div style={{position:"absolute",left:"97%",width:1,height:"100%",background:T.dim,opacity:0.3}}/>
          <div style={{position:"absolute",left:`${Math.max(1,Math.min(99,p))}%`,transform:"translateX(-50%)",width:8,height:8,borderRadius:"50%",background:pColor,top:-1,boxShadow:`0 0 6px ${pColor}88`}}/>
        </div>
        <span style={{fontSize:14,fontWeight:800,color:pColor,minWidth:35,textAlign:"right"}}>P{p}</span>
      </div>
      <div style={{fontSize:10,color:T.sub,marginTop:4}}>Mediana OMS: {result.median.toFixed(1)} {unit}</div></>}
      {adding&&<div style={{display:"flex",gap:8,marginTop:10,alignItems:"center"}}>
        <input type="number" inputMode="decimal" step="0.01" placeholder={`${label} em ${unit}`} value={val} onChange={e=>setVal(e.target.value)} autoFocus style={{flex:1,padding:"10px 12px",background:"rgba(14,18,48,0.8)",border:`1px solid ${T.gB}`,borderRadius:10,color:T.text,fontSize:15,outline:"none",textAlign:"center"}}/>
        <button onClick={()=>{if(!val)return;onQuickAdd(field,parseFloat(val));setVal("");setAdding(false)}} style={{padding:"10px 16px",borderRadius:10,background:"#a3e635",color:T.bg1,fontSize:13,fontWeight:700}}>Salvar</button>
      </div>}
    </div>);
  }

  const inp={width:"100%",padding:"12px",background:"rgba(14,18,48,0.8)",border:`1px solid ${T.gB}`,borderRadius:10,color:T.text,fontSize:15,outline:"none",textAlign:"center"};

  return(<div style={{padding:"16px 20px 0"}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
      <div style={{display:"flex",alignItems:"center",gap:10}}><button onClick={onBack} style={{width:32,height:32,borderRadius:10,background:T.glass,border:`1px solid ${T.gB}`,display:"flex",alignItems:"center",justifyContent:"center"}}><Icon name="back" size={16} color={T.sub}/></button><h2 style={{fontSize:17,fontWeight:700,margin:0}}>Crescimento</h2></div>
      <button onClick={()=>setShowForm(!showForm)} style={{padding:"6px 12px",borderRadius:10,background:"rgba(163,230,53,0.1)",border:"1px solid rgba(163,230,53,0.2)",fontSize:12,fontWeight:700,color:"#a3e635"}}>{showForm?"Cancelar":"+ Medição"}</button>
    </div>

    {showForm&&<div style={{background:T.glass,borderRadius:14,padding:16,marginBottom:16,border:`1px solid ${T.gB}`}}>
      <div style={{fontSize:12,fontWeight:700,color:T.sub,marginBottom:12}}>Nova medição</div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:12}}>
        <Fld label="Peso (kg)"><input type="number" inputMode="decimal" step="0.01" placeholder="4.5" value={wK} onChange={e=>setWK(e.target.value)} style={inp}/></Fld>
        <Fld label="Comp. (cm)"><input type="number" inputMode="decimal" step="0.1" placeholder="55" value={lC} onChange={e=>setLC(e.target.value)} style={inp}/></Fld>
        <Fld label="Cabeça (cm)"><input type="number" inputMode="decimal" step="0.1" placeholder="37" value={hC} onChange={e=>setHC(e.target.value)} style={inp}/></Fld>
      </div>
      <button onClick={doAdd} style={{width:"100%",padding:12,borderRadius:10,background:"#a3e635",color:T.bg1,fontSize:14,fontWeight:700}}>Salvar medição</button>
    </div>}

    {/* Percentile cards */}
    {latest&&<div style={{fontSize:11,color:T.sub,marginBottom:10}}>
      {latest.label==="Nasc."?"Dados de nascimento":`Última medição: ${latest.label}`} · {ageMonths.toFixed(1)} meses
    </div>}
    <PercentileCard label="Peso" value={latest?.weightKg} unit="kg" table={WHO_GIRLS.weight} icon="target" field="weightKg" onQuickAdd={quickAdd}/>
    <PercentileCard label="Comprimento" value={latest?.lengthCm} unit="cm" table={WHO_GIRLS.length} icon="ruler" field="lengthCm" onQuickAdd={quickAdd}/>
    <PercentileCard label="Cabeça" value={latest?.headCm} unit="cm" table={WHO_GIRLS.head} icon="target" field="headCm" onQuickAdd={quickAdd}/>

    {/* Growth charts */}
    {allPoints.length>0&&<>
      <div style={{fontSize:12,fontWeight:600,color:T.dim,marginTop:16,marginBottom:10,textTransform:"uppercase",letterSpacing:0.8}}>Curvas de crescimento</div>
      <GrowthChart label="Peso (kg)" field="weightKg" table={WHO_GIRLS.weight} color={T.green}/>
      <GrowthChart label="Comprimento (cm)" field="lengthCm" table={WHO_GIRLS.length} color={T.blue}/>
      <GrowthChart label="Cabeça (cm)" field="headCm" table={WHO_GIRLS.head} color={T.amber}/>
    </>}

    {/* History table */}
    {allPoints.length>0&&<><div style={{fontSize:12,fontWeight:600,color:T.dim,marginTop:8,marginBottom:10,textTransform:"uppercase",letterSpacing:0.8}}>Histórico</div>
      {[...allPoints].reverse().map((p,i)=><div key={i} style={{display:"flex",alignItems:"center",gap:12,padding:"8px 12px",marginBottom:4,background:T.glass,borderRadius:10,border:`1px solid ${T.gB}`}}>
        <span style={{fontSize:11,color:T.sub,minWidth:50}}>{p.label}</span>
        <div style={{flex:1,display:"flex",gap:10,fontSize:12}}>
          {p.weightKg&&<span style={{color:T.green}}>{p.weightKg}kg</span>}
          {p.lengthCm&&<span style={{color:T.blue}}>{p.lengthCm}cm</span>}
          {p.headCm&&<span style={{color:T.amber}}>Cab. {p.headCm}</span>}
        </div>
      </div>)}
    </>}
    <div style={{marginTop:16,padding:12,background:T.glass,borderRadius:12,border:`1px solid ${T.gB}`,fontSize:10,color:T.dim,lineHeight:1.6}}>
      Curvas OMS para meninas 0-24m. Linha tracejada = P50 (mediana). Faixa = P3-P97.
    </div>
  </div>);
}

// ── MAIN APP ──
function App(){
  const[entries,setEntries]=useState([]);const[savedMeds,setSavedMeds]=useState([]);
  const[profile,setProfile]=useState({name:"",birthDate:"2026-03-08",photo:"",mlGoal:0});
  const[activeTimer,setActiveTimer]=useState(null);const[loading,setLoading]=useState(true);
  const[page,setPage]=useState("home");const[showAdd,setShowAdd]=useState(false);const[formType,setFormType]=useState(null);
  const[showProfile,setShowProfile]=useState(false);const[showSleepInfo,setShowSleepInfo]=useState(false);
  const[toast,setToast]=useState(null);const[tick,setTick]=useState(0);const undoRef=useRef(null);

  useEffect(()=>{const t=setInterval(()=>setTick(k=>k+1),1000);return()=>clearInterval(t)},[]);

  // Firebase real-time subscriptions
  useEffect(()=>{
    let ready={e:false,p:false,m:false,a:false};
    const check=()=>{if(Object.values(ready).every(Boolean))setLoading(false)};
    const u1=FB.subEntries(d=>{setEntries(d);ready.e=true;check()});
    const u2=FB.subProfile(d=>{if(d)setProfile(d);ready.p=true;check()});
    const u3=FB.subMeds(d=>{setSavedMeds(d||[{name:"Simeticona",dose:""},{name:"Paracetamol",dose:""},{name:"Floripa",dose:""},{name:"Vita. D",dose:""}]);ready.m=true;check()});
    const u4=FB.subTimer(d=>{setActiveTimer(d?.cleared?null:d);ready.a=true;check()});
    return()=>{u1();u2();u3();u4()};
  },[]);

  const showToast=(msg,fn)=>{undoRef.current=fn;setToast(msg)};
  const handleUndo=()=>{if(undoRef.current)undoRef.current();setToast(null)};
  const addEntry=useCallback(async e=>{
    const parts=splitMidnight(e);
    for(const p of parts) await FB.addEntry(p);
    setFormType(null);setShowAdd(false);
    showToast(`${TYPES[e.type]?.label||e.type} registrado`,async()=>{for(const p of parts) await FB.delEntry(p.id)});
  },[]);
  const deleteEntry=useCallback(async id=>{const entry=entries.find(e=>e.id===id);await FB.delEntry(id);showToast(`${TYPES[entry?.type]?.label||""} removido`,async()=>{if(entry)await FB.addEntry(entry)})},[entries]);
  const quickWakeup=useCallback(()=>addEntry({type:"wakeup",date:todayStr(),time:nowTime(),id:uid()}),[addEntry]);
  const duplicateLast=useCallback(()=>{if(!entries.length)return;const l=entries[0];addEntry({...l,id:uid(),date:todayStr(),time:nowTime(),_docId:undefined})},[entries,addEntry]);
  const startTimer=useCallback(async type=>{await FB.saveTimer({type,startTime:new Date().toISOString()});setShowAdd(false)},[]);
  const stopTimer=useCallback(async()=>{if(!activeTimer)return;const s=new Date(activeTimer.startTime);const mins=Math.max(1,Math.round((Date.now()-s.getTime())/6e4));const entry={type:activeTimer.type,date:`${s.getFullYear()}-${String(s.getMonth()+1).padStart(2,"0")}-${String(s.getDate()).padStart(2,"0")}`,time:`${String(s.getHours()).padStart(2,"0")}:${String(s.getMinutes()).padStart(2,"0")}`,durationMin:mins,id:uid()};const parts=splitMidnight(entry);for(const p of parts) await FB.addEntry(p);await FB.saveTimer(null);showToast(`${mins}min registrado`,null)},[activeTimer]);

  const today=todayStr();const todayE=useMemo(()=>entries.filter(e=>e.date===today),[entries,today]);
  const totalMl=todayE.filter(e=>e.type==="bottle").reduce((s,e)=>s+(e.ml||0),0);
  const totalNursingMin=todayE.filter(e=>e.type==="nursing"&&e.durationMin).reduce((s,e)=>s+e.durationMin,0);
  const totalNursing=todayE.filter(e=>e.type==="nursing").length;
  const totalSleep=todayE.filter(e=>(e.type==="sleep"||e.type==="nap")&&e.durationMin).reduce((s,e)=>s+e.durationMin,0);
  const totalDiapers=todayE.filter(e=>e.type==="diaper").length;
  const age=calcAge(profile.birthDate);const babyName=profile.name||"Bebê";
  const sleepRec=useMemo(()=>getSleepRec(entries,age,profile.birthDate),[entries,age,profile.birthDate]);
  const napSug=useMemo(()=>!activeTimer?getNapSug(todayE,sleepRec):null,[todayE,sleepRec,activeTimer,tick]);
  const daysLeft=sleepRec?.phase===1?sleepRec.dl:null;

  if(loading)return<div style={{background:T.bg1,minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",color:T.dim}}>Carregando...</div>;
  const goTo=p=>{setPage(p);setShowAdd(false);setFormType(null)};

  return(<div style={{background:`radial-gradient(ellipse at 50% 0%,#10153d 0%,${T.bg1} 65%)`,minHeight:"100vh",color:T.text,maxWidth:480,margin:"0 auto",position:"relative",paddingBottom:activeTimer?170:80}}>
    <div style={{position:"fixed",inset:0,pointerEvents:"none",zIndex:0}}>{Array.from({length:40}).map((_,i)=><div key={i} style={{position:"absolute",width:Math.random()*1.5+0.5,height:Math.random()*1.5+0.5,background:`rgba(160,170,255,${Math.random()*0.2+0.05})`,borderRadius:"50%",top:Math.random()*100+"%",left:Math.random()*100+"%",animation:`twinkle ${3+Math.random()*4}s ease-in-out infinite ${Math.random()*4}s`}}/>)}</div>
    {toast&&<Toast message={toast} onUndo={undoRef.current?handleUndo:null} onClose={()=>setToast(null)}/>}
    <div style={{position:"relative",zIndex:1}}>
      {page==="home"&&<div style={{animation:"fadeIn .3s"}}>
        <div style={{padding:"18px 20px 0",display:"flex",alignItems:"center",gap:12}}>
          <div style={{position:"relative"}}><button onClick={()=>setShowProfile(true)} style={{width:46,height:46,borderRadius:"50%",overflow:"hidden",border:`2px solid ${T.accent}33`,background:T.glass,display:"flex",alignItems:"center",justifyContent:"center"}}>{profile.photo?<img src={profile.photo} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/>:<Icon name="sun" size={22} color={T.sub}/>}</button>{daysLeft!==null&&daysLeft>0&&<button onClick={()=>setShowSleepInfo(true)} style={{position:"absolute",top:-4,right:-8,minWidth:24,height:24,borderRadius:12,background:T.accent,color:"#fff",fontSize:11,fontWeight:800,display:"flex",alignItems:"center",justifyContent:"center",padding:"0 6px",boxShadow:`0 2px 8px ${T.accent}66`,border:`2px solid ${T.bg1}`}}>{daysLeft}</button>}{sleepRec?.phase===2&&<button onClick={()=>setShowSleepInfo(true)} style={{position:"absolute",top:-2,right:-6,width:20,height:20,borderRadius:10,background:T.green,display:"flex",alignItems:"center",justifyContent:"center",border:`2px solid ${T.bg1}`}}><Icon name="check" size={10} color={T.bg1}/></button>}</div>
          <div style={{flex:1}}><h1 style={{fontSize:20,fontWeight:800,margin:0,letterSpacing:-0.5}}>{babyName}</h1><div style={{fontSize:11,color:T.sub,marginTop:2}}>{age&&<>{age.months>0?`${age.months} ${age.months===1?"mês":"meses"} e `:""}{age.days} dias</>}</div></div>
          <span style={{fontSize:10,color:T.dim}}>{new Date().toLocaleDateString("pt-BR",{day:"numeric",month:"short"})}</span>
        </div>
        <div style={{padding:"20px 0 8px"}}><Ring activeTimer={activeTimer} napSug={napSug} tick={tick} recentEvents={todayE.slice(0,5)}/></div>
        <div style={{display:"flex",gap:8,padding:"0 20px",marginBottom:14}}>{!activeTimer&&<><button onClick={quickWakeup} style={{flex:1,padding:"10px 0",borderRadius:12,background:T.amberS,border:`1px solid ${T.amber}22`,display:"flex",alignItems:"center",justifyContent:"center",gap:5}}><Icon name="sun" size={13} color={T.amber}/><span style={{fontSize:11,fontWeight:700,color:T.amber}}>Acordou</span></button><button onClick={()=>{setFormType("bottle");setShowAdd(false)}} style={{flex:1,padding:"10px 0",borderRadius:12,background:T.greenS,border:`1px solid ${T.green}22`,display:"flex",alignItems:"center",justifyContent:"center",gap:5}}><Icon name="bottle" size={13} color={T.green}/><span style={{fontSize:11,fontWeight:700,color:T.green}}>Mamad.</span></button><button onClick={()=>startTimer("nap")} style={{flex:1,padding:"10px 0",borderRadius:12,background:`${T.accent}15`,border:`1px solid ${T.accent}22`,display:"flex",alignItems:"center",justifyContent:"center",gap:5}}><Icon name="play" size={12} color={T.accent}/><span style={{fontSize:11,fontWeight:700,color:T.accent}}>Soneca</span></button><button onClick={()=>startTimer("sleep")} style={{flex:1,padding:"10px 0",borderRadius:12,background:T.purpleS,border:`1px solid ${T.purple}22`,display:"flex",alignItems:"center",justifyContent:"center",gap:5}}><Icon name="play" size={12} color={T.purple}/><span style={{fontSize:11,fontWeight:700,color:T.purple}}>Sono</span></button></>}</div>
        {napSug?.wind&&<div style={{margin:"0 20px 12px",padding:"10px 14px",borderRadius:12,background:T.amberS,border:`1px solid ${T.amber}22`,display:"flex",alignItems:"center",gap:10,animation:"pulse 2s infinite"}}><Icon name="bell" size={18} color={T.amber}/><div><div style={{fontSize:12,fontWeight:700,color:T.amber}}>Preparar para dormir</div><div style={{fontSize:10,color:T.sub}}>~{napSug.rem}min restantes</div></div></div>}
        {napSug?.over&&<div style={{margin:"0 20px 12px",padding:"10px 14px",borderRadius:12,background:T.orangeS,border:`1px solid ${T.orange}22`,display:"flex",alignItems:"center",gap:10,animation:"pulse 1.5s infinite"}}><Icon name="zap" size={18} color={T.orange}/><div><div style={{fontSize:12,fontWeight:700,color:T.orange}}>Janela de sono passou</div><div style={{fontSize:10,color:T.sub}}>{fmtDur(napSug.el)} acordado(a)</div></div></div>}
        <MlGoalBar current={totalMl} goal={profile.mlGoal}/>
        <WeeklyCard entries={entries}/>
        <div style={{padding:"0 20px",marginBottom:14}}><div style={{display:"flex",background:T.glass,borderRadius:14,border:`1px solid ${T.gB}`}}>{[{i:"bottle",v:`${totalMl}`,u:"ml",c:T.green},{i:"breast",v:totalNursingMin>0?fmtDur(totalNursingMin):`${totalNursing}x`,c:T.blue},{i:"moon",v:fmtDur(totalSleep),c:T.purple},{i:"droplet",v:`${totalDiapers}`,c:T.pink}].map((p,idx)=><div key={idx} style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",gap:5,padding:"10px 2px"}}><Icon name={p.i} size={14} color={p.c}/><span style={{fontSize:12,fontWeight:700,color:p.c}}>{p.v}{p.u?<span style={{fontSize:10,fontWeight:500,opacity:0.7}}>{p.u}</span>:null}</span></div>)}</div></div>
        {entries.length>0&&<div style={{padding:"0 20px",marginBottom:14}}><button onClick={duplicateLast} style={{width:"100%",padding:"10px 14px",borderRadius:12,background:T.glass,border:`1px solid ${T.gB}`,display:"flex",alignItems:"center",justifyContent:"center",gap:8}}><Icon name="copy" size={14} color={T.sub}/><span style={{fontSize:12,fontWeight:600,color:T.sub}}>Repetir último: {TYPES[entries[0].type]?.label}</span></button></div>}
        <div style={{padding:"0 20px"}}><div style={{fontSize:12,fontWeight:600,color:T.dim,marginBottom:8,textTransform:"uppercase",letterSpacing:0.8}}>Hoje</div>{todayE.length===0&&<div style={{textAlign:"center",padding:"32px 20px",color:T.dim}}><Icon name="star" size={32} color={T.dim} fill={T.dim}/><div style={{fontSize:13,marginTop:8}}>Toque + para registrar</div></div>}{todayE.map(e=><EntryRow key={e.id} entry={e} onDelete={deleteEntry}/>)}</div>
      </div>}
      {page==="history"&&<HistoryPage entries={entries} onDelete={deleteEntry}/>}
      {page==="stats"&&<StatsPage entries={entries} onGrowth={()=>goTo("growth")}/>}
      {page==="growth"&&<GrowthPage entries={entries} birthDate={profile.birthDate} profile={profile} onBack={()=>goTo("stats")} onAddEntry={addEntry}/>}
    </div>

    <Modal open={showSleepInfo} onClose={()=>setShowSleepInfo(false)}>
      {sleepRec?.phase===1&&<><div style={{textAlign:"center",marginBottom:16}}><Icon name="star" size={40} color={T.accent} fill={T.accent}/></div><div style={{textAlign:"center",fontSize:22,fontWeight:800,marginBottom:6}}>{sleepRec.dl} dias</div><div style={{textAlign:"center",fontSize:13,color:T.sub,marginBottom:16}}>para o plano de sono de {babyName}</div><div style={{height:4,borderRadius:2,background:T.bg1,marginBottom:16,overflow:"hidden"}}><div style={{height:"100%",width:`${Math.max(0,Math.min(100,((60-sleepRec.dl)/60)*100))}%`,background:T.accent,borderRadius:2}}/></div><div style={{fontSize:12,color:T.sub,lineHeight:1.6}}>Aos 2 meses o ritmo circadiano amadurece. Continue registrando.</div><div style={{marginTop:14,padding:"10px 12px",borderRadius:10,background:"rgba(14,18,48,0.6)",fontSize:11,color:T.dim}}>Janela: {sleepRec.g.min}–{sleepRec.g.max} min · {sleepRec.g.naps} sonecas/dia</div></>}
      {sleepRec?.phase===2&&<><div style={{textAlign:"center",marginBottom:12}}><Icon name="check" size={36} color={T.green}/></div><div style={{textAlign:"center",fontSize:16,fontWeight:700,marginBottom:14}}>Plano de sono ativo</div>{sleepRec.a?<><div style={{padding:10,borderRadius:10,background:T.greenS,textAlign:"center",marginBottom:14}}><div style={{fontSize:9,color:T.sub,textTransform:"uppercase",marginBottom:4}}>Recomendado</div><div style={{fontSize:18,fontWeight:800,color:T.green}}>{fmtDur(sleepRec.a.rec)}</div></div><div style={{fontSize:11,color:T.dim}}>Baseado em {sleepRec.a.pts} observações</div></>:<div style={{fontSize:12,color:T.sub}}>Registre mais dados para personalizar.</div>}</>}
    </Modal>

    <Sheet open={showAdd&&!formType} onClose={()=>setShowAdd(false)}>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:"8px 0",padding:"0 16px"}}>{["bottle","nursing","sleep","nap","wakeup","nightwaking","diaper","medicine","temperature","pumping"].map((type,i)=>{const cfg=TYPES[type];const last=entries.find(e=>e.type===type);const agoRaw=last?timeSince(last.date,last.time):null;const ago=agoRaw==="now"?"Just now":agoRaw;return(<button key={type} onClick={()=>setFormType(type)} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:10,padding:"14px 4px 10px",animation:`slideUp .3s ease ${i*0.035}s both`}}><div style={{width:66,height:66,borderRadius:"50%",background:`radial-gradient(circle at 40% 35%, rgba(45,55,110,0.9), rgba(16,20,50,0.95))`,border:`1.5px solid ${cfg.color}20`,display:"flex",alignItems:"center",justifyContent:"center",boxShadow:`0 4px 16px rgba(0,0,0,0.35), 0 0px 20px ${cfg.color}10, inset 0 1px 0 rgba(180,190,255,0.06)`,transition:"transform .15s, box-shadow .15s"}}><Icon name={cfg.icon} size={26} color={cfg.color}/></div><div style={{textAlign:"center"}}><div style={{fontSize:12,fontWeight:600,color:T.text,lineHeight:1.3}}>{cfg.label}</div>{ago&&<div style={{fontSize:10,color:T.dim,marginTop:2}}>{ago}</div>}</div></button>)})}</div>
    </Sheet>

    <Sheet open={!!formType} onClose={()=>setFormType(null)}>
      {formType&&<AddForm type={formType} onSave={addEntry} savedMeds={savedMeds} onSaveMeds={async m=>await FB.saveMeds(m)}/>}
    </Sheet>

    {showProfile&&<ProfilePage profile={profile} onSave={async p=>await FB.saveProfile(p)} onBack={()=>setShowProfile(false)} onGrowth={()=>{setShowProfile(false);goTo("growth")}}/>}
    <TimerBar activeTimer={activeTimer} onStop={stopTimer}/>

    <nav style={{position:"fixed",bottom:"calc(12px + env(safe-area-inset-bottom))",left:"50%",transform:"translateX(-50%)",width:"calc(100% - 32px)",maxWidth:448,display:"flex",alignItems:"center",justifyContent:"space-around",padding:"8px 12px",background:"rgba(16,20,52,0.92)",backdropFilter:"blur(16px)",borderRadius:22,border:`1px solid ${T.gB}`,boxShadow:"0 8px 32px rgba(0,0,0,0.5)",zIndex:50}}>
      {[{icon:"home",label:"Início",active:page==="home"&&!showAdd,action:()=>goTo("home")},{icon:"clock",label:"Histórico",active:page==="history",action:()=>goTo("history")}].map(n=><button key={n.icon} onClick={n.action} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:2,padding:"4px 8px",opacity:n.active?1:0.4}}><Icon name={n.icon} size={20} color={n.active?T.accent:T.sub}/><span style={{fontSize:9,fontWeight:600,color:n.active?T.accent:T.dim}}>{n.label}</span></button>)}
      <button onClick={()=>{setShowAdd(!showAdd);setFormType(null);setPage("home")}} style={{width:50,height:50,borderRadius:"50%",background:T.accent,display:"flex",alignItems:"center",justifyContent:"center",boxShadow:`0 4px 20px ${T.accent}44`,transition:"transform .2s cubic-bezier(0.34,1.56,0.64,1)",transform:showAdd?"rotate(45deg) scale(1.05)":"scale(1)",margin:"-8px 0"}}><Icon name="plus" size={22} color="#fff"/></button>
      {[{icon:"chart",label:"Resumo",active:page==="stats"||page==="growth",action:()=>goTo("stats")},{icon:"gear",label:"Perfil",active:false,action:()=>setShowProfile(true)}].map(n=><button key={n.icon} onClick={n.action} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:2,padding:"4px 8px",opacity:n.active?1:0.4}}><Icon name={n.icon} size={20} color={n.active?T.accent:T.sub}/><span style={{fontSize:9,fontWeight:600,color:n.active?T.accent:T.dim}}>{n.label}</span></button>)}
    </nav>
  </div>);
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
