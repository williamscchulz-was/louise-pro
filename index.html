  <script>
  window.onerror=function(msg,src,line,col,err){
    var d=document.getElementById('error-display');
    if(!d){d=document.createElement('div');d.id='error-display';d.style.cssText='position:fixed;inset:0;z-index:9999;background:#0a0e28;color:#f87171;padding:40px 20px;font-family:monospace;font-size:13px;overflow:auto;white-space:pre-wrap';document.body.appendChild(d);d.innerHTML='<div style="font-size:20px;font-weight:bold;color:#fbbf24;margin-bottom:16px">⚠ Louise Pro — Error</div>';}

    return false;
  };
  window.addEventListener('unhandledrejection',function(e){
    window.onerror('Promise: '+(e.reason&&e.reason.message||e.reason),null,0,0,e.reason);
  });
  // Toggle body.app-hidden whenever the PWA visibility changes. Paired with
  // the CSS rule in <style>, this freezes all animations while the app is
  // backgrounded — useful on iOS PWA where background throttling is weak.
  document.addEventListener('visibilitychange',function(){
    if(document.body){document.body.classList.toggle('app-hidden',document.hidden);}
  });
  // Auto-reload when a newly installed Service Worker takes control.
  // Without this, after a deploy the old SW keeps serving the stale
  // HTML until the user manually refreshes. The `controllerchange`
  // event fires exactly once per SW takeover — we guard against reload
  // loops with a session flag.
  if('serviceWorker' in navigator){
    var _swReloading=false;
    navigator.serviceWorker.addEventListener('controllerchange',function(){
      if(_swReloading)return;
      _swReloading=true;
      // v10.8.0: banner visível curto antes do reload pra usuário entender que é update, não bug.
      try{
        var b=document.createElement('div');

        document.head.appendChild(st);
        document.body.appendChild(b);
      }catch(e){}
      setTimeout(function(){window.location.reload()},800);
    });
  }
  </script>

<div id="root"></div>
<!-- Host para nav + TimerBar via React Portal. Fora do #root (que tem overflow:hidden)
     e do App root (que tem overflow:auto). Essencial pra position:fixed funcionar
     corretamente em iOS Safari PWA — o bug famoso onde fixed dentro de ancestor com
     overflow:auto vira efetivamente absolute em standalone mode.
     O próprio host eh position:fixed inset:0 pointer-events:none pra cobrir toda a
     tela (incluindo a safe-area do home indicator do iPhone) e servir como
     containing block de referência pros filhos com position:fixed. Children que
     precisam clique (a nav, o TimerBar) restauram pointer-events:auto. -->
<div id="nav-host" style="position:fixed;inset:0;pointer-events:none;z-index:300"></div>
<!-- Publica --phys-h com screen.height pra que html/body/App container estendam até
     o fim FÍSICO da tela (não só innerHeight). Assim o scroll container pode
     escorrer conteúdo até atrás do home indicator, simetricamente ao que já
     acontece atrás do status bar no topo. -->
<script>
(function(){
  function upd(){
    var h=(window.screen&&window.screen.height)||window.innerHeight;
    document.documentElement.style.setProperty('--phys-h',h+'px');
  }
  upd();
  window.addEventListener('resize',upd);
  window.addEventListener('orientationchange',upd);
})();
</script>

    d.style.color='#f87171';

};

// OFFLINE PERSISTENCE (v10.5.2): cacheia entries/config no IndexedDB.
// Impacto no cold start iPhone PWA: antes de receber do servidor (200-800ms), o app
// já renderiza com o último snapshot em cache. Sensação de "abriu instantâneo".
// synchronizeTabs: multi-aba ou PWA + Safari abertos não brigam pelo lock.
// Catch silencioso: em browsers sem suporte (raríssimo), segue sem persistência.
db.enablePersistence({synchronizeTabs: true}).catch(()=>{});

// Firebase functions (global, accessed by React code)
window.FB = {
  subEntries(cb) {
    return db.collection('entries').orderBy('date','desc').onSnapshot(snap => {
      const data = snap.docs.map(d => ({...d.data(), _docId: d.id}));
      data.sort((a,b) => (`${b.date}T${b.time}`).localeCompare(`${a.date}T${a.time}`));
      cb(data);
    });
  },
  async addEntry(e) { 
    // Remove undefined values (Firestore rejects them)
    const clean = Object.fromEntries(Object.entries(e).filter(([_,v]) => v !== undefined));
    await db.collection('entries').doc(e.id).set(clean); 
  },
  async delEntry(id) { await db.collection('entries').doc(id).delete(); },
  subProfile(cb) { return db.collection('config').doc('profile').onSnapshot(s => cb(s.exists ? s.data() : null)); },
  // MERGE: campos não incluídos em `p` ficam preservados. Blinda contra callers que passam
  // payload parcial (ex: side-paths que só atualizam lastSeenVersion) ou state stale de
  // outra aba/dispositivo. SEM merge qualquer save parcial limpava name/photo/etc. v10.5.0.
  async saveProfile(p) { await db.collection('config').doc('profile').set(p, {merge:true}); },
  subMeds(cb) { return db.collection('config').doc('meds').onSnapshot(s => cb(s.exists ? s.data()?.list : null)); },
  async saveMeds(m) { await db.collection('config').doc('meds').set({list:m}); },
  subTimer(cb) { return db.collection('config').doc('active').onSnapshot(s => cb(s.exists ? s.data() : null)); },
  async saveTimer(t) { await db.collection('config').doc('active').set(t||{cleared:true}); },
  subInbox(cb) { return db.collection('config').doc('inbox').onSnapshot(s => cb(s.exists ? s.data() : null)); },
  // MERGE defensivo: mesmo padrão do saveProfile — preserva campos não incluídos em `data`.
  async saveInbox(data) { await db.collection('config').doc('inbox').set(data, {merge:true}); },
  // Push notification token storage — each token is a separate doc in subcollection
  // Path: config/pushTokens/tokens/{tokenId}
  // Worker reads from this path to fan out push notifications.
  async savePushToken(token, lang) {
    if (!token) return;
    // Use a hash of the token as document ID to keep paths short and dedupe across devices
    const docId = btoa(token).replace(/[+/=]/g, '').slice(0, 40);
    await db.collection('config').doc('pushTokens').collection('tokens').doc(docId).set({
      token: token,
      lang: lang || 'en',
      updatedAt: new Date().toISOString()
    });
  },
  // Reminders: medication reminders that fire push notifications at scheduled times.
  // Path: config/reminders/items/{reminderId}
  // Worker checks this collection every minute and fires FCM if horario matches.
  subReminders(cb) {
    return db.collection('config').doc('reminders').collection('items').onSnapshot(snap => {
      const list = snap.docs.map(d => ({...d.data(), _id: d.id}));
      cb(list);
    });
  },
  async addReminder(reminder) {
    const id = reminder._id || ('rem_' + Date.now() + '_' + Math.random().toString(36).slice(2,7));
    const clean = {...reminder};
    delete clean._id;
    await db.collection('config').doc('reminders').collection('items').doc(id).set(clean);
    return id;
  },
  async delReminder(id) {
    await db.collection('config').doc('reminders').collection('items').doc(id).delete();
  },
  // ── BACKUP / RESTORE (v11.2) ──
  // Exporta TODO o state da Louise pro formato JSON que pode ser salvo em disco / iCloud /
  // Dropbox / etc. Importa restaura. Nossa rede de seguranca caso o Firestore tenha quota
  // issue, conta suspensa, ou alguem deletar por acidente.
  async exportAll() {
    const entriesSnap = await db.collection('entries').get();
    const entries = entriesSnap.docs.map(d => ({...d.data(), _docId: d.id}));
    const profileSnap = await db.collection('config').doc('profile').get();
    const profile = profileSnap.exists ? profileSnap.data() : null;
    const medsSnap = await db.collection('config').doc('meds').get();
    const meds = medsSnap.exists ? (medsSnap.data().list || []) : [];
    const inboxSnap = await db.collection('config').doc('inbox').get();
    const inbox = inboxSnap.exists ? inboxSnap.data() : null;
    const remindersSnap = await db.collection('config').doc('reminders').collection('items').get();
    const reminders = remindersSnap.docs.map(d => ({...d.data(), _id: d.id}));
    return {
      _meta: { version: 1, exportedAt: new Date().toISOString(), app: 'louise-pro' },
      entries, profile, meds, inbox, reminders
    };
  },
  async importAll(data) {
    if (!data || !data._meta || data._meta.app !== 'louise-pro') throw new Error('Invalid backup file');
    // Entries: set each (merge:false — replaces; import overwrites what was there)
    if (Array.isArray(data.entries)) {
      for (const e of data.entries) {
        const clean = {...e}; delete clean._docId;
        await db.collection('entries').doc(e.id || e._docId).set(clean);
      }
    }
    if (data.profile) await db.collection('config').doc('profile').set(data.profile, {merge: false});
    if (Array.isArray(data.meds)) await db.collection('config').doc('meds').set({list: data.meds});
    if (data.inbox) await db.collection('config').doc('inbox').set(data.inbox, {merge: false});
    if (Array.isArray(data.reminders)) {
      for (const r of data.reminders) {
        const clean = {...r}; delete clean._id;
        await db.collection('config').doc('reminders').collection('items').doc(r._id).set(clean);
      }
    }
  },
};
dbg('Firebase ready');
} catch(e) { dbg('Firebase Error: '+e.message); throw e; }
</script>

const {CURIOSITIES, WEEKLY_CURIOSITIES, MILESTONES} = window;
// Helper: pick today's curiosity based on age (same cascade used by CuriosityCard).
// Returns {title, body, tagLabel} in requested lang, or null if no curiosity fits today.
function getTodayCuriosity(age,lang){
  if(!age) return null;
  const dayNum=age.totalDays;
  const monthNum=age.months;
  const weekNum=age.totalWeeks;
  let txt=null,tagLabel="";
  // Priority 1: daily curiosities (days 1-30)
  if(dayNum>=1&&dayNum<=30){
    const c=CURIOSITIES&&CURIOSITIES[dayNum-1];
    if(c){
      txt=lang==="en"?c.en:c.pt;
      tagLabel=lang==="en"?`Day ${dayNum}`:`Dia ${dayNum}`;
    }
  }
  // Priority 2: monthly milestones (only on the exact day of the month anniversary)
  else if(monthNum>=2&&monthNum<=12&&age.days===0){
    const ms=MILESTONES&&MILESTONES.find(m=>m.m===monthNum);
    if(ms){
      txt=lang==="en"?ms.en:ms.pt;
      tagLabel=lang==="en"?`${monthNum} months`:`${monthNum} meses`;
    }
  }
  // Priority 3: weekly curiosities (weeks 5-52) — only on the first day of each new week
  // (dayNum%7===0 ⇔ day baby transitions into weekNum). Avoids repeating the same
  // weekly fact 7 days in a row.
  if(!txt&&weekNum>=5&&weekNum<=52&&dayNum%7===0){
    const idx=weekNum-5;
    const wc=WEEKLY_CURIOSITIES&&WEEKLY_CURIOSITIES[idx];
    if(wc){
      txt=lang==="en"?wc.en:wc.pt;
      tagLabel=lang==="en"?`Week ${weekNum}`:`Semana ${weekNum}`;
    }
  }
  if(!txt) return null;
  return{title:txt.t,body:txt.b,tagLabel};
}

// Split sleep entry that crosses midnight into two entries
function splitMidnight(entry){
  if(!entry.durationMin || (entry.type!=="sleep"&&entry.type!=="nap")) return [entry];
  const [h,m]=(entry.time||"00:00").split(":").map(Number);
  const startMin=h*60+m;
  const endMin=startMin+entry.durationMin;
  if(endMin<=1440) return [entry]; // doesn't cross midnight
  const beforeMidnight=1440-startMin;
  const afterMidnight=entry.durationMin-beforeMidnight;
  const nextDay=dateOffset(entry.date,1);
  // Split wakings: each waking belongs to ONE half based on its actual time.
  // A waking is "before midnight" if its time-of-day is >= startMin (still on the start day).
  // A waking is "after midnight" if its time-of-day is < startMin (rolled over to next day).
  const wakings=entry.wakings||[];
  const wakingsBefore=[];
  const wakingsAfter=[];
  for(const w of wakings){
    const [wh,wm]=(w.time||"00:00").split(":").map(Number);
    const wMin=wh*60+wm;
    // If the waking time is greater or equal to start time, it's still on the start day
    // (e.g., bedtime 20:42, waking 23:30 → before midnight)
    // Otherwise it rolled over (e.g., bedtime 20:42, waking 04:28 → after midnight)
    if(wMin>=startMin) wakingsBefore.push(w);
    else wakingsAfter.push(w);
  }
  const part1={...entry, durationMin:beforeMidnight, id:entry.id};
  const part2={...entry, date:nextDay, time:"00:00", durationMin:afterMidnight, id:entry.id+"_b"};
  // Only attach wakings array if non-empty (keeps entries clean for old code paths)
  if(wakingsBefore.length>0) part1.wakings=wakingsBefore; else delete part1.wakings;
  if(wakingsAfter.length>0) part2.wakings=wakingsAfter; else delete part2.wakings;
  return [part1, part2];
}

function EditStartModal({open,onClose,activeTimer,onSave}){
  const [dateStr,setDateStr]=useState("");
  const [timeStr,setTimeStr]=useState("");
  const [tick,setTick]=useState(0);
  // Init fields when opening
  useEffect(()=>{
    if(!open||!activeTimer)return;
    const st=new Date(activeTimer.startTime);
    setDateStr(`${st.getFullYear()}-${String(st.getMonth()+1).padStart(2,"0")}-${String(st.getDate()).padStart(2,"0")}`);
    setTimeStr(`${String(st.getHours()).padStart(2,"0")}:${String(st.getMinutes()).padStart(2,"0")}`);
  },[open,activeTimer]);
  // Live tick to keep "new duration" fresh
  useEffect(()=>{
    if(!open)return;
    const iv=setInterval(()=>setTick(k=>k+1),1000);
    return()=>clearInterval(iv);
  },[open]);
  if(!activeTimer)return null;
  const typeLabel=activeTimer.type==="sleep"?(_lang==="en"?"Bedtime":"Bedtime"):activeTimer.type==="nap"?(_lang==="en"?"Nap":"Soneca"):(_lang==="en"?"Tummy time":"Tummy time");
  const typeColor=activeTimer.type==="tummytime"?T.amber:T.purple;
  const typeColorLight=activeTimer.type==="tummytime"?"#fde68a":"#c4b5fd";
  const typeIcon=activeTimer.type==="sleep"?"moon":activeTimer.type==="nap"?"cloud":"baby";
  // Parse proposed new start
  let newStartMs=null,valid=false,errMsg="";
  try{
    if(dateStr&&timeStr){
      const d=new Date(`${dateStr}T${timeStr}`);
      if(!isNaN(d.getTime())){
        newStartMs=d.getTime();
        const nowMs=Date.now();
        if(newStartMs>nowMs){
          errMsg=_lang==="en"?"Start cannot be in the future":"Início não pode ser no futuro";
        }else if(nowMs-newStartMs>30*60*60*1000){
          errMsg=_lang==="en"?"Too far in the past (max 30h)":"Muito longe no passado (máx 30h)";
        }else{
          // If wakings exist, new start can't be after the first waking
          const wakings=activeTimer.wakings||[];
          if(wakings.length>0){
            const origStart=new Date(activeTimer.startTime);
            // Compute first waking absolute timestamp
            const fw=wakings[0];
            const[fwh,fwm]=(fw.time||"00:00").split(":").map(Number);
            const startMinOfDay=origStart.getHours()*60+origStart.getMinutes();
            const wakeMinOfDay=fwh*60+fwm;
            let dayOffset=0;
            if(wakeMinOfDay<startMinOfDay)dayOffset=1;
            const fwMs=new Date(origStart.getFullYear(),origStart.getMonth(),origStart.getDate()+dayOffset,fwh,fwm).getTime();
            if(newStartMs>=fwMs){
              errMsg=_lang==="en"?"First waking is before this time":"Primeiro despertar é antes desse horário";
            }else{valid=true}
          }else{valid=true}
        }
      }
    }
  }catch(e){errMsg=_lang==="en"?"Invalid date/time":"Data/hora inválidos"}
  // Current duration and new duration
  const newMins=newStartMs?Math.max(0,Math.floor((Date.now()-newStartMs)/60000)):0;
  const oldMins=Math.max(0,Math.floor((Date.now()-new Date(activeTimer.startTime).getTime())/60000));
  const fmtM=m=>{const h=Math.floor(m/60),r=m%60;return h>0?`${h}h ${r}min`:`${r}min`};
  const doSave=async()=>{
    if(!valid||!newStartMs)return;
    Haptic.medium();
    await onSave(new Date(newStartMs).toISOString());
    onClose();
  };
  const wakingsCount=(activeTimer.wakings||[]).length;
  return(<Modal open={open} onClose={onClose}>
    <div style={{width:64,height:64,margin:"0 auto 16px",borderRadius:20,background:`linear-gradient(135deg,${typeColor}38,${typeColor}10)`,border:`1px solid ${typeColor}50`,display:"flex",alignItems:"center",justifyContent:"center",boxShadow:"0 1px 0 0 rgba(255,255,255,0.08) inset",position:"relative"}}><Icon name={typeIcon} size={28} color={typeColorLight}/></div>
    <div style={{textAlign:"center",fontSize:22,fontWeight:800,letterSpacing:-0.5,color:"#f0f2ff",marginBottom:6}}>{_lang==="en"?"Edit start":"Editar início"}</div>
    <div style={{textAlign:"center",fontSize:12,color:"#9099c3",lineHeight:1.55,marginBottom:20}}>{_lang==="en"?`Change the start time of this ${typeLabel.toLowerCase()}. Wakings stay at their actual time.`:`Mude o horário de início deste ${typeLabel.toLowerCase()}. Despertares permanecem no horário real.`}</div>
    <div style={{fontSize:11,color:"#7a80a8",fontWeight:600,marginBottom:10,letterSpacing:-0.05}}>{_lang==="en"?"Day":"Data"}</div>
    <div style={{display:"grid",gridTemplateColumns:"minmax(0,1fr) minmax(0,1fr)",gap:10,marginBottom:16}}>
      <input type="date" value={dateStr} onChange={e=>setDateStr(e.target.value)} style={{width:"100%",maxWidth:"100%",boxSizing:"border-box",WebkitAppearance:"none",appearance:"none",padding:"14px 14px",background:"rgba(20,26,60,0.55)",border:`1px solid ${T.gBSoft}`,borderRadius:14,color:T.text,fontSize:16,fontWeight:600,letterSpacing:-0.2,outline:"none",colorScheme:"dark",textAlign:"center",boxShadow:T.insetTop}}/>
      <input type="time" value={timeStr} onChange={e=>setTimeStr(e.target.value)} style={{width:"100%",maxWidth:"100%",boxSizing:"border-box",WebkitAppearance:"none",appearance:"none",padding:"14px 14px",background:"rgba(20,26,60,0.55)",border:`1px solid ${T.gBSoft}`,borderRadius:14,color:T.text,fontSize:16,fontWeight:600,letterSpacing:-0.2,outline:"none",colorScheme:"dark",textAlign:"center",fontVariantNumeric:"tabular-nums",boxShadow:T.insetTop}}/>
    </div>
    {errMsg?(
      <div style={{padding:"12px 14px",borderRadius:12,background:"rgba(248,113,113,0.10)",border:"1px solid rgba(248,113,113,0.28)",marginBottom:16,fontSize:12,color:"#fca5a5",textAlign:"center",lineHeight:1.5}}>{errMsg}</div>
    ):valid&&(
      <div style={{padding:"12px 14px",borderRadius:12,background:`${typeColor}10`,border:`1px solid ${typeColor}28`,marginBottom:16,fontSize:12,color:typeColorLight,textAlign:"center",lineHeight:1.6}}>
        {_lang==="en"?"New duration: ":"Nova duração: "}<strong style={{color:"#f0f2ff",fontWeight:800}}>{fmtM(newMins)}</strong>
        <span style={{color:"#7a80a8",fontWeight:500}}> ({_lang==="en"?"was ":"era "}{fmtM(oldMins)})</span>
        {wakingsCount>0&&<div style={{fontSize:10,color:"#9099c3",marginTop:4}}>{wakingsCount} {_lang==="en"?`waking${wakingsCount>1?"s":""} preserved`:`despertar${wakingsCount>1?"es":""} preservado${wakingsCount>1?"s":""}`}</div>}
      </div>
    )}
    <button onClick={doSave} disabled={!valid} style={{width:"100%",padding:16,borderRadius:16,background:valid?`linear-gradient(180deg,${typeColor},${typeColor}cc)`:"rgba(14,18,48,0.6)",color:valid?"#1a0f00":T.dim,fontSize:16,fontWeight:800,letterSpacing:-0.2,border:`1px solid ${valid?`${typeColor}70`:T.gBSoft}`,boxShadow:valid?`0 1px 0 0 rgba(255,255,255,0.25) inset, 0 0 0 1px rgba(255,255,255,0.06), 0 8px 24px -8px ${typeColor}55`:"none",cursor:valid?"pointer":"not-allowed",opacity:valid?1:0.5}}>{_lang==="en"?"Save changes":"Salvar alterações"}</button>
  </Modal>);
}

    {/* Toolbar */}

      <span style={{fontSize:11,color:unreadCount>0?"#c4b5fd":T.dim,padding:"5px 12px",borderRadius:11,background:unreadCount>0?"linear-gradient(180deg,rgba(139,124,246,0.18),rgba(139,124,246,0.08))":"rgba(85,90,128,0.08)",fontWeight:700,letterSpacing:-0.05,border:`1px solid ${unreadCount>0?"rgba(139,124,246,0.32)":"rgba(85,90,128,0.15)"}`,boxShadow:unreadCount>0?T.insetTop:"none"}}>
        {unreadCount>0?`${unreadCount} ${lang==="en"?"new":"novas"}`:(lang==="en"?"All read":"Todas lidas")}
      </span>

    </div>}

    {/* List or empty state */}
    <div style={{flex:1,overflowY:"auto",WebkitOverflowScrolling:"touch"}}>
      {items.length===0?(
        <div style={{textAlign:"center",padding:"80px 24px 40px",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>
          <div style={{width:72,height:72,margin:"0 auto 18px",borderRadius:22,background:"rgba(139,124,246,0.06)",border:"1px solid rgba(139,124,246,0.12)",display:"flex",alignItems:"center",justifyContent:"center"}}>
            <Icon name="bell" size={32} color={T.dim}/>
          </div>
          <div style={{fontSize:15,fontWeight:800,marginBottom:6,color:T.text}}>{lang==="en"?"All caught up":"Tudo em dia"}</div>
          <div style={{fontSize:11,color:T.sub,lineHeight:1.6,maxWidth:260}}>{lang==="en"?"New hints from the routine engine will appear here during the day.":"Novas dicas do engine aparecerão aqui durante o dia."}</div>
          <div style={{display:"inline-flex",alignItems:"center",gap:5,marginTop:14,padding:"5px 10px",borderRadius:8,background:"rgba(139,124,246,0.06)",fontSize:9,color:T.accent,fontWeight:700,letterSpacing:0.5}}>
            <Icon name="clock" size={10} color={T.accent}/>
            {lang==="en"?"RESETS AT MIDNIGHT":"RESET À MEIA-NOITE"}
          </div>
        </div>
      ):items.map(it=>{
        const col=colorByType[it.type]||T.blue;
        const ic=iconByType[it.type]||"star";
        const unread=!readFn(it);
        const isCuriosity=it.type==="curiosity";
        const colLight=it.type==="good"?"#6ee7b7":it.type==="warn"?"#fdba74":it.type==="curiosity"?"#c4b5fd":"#7dd3fc";
        return(<button key={it.key} onClick={()=>unread&&onMarkRead(it.key)} style={{position:"relative",display:"flex",alignItems:"flex-start",gap:13,padding:"16px 22px 16px 26px",margin:"0 18px 8px",borderRadius:18,background:unread?`linear-gradient(180deg,${col}1a,${col}05)`:"rgba(22,28,60,0.35)",border:`1px solid ${unread?col+"38":T.gBSoft}`,boxShadow:unread?`0 1px 0 0 rgba(255,255,255,0.06) inset, 0 6px 16px -8px ${col}25`:T.insetTop,overflow:"hidden",width:"calc(100% - 36px)",textAlign:"left",cursor:unread?"pointer":"default"}}>
          <div style={{position:"absolute",left:0,top:0,bottom:0,width:4,background:`linear-gradient(180deg,${col},${col}40)`,borderRadius:"0 2px 2px 0",pointerEvents:"none",opacity:unread?1:0.4}}/>
          <div style={{width:38,height:38,borderRadius:12,background:`linear-gradient(135deg,${col}40,${col}10)`,border:`1px solid ${col}50`,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,opacity:unread?1:0.5,boxShadow:"0 1px 0 0 rgba(255,255,255,0.08) inset"}}>
            <Icon name={ic} size={17} color={colLight}/>
          </div>
          <div style={{flex:1,minWidth:0}}>
            {isCuriosity&&<div style={{fontSize:9,fontWeight:800,letterSpacing:0.8,textTransform:"uppercase",color:colLight,marginBottom:4,opacity:unread?1:0.5}}>{lang==="en"?"Daily curiosity":"Curiosidade do dia"}</div>}
            <div style={{fontSize:15,fontWeight:700,marginBottom:4,color:unread?colLight:T.sub,lineHeight:1.3,letterSpacing:-0.2}}>{it.title}</div>
            <div style={{fontSize:12,color:unread?"#9099c3":T.dim,lineHeight:1.55}}>{it.sub}</div>
            <div style={{fontSize:10,color:T.dim,marginTop:6,fontWeight:600,letterSpacing:0.3}}>{fmtAgo(it.timestamp)}</div>
          </div>
        </button>);
      })}
    </div>
  </div>);
}

function ProfilePage({profile,onSave,onBack,onGrowth,onShowChangelog,hasUnreadChangelog,reminders,onAddReminder,onDelReminder,onDirtyChange,cancelSignal,saveSignal}){
  const[name,setName]=useState(profile.name||"");
  const[birth,setBirth]=useState(profile.birthDate||"");
  const[photo,setPhoto]=useState(profile.photo||"");
  const[mlGoal,setMlGoal]=useState(String(profile.mlGoal||""));
  const[birthWeight,setBirthWeight]=useState(String(profile.birthWeight||""));
  const[birthLength,setBirthLength]=useState(String(profile.birthLength||""));
  const[birthHead,setBirthHead]=useState(String(profile.birthHead||""));
  const[langSel,setLangSel]=useState(profile.lang||"en");
  const[keepScreenOn,setKeepScreenOn]=useState(profile.keepScreenOn!==false);
  // hapticEnabled removed — iOS Safari doesn't support navigator.vibrate.
  // Still sent to Firestore as `false` for schema compat with any older clients.
  const hapticEnabled=false;
  const[pushEnabled,setPushEnabled]=useState(profile.pushEnabled===true);
  const[pushPermission,setPushPermission]=useState(()=>typeof Notification!=="undefined"?Notification.permission:"unsupported");
  const[pushBusy,setPushBusy]=useState(false);
  // Dirty tracking — only INPUT fields (not toggles, which autosave)
  // Revert-all handler, triggered by the Cancel button in the contextual navbar.
  // Defined early so effects below can reference it, but revertAll body is set after feeding states exist.
  const revertAllRef=useRef(null);
  // Watch cancelSignal — increments every time parent triggers cancel
  useEffect(()=>{if(cancelSignal&&revertAllRef.current)revertAllRef.current()},[cancelSignal]);
  // Watch saveSignal — increments every time parent triggers save via navbar.
  const saveRef=useRef(null);
  useEffect(()=>{if(saveSignal&&saveRef.current)saveRef.current()},[saveSignal]);
  // Local state for the new-reminder form
  const[remNome,setRemNome]=useState("");
  const[remDose,setRemDose]=useState("");
  const[remHorario,setRemHorario]=useState("09:00");
  const[remTitulo,setRemTitulo]=useState("");
  const[remCorpo,setRemCorpo]=useState("");
  const[remShowCustom,setRemShowCustom]=useState(false);
  const[remBusy,setRemBusy]=useState(false);
  // Edit-mode state for existing reminders
  const[editingRemId,setEditingRemId]=useState(null);
  const[editNome,setEditNome]=useState("");
  const[editDose,setEditDose]=useState("");
  const[editHorario,setEditHorario]=useState("");
  const[editTitulo,setEditTitulo]=useState("");
  const[editCorpo,setEditCorpo]=useState("");
  const[editBusy,setEditBusy]=useState(false);
  const startRemEdit=(r)=>{
    setEditingRemId(r._id);
    setEditNome(r.nome||"");
    setEditDose(r.dose||"");
    setEditHorario((r.horarios&&r.horarios[0])||"09:00");
    setEditTitulo(r.titulo||"");
    setEditCorpo(r.corpo||"");
  };
  const cancelRemEdit=()=>{
    setEditingRemId(null);setEditNome("");setEditDose("");setEditHorario("");setEditTitulo("");setEditCorpo("");
  };
  const saveRemEdit=async(orig)=>{
    if(!editNome.trim()||!editHorario)return;
    setEditBusy(true);Haptic.medium();
    try{
      const payload={_id:orig._id,nome:editNome.trim(),dose:editDose.trim(),horarios:[editHorario],ativo:orig.ativo!==false,createdAt:orig.createdAt||new Date().toISOString()};
      if(editTitulo.trim())payload.titulo=editTitulo.trim();
      if(editCorpo.trim())payload.corpo=editCorpo.trim();
      await onAddReminder(payload);
      cancelRemEdit();
      Haptic.success();
    }catch(e){Haptic.warning()}
    setEditBusy(false);
  };
  // Feeding interval reminder state — single global reminder, not a list
  // Lookup the existing one from props.reminders (if any)
  const feedReminder=(reminders||[]).find(r=>r.tipo==="feedingInterval");
  // Medication reminders list (everything except the feeding interval one)
  const medList=(reminders||[]).filter(r=>r.tipo!=="feedingInterval");
  const[fdEnabled,setFdEnabled]=useState(feedReminder?.ativo===true);
  const[fdMinutes,setFdMinutes]=useState(feedReminder?.intervalMin||120);
  const[fdBusy,setFdBusy]=useState(false);
  // Human-readable conversion of fdMinutes (e.g. 120 → "2h")
  const fdConverted=(()=>{const v=fdMinutes||0;const h=Math.floor(v/60);const m=v%60;if(h===0)return`${m}min`;if(m===0)return`${h}h`;return`${h}h ${m}min`})();
  // Sync local state when the prop changes (Firestore push from another device)
  useEffect(()=>{
    const r=(reminders||[]).find(x=>x.tipo==="feedingInterval");
    if(r){setFdEnabled(r.ativo===true);setFdMinutes(r.intervalMin||120)}
  },[reminders]);
  // Save handler — upserts the single feedingInterval reminder
  const saveFeedReminder=async(overrides={})=>{
    const enabled=overrides.ativo!==undefined?overrides.ativo:fdEnabled;
    const minutes=overrides.intervalMin!==undefined?overrides.intervalMin:fdMinutes;
    const existing=(reminders||[]).find(r=>r.tipo==="feedingInterval");
    setFdBusy(true);
    Haptic.medium();
    try{
      await onAddReminder({
        _id:existing?._id||"feedingInterval",
        tipo:"feedingInterval",
        ativo:enabled,
        intervalMin:minutes,
        createdAt:existing?.createdAt||new Date().toISOString()
      });
      Haptic.success();
    }catch(e){Haptic.warning()}
    setFdBusy(false);
  };
  const pushSupported=PushNotifs.isSupported();

  // ═══ UNIFIED DIRTY STATE ═══
  // Tracks all input fields (including feeding reminder) but NOT the toggles (keepScreenOn/haptic/push/lang/feedingEnabled which autosave)
  // Photo sig (v10.5.3): foto é base64 de 50-200KB. Compare direto string-vs-string é O(n)
  // e roda a cada re-render da ProfilePage (re-renders acontecem em cada keystroke nos inputs).
  // Assinatura curta = length + primeiros 24 + últimos 24 chars. useMemo garante que o
  // hash só recalcula quando a string muda de referência. O isDirty vira O(1) por render.
  const photoSig = useMemo(()=>photo?`${photo.length}:${photo.slice(0,24)}:${photo.slice(-24)}`:"",[photo]);
  const remotePhotoSig = useMemo(()=>{const p=profile.photo||"";return p?`${p.length}:${p.slice(0,24)}:${p.slice(-24)}`:""},[profile.photo]);
  const isDirty=(
    name!==(profile.name||"")||
    birth!==(profile.birthDate||"")||
    photoSig!==remotePhotoSig||
    mlGoal!==String(profile.mlGoal||"")||
    birthWeight!==String(profile.birthWeight||"")||
    birthLength!==String(profile.birthLength||"")||
    birthHead!==String(profile.birthHead||"")||
    fdMinutes!==(feedReminder?.intervalMin||120)
  );
  useEffect(()=>{if(onDirtyChange)onDirtyChange(isDirty)},[isDirty]);
  // Populate revertAllRef with function that resets all tracked fields
  revertAllRef.current=()=>{
    setName(profile.name||"");
    setBirth(profile.birthDate||"");
    setPhoto(profile.photo||"");
    setMlGoal(String(profile.mlGoal||""));
    setBirthWeight(String(profile.birthWeight||""));
    setBirthLength(String(profile.birthLength||""));
    setBirthHead(String(profile.birthHead||""));
    setFdMinutes(feedReminder?.intervalMin||120);
    Haptic.medium();
  };
  // Persists a single toggle change immediately to Firestore (no need to tap Save).
  // DELTA-ONLY (v10.5.0): só manda os campos que de fato mudaram. Combinado com saveProfile
  // usando merge, zero risco de sobrescrever name/photo com state stale desta aba.
  const persistToggle=async(overrides)=>{
    try{await onSave(overrides)}catch(e){/* fail silent */}
  };
  const handlePushToggle=async()=>{
    if(pushBusy)return;
    if(!pushSupported)return;
    if(pushEnabled){
      // Disable: flip the flag and persist immediately
      setPushEnabled(false);
      Haptic.light();
      await persistToggle({pushEnabled:false});
      return;
    }
    // Enable: must request permission via user gesture
    setPushBusy(true);
    Haptic.medium();
    try{
      const granted=await PushNotifs.requestPermission();
      setPushPermission(typeof Notification!=="undefined"?Notification.permission:"unsupported");
      if(granted){
        setPushEnabled(true);
        await persistToggle({pushEnabled:true});
        // Try to fetch token (may return null if FCM SDK not loaded — that's OK)
        const token=await PushNotifs.getToken();
        if(token)await PushNotifs.saveToken(token);
        Haptic.success();
      }else{
        Haptic.warning();
      }
    }catch(e){/* fail silent */}
    setPushBusy(false);
  };
  const fr=useRef(null);
  const handlePhoto=e=>{const f=e.target.files?.[0];if(!f)return;const rd=new FileReader();rd.onload=ev=>{const img=new Image();img.onload=()=>{const c=document.createElement("canvas"),mx=200;let w=img.width,h=img.height;if(w>h){h=(h/w)*mx;w=mx}else{w=(w/h)*mx;h=mx}c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);setPhoto(c.toDataURL("image/jpeg",0.8))};img.src=ev.target.result};rd.readAsDataURL(f)};
  const doSave=async()=>{
    // Save profile fields
    await onSave({name:name.trim(),birthDate:birth,photo,mlGoal:parseInt(mlGoal)||0,birthWeight:parseFloat(birthWeight)||0,birthLength:parseFloat(birthLength)||0,birthHead:parseFloat(birthHead)||0,lang:langSel,keepScreenOn,hapticEnabled,pushEnabled});
    // Also persist feeding reminder interval if it changed
    if(fdMinutes!==(feedReminder?.intervalMin||120)){
      const clamped=Math.max(30,Math.min(720,fdMinutes||120));
      await saveFeedReminder({intervalMin:clamped});
      if(clamped!==fdMinutes)setFdMinutes(clamped);
    }
    Haptic.success();
  };
  saveRef.current=doSave;
  const inp={width:"100%",maxWidth:"100%",boxSizing:"border-box",WebkitAppearance:"none",appearance:"none",padding:"17px 18px",background:"rgba(20,26,60,0.55)",border:`1px solid ${T.gBSoft}`,borderRadius:16,color:T.text,fontSize:17,fontWeight:600,letterSpacing:-0.2,outline:"none",boxShadow:T.insetTop};
  return(<div style={{position:"fixed",inset:0,zIndex:200,maxWidth:480,margin:"0 auto",background:`radial-gradient(ellipse at 50% 0%,#10153d,${T.bg1} 65%)`,overflowY:"auto",overflowX:"hidden",overscrollBehavior:"contain",WebkitOverflowScrolling:"touch",paddingTop:"env(safe-area-inset-top)",paddingBottom:"calc(100px + env(safe-area-inset-bottom))"}}>
    {/* Fade overlays removed — both top and bottom gradient strips were visually distracting,
        making content look dimmed/buggy rather than giving a clean melt effect. Simple solid scroll. */}
    <div style={{display:"flex",alignItems:"center",gap:14,padding:"16px 20px"}}><button onClick={onBack} style={{width:36,height:36,borderRadius:10,background:T.glass,border:`1px solid ${T.gB}`,display:"flex",alignItems:"center",justifyContent:"center"}}><Icon name="back" size={18} color={T.sub}/></button><span style={{fontSize:17,fontWeight:700}}>{L("profile")}</span></div>
    <div style={{padding:"0 20px"}}>

      <div style={{background:"rgba(22,28,60,0.4)",borderRadius:16,border:`1px solid ${T.gB}`,padding:16,marginBottom:12}}>

            <div style={{fontSize:12,color:"#7a80a8",lineHeight:1.5}}>{langSel==="en"?"During night wake & nursing timers":"Durante night wake e amamentação"}</div>

            <div style={{position:"absolute",top:3,left:keepScreenOn?25:3,width:24,height:24,borderRadius:"50%",background:"#fff",transition:"left .2s",boxShadow:"0 2px 6px rgba(0,0,0,0.4)"}}/>

               pushPermission==="denied"?(langSel==="en"?"Permission denied — enable in iOS Settings":"Permissão negada — ative nos Ajustes do iOS"):

        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:6}}>
          <div style={{width:32,height:32,borderRadius:10,background:`linear-gradient(135deg,${T.accent}38,${T.accent}10)`,border:`1px solid ${T.accent}50`,display:"flex",alignItems:"center",justifyContent:"center",boxShadow:"0 1px 0 0 rgba(255,255,255,0.08) inset"}}>

function ChangelogModal({onClose,lang}){
  // Render a bullet: detect highlight prefix "★ " and bold markers **text**
  const renderBullet=(text,idx)=>{
    const highlighted=text.startsWith("\u2605 ");
    const clean=highlighted?text.slice(2):text;
    // Parse **bold** segments
    const parts=[];
    let remaining=clean;
    let key=0;
    while(remaining.length>0){
      const boldStart=remaining.indexOf("**");
      if(boldStart===-1){parts.push(<span key={key++}>{remaining}</span>);break}
      if(boldStart>0)parts.push(<span key={key++}>{remaining.slice(0,boldStart)}</span>);
      const boldEnd=remaining.indexOf("**",boldStart+2);
      if(boldEnd===-1){parts.push(<span key={key++}>{remaining.slice(boldStart)}</span>);break}
      parts.push(<strong key={key++} style={{color:"#c4b5fd",fontWeight:700}}>{remaining.slice(boldStart+2,boldEnd)}</strong>);
      remaining=remaining.slice(boldEnd+2);
    }

  const days=period==="all"
    ?[...new Set(entries.map(e=>e.date))].sort()
    :(()=>{
      const arr=[];
      // Past complete days: from N days ago up to yesterday (inclusive)
      for(let i=period;i>=1;i--){
        const d=new Date();d.setDate(d.getDate()-i);
        arr.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`);
      }
      // Today as bonus visual (still in progress, not part of the average)
      arr.push(today);
      return arr;
    })();
  const numDays=days.length||1;
  const data=days.map(dt=>{
    const de=entries.filter(e=>e.date===dt);

// ── GROWTH PAGE with WHO percentiles ──
// Helper: parse decimal string accepting both comma and dot (pt-BR friendly)
const parseGrowthDecimal=(s)=>{
  if(s===undefined||s===null)return undefined;
  const str=String(s).trim();
  if(!str)return undefined;
  const n=parseFloat(str.replace(",","."));
  return isNaN(n)?undefined:n;
};
// Helper: format number back to display with comma in pt
const formatGrowthVal=(v)=>{
  if(v===undefined||v===null||v==="")return "";
  const s=String(v);
  return _lang==="pt"?s.replace(".",","):s;
};

function GrowthPage({entries,birthDate,profile,onBack,onAddEntry,onDeleteEntry}){
  const growthEntries=entries.filter(e=>e.type==="growth").sort((a,b)=>`${a.date}T${a.time}`.localeCompare(`${b.date}T${b.time}`));
  const age=calcAge(birthDate);
  const ageMonths=age?(age.months+(age.days/30)):0;
  const[showForm,setShowForm]=useState(false);
  const[editingId,setEditingId]=useState(null);
  const[fDate,setFDate]=useState(todayStr());
  const[wK,setWK]=useState("");const[lC,setLC]=useState("");const[hC,setHC]=useState("");

  // Find existing growth entry on a date (excluding current edit target)
  const findByDate=(date,excludeId)=>growthEntries.find(e=>e.date===date&&e.id!==excludeId);
  const mergeTarget=!editingId?findByDate(fDate,null):null;
  const isEdit=!!editingId;

  // Build all data points: birth + entries
  const allPoints=[];
  if(profile.birthWeight||profile.birthLength||profile.birthHead){
    allPoints.push({ageM:0,date:birthDate,weightKg:profile.birthWeight,lengthCm:profile.birthLength,headCm:profile.birthHead,label:_lang==="en"?"Birth":"Nasc.",isBirth:true});
  }
  growthEntries.forEach(e=>{
    const eAge=calcAge(birthDate);
    if(!eAge)return;
    const d1=new Date(birthDate),d2=new Date(e.date);
    const mths=(d2.getFullYear()-d1.getFullYear())*12+d2.getMonth()-d1.getMonth()+(d2.getDate()-d1.getDate())/30;
    allPoints.push({ageM:Math.max(0,mths),date:e.date,weightKg:e.weightKg,lengthCm:e.lengthCm,headCm:e.headCm,label:new Date(e.date+"T12:00").toLocaleDateString(_lang==="pt"?"pt-BR":"en-US",{day:"numeric",month:"short"}),entryId:e.id});
  });
  const latest=allPoints[allPoints.length-1];

  const resetForm=()=>{
    setShowForm(false);setEditingId(null);
    setFDate(todayStr());
    setWK("");setLC("");setHC("");
  };

  const openNew=()=>{
    setEditingId(null);
    setFDate(todayStr());
    setWK("");setLC("");setHC("");
    setShowForm(true);
  };

  const openEdit=(entryId)=>{
    const e=growthEntries.find(g=>g.id===entryId);
    if(!e)return;
    setEditingId(entryId);
    setFDate(e.date);
    setWK(e.weightKg!==undefined?formatGrowthVal(e.weightKg):"");
    setLC(e.lengthCm!==undefined?formatGrowthVal(e.lengthCm):"");
    setHC(e.headCm!==undefined?formatGrowthVal(e.headCm):"");
    setShowForm(true);
  };

  // In edit mode, also consider existing values so empty fields don't fail validation
  const hasAnyValue=()=>{
    const w=parseGrowthDecimal(wK),l=parseGrowthDecimal(lC),h=parseGrowthDecimal(hC);
    if(w!==undefined||l!==undefined||h!==undefined)return true;
    if(isEdit){
      const orig=growthEntries.find(g=>g.id===editingId);
      if(orig&&(orig.weightKg!==undefined||orig.lengthCm!==undefined||orig.headCm!==undefined))return true;
    }
    return false;
  };

  const doSave=()=>{
    const w=parseGrowthDecimal(wK),l=parseGrowthDecimal(lC),h=parseGrowthDecimal(hC);
    if(!hasAnyValue())return;
    let targetEntry;
    if(isEdit){
      const orig=growthEntries.find(g=>g.id===editingId);
      if(!orig)return;
      targetEntry={...orig,date:fDate};
    }else if(mergeTarget){
      targetEntry={...mergeTarget,date:fDate};
    }else{
      targetEntry={type:"growth",date:fDate,time:nowTime(),id:uid()};
    }
    // Apply provided fields (empty fields preserve existing values in merge/edit)
    if(w!==undefined)targetEntry.weightKg=w;
    if(l!==undefined)targetEntry.lengthCm=l;
    if(h!==undefined)targetEntry.headCm=h;
    onAddEntry(targetEntry);
    resetForm();
  };

  const doDelete=()=>{
    if(!editingId)return;
    const msg=_lang==="en"?"Delete this measurement?":"Excluir esta medição?";
    if(!confirm(msg))return;
    if(onDeleteEntry)onDeleteEntry(editingId);
    resetForm();
  };

  // Mini chart for a metric
  function GrowthChart({label,field,table,color}){
    const pts=allPoints.filter(p=>p[field]);
    if(pts.length<1)return null;
    // WHO P3, P50, P97 curves
    const maxAge=Math.max(ageMonths+1,3);
    const whoSteps=[];for(let m=0;m<=maxAge;m+=maxAge/20){
      const lms=interpolateLMS(table,m);
      const z3=lms.M*Math.pow(1+lms.L*lms.S*(-1.88),1/lms.L);
      const z97=lms.M*Math.pow(1+lms.L*lms.S*1.88,1/lms.L);
      whoSteps.push({m,p3:Math.abs(lms.L)>0.001?z3:lms.M*Math.exp(-1.88*lms.S),p50:lms.M,p97:Math.abs(lms.L)>0.001?z97:lms.M*Math.exp(1.88*lms.S)});
    }
    const allVals=[...whoSteps.map(w=>w.p97),...whoSteps.map(w=>w.p3),...pts.map(p=>p[field])];
    const minV=Math.min(...allVals)*0.9,maxV=Math.max(...allVals)*1.05;
    const W=320,H=140;
    const x=m=>10+(m/maxAge)*(W-20);
    const y=v=>H-10-((v-minV)/(maxV-minV))*(H-20);
    const pathStr=(arr,key)=>arr.map((p,i)=>`${i===0?"M":"L"}${x(p.m).toFixed(1)},${y(p[key]).toFixed(1)}`).join(" ");
    return(<div style={{marginBottom:16}}>
      <div style={{fontSize:12,fontWeight:700,color,marginBottom:6}}>{label}</div>
      <svg width={W} height={H} viewBox={`0 0 ${W} ${H}`} style={{width:"100%",height:"auto",background:T.glass,borderRadius:12,border:`1px solid ${T.gB}`}}>
        <path d={pathStr(whoSteps,"p3")+" L"+x(maxAge)+","+y(whoSteps[whoSteps.length-1].p97)+" "+pathStr([...whoSteps].reverse(),"p97")} fill={`${color}08`} stroke="none"/>
        <path d={pathStr(whoSteps,"p50")} fill="none" stroke={`${color}44`} strokeWidth="1" strokeDasharray="4,3"/>
        <path d={pathStr(whoSteps,"p3")} fill="none" stroke={`${color}22`} strokeWidth="0.5"/>
        <path d={pathStr(whoSteps,"p97")} fill="none" stroke={`${color}22`} strokeWidth="0.5"/>
        {pts.map((p,i)=><circle key={i} cx={x(p.ageM)} cy={y(p[field])} r={4} fill={color} stroke={T.bg1} strokeWidth={2}/>)}
        {pts.length>1&&<path d={pts.map((p,i)=>`${i===0?"M":"L"}${x(p.ageM).toFixed(1)},${y(p[field]).toFixed(1)}`).join(" ")} fill="none" stroke={color} strokeWidth="2"/>}
        <text x={W-4} y={y(whoSteps[whoSteps.length-1].p50)+4} textAnchor="end" fill={`${color}66`} fontSize="8">P50</text>
        <text x={W-4} y={y(whoSteps[whoSteps.length-1].p97)+4} textAnchor="end" fill={`${color}44`} fontSize="7">P97</text>
        <text x={W-4} y={y(whoSteps[whoSteps.length-1].p3)+4} textAnchor="end" fill={`${color}44`} fontSize="7">P3</text>
      </svg>
    </div>);
  }

  // PercentileCard: read-only display now (no quick-add — use the unified form instead)
  function PercentileCard({label,value,unit,table,icon}){

  const inp={width:"100%",maxWidth:"100%",boxSizing:"border-box",WebkitAppearance:"none",appearance:"none",padding:"15px 12px",background:"rgba(20,26,60,0.55)",border:`1px solid ${T.gBSoft}`,borderRadius:14,color:T.text,fontSize:17,fontWeight:600,letterSpacing:-0.2,outline:"none",textAlign:"center",boxShadow:T.insetTop};

  return(<div style={{padding:"calc(16px + env(safe-area-inset-top)) 20px 0"}}>

      <button onClick={()=>showForm?resetForm():openNew()} style={{padding:"6px 12px",borderRadius:10,background:"rgba(163,230,53,0.1)",border:"1px solid rgba(163,230,53,0.2)",fontSize:12,fontWeight:700,color:"#a3e635"}}>{showForm?L("cancel"):(_lang==="en"?"+ Measure":"+ Medição")}</button>

      <button onClick={doSave} disabled={!hasAnyValue()} style={{width:"100%",padding:12,borderRadius:10,background:hasAnyValue()?"#a3e635":"rgba(139,124,246,0.1)",color:hasAnyValue()?T.bg1:T.dim,fontSize:14,fontWeight:700,opacity:hasAnyValue()?1:0.6}}>{isEdit?(_lang==="en"?"Update measurement":"Atualizar medição"):(mergeTarget?(_lang==="en"?"Update measurement":"Atualizar medição"):(_lang==="en"?"Save measurement":"Salvar medição"))}</button>

    {latest&&<div style={{fontSize:11,color:T.sub,marginBottom:10}}>

    </div>}
    <PercentileCard label={L("weight")} value={latest?.weightKg} unit="kg" table={WHO_GIRLS.weight} icon="target"/>
    <PercentileCard label={L("length")} value={latest?.lengthCm} unit="cm" table={WHO_GIRLS.length} icon="ruler"/>
    <PercentileCard label={L("head")} value={latest?.headCm} unit="cm" table={WHO_GIRLS.head} icon="target"/>

    {/* Growth charts */}
    {allPoints.length>0&&<>
      <div style={{fontSize:12,fontWeight:600,color:T.dim,marginTop:16,marginBottom:10,textTransform:"uppercase",letterSpacing:0.8}}>{_lang==="en"?"Growth curves":"Curvas de crescimento"}</div>
      <GrowthChart label={`${L("weight")} (kg)`} field="weightKg" table={WHO_GIRLS.weight} color={T.green}/>
      <GrowthChart label={`${L("length")} (cm)`} field="lengthCm" table={WHO_GIRLS.length} color={T.blue}/>
      <GrowthChart label={`${L("head")} (cm)`} field="headCm" table={WHO_GIRLS.head} color={T.amber}/>
    </>}

    {/* History table (clickable rows, except Birth) */}
    {allPoints.length>0&&<><div style={{fontSize:12,fontWeight:600,color:T.dim,marginTop:8,marginBottom:10,textTransform:"uppercase",letterSpacing:0.8}}>{_lang==="en"?"History":"Histórico"}</div>
      {[...allPoints].reverse().map((p,i)=>{
        const clickable=!p.isBirth&&p.entryId;
        const rowStyle={display:"flex",alignItems:"center",gap:12,padding:"10px 12px",marginBottom:4,background:T.glass,borderRadius:10,border:`1px solid ${T.gB}`,width:"100%",textAlign:"left",cursor:clickable?"pointer":"default",opacity:p.isBirth?0.75:1};
        const content=<>
          <span style={{fontSize:11,color:T.sub,minWidth:50,fontWeight:600}}>{p.label}</span>
          <div style={{flex:1,display:"flex",gap:10,fontSize:12,flexWrap:"wrap"}}>
            {p.weightKg!==undefined&&<span style={{color:T.green,fontWeight:600}}>{formatGrowthVal(p.weightKg)}kg</span>}
            {p.lengthCm!==undefined&&<span style={{color:T.blue,fontWeight:600}}>{formatGrowthVal(p.lengthCm)}cm</span>}
            {p.headCm!==undefined&&<span style={{color:T.amber,fontWeight:600}}>{_lang==="en"?"Head":"Cab."} {formatGrowthVal(p.headCm)}</span>}
          </div>
          {p.isBirth?<span style={{fontSize:9,color:"#a78bfa",background:"rgba(139,124,246,0.15)",padding:"2px 6px",borderRadius:4,fontWeight:700,letterSpacing:0.5}}>{_lang==="en"?"BIRTH":"NASC."}</span>:<div style={{width:26,height:26,borderRadius:7,background:"rgba(139,124,246,0.1)",border:"1px solid rgba(139,124,246,0.15)",display:"flex",alignItems:"center",justifyContent:"center"}}><Icon name="pencil" size={11} color="#a78bfa"/></div>}
        </>;
        return clickable?<button key={i} onClick={()=>openEdit(p.entryId)} style={rowStyle}>{content}</button>:<div key={i} style={rowStyle}>{content}</div>;
      })}
    </>}
    <div style={{marginTop:16,padding:12,background:T.glass,borderRadius:12,border:`1px solid ${T.gB}`,fontSize:10,color:T.dim,lineHeight:1.6}}>
      {_lang==="en"?"WHO curves for girls 0-24mo. Dashed line = P50 (median). Band = P3-P97.":"Curvas OMS para meninas 0-24m. Linha tracejada = P50 (mediana). Faixa = P3-P97."}
    </div>
  </div>);
}

// ── BACKUP SECTION (v11.2) ──
// Aparece no Profile entre "View growth" e "Louise Pro version". Duas operações:
// 1) Exportar: gera JSON + dispara download (browser salva em Files/iCloud/Downloads).
// 2) Importar: file picker → confirmação explícita → restaura.
// Também faz auto-export silencioso pra IndexedDB a cada 24h pra ter snapshot local recente
// independente do Firestore. Mostra "Último backup há Xh" em todas chamadas (manual ou auto).
const BACKUP_KEY = "lp_last_backup_at";
function fmtBackupAgo(ts, lang){
  if(!ts) return lang==="en"?"never":"nunca";
  const diffMin = Math.floor((Date.now()-ts)/60000);
  if(diffMin<1) return lang==="en"?"just now":"agora";
  if(diffMin<60) return `${diffMin}min`;
  const h = Math.floor(diffMin/60);
  if(h<24) return `${h}h`;
  const d = Math.floor(h/24);
  return lang==="en"?`${d}d ago`:`${d}d atrás`;
}
function downloadJSON(obj, filename){
  const blob = new Blob([JSON.stringify(obj, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{document.body.removeChild(a); URL.revokeObjectURL(url)},100);
}
function BackupSection(){
  const[lastAt,setLastAt]=useState(()=>{try{const v=localStorage.getItem(BACKUP_KEY);return v?parseInt(v,10):0}catch(_){return 0}});
  const[busy,setBusy]=useState(false);
  const[msg,setMsg]=useState("");
  const fileRef=useRef(null);
  // Auto-backup 24h (silent): ao montar o Profile, se >24h do último, gera JSON e baixa.
  useEffect(()=>{
    const H24=24*3600*1000;
    if(lastAt&&Date.now()-lastAt<H24)return;
    // Evita auto-trigger em loop se falhar — marca tentativa com timestamp atual.
    (async()=>{
      try{
        const data=await FB.exportAll();
        downloadJSON(data,`louise-backup-${todayStr()}.json`);
        const now=Date.now();
        setLastAt(now);
        try{localStorage.setItem(BACKUP_KEY,String(now))}catch(_){}
      }catch(e){console.warn("[LP] auto-backup failed:",e.message)}
    })();
  },[]);
  const onExport=async()=>{
    if(busy)return;
    setBusy(true);setMsg("");
    try{
      const data=await FB.exportAll();
      downloadJSON(data,`louise-backup-${todayStr()}.json`);
      const now=Date.now();setLastAt(now);
      try{localStorage.setItem(BACKUP_KEY,String(now))}catch(_){}
      setMsg(L("exportedJust"));
      Haptic.success();
      setTimeout(()=>setMsg(""),3000);
    }catch(e){setMsg("Erro: "+e.message);Haptic.warning();setTimeout(()=>setMsg(""),4000)}
    setBusy(false);
  };
  const onImportClick=()=>{fileRef.current?.click()};
  const onImportFile=async(e)=>{
    const f=e.target.files?.[0];if(!f)return;
    if(!confirm(L("importConfirm"))){e.target.value="";return}
    setBusy(true);setMsg("");
    try{
      const txt=await f.text();
      const data=JSON.parse(txt);
      await FB.importAll(data);
      setMsg(L("importedOk"));
      Haptic.success();
      setTimeout(()=>{setMsg("");window.location.reload()},1500);
    }catch(err){setMsg(L("importErr")+": "+err.message);Haptic.warning();setTimeout(()=>setMsg(""),5000)}
    setBusy(false);
    e.target.value="";
  };
  return(<div style={{marginTop:16,padding:"16px 18px",borderRadius:14,background:"rgba(22,28,60,0.4)",border:`1px solid ${T.gB}`,boxShadow:T.insetTop}}>
    <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
      <div style={{width:32,height:32,borderRadius:9,background:"rgba(52,211,153,0.12)",border:"1px solid rgba(52,211,153,0.28)",display:"flex",alignItems:"center",justifyContent:"center"}}>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6ee7b7" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      </div>
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontSize:13,fontWeight:700,color:T.text}}>{L("backup")}</div>
        <div style={{fontSize:10,color:T.sub,fontWeight:600,marginTop:1,fontVariantNumeric:"tabular-nums"}}>{L("lastBackup")}: {fmtBackupAgo(lastAt,_lang)}</div>
      </div>
    </div>
    <div style={{fontSize:11,color:T.sub,lineHeight:1.5,marginBottom:12}}>{L("backupDesc")}</div>
    <div style={{display:"flex",gap:8}}>
      <button onClick={onExport} disabled={busy} style={{flex:1,padding:"11px 12px",borderRadius:11,background:busy?"rgba(52,211,153,0.1)":"linear-gradient(180deg,rgba(52,211,153,0.22),rgba(16,185,129,0.12))",border:"1px solid rgba(52,211,153,0.35)",color:"#6ee7b7",fontSize:12,fontWeight:700,letterSpacing:-0.1,display:"flex",alignItems:"center",justifyContent:"center",gap:6,opacity:busy?0.6:1}}>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        {L("exportData")}
      </button>
      <button onClick={onImportClick} disabled={busy} style={{flex:1,padding:"11px 12px",borderRadius:11,background:"rgba(22,28,60,0.6)",border:`1px solid ${T.gBSoft}`,color:T.sub,fontSize:12,fontWeight:700,letterSpacing:-0.1,display:"flex",alignItems:"center",justifyContent:"center",gap:6,opacity:busy?0.6:1}}>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        {L("importData")}
      </button>

// ── ERROR BOUNDARY (v11.0) ──
// Última linha de defesa: se qualquer componente der throw durante render,
// em vez de tela branca aparece esse fallback, e o app faz reload em 3s pra
// tentar recuperar. Logs vão pra console pra debug depois.
class ErrorBoundary extends React.Component {
  constructor(props){super(props);this.state={hasError:false,err:null}}
  static getDerivedStateFromError(err){return{hasError:true,err:err}}
  componentDidCatch(err,info){console.error("[LP] ErrorBoundary caught:",err,info)}
  componentDidUpdate(_,prev){
    if(this.state.hasError&&!prev.hasError){
      setTimeout(function(){window.location.reload()},3000);
    }
  }
  render(){
    if(this.state.hasError){
      return(<div style={{position:"fixed",inset:0,background:"linear-gradient(180deg,#070b1e 0%,#0b1130 100%)",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"36px 28px",textAlign:"center",color:"#f0f2ff",fontFamily:"'Outfit',sans-serif"}}>
        <div style={{width:72,height:72,borderRadius:24,background:"rgba(248,113,113,0.1)",border:"1.5px solid rgba(248,113,113,0.25)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:30,color:"#f87171",marginBottom:20,boxShadow:"0 0 32px -8px rgba(248,113,113,0.3)"}}>\u26A0</div>
        <div style={{fontSize:22,fontWeight:800,letterSpacing:-0.5,marginBottom:6}}>Oops!</div>
        <div style={{fontSize:13,color:"#a3aac8",lineHeight:1.55,marginBottom:20,maxWidth:240}}>Algo quebrou. Recarregando em 3s\u2026</div>
        <div style={{width:28,height:28,border:"2.5px solid rgba(139,124,246,0.2)",borderTopColor:"#a78bfa",borderRadius:"50%",animation:"spin 0.9s linear infinite"}}/>
        <style>{"@keyframes spin{to{transform:rotate(360deg)}}"}</style>
      </div>);
    }
    return this.props.children;
  }
}

  // Live bedtime virtual entry: built when an active sleep timer is running.

  // ── INBOX HANDLERS (v11.1 — per-device read state via localStorage) ──

          <div style={{flex:1}}><h1 style={{fontSize:17,fontWeight:800,margin:0,letterSpacing:-0.3}}>{babyName}</h1><div style={{display:"flex",alignItems:"center",gap:6,marginTop:3}}><span style={{fontSize:10,color:T.accent,fontWeight:600}}>{age&&<>{age.months>0?`${age.months} ${_lang==="en"?(age.months===1?"month":"months"):(age.months===1?"mês":"meses")}${_lang==="en"?" and ":" e "}`:""}{age.days} {_lang==="en"?"days":"dias"}</>}</span><span style={{width:3,height:3,borderRadius:"50%",background:T.dim}}/><span style={{fontSize:10,color:T.dim}}>{new Date().toLocaleDateString(_lang==="pt"?"pt-BR":"en-US",{day:"numeric",month:"short"})}</span></div></div>

        </div>
        <CuriosityCard age={age} lang={lang} tick={tick}/>

                <div style={{fontSize:11,fontWeight:600,color:s.status==="done"?T.text:s.status==="next"?T.text:T.dim}}>{label}</div>
                {isNap&&!isBed&&<div style={{fontSize:9,color:T.dim}}>WW {fmtDur(s.ww)}{s.durRange?" · "+s.durRange:s.duration>0?" · "+fmtDur(s.duration||s.durMin):""}</div>}
              </div>
              <span style={{fontSize:9,fontWeight:600,padding:"2px 7px",borderRadius:5,background:s.status==="done"?T.greenS:s.status==="next"?`${color}20`:`${T.dim}12`,color:statusColor}}>{s.status==="done"?(_lang==="en"?"Done":"Feito"):s.status==="next"?(_lang==="en"?"Next":"Prox."):(_lang==="en"?"Later":"Depois")}</span>
            </div>
          })}
        </>}
      </>}
    </Modal>

    {/* AddPicker (v10.5.5): seletor de tipo é um Modal central (scale+fade 250ms), não mais Sheet
        que deslizava de baixo cobrindo 78% da tela. O slide-up causava jank/bug percebido no iPhone.
        O AddForm em si (Bottle/Amount/Save) continua Sheet porque tem inputs e scroll. */}
    <Modal open={showAdd&&!formType} onClose={()=>setShowAdd(false)}>
      <div style={{fontSize:11,fontWeight:700,color:"#7a80a8",letterSpacing:0.5,textTransform:"uppercase",marginBottom:16,textAlign:"center"}}>{_lang==="en"?"Add event":"Adicionar evento"}</div>
      <div style={{display:"grid",gridTemplateColumns:"minmax(0,1fr) minmax(0,1fr) minmax(0,1fr)",gap:"10px 0"}}>{["wakeup","bottle","nursing","sleep","nap","diaper","bath","medicine","temperature","tummytime"].map((type,i)=>{const cfg=TYPES[type];const last=entries.find(e=>e.type===type);const agoRaw=last?timeSince(last.date,last.time):null;const ago=agoRaw==="now"?"Just now":agoRaw;return(<button key={type} onClick={()=>setFormType(type)} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:8,padding:"8px 4px 4px",animation:`slideUp .3s ease ${i*0.025}s both`}}>
        <div style={{width:58,height:58,borderRadius:"50%",background:`radial-gradient(circle at 35% 30%, rgba(50,60,120,0.95), rgba(18,22,55,0.98))`,border:`1.5px solid ${cfg.color}25`,display:"flex",alignItems:"center",justifyContent:"center",boxShadow:`0 4px 16px rgba(0,0,0,0.35), 0 0 20px ${cfg.color}18, inset 0 1px 0 rgba(200,210,255,0.08), inset 0 -2px 4px rgba(0,0,0,0.2)`,position:"relative",overflow:"hidden",filter:`drop-shadow(0 0 4px ${cfg.color}44)`}}>
          <div style={{position:"absolute",top:"15%",left:"25%",width:"40%",height:"30%",background:`radial-gradient(ellipse,${cfg.color}12,transparent)`,borderRadius:"50%",filter:"blur(5px)"}}/>
          <Icon name={cfg.icon} size={22} color={cfg.color}/>
        </div>
        <div style={{textAlign:"center",minWidth:0,maxWidth:"100%"}}><div style={{fontSize:11,fontWeight:600,color:T.text,lineHeight:1.2,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{cfg.label[_lang]||cfg.label.en}</div>{ago&&<div style={{fontSize:10,color:T.sub,fontWeight:500,marginTop:2,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{ago}</div>}</div>
      </button>)})}</div>
    </Modal>

    {/* AddForm agora \u00e9 Modal central (v10.7.2) em vez de Sheet slide-up. Unifica com o +
        popup e resolve o jank de anim\u00e7\u00e3o no iPhone. prop `wide` deixa um pouco mais largo
        pros campos de data/hora caberem confort\u00e1veis. */}
    <Modal open={!!formType} onClose={()=>{setFormType(null);setEditEntry(null)}} wide>
      {formType&&<AddForm type={formType} onSave={addEntry} savedMeds={savedMeds} onSaveMeds={async m=>await FB.saveMeds(m)} editEntry={editEntry} lastBottleMl={lastBottleMl} topMl={topMl} onStartTimer={type=>{startTimer(type);setFormType(null);setShowAdd(false)}}/>}
    </Modal>

    {showProfile&&<ProfilePage profile={profile} onSave={async p=>await FB.saveProfile(p)} onBack={()=>{setShowProfile(false);setProfileIsDirty(false)}} onGrowth={()=>{setShowProfile(false);setProfileIsDirty(false);goTo("growth")}} onShowChangelog={()=>setShowChangelog(true)} hasUnreadChangelog={hasUnreadChangelog} reminders={reminders} onAddReminder={async r=>await FB.addReminder(r)} onDelReminder={async id=>await FB.delReminder(id)} onDirtyChange={setProfileIsDirty} cancelSignal={profileCancelSignal} saveSignal={profileSaveSignal}/>}
    {showInbox&&<InboxPanel inbox={inbox} onClose={()=>setShowInbox(false)} onMarkRead={markInboxRead} onMarkAllRead={markAllInboxRead} lang={lang} isRead={isRead}/>}
    {showChangelog&&<ChangelogModal onClose={closeChangelog} lang={lang}/>}
    {showUpdateToast&&!showChangelog&&<UpdateToast fromVersion={profile.lastSeenVersion} toVersion={APP_VERSION} onView={openChangelog} onDismiss={dismissUpdateToast} lang={lang}/>}
    <EditStartModal open={showEditStart} onClose={()=>setShowEditStart(false)} activeTimer={activeTimer} onSave={handleEditStart}/>
    <NursingSidePicker open={showNursingPicker} onClose={()=>setShowNursingPicker(false)} onSelect={side=>startTimer("nursing",side)}/>

    {/* TimerBar + Nav via React Portal — vivem fora do scroll container (App root com overflow:auto)
        e fora do #root (com overflow:hidden) para que position:fixed funcione corretamente
        em iOS Safari PWA standalone. Veja #nav-host no <body>. */}
    {ReactDOM.createPortal(<><TimerBar activeTimer={activeTimer} onStop={stopTimer} onSwitch={switchSide} onPause={pauseNursing} onEditStart={()=>setShowEditStart(true)} hidden={showAdd||!!formType||showProfile||showInbox||showChangelog||showEditStart||showNursingPicker||showSleepInfo}/>
    {showProfile?<nav style={{position:"fixed",bottom:"calc(8px + env(safe-area-inset-bottom))",left:"50%",transform:"translateX(-50%)",width:profileIsDirty?"calc(100% - 32px)":"auto",maxWidth:profileIsDirty?448:"none",opacity:1,display:"flex",alignItems:"center",gap:8,padding:profileIsDirty?"10px":"0",pointerEvents:"auto",background:profileIsDirty?"linear-gradient(180deg,rgba(28,22,60,0.97),rgba(22,18,52,0.98))":"transparent",backdropFilter:profileIsDirty?"blur(16px)":"none",WebkitBackdropFilter:profileIsDirty?"blur(16px)":"none",borderRadius:profileIsDirty?22:999,border:profileIsDirty?"1px solid rgba(139,124,246,0.35)":"none",boxShadow:profileIsDirty?"0 1px 0 0 rgba(255,255,255,0.1) inset, 0 0 0 1px rgba(139,124,246,0.15), 0 12px 36px -8px rgba(139,124,246,0.4)":"none",zIndex:250,animation:profileIsDirty?"slideUpCentered 0.3s cubic-bezier(0.22,1,0.36,1)":"none"}}>
      {profileIsDirty?<>
        <button onClick={()=>{Haptic.medium();setProfileCancelSignal(s=>s+1)}} style={{flex:"0 0 42%",padding:13,borderRadius:14,background:"rgba(14,18,48,0.7)",color:"#8b90b8",fontSize:14,fontWeight:700,border:"1px solid rgba(255,255,255,0.08)",cursor:"pointer",letterSpacing:-0.2,display:"flex",alignItems:"center",justifyContent:"center",gap:6}}>
          <Icon name="x" size={14} color="#8b90b8"/>{_lang==="en"?"Cancel":"Cancelar"}
        </button>
        <button onClick={()=>{setProfileSaveSignal(s=>s+1)}} style={{flex:1,padding:13,borderRadius:14,background:"linear-gradient(180deg,#9b8df8,#7c3aed)",color:"#fff",fontSize:14,fontWeight:700,border:"1px solid rgba(139,124,246,0.55)",boxShadow:"0 1px 0 0 rgba(255,255,255,0.2) inset, 0 6px 16px -4px rgba(139,124,246,0.5)",cursor:"pointer",letterSpacing:-0.2,display:"flex",alignItems:"center",justifyContent:"center",gap:6}}>
          <span style={{width:6,height:6,borderRadius:"50%",background:"#fbbf24",animation:"pulse 1.4s ease-in-out infinite"}}/>
          <Icon name="check" size={14} color="#fff"/>{_lang==="en"?"Save":"Salvar"}
        </button>
      </>:<div style={{position:"relative",width:60,height:60,display:"flex",alignItems:"center",justifyContent:"center"}}>
        {/* Mercury ring — continuous spinning conic gradient, GPU-accelerated */}
        <div style={{position:"absolute",inset:0,borderRadius:"50%",background:"conic-gradient(from 0deg, #8b7cf6 0%, #e0d4ff 15%, #ffffff 22%, #c4b5fd 35%, #8b7cf6 50%, #5b4aaf 65%, #ffffff 78%, #a78bfa 92%, #8b7cf6 100%)",animation:"mercurySpin 3s linear infinite",willChange:"transform",transformOrigin:"center center"}}/>
        {/* Ring glow layer — separate static element so the spinning layer isn't weighed down */}
        <div style={{position:"absolute",inset:-4,borderRadius:"50%",boxShadow:"0 0 20px rgba(139,124,246,0.55)",pointerEvents:"none"}}/>
        {/* Inner mask — the dark disc that reveals the ring as a border */}
        <div style={{position:"absolute",inset:2.5,borderRadius:"50%",background:"linear-gradient(180deg,rgba(14,18,48,0.98),rgba(8,10,28,0.99))"}}/>
        {/* Actual clickable button on top */}
        <button onClick={()=>{setShowProfile(false);setProfileIsDirty(false)}} style={{position:"relative",zIndex:2,width:55,height:55,borderRadius:"50%",background:"transparent",color:"#c4b5fd",border:"none",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",padding:0}}>
        <Icon name="home" size={20} color="#c4b5fd"/>
      </button>
      </div>}
    </nav>:<nav style={{position:"absolute",bottom:"calc(8px + env(safe-area-inset-bottom))",left:"50%",transform:"translateX(-50%)",width:"calc(100% - 24px)",maxWidth:420,pointerEvents:"auto",display:"flex",alignItems:"center",justifyContent:"space-around",gap:2,padding:"7px 8px",background:"linear-gradient(180deg,rgba(38,44,90,0.38),rgba(14,18,48,0.58))",backdropFilter:"blur(18px) saturate(180%)",WebkitBackdropFilter:"blur(18px) saturate(180%)",borderRadius:34,border:"1px solid rgba(255,255,255,0.14)",boxShadow:"0 1px 0 0 rgba(255,255,255,0.24) inset, 0 -1px 2px 0 rgba(0,0,0,0.18) inset, 0 10px 32px -8px rgba(0,0,0,0.55), 0 0 48px -18px rgba(139,124,246,0.3)"}}>
      {[{icon:"home",label:L("home"),active:page==="home"&&!showAdd,action:()=>goTo("home")},{icon:"clock",label:L("history"),active:page==="history",action:()=>goTo("history")}].map(n=><button key={n.icon} aria-label={n.label} className="navbtn" onClick={n.action} style={{display:"flex",alignItems:"center",justifyContent:"center",width:48,height:44,borderRadius:22,background:n.active?"rgba(139,124,246,0.22)":"transparent",border:"none",padding:0}}><Icon name={n.icon} size={n.active?22:20} color={n.active?"#ffffff":T.dim}/></button>)}
      <button aria-label={showAdd?L("close"):L("addEvent")} className="navfab" onClick={()=>{setShowAdd(!showAdd);setFormType(null);setPage("home")}} style={{width:48,height:44,borderRadius:22,background:`linear-gradient(180deg,#9b8df8,#7c3aed)`,display:"flex",alignItems:"center",justifyContent:"center",boxShadow:`0 1px 0 0 rgba(255,255,255,0.22) inset, 0 4px 14px -2px ${T.accent}70`,transform:showAdd?"rotate(45deg)":"rotate(0deg)",margin:"0 2px",border:"none",padding:0}}><Icon name="plus" size={22} color="#fff"/></button>
      {[{icon:"chart",label:L("stats"),active:page==="stats"||page==="growth",action:()=>goTo("stats")},{icon:"gear",label:L("settings"),active:false,action:()=>setShowProfile(true)}].map(n=><button key={n.icon} aria-label={n.label} className="navbtn" onClick={n.action} style={{display:"flex",alignItems:"center",justifyContent:"center",width:48,height:44,borderRadius:22,background:n.active?"rgba(139,124,246,0.22)":"transparent",border:"none",padding:0}}><Icon name={n.icon} size={n.active?22:20} color={n.active?"#ffffff":T.dim}/></button>)}
    </nav>}
    </>, document.getElementById("nav-host"))}
  </div>);
}

// Remove loading screen
var _ld=document.getElementById('load-debug');if(_ld)_ld.remove();
ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App/></ErrorBoundary>);
</script>

</body>
</html>
