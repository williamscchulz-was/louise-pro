  <!-- Resource hints (v10.0.4): preload critical scripts in parallel with HTML parse
       and warm up TCP+TLS to the Firestore host so the first live query is faster.

  <link rel="preload" as="script" href="https://unpkg.com/react@18/umd/react.production.min.js">

  <!-- ERROR & LOADING HANDLER -->

  <script>
  window.onerror=function(msg,src,line,col,err){
    var d=document.getElementById('error-display');
    if(!d){d=document.createElement('div');d.id='error-display';d.style.cssText='position:fixed;inset:0;z-index:9999;background:#0a0e28;color:#f87171;padding:40px 20px;font-family:monospace;font-size:13px;overflow:auto;white-space:pre-wrap';document.body.appendChild(d);d.innerHTML='<div style="font-size:20px;font-weight:bold;color:#fbbf24;margin-bottom:16px">⚠ Louise Pro — Error</div>';}
    d.innerHTML+='<div style="margin-bottom:12px;padding:12px;background:rgba(248,113,113,0.1);border-radius:8px;border-left:3px solid #f87171"><b>'+msg+'</b>\nLine: '+line+' Col: '+col+'\n'+(err&&err.stack?err.stack:'')+'</div>';
    return false;
  };
  window.addEventListener('unhandledrejection',function(e){
    window.onerror('Promise: '+(e.reason&&e.reason.message||e.reason),null,0,0,e.reason);
  });
  // Toggle body.app-hidden whenever the PWA visibility changes. Paired with
  // the CSS rule in <style>, this freezes all animations while the app is
  // backgrounded — useful on iOS PWA where background throttling is weak.
  document.addEventListener('visibilitychange',function(){
    if(document.body){document.body.classList.toggle('app-hidden',document.hidden);}
  });
  // v11.9.7: tom noturno automatico. Aplica body.is-night entre 22h e 06h.
  // Re-checa cada 5min. Transition CSS de 1.2s torna a mudanca quase imperceptivel.
  function _updateNightClass(){
    if(!document.body)return;
    var h=new Date().getHours();
    var night=h>=22||h<6;
    document.body.classList.toggle('is-night',night);
  }
  _updateNightClass();
  setInterval(_updateNightClass,5*60*1000);
  // v11.9.30+v11.9.31: trava orientacao em portrait. Manifest ja tem "portrait-primary"
  // (PWA standalone respeita). iOS PWA Safari 16.4+ suporta lock(); versoes antigas e
  // browser tab fallam silently — overlay CSS abaixo cobre. Re-tenta em orientationchange
  // pra pegar momentos onde iOS solta o lock.
  function _tryLockPortrait(){
    try{
      if(screen&&screen.orientation&&screen.orientation.lock){
        screen.orientation.lock('portrait').catch(function(){});
      }
    }catch(_){}
  }
  _tryLockPortrait();
  // Listener: re-tenta lock toda vez que a tela rotaciona. Em PWA standalone iOS 16.4+
  // isso forca a volta pro portrait quase imediato. Em browser tab, no-op silencioso.
  try{
    if(screen&&screen.orientation&&screen.orientation.addEventListener){
      screen.orientation.addEventListener('change',_tryLockPortrait);
    }else if(window.addEventListener){
      window.addEventListener('orientationchange',_tryLockPortrait);
    }
  }catch(_){}
  // Auto-reload when a newly installed Service Worker takes control.
  // Without this, after a deploy the old SW keeps serving the stale
  // HTML until the user manually refreshes. The `controllerchange`
  // event fires exactly once per SW takeover — we guard against reload
  // loops with a session flag.
  if('serviceWorker' in navigator){
    var _swReloading=false;
    navigator.serviceWorker.addEventListener('controllerchange',function(){
      if(_swReloading)return;
      _swReloading=true;
      // v10.8.0: banner visível curto antes do reload pra usuário entender que é update, não bug.
      try{

     O próprio host eh position:fixed inset:0 pointer-events:none pra cobrir toda a

// Impacto no cold start iPhone PWA: antes de receber do servidor (200-800ms), o app
// já renderiza com o último snapshot em cache. Sensação de "abriu instantâneo".
// synchronizeTabs: multi-aba ou PWA + Safari abertos não brigam pelo lock.
// Catch silencioso: em browsers sem suporte (raríssimo), segue sem persistência.

// Firebase functions (global, accessed by React code)
window.FB = {
  // v11.9.0: window de N dias (default 90). Antes lia TODA a colleção no cold start —
  // ~1650 reads hoje, escalando pra 22k/ano. 90d janela cobre engine (7d), stats curtos
  // (4-30d) e history visivível. Janela 90d é fixa; pra ver >90d, re-adicionar lazy load.
  subEntries(cb, daysBack=90) {
    let query = db.collection('entries').orderBy('date','desc');
    if (daysBack && daysBack > 0) {
      // Cutoff date local (YYYY-MM-DD). Calculado uma vez no setup; entries de "hoje"
      // continuam aparecendo pq today >= cutoff (se app fica aberto cross-midnight,
      // novos entries chegam normal; cutoff fica estático mas isso é ok pra 90d).
      const d = new Date();
      d.setDate(d.getDate() - daysBack);
      const cutoff = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
      query = query.where('date','>=',cutoff);
    }
    return query.onSnapshot(snap => {
      const data = snap.docs.map(d => ({...d.data(), _docId: d.id}));
      data.sort((a,b) => (`${b.date}T${b.time}`).localeCompare(`${a.date}T${a.time}`));
      cb(data);
    });
  },
  // v11.9.34: loadOlderEntries removido — dead code (auditoria DB v11.9.25). Era idea
  // legítima pra Stats/History antigos, nunca foi conectado na UI. Se um dia precisar,
  // re-adicionar é trivial. Por hora, app mais enxuto.
  async addEntry(e) {
    // Remove undefined values (Firestore rejects them)
    const clean = Object.fromEntries(Object.entries(e).filter(([_,v]) => v !== undefined));
    await db.collection('entries').doc(e.id).set(clean); 
  },
  async delEntry(id) { await db.collection('entries').doc(id).delete(); },
  subProfile(cb) { return db.collection('config').doc('profile').onSnapshot(s => cb(s.exists ? s.data() : null)); },
  // MERGE: campos não incluídos em `p` ficam preservados. Blinda contra callers que passam
  // payload parcial (ex: side-paths que só atualizam lastSeenVersion) ou state stale de
  // outra aba/dispositivo. SEM merge qualquer save parcial limpava name/photo/etc. v10.5.0.
  async saveProfile(p) { await db.collection('config').doc('profile').set(p, {merge:true}); },
  subMeds(cb) { return db.collection('config').doc('meds').onSnapshot(s => cb(s.exists ? s.data()?.list : null)); },
  async saveMeds(m) { await db.collection('config').doc('meds').set({list:m}); },
  subTimer(cb) { return db.collection('config').doc('active').onSnapshot(s => cb(s.exists ? s.data() : null)); },
  async saveTimer(t) { await db.collection('config').doc('active').set(t||{cleared:true}); },
  subInbox(cb) { return db.collection('config').doc('inbox').onSnapshot(s => cb(s.exists ? s.data() : null)); },
  // MERGE defensivo: mesmo padrão do saveProfile — preserva campos não incluídos em `data`.
  async saveInbox(data) { await db.collection('config').doc('inbox').set(data, {merge:true}); },
  // Push notification token storage — each token is a separate doc in subcollection
  // Path: config/pushTokens/tokens/{tokenId}
  // Worker reads from this path to fan out push notifications.
  async savePushToken(token, lang) {
    if (!token) return;
    // Use a hash of the token as document ID to keep paths short and dedupe across devices
    const docId = btoa(token).replace(/[+/=]/g, '').slice(0, 40);
    await db.collection('config').doc('pushTokens').collection('tokens').doc(docId).set({
      token: token,
      lang: lang || 'en',
      updatedAt: new Date().toISOString()
    });
    // v11.9.25: GC tokens orfaos (>180d sem refresh). FCM rotaciona tokens em ~270d, e
    // re-instalacao do app ou troca de browser geram novos. Sem GC a sub-collection cresce
    // indefinidamente e o backend manda push pra tokens mortos. Fire-and-forget.
    try {
      const cutoff = new Date(Date.now() - 180*86400000).toISOString();
      const oldDocs = await db.collection('config').doc('pushTokens').collection('tokens')
        .where('updatedAt', '<', cutoff).get();
      for (const d of oldDocs.docs) {
        if (d.id !== docId) await d.ref.delete();
      }
    } catch(_) { /* best-effort, sem retry */ }
  },
  // Reminders: medication reminders that fire push notifications at scheduled times.
  // Path: config/reminders/items/{reminderId}
  // Worker checks this collection every minute and fires FCM if horario matches.
  subReminders(cb) {
    return db.collection('config').doc('reminders').collection('items').onSnapshot(snap => {
      const list = snap.docs.map(d => ({...d.data(), _id: d.id}));
      cb(list);
    });
  },
  async addReminder(reminder) {
    const id = reminder._id || ('rem_' + Date.now() + '_' + Math.random().toString(36).slice(2,7));
    const clean = {...reminder};
    delete clean._id;
    await db.collection('config').doc('reminders').collection('items').doc(id).set(clean);
    return id;
  },
  async delReminder(id) {
    await db.collection('config').doc('reminders').collection('items').doc(id).delete();
  },
  // ── BACKUP / RESTORE (v11.2) ──
  // Exporta TODO o state da Louise pro formato JSON que pode ser salvo em disco / iCloud /
  // Dropbox / etc. Importa restaura. Nossa rede de seguranca caso o Firestore tenha quota
  // issue, conta suspensa, ou alguem deletar por acidente.
  async exportAll() {
    // v11.9.25: tenta cache primeiro (Firestore offline persistence ja tem snapshot).
    // Auto-backup diario antes lia do server toda manha (~1650 reads). Cache zera o custo
    // quando ja existe (caso comum). Fallback pro server se cache vazio (raro - primeira
    // execução pos-install ou apos cache clear).
    const tryGet = async (ref) => {
      try { const s = await ref.get({ source: 'cache' }); if (s && (s.exists || (s.docs && s.docs.length))) return s; } catch(_){}
      return await ref.get();
    };
    const entriesSnap = await tryGet(db.collection('entries'));
    const entries = entriesSnap.docs.map(d => ({...d.data(), _docId: d.id}));
    const profileSnap = await tryGet(db.collection('config').doc('profile'));
    const profile = profileSnap.exists ? profileSnap.data() : null;
    const medsSnap = await tryGet(db.collection('config').doc('meds'));
    const meds = medsSnap.exists ? (medsSnap.data().list || []) : [];
    const inboxSnap = await tryGet(db.collection('config').doc('inbox'));
    const inbox = inboxSnap.exists ? inboxSnap.data() : null;
    const remindersSnap = await tryGet(db.collection('config').doc('reminders').collection('items'));
    const reminders = remindersSnap.docs.map(d => ({...d.data(), _id: d.id}));
    return {
      _meta: { version: 1, exportedAt: new Date().toISOString(), app: 'louise-pro' },
      entries, profile, meds, inbox, reminders
    };
  },
  async importAll(data) {
    if (!data || !data._meta || data._meta.app !== 'louise-pro') throw new Error('Invalid backup file');
    // v11.9.26: WriteBatch — antes era loop com await por doc (1650 entries × ~50ms = ~80s
    // de roundtrips). Batches agrupam até 500 ops/round-trip — ~4 batches pra 1650 entries.
    // Restore vai de ~80s pra ~5s. Limite Firestore: 500 ops por commit.
    const BATCH_MAX = 500;
    const allOps = [];
    if (Array.isArray(data.entries)) {
      for (const e of data.entries) {
        const clean = { ...e }; delete clean._docId;
        const id = e.id || e._docId;
        if (!id) continue;
        allOps.push({ ref: db.collection('entries').doc(id), data: clean, opts: null });
      }
    }
    if (data.profile) {
      allOps.push({ ref: db.collection('config').doc('profile'), data: data.profile, opts: { merge: false } });
    }
    if (Array.isArray(data.meds)) {
      allOps.push({ ref: db.collection('config').doc('meds'), data: { list: data.meds }, opts: null });
    }
    if (data.inbox) {
      allOps.push({ ref: db.collection('config').doc('inbox'), data: data.inbox, opts: { merge: false } });
    }
    if (Array.isArray(data.reminders)) {
      for (const r of data.reminders) {
        const clean = { ...r }; delete clean._id;
        if (!r._id) continue;
        allOps.push({ ref: db.collection('config').doc('reminders').collection('items').doc(r._id), data: clean, opts: null });
      }
    }
    // Chunk + commit
    for (let i = 0; i < allOps.length; i += BATCH_MAX) {
      const chunk = allOps.slice(i, i + BATCH_MAX);
      const batch = db.batch();
      for (const op of chunk) {
        if (op.opts) batch.set(op.ref, op.data, op.opts);
        else batch.set(op.ref, op.data);
      }
      await batch.commit();
    }
  },
  // Backup em Firestore (v11.4): salva snapshot num doc \u00fanico `config/backups/latest` que \u00e9
  // sobrescrito a cada backup. Compartilhado entre os 2 devices. Tamanho m\u00e1ximo do doc
  // Firestore \u00e9 1 MiB — enquanto os entries n\u00e3o passarem de ~4000 registros, cabe.
  async saveBackup(data) {
    const payload = JSON.stringify(data);
    const size = payload.length;
    if (size > 900000) throw new Error('Backup muito grande para salvar no Firestore (' + Math.round(size/1024) + 'KB). Use "Baixar c\u00f3pia local".');
    const updatedAt = new Date().toISOString();
    // v11.9.0: doc principal carrega o snapshot inteiro (~900KB). Doc separado `backupMeta`
    // tem s\u00f3 {updatedAt, size}, leitura cheap pra mostrar status no Profile sem baixar 900KB.
    await db.collection('config').doc('backups').set({ snapshot: data, updatedAt, size });
    await db.collection('config').doc('backupMeta').set({ updatedAt, size });
    return { size };
  },
  // Metadata-only \u2014 pra mostrar "\u00faltima backup: X horas atr\u00e1s" sem baixar o snapshot inteiro.
  // Caso o doc backupMeta n\u00e3o exista (backup antigo pr\u00e9-v11.9.0), faz fallback pro doc full
  // mas s\u00f3 na primeira vez \u2014 ap\u00f3s o pr\u00f3ximo saveBackup, backupMeta passa a existir.
  async loadBackupMeta() {
    const meta = await db.collection('config').doc('backupMeta').get();
    if (meta.exists) return meta.data();
    // Fallback: backup antigo s\u00f3 tem o doc full. L\u00ea s\u00f3 pra extrair metadata.
    const full = await db.collection('config').doc('backups').get();
    if (!full.exists) return null;
    const d = full.data();
    return { updatedAt: d.updatedAt, size: d.size };
  },
  // Snapshot completo \u2014 s\u00f3 usado ao restaurar.
  async loadBackup() {
    const snap = await db.collection('config').doc('backups').get();
    if (!snap.exists) return null;
    const d = snap.data();
    return { data: d.snapshot, updatedAt: d.updatedAt, size: d.size };
  },
};

  // A waking is "before midnight" if its time-of-day is >= startMin (still on the start day).
  // A waking is "after midnight" if its time-of-day is < startMin (rolled over to next day).
  const wakings=entry.wakings||[];
  const wakingsBefore=[];
  const wakingsAfter=[];
  for(const w of wakings){
    const [wh,wm]=(w.time||"00:00").split(":").map(Number);
    const wMin=wh*60+wm;
    // If the waking time is greater or equal to start time, it's still on the start day
    // (e.g., bedtime 20:42, waking 23:30 → before midnight)
    // Otherwise it rolled over (e.g., bedtime 20:42, waking 04:28 → after midnight)
    if(wMin>=startMin) wakingsBefore.push(w);
    else wakingsAfter.push(w);
  }
  const part1={...entry, durationMin:beforeMidnight, id:entry.id};
  const part2={...entry, date:nextDay, time:"00:00", durationMin:afterMidnight, id:entry.id+"_b"};

  if(wakingsBefore.length>0) part1.wakings=wakingsBefore; else delete part1.wakings;
  if(wakingsAfter.length>0) part2.wakings=wakingsAfter; else delete part2.wakings;
  return [part1, part2];
}

  if(bedEv){let bm=toMin(bedEv.time);if(bm<dayStart)bm+=1440;bedMin=bm;if(bm>dayStart)dayEnd=bm}
  if(!bedMin&&activeTimer&&activeTimer.type==="sleep"){const st=new Date(activeTimer.startTime);const bm=st.getHours()*60+st.getMinutes();const adjBm=bm<dayStart?bm+1440:bm;bedMin=adjBm;if(adjBm>dayStart)dayEnd=adjBm}
  const daySpan=Math.max(1,dayEnd-dayStart);
  const toAng=mins=>{const t=Math.max(0,Math.min(1,(mins-dayStart)/daySpan));return startAng+t*totalArc};
  const descArc=(sA,eA)=>{const s=sA*Math.PI/180,e=eA*Math.PI/180;return`M ${cx+R*Math.cos(s)} ${cy+R*Math.sin(s)} A ${R} ${R} 0 ${eA-sA>180?1:0} 1 ${cx+R*Math.cos(e)} ${cy+R*Math.sin(e)}`};
  const sleepEvs=evs.filter(e=>e.type==="nap"&&e.durationMin>0);
  const dotEvs=evs.filter(e=>e.type==="bottle"||e.type==="nursing"||e.type==="diaper"||e.type==="medicine"||e.type==="tummytime");
  const sleepArcs=sleepEvs.map(ev=>{

  const dots=groups.map(gr=>({primary:gr[0],items:gr}));
  // Determine last event globally: dot vs sleep arc (compare end times)
  const _lastEv=(()=>{let maxT="",type="none",dIdx=-1,sIdx=-1;dots.forEach((gr,idx)=>{gr.items.forEach(it=>{const t=`${it.ev.date}T${it.ev.time}`;if(t>maxT){maxT=t;type="dot";dIdx=idx}})});sleepArcs.forEach((sa,idx)=>{const endMs=new Date(`${sa.ev.date}T${sa.ev.time}`).getTime()+sa.ev.durationMin*60000;const d=new Date(endMs);const t=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")+"T"+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");if(t>maxT){maxT=t;type="sleep";sIdx=idx}});return{type,dIdx,sIdx}})();
  const lastDotIdx=_lastEv.type==="dot"?_lastEv.dIdx:-1;

  const totalSleepMin=evs.filter(e=>(e.type==="sleep"||e.type==="nap")&&e.durationMin).reduce((s,e)=>s+e.durationMin,0);

  let anchorMoon=null;
  if(bedMin){const dispMin=bedMin%1440;const bedTimeStr=`${String(Math.floor(dispMin/60)).padStart(2,"0")}:${String(dispMin%60).padStart(2,"0")}`;const moonAng=toAng(bedMin);const moonRad=moonAng*Math.PI/180;anchorMoon={x:cx+R*Math.cos(moonRad),y:cy+R*Math.sin(moonRad),time:bedTimeStr}}

        {/* Dashed flow on last sleep arc */}
        {lastSleepArcIdx>=0&&!activeTimer&&sleepArcs[lastSleepArcIdx]&&<path d={sleepArcs[lastSleepArcIdx].path} fill="none" stroke={sleepArcs[lastSleepArcIdx].col} strokeWidth={arcStrokeDashed} strokeLinecap="round" strokeDasharray="6 9" opacity={0.35} style={{animation:"dashFlow 2s linear infinite"}}/>}
        {/* Sparkle na ponta do arco de sono mais recente (v10.7.1) — indica "isso foi há pouco". */}
        {lastSleepArcIdx>=0&&!activeTimer&&sleepEvs[lastSleepArcIdx]&&(()=>{const ev=sleepEvs[lastSleepArcIdx];const endMin=Math.min(toMin(ev.time)+ev.durationMin,dayStart+daySpan);const endRad=toAng(endMin)*Math.PI/180;const tx=cx+R*Math.cos(endRad),ty=cy+R*Math.sin(endRad);const col=sleepArcs[lastSleepArcIdx].col;return(<g><circle cx={tx} cy={ty} r={4} fill={col} opacity={0.9}><animate attributeName="r" values="3;6;3" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/></circle><circle cx={tx} cy={ty} r={8} fill="none" stroke={col} strokeWidth={1.5} opacity={0.4}><animate attributeName="r" values="5;14;5" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.4;0;0.4" dur="2s" repeatCount="indefinite"/></circle></g>)})()}

      </svg>

      {sleepArcs.map((sa,i)=>{const isLastSleep=i===lastSleepArcIdx&&!activeTimer;return<div key={"si"+i} style={{position:"absolute",left:sa.mx-sleepSz/2,top:sa.my-sleepSz/2,width:sleepSz,height:sleepSz,borderRadius:"50%",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",zIndex:3,filter:`drop-shadow(0 0 ${isLastSleep?12:5}px ${sa.col}${isLastSleep?"aa":"55"})`,animation:isLastSleep?"glowBreathe 2s ease-in-out infinite":"none"}}><Icon name={sa.ev.type==="nap"?"cloud":"moon"} size={isLastSleep?sleepIconSz+2:sleepIconSz} color={sa.col}/><span style={{fontSize:T.fXS,fontWeight:700,color:`${sa.col}88`,marginTop:1,lineHeight:1}}>{fmtDur(sa.ev.durationMin)}</span></div>})}
      {/* Live timer icon — strong glow breathing */}
      {timerArc&&<>
        <div style={{position:"absolute",left:timerArc.mx-sleepSz/2,top:timerArc.my-sleepSz/2,width:sleepSz,height:sleepSz,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",zIndex:4,filter:`drop-shadow(0 0 10px ${timerArc.col}aa)`,animation:"glowBreathe 2s ease-in-out infinite"}}><Icon name={activeTimer.type==="nap"?"cloud":activeTimer.type==="tummytime"?"baby":"bed"} size={sleepIconSz+2} color={timerArc.col}/></div>

        <div onClick={e=>{e.stopPropagation();setTip(active?null:i)}} style={{position:"relative",width:dotSz,height:dotSz,borderRadius:"50%",background:"radial-gradient(circle at 35% 30%,rgba(30,38,80,0.95),rgba(12,16,42,0.98))",border:`2.5px solid ${active||isLast?c:c+"77"}`,display:"flex",alignItems:"center",justifyContent:"center",boxShadow:`0 2px 10px rgba(0,0,0,0.45), 0 0 ${active?22:16}px ${c}${active?"55":"30"}, inset 0 1px 0 rgba(200,220,255,0.06), inset 0 -1px 3px rgba(0,0,0,0.15)`,zIndex:active?10:isLast?5:2,transform:active?"scale(1.15)":"scale(1)",transition:"all .2s cubic-bezier(0.34,1.56,0.64,1)",overflow:"hidden",filter:`drop-shadow(0 0 5px ${c}44)`}}>
          <div style={{position:"absolute",top:"10%",left:"18%",width:"50%",height:"28%",background:`radial-gradient(ellipse,${c}22,transparent)`,borderRadius:"50%",filter:"blur(3px)"}}/>

      {anchorSun&&<div style={{position:"absolute",left:anchorSun.x-anchorSz/2,top:anchorSun.y-anchorSz/2,display:"flex",flexDirection:"column",alignItems:"center",zIndex:5,pointerEvents:"none"}}><div style={{width:anchorSz,height:anchorSz,borderRadius:"50%",background:"radial-gradient(circle at 40% 30%,rgba(251,191,36,0.28),rgba(251,146,60,0.08))",border:"2px solid rgba(251,191,36,0.55)",display:"flex",alignItems:"center",justifyContent:"center",boxShadow:"0 0 14px rgba(251,191,36,0.3)"}}><Icon name="sun" size={anchorIconSz} color="#fbbf24"/></div><span style={{fontSize:T.fXS,fontWeight:700,color:"#fbbf24",marginTop:2,textShadow:"0 1px 4px rgba(0,0,0,0.8)"}}>{anchorSun.time}</span></div>}

      {[{l:46,t:42,c:"a"},{l:55,t:46,c:"b"},{l:49,t:54,c:"c"},{l:43,t:49,c:"b"},{l:57,t:51,c:"a"},{l:51,t:39,c:"c"}].map((p,i)=><div key={"rdust"+i} className={"ring-dust-"+p.c} style={{position:"absolute",left:p.l+"%",top:p.t+"%",width:2,height:2,borderRadius:"50%",background:"rgba(196,181,253,0.7)",opacity:0.25+((i%3)*0.15),pointerEvents:"none"}}/>)}

      {tip!==null&&<div onClick={()=>setTip(null)} style={{position:"absolute",inset:0,zIndex:1}}/>}
      {showOrbit&&<div key={Date.now()} style={{position:"absolute",left:cx-3,top:cy-3,width:6,height:6,zIndex:10,pointerEvents:"none",animation:"orbitComet 1.2s cubic-bezier(0.25,0.1,0.25,1) forwards"}}><div style={{width:6,height:6,borderRadius:"50%",background:"#fff",boxShadow:"0 0 8px #fff, 0 0 20px rgba(139,124,246,0.6), -8px 0 12px rgba(139,124,246,0.3), -16px 0 8px rgba(139,124,246,0.15)",transform:`translateY(${-R}px)`}}/></div>}

function MlGoalBar({current,goal}){if(!goal||goal<=0)return null;const pct=Math.min(100,(current/goal)*100);const reached=current>=goal;return(<div style={{padding:"0 20px",marginBottom:16}}><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}><div style={{display:"flex",alignItems:"center",gap:6}}><Icon name="target" size={14} color={reached?T.green:T.sub}/><span style={{fontSize:T.fSM,fontWeight:600,color:T.sub}}>{L("dailyGoal")}</span></div><span style={{fontSize:T.fMD,fontWeight:700,color:reached?T.green:T.text}}>{current} / {goal} ml</span></div><div style={{height:6,borderRadius:3,background:T.bg3,overflow:"hidden"}}><div style={{height:"100%",borderRadius:3,width:`${pct}%`,background:reached?T.green:`linear-gradient(90deg,${T.accent},${T.purple})`,transition:"width .5s"}}/></div></div>)}

// ── LAST FEED ──
function LastFeedCard({entries}){
  const feed=entries.filter(e=>e.type==="bottle"||e.type==="nursing").sort((a,b)=>`${b.date}T${b.time}`.localeCompare(`${a.date}T${a.time}`))[0];
  if(!feed)return null;
  const ago=timeSince(feed.date,feed.time);
  const isBottle=feed.type==="bottle";
  const detail=isBottle&&feed.ml?`${feed.ml}ml`:(feed.durationMin?fmtDur(feed.durationMin):TL(feed.type));
  const col=isBottle?T.green:T.blue;
  const colLight=isBottle?"#6ee7b7":"#7dd3fc";
  return(<div style={{padding:"0 20px",marginBottom:14}}>
    <div style={{position:"relative",padding:"16px 18px 16px 22px",borderRadius:18,background:`linear-gradient(180deg,${col}12,${col}04)`,border:`1px solid ${col}32`,display:"flex",alignItems:"center",gap:14,overflow:"hidden",boxShadow:`0 1px 0 0 rgba(255,255,255,0.06) inset, 0 6px 16px -8px ${col}25`}}>
      <div style={{position:"absolute",left:0,top:0,bottom:0,width:4,background:`linear-gradient(180deg,${col},${col}40)`,borderRadius:"0 2px 2px 0",pointerEvents:"none"}}/>
      <div style={{width:46,height:46,borderRadius:14,background:`linear-gradient(135deg,${col}38,${col}10)`,border:`1px solid ${col}50`,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,boxShadow:"0 1px 0 0 rgba(255,255,255,0.08) inset"}}>
        <Icon name={isBottle?"bottle":"breast"} size={20} color={colLight}/>
      </div>
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontSize:T.fSM,color:T.label,fontWeight:600,letterSpacing:-0.05}}>{_lang==="en"?"Last feed":"Última mamada"}</div>
        <div style={{fontSize:T.f2XL,fontWeight:800,color:colLight,letterSpacing:-0.5,fontVariantNumeric:"tabular-nums",marginTop:2}}>{detail}</div>
      </div>
      <div style={{textAlign:"right"}}>
        <div style={{fontSize:T.fLG,fontWeight:700,color:T.heading,fontVariantNumeric:"tabular-nums",letterSpacing:-0.3}}>{feed.time}</div>
        <div style={{fontSize:T.fSM,color:T.sub,marginTop:3,fontWeight:500}}>{ago}</div>
      </div>
    </div>

function EditStartModal({open,onClose,activeTimer,onSave}){
  const [dateStr,setDateStr]=useState("");

  },[open,activeTimer]);

  if(!activeTimer)return null;

  const typeIcon=activeTimer.type==="sleep"?"moon":activeTimer.type==="nap"?"cloud":"baby";
  // Parse proposed new start
  let newStartMs=null,valid=false,errMsg="";
  try{

      const d=new Date(`${dateStr}T${timeStr}`);
      if(!isNaN(d.getTime())){
        newStartMs=d.getTime();
        const nowMs=Date.now();
        if(newStartMs>nowMs){
          errMsg=_lang==="en"?"Start cannot be in the future":"Início não pode ser no futuro";
        }else if(nowMs-newStartMs>30*60*60*1000){
          errMsg=_lang==="en"?"Too far in the past (max 30h)":"Muito longe no passado (máx 30h)";
        }else{
          // If wakings exist, new start can't be after the first waking
          const wakings=activeTimer.wakings||[];
          if(wakings.length>0){
            const origStart=new Date(activeTimer.startTime);
            // Compute first waking absolute timestamp
            const fw=wakings[0];
            const[fwh,fwm]=(fw.time||"00:00").split(":").map(Number);
            const startMinOfDay=origStart.getHours()*60+origStart.getMinutes();
            const wakeMinOfDay=fwh*60+fwm;

            const fwMs=new Date(origStart.getFullYear(),origStart.getMonth(),origStart.getDate()+dayOffset,fwh,fwm).getTime();
            if(newStartMs>=fwMs){

    }

    <div style={{width:64,height:64,margin:"0 auto 16px",borderRadius:20,background:`linear-gradient(135deg,${typeColor}38,${typeColor}10)`,border:`1px solid ${typeColor}50`,display:"flex",alignItems:"center",justifyContent:"center",boxShadow:"0 1px 0 0 rgba(255,255,255,0.08) inset",position:"relative"}}><Icon name={typeIcon} size={28} color={typeColorLight}/></div>
    <div style={{textAlign:"center",fontSize:T.f2XL,fontWeight:800,letterSpacing:-0.5,color:T.heading,marginBottom:6}}>{_lang==="en"?"Edit start":"Editar início"}</div>

    <div style={{fontSize:T.fSM,color:T.label,fontWeight:600,marginBottom:10,letterSpacing:-0.05}}>{_lang==="en"?"Day":"Data"}</div>
    <div style={{display:"grid",gridTemplateColumns:"minmax(0,1fr) minmax(0,1fr)",gap:10,marginBottom:16}}>
      <input type="date" value={dateStr} onChange={e=>setDateStr(e.target.value)} style={{width:"100%",maxWidth:"100%",boxSizing:"border-box",WebkitAppearance:"none",appearance:"none",padding:"14px 14px",background:"rgba(20,26,60,0.55)",border:`1px solid ${T.gBSoft}`,borderRadius:14,color:T.text,fontSize:T.fLG,fontWeight:600,letterSpacing:-0.2,outline:"none",colorScheme:"dark",textAlign:"center",boxShadow:T.insetTop}}/>

    </div>
    {errMsg?(
      <div style={{padding:"12px 14px",borderRadius:12,background:"rgba(248,113,113,0.10)",border:"1px solid rgba(248,113,113,0.28)",marginBottom:16,fontSize:T.fMD,color:"#fca5a5",textAlign:"center",lineHeight:1.5}}>{errMsg}</div>

// 28 particulas com cores variadas, drop 1.4s, fade out. Cleanup por timeout.
// v11.9.74: count-up premium. Anima de 0 (mount) ou do valor anterior até `end`,
// easeOutCubic via rAF. Re-anima só quando `end` muda (não no tick — end é estável).
// Hooks ANTES de qualquer return (Rules of Hooks). Retorna o número (node de texto).
function CountUp({end,dur=650}){
  const[v,setV]=useState(0);
  const ref=useRef(0);
  useEffect(()=>{
    const to=typeof end==="number"?end:0;
    const from=ref.current;
    ref.current=to;
    if(from===to){setV(to);return}
    let raf;const t0=performance.now();
    const step=now=>{
      const p=Math.min(1,(now-t0)/dur);
      const e=1-Math.pow(1-p,3);
      setV(Math.round(from+(to-from)*e));
      if(p<1){raf=requestAnimationFrame(step)}else{setV(to)}
    };
    raf=requestAnimationFrame(step);
    return()=>{if(raf)cancelAnimationFrame(raf)};
  },[end,dur]);
  return v;
}

  {editVisible&&<div style={{position:"absolute",left:0,top:0,bottom:0,width:Math.abs(dx),background:editPastThreshold?"linear-gradient(90deg,rgba(96,165,250,0.32),rgba(96,165,250,0.18))":"linear-gradient(90deg,rgba(96,165,250,0.18),rgba(96,165,250,0.08))",display:"flex",alignItems:"center",justifyContent:"flex-start",paddingLeft:24,borderRadius:"18px 0 0 18px",opacity:overlayOpacity,transition:dragging?"none":"opacity .2s ease, background .2s ease"}}><div style={{display:"flex",alignItems:"center",gap:8,color:"#7dd3fc"}}><Icon name="pencil" size={20} color="#7dd3fc"/><span style={{fontSize:T.fMD,fontWeight:700,letterSpacing:-0.2,opacity:editPastThreshold?1:0,transition:"opacity .15s ease"}}>{_lang==="en"?"Edit":"Editar"}</span></div></div>}

  <button onClick={()=>{if(Math.abs(dx)<5)onEdit&&onEdit(entry)}} style={{flex:1,textAlign:"left",minWidth:0,lineHeight:1.2}}><div style={{fontSize:T.fMD,fontWeight:600,letterSpacing:-0.15,color:T.heading,display:"flex",alignItems:"center",gap:5,lineHeight:1.2}}>{napLabel&&<span style={{display:"inline-block",padding:"1px 5px",borderRadius:4,background:`${cfg.color}25`,color:cfg.color,fontSize:T.fXS,fontWeight:700}}>{napLabel}</span>}<span>{cfg.label[_lang]||cfg.label.en}</span>{nightBadge&&<span title={_lang==="en"?"During bedtime":"Durante bedtime"} style={{display:"inline-flex",alignItems:"center",gap:2,padding:"0 5px 0 4px",borderRadius:5,background:"rgba(96,165,250,0.14)",border:"1px solid rgba(96,165,250,0.32)",fontSize:T.fXS,fontWeight:700,color:"#60a5fa",letterSpacing:0.2}}><Icon name="moon" size={8} color="#60a5fa"/>{_lang==="en"?"night":"noite"}</span>}</div>{detail&&<div style={{fontSize:T.fSM,color:"#9099c3",marginTop:0,fontWeight:500,lineHeight:1.15}}>{detail}</div>}</button>
  <div style={{textAlign:"right",flexShrink:0,lineHeight:1.1}}>{(entry.type==="sleep"||entry.type==="nap")&&entry.durationMin?(()=>{const endMs=new Date(`${entry.date}T${entry.time}`).getTime()+entry.durationMin*60000;const endD=new Date(endMs);const endT=`${String(endD.getHours()).padStart(2,"0")}:${String(endD.getMinutes()).padStart(2,"0")}`;const endDt=`${endD.getFullYear()}-${String(endD.getMonth()+1).padStart(2,"0")}-${String(endD.getDate()).padStart(2,"0")}`;return<><div style={{fontSize:T.fMD,fontWeight:700,color:T.heading,fontVariantNumeric:"tabular-nums",letterSpacing:-0.3}}>{`${entry.time}\u2013${endT}`}</div><div style={{fontSize:T.fSM,color:T.sub,fontWeight:500,marginTop:1}}>{timeSince(endDt,endT)}</div></>})():<><div style={{fontSize:T.fMD,fontWeight:700,color:T.heading,fontVariantNumeric:"tabular-nums",letterSpacing:-0.3}}>{entry.time}</div><div style={{fontSize:T.fSM,color:T.sub,fontWeight:500,marginTop:1}}>{timeSince(entry.date,entry.time)}</div></>}</div>
</div></div>)});

function AddForm({type,onSave,onSaveBatch,savedMeds,onSaveMeds,editEntry,lastBottleMl,lastBottleEntry,feedingIntervalMin,topMl,onStartTimer,suggestedMl}){const cfg=TYPES[type];const ed=editEntry||{};
  const[date,setDate]=useState(ed.date||todayStr());
  // v11.9.3: Bottle volta a usar nowTime (revertido o smart default da v11.9.1 — usuário
  // prefere registrar no horário real, não no horário esperado).
  const[time,setTime]=useState(ed.time||nowTime());
  const[ml,setMl]=useState(ed.ml?String(ed.ml):(type==="bottle"&&!editEntry?String(suggestedMl||lastBottleMl||""):""));const[durH,setDurH]=useState(ed.durationMin?String(Math.floor(ed.durationMin/60)):"");const[durM,setDurM]=useState(ed.durationMin?String(ed.durationMin%60):"");
  const[diaperT,setDiaperT]=useState(ed.subtype||"wet");const[medN,setMedN]=useState(ed.name||"");const[medD,setMedD]=useState(ed.dose||"");
  const[tempV,setTempV]=useState(ed.value?String(ed.value):"");const[side,setSide]=useState(ed.side||"left");const[nurseM,setNurseM]=useState(ed.durationMin&&type==="nursing"?String(ed.durationMin):"");
  const[tumM,setTumM]=useState(ed.durationMin&&type==="tummytime"?String(Math.floor(ed.durationMin)):"");
  const[tumS,setTumS]=useState(ed.durationMin&&type==="tummytime"?String(Math.round((ed.durationMin-Math.floor(ed.durationMin))*60)):"");
  const[weightKg,setWeightKg]=useState(ed.weightKg?String(ed.weightKg):"");const[lengthCm,setLengthCm]=useState(ed.lengthCm?String(ed.lengthCm):"");
  const[headCm,setHeadCm]=useState(ed.headCm?String(ed.headCm):"");const[notes,setNotes]=useState(ed.notes||"");const[showML,setShowML]=useState(false);
  const[endTime,setEndTime]=useState("");const[durMode,setDurMode]=useState("dur");
  const[nMN,setNMN]=useState("");const[nMD,setNMD]=useState("");const mRef=useRef(null);
  const isEdit=!!editEntry;
  // v11.8.0: medicine multi-select + drops picker. Em edit mode mantem single-select
  // (edita s\u00f3 uma entry por vez). No add mode, usu\u00e1rio pode marcar varios meds de
  // uma vez (combo manh\u00e3: Floripa+VitD+C\u00f3licaliv). Meds sem dose abrem drops picker 1-6.
  const[selectedMeds,setSelectedMeds]=useState(()=>{
    if(type==="medicine"&&editEntry&&editEntry.name)return new Set([editEntry.name]);
    return new Set();
  });
  // v11.8.1: drops picker vira Modal popup (antes era stage inline).
  const[dropsOpen,setDropsOpen]=useState(false);
  const pendingMedsRef=useRef({fixedMeds:[],dropMeds:[],doses:{}});
  const[currentDropIdx,setCurrentDropIdx]=useState(0);
  // v11.9.22: long-press num chip de med abre form pre-populado pra edit/delete.
  const[editingMedName,setEditingMedName]=useState(null);
  // v11.9.35: confirm 2-step pra delete de med (em vez de confirm() nativo)
  const[confirmDelMed,setConfirmDelMed]=useState(false);
  const medPressRef=useRef({timer:null,fired:false});
  const toggleMed=(name)=>{
    if(medPressRef.current.fired){medPressRef.current.fired=false;return}
    setSelectedMeds(s=>{const n=new Set(s);if(n.has(name))n.delete(name);else n.add(name);return n});
  };
  const onMedLongPress=(med)=>{
    setEditingMedName(med.name);
    setMedN(med.name);
    setMedD(med.dose||"");
    setShowML(true);
    Haptic.medium();
  };
  const startMedPress=(med)=>{
    if(medPressRef.current.timer)clearTimeout(medPressRef.current.timer);

      medPressRef.current.fired=true;
      onMedLongPress(med);
    },550);
  };
  const endMedPress=()=>{
    if(medPressRef.current.timer){clearTimeout(medPressRef.current.timer);medPressRef.current.timer=null}
  };
  useEffect(()=>{if(type==="bottle"&&mRef.current)mRef.current.focus()},[type]);
  // v11.7.3: double-submit guard + validation feedback. Antes: clique em Save enquanto a
  // Firestore write ainda resolvia criava entry duplicada; valida\u00e7\u00e3o vazia retornava
  // silenciosamente (bot\u00e3o parecia morto). Agora: guard + shake + haptic.warning se inv\u00e1lido.
  const[saving,setSaving]=useState(false);
  const savingRef=useRef(false);
  const[shakeFlash,setShakeFlash]=useState(0);
  const invalid=(msg)=>{Haptic.warning();setShakeFlash(n=>n+1)};
  const doSave=async()=>{
    if(savingRef.current||saving)return;
    const b={type,date,time,notes:notes.trim()||undefined,id:isEdit?ed.id:uid()};
    let payload=null;
    if(type==="bottle"){if(!ml){invalid();return}payload={...b,ml:parseInt(ml)}}
    else if(type==="nursing")payload={...b,side,durationMin:nurseM?parseInt(nurseM):undefined};

      }else{t2=(parseInt(durH)||0)*60+(parseInt(durM)||0)}

    else if(type==="tummytime"){const m=parseInt(tumM)||0;const s=parseInt(tumS)||0;const total=m+s/60;if(total<=0){invalid();return}payload={...b,durationMin:total}}

      else{
        // v11.8.0: multi-select + drops picker.

        return;
      }

    if(!payload)return;

    try{await onSave(payload)}catch(e){}
    // N\u00e3o reseta saving: parent desmonta o form via setFormType(null) quando termina.
  };
  const inp=INP_BASE;
  const isToday=date===todayStr();
  // v11.9.15: usa fmtRelDate ("Ontem", "Anteontem", weekday, ou data curta) em vez de só short date.
  const dateLbl=isToday?L("today"):fmtRelDate(date);

    <div style={{display:"flex",alignItems:"center",gap:12,padding:"0 20px 16px"}}>
      <div style={{width:32,height:32,borderRadius:10,background:cfg.bg,display:"flex",alignItems:"center",justifyContent:"center"}}><Icon name={cfg.icon} size={18} color={cfg.color}/></div>
      <span style={{fontSize:T.fXL,fontWeight:700}}>{cfg.label[_lang]||cfg.label.en}</span>
    </div>
    <div style={{padding:"0 20px"}}>
      {/* Date + Time row */}
      <div style={{display:"grid",gridTemplateColumns:"minmax(0,1fr) minmax(0,1fr)",gap:10,marginBottom:18}}>
        <Fld label={(_lang==="en"?"Day · ":"Dia · ")+dateLbl}><input type="date" value={date} onChange={e=>setDate(e.target.value)} style={{...inp,colorScheme:"dark"}}/></Fld>
        <Fld label={L("time")}><input type="time" value={time} onChange={e=>setTime(e.target.value)} style={{...inp,colorScheme:"dark"}}/></Fld>
      </div>
      {type==="bottle"&&<><Fld label={_lang==="en"?"Amount (ml)":"Quantidade (ml)"}><input ref={mRef} type="number" inputMode="numeric" placeholder="0" value={ml} onChange={e=>setMl(e.target.value)} style={{...inp,fontSize:36,fontWeight:800,textAlign:"center",padding:"16px"}}/></Fld>
        <div style={{display:"flex",gap:8,marginBottom:20}}>{(topMl&&topMl.length>0?[...new Set([...topMl,lastBottleMl].filter(Boolean))].slice(0,4):[60,90,120]).map((v,i)=><button key={v} onClick={()=>setMl(String(v))} style={{flex:1,padding:"10px 0",borderRadius:10,background:ml===String(v)?T.green:T.glass,color:ml===String(v)?T.bg1:T.text,border:`1px solid ${ml===String(v)?T.green:T.gB}`,textAlign:"center"}}><div style={{fontSize:T.fLG,fontWeight:800}}>{v}</div>{i===0&&topMl?.length>0&&<div style={{fontSize:T.fXS,color:ml===String(v)?T.bg1:T.dim,marginTop:1}}>{_lang==="en"?"top":"mais"}</div>}</button>)}</div></>}
      {type==="nursing"&&<><Fld label={L("side")}><Seg opts={[{v:"left",l:L("left")},{v:"right",l:L("right")},{v:"both",l:L("both")}]} val={side} set={setSide} color={cfg.color}/></Fld><Fld label={`${L("duration")} (min)`}><input type="number" inputMode="numeric" placeholder="15" value={nurseM} onChange={e=>setNurseM(e.target.value)} style={inp}/></Fld></>}
      {type==="tummytime"&&<Fld label={L("duration")}><div style={{display:"flex",gap:10,alignItems:"center"}}><input type="number" inputMode="numeric" placeholder="0" value={tumM} onChange={e=>setTumM(e.target.value)} style={{...inp,flex:1,textAlign:"center",fontSize:T.f3XL,fontWeight:800}}/><span style={{color:T.dim,fontWeight:700}}>min</span><input type="number" inputMode="numeric" placeholder="0" value={tumS} onChange={e=>setTumS(e.target.value)} style={{...inp,flex:1,textAlign:"center",fontSize:T.f3XL,fontWeight:800}}/><span style={{color:T.dim,fontWeight:700}}>s</span></div></Fld>}
      {(type==="sleep"||type==="nap")&&<>
        <div style={{display:"flex",gap:4,marginBottom:14,background:T.glass,borderRadius:10,padding:3,border:`1px solid ${T.gB}`}}>
          <button onClick={()=>setDurMode("dur")} style={{flex:1,padding:"8px 0",borderRadius:8,fontSize:T.fMD,fontWeight:700,background:durMode==="dur"?T.purple:"transparent",color:durMode==="dur"?"#fff":T.sub}}>{L("duration")}</button>
          <button onClick={()=>setDurMode("end")} style={{flex:1,padding:"8px 0",borderRadius:8,fontSize:T.fMD,fontWeight:700,background:durMode==="end"?T.purple:"transparent",color:durMode==="end"?"#fff":T.sub}}>{L("endTime")}</button>

      </>}

            <Icon name="plus" size={14} color={T.dim}/><span style={{fontSize:T.fMD,fontWeight:600,color:T.dim}}>{_lang==="en"?"Other":"Outro"}</span>

        </div>

              <div style={{fontSize:T.fMD,fontWeight:700,color:on?T.amber:T.text,letterSpacing:-0.1}}>{m.name}</div>
              <div style={{fontSize:T.fSM,color:on?`${T.amber}cc`:T.dim,marginTop:2,opacity:asks?0.85:0.7,fontStyle:asks?"italic":"normal"}}>

  const readFn=isRead||(it=>it.read===true);
  const items=(inbox.items||[]).slice().sort((a,b)=>(b.timestamp||0)-(a.timestamp||0));
  const unreadCount=items.filter(it=>!readFn(it)).length;
  const todayLabel=new Date().toLocaleDateString(lang==="pt"?"pt-BR":"en-US",{weekday:"short",day:"numeric",month:"short"}).toUpperCase().replace(".","");
  const iconByType={good:"check",warn:"zap",info:"star",curiosity:"sun"};
  const colorByType={good:T.green,warn:T.orange,info:T.blue,curiosity:T.purple};

  const fmtAgo=ts=>{
    if(!ts)return"";
    const diff=Math.floor((Date.now()-ts)/60000);
    if(diff<1)return lang==="en"?"now":"agora";
    if(diff<60)return `${diff}min`;
    const h=Math.floor(diff/60),m=diff%60;
    return m>0?`${h}h${m}m`:`${h}h`;
  };
  return(<div style={{position:"fixed",inset:0,zIndex:210,maxWidth:480,margin:"0 auto",background:"linear-gradient(180deg,rgba(7,11,30,0.99),rgba(5,8,24,0.98))",backdropFilter:"blur(16px)",WebkitBackdropFilter:"blur(16px)",display:"flex",flexDirection:"column",paddingTop:"env(safe-area-inset-top)",paddingBottom:"env(safe-area-inset-bottom)",animation:"fadeIn .25s ease"}}>
    {/* Header */}
    <div style={{display:"flex",alignItems:"center",gap:14,padding:"22px 22px 18px",borderBottom:"1px solid rgba(255,255,255,0.06)"}}>
      <div style={{width:42,height:42,borderRadius:13,background:"linear-gradient(135deg,rgba(139,124,246,0.25),rgba(139,124,246,0.08))",border:"1px solid rgba(139,124,246,0.35)",display:"flex",alignItems:"center",justifyContent:"center",boxShadow:"0 1px 0 0 rgba(255,255,255,0.08) inset"}}>
        <Icon name="bell" size={20} color="#c4b5fd"/>
      </div>
      <div style={{flex:1}}>
        <div style={{fontSize:T.fXL,fontWeight:800,letterSpacing:-0.4,color:T.heading}}>{lang==="en"?"Notifications":"Notificações"}</div>
        <div style={{fontSize:T.fSM,color:T.label,marginTop:3,fontWeight:600}}>{lang==="en"?"Today · ":"Hoje · "}{todayLabel}</div>
      </div>
      <button onClick={onClose} style={{width:38,height:38,borderRadius:12,background:"rgba(22,28,60,0.65)",border:`1px solid ${T.gBSoft}`,display:"flex",alignItems:"center",justifyContent:"center",boxShadow:T.insetTop}}>
        <Icon name="x" size={16} color={T.sub}/>
      </button>
    </div>

    {/* Toolbar */}
    {items.length>0&&<div style={{padding:"14px 22px 12px",display:"flex",alignItems:"center",gap:10}}>
      <span style={{fontSize:T.fSM,color:unreadCount>0?"#c4b5fd":T.dim,padding:"5px 12px",borderRadius:11,background:unreadCount>0?"linear-gradient(180deg,rgba(139,124,246,0.18),rgba(139,124,246,0.08))":"rgba(85,90,128,0.08)",fontWeight:700,letterSpacing:-0.05,border:`1px solid ${unreadCount>0?"rgba(139,124,246,0.32)":"rgba(85,90,128,0.15)"}`,boxShadow:unreadCount>0?T.insetTop:"none"}}>
        {unreadCount>0?`${unreadCount} ${lang==="en"?"new":"novas"}`:(lang==="en"?"All read":"Todas lidas")}
      </span>
      {unreadCount>0&&<button onClick={onMarkAllRead} style={{marginLeft:"auto",fontSize:T.fSM,color:T.sub,padding:"7px 14px",borderRadius:11,background:"rgba(22,28,60,0.6)",border:`1px solid ${T.gBSoft}`,fontWeight:600,letterSpacing:-0.05,boxShadow:T.insetTop}}>{lang==="en"?"Mark all read":"Marcar todas"}</button>}
    </div>}

    {/* List or empty state */}
    <div style={{flex:1,overflowY:"auto",WebkitOverflowScrolling:"touch"}}>
      {items.length===0?(
        <div style={{textAlign:"center",padding:"80px 24px 40px",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>
          <div style={{width:72,height:72,margin:"0 auto 18px",borderRadius:22,background:"rgba(139,124,246,0.06)",border:"1px solid rgba(139,124,246,0.12)",display:"flex",alignItems:"center",justifyContent:"center"}}>
            <Icon name="bell" size={32} color={T.dim}/>
          </div>
          <div style={{fontSize:T.fLG,fontWeight:800,marginBottom:6,color:T.text}}>{lang==="en"?"All caught up":"Tudo em dia"}</div>
          <div style={{fontSize:T.fSM,color:T.sub,lineHeight:1.6,maxWidth:260}}>{lang==="en"?"New hints from the routine engine will appear here during the day.":"Novas dicas do engine aparecerão aqui durante o dia."}</div>
          <div style={{display:"inline-flex",alignItems:"center",gap:5,marginTop:14,padding:"5px 10px",borderRadius:8,background:"rgba(139,124,246,0.06)",fontSize:T.fXS,color:T.accent,fontWeight:700,letterSpacing:0.5}}>
            <Icon name="clock" size={10} color={T.accent}/>
            {lang==="en"?"RESETS AT MIDNIGHT":"RESET À MEIA-NOITE"}
          </div>
        </div>
      ):items.map(it=>{
        const col=colorByType[it.type]||T.blue;
        const ic=iconByType[it.type]||"star";
        const unread=!readFn(it);
        const isCuriosity=it.type==="curiosity";
        const colLight=it.type==="good"?"#6ee7b7":it.type==="warn"?"#fdba74":it.type==="curiosity"?"#c4b5fd":"#7dd3fc";
        return(<button key={it.key} onClick={()=>unread&&onMarkRead(it.key)} style={{position:"relative",display:"flex",alignItems:"flex-start",gap:13,padding:"16px 22px 16px 26px",margin:"0 18px 8px",borderRadius:18,background:unread?`linear-gradient(180deg,${col}1a,${col}05)`:"rgba(22,28,60,0.35)",border:`1px solid ${unread?col+"38":T.gBSoft}`,boxShadow:unread?`0 1px 0 0 rgba(255,255,255,0.06) inset, 0 6px 16px -8px ${col}25`:T.insetTop,overflow:"hidden",width:"calc(100% - 36px)",textAlign:"left",cursor:unread?"pointer":"default"}}>
          <div style={{position:"absolute",left:0,top:0,bottom:0,width:4,background:`linear-gradient(180deg,${col},${col}40)`,borderRadius:"0 2px 2px 0",pointerEvents:"none",opacity:unread?1:0.4}}/>
          <div style={{width:38,height:38,borderRadius:12,background:`linear-gradient(135deg,${col}40,${col}10)`,border:`1px solid ${col}50`,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,opacity:unread?1:0.5,boxShadow:"0 1px 0 0 rgba(255,255,255,0.08) inset"}}>
            <Icon name={ic} size={17} color={colLight}/>
          </div>
          <div style={{flex:1,minWidth:0}}>
            {isCuriosity&&<div style={{fontSize:T.fXS,fontWeight:800,letterSpacing:0.8,textTransform:"uppercase",color:colLight,marginBottom:4,opacity:unread?1:0.5}}>{lang==="en"?"Daily curiosity":"Curiosidade do dia"}</div>}
            <div style={{fontSize:T.fLG,fontWeight:700,marginBottom:4,color:unread?colLight:T.sub,lineHeight:1.3,letterSpacing:-0.2}}>{it.title}</div>
            <div style={{fontSize:T.fMD,color:unread?"#9099c3":T.dim,lineHeight:1.55}}>{it.sub}</div>
            <div style={{fontSize:T.fSM,color:T.dim,marginTop:6,fontWeight:600,letterSpacing:0.3}}>{fmtAgo(it.timestamp)}</div>
          </div>
        </button>);
      })}
    </div>
  </div>);
}

function ProfilePage({profile,entries,onSave,onBack,onGrowth,onShowChangelog,hasUnreadChangelog,reminders,onAddReminder,onDelReminder,onDirtyChange,cancelSignal,saveSignal}){
  const[name,setName]=useState(profile.name||"");
  const[birth,setBirth]=useState(profile.birthDate||"");
  const[photo,setPhoto]=useState(profile.photo||"");
  const[mlGoal,setMlGoal]=useState(String(profile.mlGoal||""));
  // v11.9.40: rotina diária (pediatra)
  const _r0=profile.routine||{};
  const _naps0=Array.isArray(_r0.naps)?_r0.naps:[];
  const[routineEnabled,setRoutineEnabled]=useState(profile.routine?.enabled===true);
  const[wakeTime,setWakeTime]=useState(_r0.wakeTime||"07:00");
  const[bathTime,setBathTime]=useState(_r0.bathTime||"18:00");
  const[bedtime,setBedtime]=useState(_r0.bedtime||"19:30");
  const[bottlesPerDay,setBottlesPerDay]=useState(String(_r0.bottlesPerDay||7));
  const[nap1,setNap1]=useState(_naps0[0]?.time||"08:15");
  const[nap2,setNap2]=useState(_naps0[1]?.time||"10:45");
  const[nap3,setNap3]=useState(_naps0[2]?.time||"13:30");
  const[nap4,setNap4]=useState(_naps0[3]?.time||"16:00");
  const[birthWeight,setBirthWeight]=useState(String(profile.birthWeight||""));
  const[birthLength,setBirthLength]=useState(String(profile.birthLength||""));
  const[birthHead,setBirthHead]=useState(String(profile.birthHead||""));
  const[langSel,setLangSel]=useState(profile.lang||"en");
  const[keepScreenOn,setKeepScreenOn]=useState(profile.keepScreenOn!==false);
  // hapticEnabled removed — iOS Safari doesn't support navigator.vibrate.
  // Still sent to Firestore as `false` for schema compat with any older clients.
  const hapticEnabled=false;
  const[pushEnabled,setPushEnabled]=useState(profile.pushEnabled===true);
  const[pushPermission,setPushPermission]=useState(()=>typeof Notification!=="undefined"?Notification.permission:"unsupported");
  const[pushBusy,setPushBusy]=useState(false);
  // Dirty tracking — only INPUT fields (not toggles, which autosave)
  // Revert-all handler, triggered by the Cancel button in the contextual navbar.
  // Defined early so effects below can reference it, but revertAll body is set after feeding states exist.
  const revertAllRef=useRef(null);
  // Watch cancelSignal — increments every time parent triggers cancel
  useEffect(()=>{if(cancelSignal&&revertAllRef.current)revertAllRef.current()},[cancelSignal]);
  // Watch saveSignal — increments every time parent triggers save via navbar.
  const saveRef=useRef(null);
  useEffect(()=>{if(saveSignal&&saveRef.current)saveRef.current()},[saveSignal]);
  // Local state for the new-reminder form
  const[remNome,setRemNome]=useState("");
  const[remDose,setRemDose]=useState("");
  const[remHorario,setRemHorario]=useState("09:00");
  const[remTitulo,setRemTitulo]=useState("");
  const[remCorpo,setRemCorpo]=useState("");
  const[remShowCustom,setRemShowCustom]=useState(false);
  const[remBusy,setRemBusy]=useState(false);
  // Edit-mode state for existing reminders
  const[editingRemId,setEditingRemId]=useState(null);
  const[editNome,setEditNome]=useState("");
  const[editDose,setEditDose]=useState("");
  const[editHorario,setEditHorario]=useState("");
  const[editTitulo,setEditTitulo]=useState("");
  const[editCorpo,setEditCorpo]=useState("");
  const[editBusy,setEditBusy]=useState(false);
  const startRemEdit=(r)=>{
    setEditingRemId(r._id);
    setEditNome(r.nome||"");
    setEditDose(r.dose||"");
    setEditHorario((r.horarios&&r.horarios[0])||"09:00");
    setEditTitulo(r.titulo||"");
    setEditCorpo(r.corpo||"");
  };
  const cancelRemEdit=()=>{
    setEditingRemId(null);setEditNome("");setEditDose("");setEditHorario("");setEditTitulo("");setEditCorpo("");
  };
  const saveRemEdit=async(orig)=>{
    if(!editNome.trim()||!editHorario)return;
    setEditBusy(true);Haptic.medium();
    try{
      const payload={_id:orig._id,nome:editNome.trim(),dose:editDose.trim(),horarios:[editHorario],ativo:orig.ativo!==false,createdAt:orig.createdAt||new Date().toISOString()};
      if(editTitulo.trim())payload.titulo=editTitulo.trim();
      if(editCorpo.trim())payload.corpo=editCorpo.trim();
      await onAddReminder(payload);
      cancelRemEdit();
      Haptic.success();
    }catch(e){Haptic.warning()}
    setEditBusy(false);
  };
  // Feeding interval reminder state — single global reminder, not a list
  // Lookup the existing one from props.reminders (if any)
  const feedReminder=(reminders||[]).find(r=>r.tipo==="feedingInterval");
  // Medication reminders list (everything except the feeding interval one)
  const medList=(reminders||[]).filter(r=>r.tipo!=="feedingInterval");
  const[fdEnabled,setFdEnabled]=useState(feedReminder?.ativo===true);
  // v11.7.7: SEM\u00c2NTICA INVERTIDA \u2014 `intervalMin` continua sendo o prazo do push
  // (cloud function \u00e9 a fonte da verdade e n\u00e3o precisa mudar). Novo campo
  // `barIntervalMin` \u00e9 client-only, controla s\u00f3 a barra do card Home. Fallback:
  // se `barIntervalMin` ausente, usa `intervalMin` (comportamento pr\u00e9-v11.7.7).
  const[fdPushMinutes,setFdPushMinutes]=useState(feedReminder?.intervalMin||120);
  const[fdMinutes,setFdMinutes]=useState(feedReminder?.barIntervalMin||feedReminder?.intervalMin||120);
  const[fdBusy,setFdBusy]=useState(false);
  const fmtMin=(v)=>{const h=Math.floor(v/60);const m=v%60;if(h===0)return`${m}min`;if(m===0)return`${h}h`;return`${h}h ${m}min`};
  const fdConverted=fmtMin(fdMinutes||0);
  const fdPushConverted=fmtMin(fdPushMinutes||0);
  // Sync local state when the prop changes (Firestore push from another device)
  useEffect(()=>{
    const r=(reminders||[]).find(x=>x.tipo==="feedingInterval");
    if(r){setFdEnabled(r.ativo===true);setFdPushMinutes(r.intervalMin||120);setFdMinutes(r.barIntervalMin||r.intervalMin||120)}
  },[reminders]);
  // Save handler — upserts the single feedingInterval reminder.
  // v11.7.7: `intervalMin` = prazo do push (lido pelo cloud function).
  //          `barIntervalMin` = prazo da barra (client-only).
  const saveFeedReminder=async(overrides={})=>{
    const enabled=overrides.ativo!==undefined?overrides.ativo:fdEnabled;
    const barMinutes=overrides.barIntervalMin!==undefined?overrides.barIntervalMin:fdMinutes;
    const pushMinutes=overrides.intervalMin!==undefined?overrides.intervalMin:fdPushMinutes;
    const existing=(reminders||[]).find(r=>r.tipo==="feedingInterval");
    setFdBusy(true);
    Haptic.medium();
    try{
      await onAddReminder({
        _id:existing?._id||"feedingInterval",
        tipo:"feedingInterval",
        ativo:enabled,
        intervalMin:pushMinutes,
        barIntervalMin:barMinutes,
        createdAt:existing?.createdAt||new Date().toISOString()
      });
      Haptic.success();
    }catch(e){Haptic.warning()}
    setFdBusy(false);
  };
  const pushSupported=PushNotifs.isSupported();

  // ═══ UNIFIED DIRTY STATE ═══
  // Tracks all input fields (including feeding reminder) but NOT the toggles (keepScreenOn/haptic/push/lang/feedingEnabled which autosave)
  // Photo sig (v10.5.3): foto é base64 de 50-200KB. Compare direto string-vs-string é O(n)
  // e roda a cada re-render da ProfilePage (re-renders acontecem em cada keystroke nos inputs).
  // Assinatura curta = length + primeiros 24 + últimos 24 chars. useMemo garante que o
  // hash só recalcula quando a string muda de referência. O isDirty vira O(1) por render.
  const photoSig = useMemo(()=>photo?`${photo.length}:${photo.slice(0,24)}:${photo.slice(-24)}`:"",[photo]);
  const remotePhotoSig = useMemo(()=>{const p=profile.photo||"";return p?`${p.length}:${p.slice(0,24)}:${p.slice(-24)}`:""},[profile.photo]);
  const isDirty=(
    name!==(profile.name||"")||
    birth!==(profile.birthDate||"")||
    photoSig!==remotePhotoSig||
    mlGoal!==String(profile.mlGoal||"")||
    birthWeight!==String(profile.birthWeight||"")||
    birthLength!==String(profile.birthLength||"")||
    birthHead!==String(profile.birthHead||"")||
    fdPushMinutes!==(feedReminder?.intervalMin||120)||
    fdMinutes!==(feedReminder?.barIntervalMin||feedReminder?.intervalMin||120)||
    // v11.9.40: rotina
    routineEnabled!==(profile.routine?.enabled===true)||
    wakeTime!==(_r0.wakeTime||"07:00")||
    bathTime!==(_r0.bathTime||"18:00")||
    bedtime!==(_r0.bedtime||"19:30")||
    bottlesPerDay!==String(_r0.bottlesPerDay||7)||
    nap1!==(_naps0[0]?.time||"08:15")||
    nap2!==(_naps0[1]?.time||"10:45")||
    nap3!==(_naps0[2]?.time||"13:30")||
    nap4!==(_naps0[3]?.time||"16:00")
  );
  useEffect(()=>{if(onDirtyChange)onDirtyChange(isDirty)},[isDirty]);
  // Populate revertAllRef with function that resets all tracked fields
  revertAllRef.current=()=>{
    setName(profile.name||"");
    setBirth(profile.birthDate||"");
    setPhoto(profile.photo||"");
    setMlGoal(String(profile.mlGoal||""));
    setBirthWeight(String(profile.birthWeight||""));
    setBirthLength(String(profile.birthLength||""));
    setBirthHead(String(profile.birthHead||""));
    setFdPushMinutes(feedReminder?.intervalMin||120);
    setFdMinutes(feedReminder?.barIntervalMin||feedReminder?.intervalMin||120);
    // v11.9.40: revert rotina
    setRoutineEnabled(profile.routine?.enabled===true);
    setWakeTime(_r0.wakeTime||"07:00");
    setBathTime(_r0.bathTime||"18:00");
    setBedtime(_r0.bedtime||"19:30");
    setBottlesPerDay(String(_r0.bottlesPerDay||7));
    setNap1(_naps0[0]?.time||"08:15");
    setNap2(_naps0[1]?.time||"10:45");
    setNap3(_naps0[2]?.time||"13:30");
    setNap4(_naps0[3]?.time||"16:00");
    Haptic.medium();
  };
  // Persists a single toggle change immediately to Firestore (no need to tap Save).
  // DELTA-ONLY (v10.5.0): só manda os campos que de fato mudaram. Combinado com saveProfile
  // usando merge, zero risco de sobrescrever name/photo com state stale desta aba.
  const persistToggle=async(overrides)=>{
    try{await onSave(overrides)}catch(e){/* fail silent */}
  };
  const handlePushToggle=async()=>{
    if(pushBusy)return;
    if(!pushSupported)return;
    if(pushEnabled){
      // Disable: flip the flag and persist immediately
      setPushEnabled(false);
      Haptic.light();
      await persistToggle({pushEnabled:false});
      return;
    }
    // Enable: must request permission via user gesture
    setPushBusy(true);
    Haptic.medium();
    try{
      const granted=await PushNotifs.requestPermission();
      setPushPermission(typeof Notification!=="undefined"?Notification.permission:"unsupported");
      if(granted){
        setPushEnabled(true);
        await persistToggle({pushEnabled:true});
        // Try to fetch token (may return null if FCM SDK not loaded — that's OK)
        const token=await PushNotifs.getToken();
        if(token)await PushNotifs.saveToken(token);
        Haptic.success();
      }else{
        Haptic.warning();
      }
    }catch(e){/* fail silent */}
    setPushBusy(false);
  };
  const fr=useRef(null);
  const handlePhoto=e=>{const f=e.target.files?.[0];if(!f)return;const rd=new FileReader();rd.onload=ev=>{const img=new Image();img.onload=()=>{const c=document.createElement("canvas"),mx=200;let w=img.width,h=img.height;if(w>h){h=(h/w)*mx;w=mx}else{w=(w/h)*mx;h=mx}c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);setPhoto(c.toDataURL("image/jpeg",0.8))};img.src=ev.target.result};rd.readAsDataURL(f)};
  const doSave=async()=>{
    // Save profile fields
    // v11.7: parse com comma OR ponto (BRT keyboard usa v\u00edrgula por default).
    const pFloat=v=>parseFloat(String(v||"").replace(",","."))||0;
    // v11.9.40: rotina diária — salva como sub-objeto routine
    const routine={
      enabled:routineEnabled,
      wakeTime,
      bathTime,
      bedtime,
      bottlesPerDay:Math.max(1,Math.min(20,parseInt(bottlesPerDay)||7)),

    // Also persist feeding reminder intervals if they changed (barra OR push).
    // v11.7.7: intervalMin = push; barIntervalMin = barra.
    const barraChanged=fdMinutes!==(feedReminder?.barIntervalMin||feedReminder?.intervalMin||120);
    const pushChanged=fdPushMinutes!==(feedReminder?.intervalMin||120);
    if(barraChanged||pushChanged){
      const clampedBarra=Math.max(30,Math.min(720,fdMinutes||120));
      const clampedPush=Math.max(30,Math.min(720,fdPushMinutes||120));
      await saveFeedReminder({barIntervalMin:clampedBarra,intervalMin:clampedPush});
      if(clampedBarra!==fdMinutes)setFdMinutes(clampedBarra);
      if(clampedPush!==fdPushMinutes)setFdPushMinutes(clampedPush);
    }
  };
  saveRef.current=doSave;
  // v11.7.2: AUTO-SAVE. Em vez de bot\u00e3o Save/Cancel, grava sozinho 900ms depois da \u00faltima
  // edi\u00e7\u00e3o em qualquer campo. Mostra "Salvando..." -> "\u2713 Salvo" no header durante a janela.
  // Sem debounce curto demais (n\u00e3o gasta requests por keystroke) nem longo demais (usu\u00e1ria
  // pode sair da p\u00e1gina antes). Photo salva imediatamente (0ms) porque n\u00e3o d\u00e1 pra editar.
  const[autoState,setAutoState]=useState("idle"); // idle | pending | saving | saved
  const saveTimerRef=useRef(null);
  const savedFlashRef=useRef(null);
  useEffect(()=>{
    if(!isDirty){return}
    setAutoState("pending");
    if(saveTimerRef.current)clearTimeout(saveTimerRef.current);
    // Photo change = save imediato. Campos de texto = 900ms debounce.
    const delay=photo!==(profile.photo||"")?0:900;
    saveTimerRef.current=setTimeout(async()=>{
      setAutoState("saving");
      try{
        await doSave();
        setAutoState("saved");
        if(savedFlashRef.current)clearTimeout(savedFlashRef.current);
        savedFlashRef.current=setTimeout(()=>setAutoState("idle"),1400);
      }catch(e){setAutoState("idle")}
    },delay);
    return()=>{if(saveTimerRef.current)clearTimeout(saveTimerRef.current)};
  },[isDirty,name,birth,photo,mlGoal,birthWeight,birthLength,birthHead,fdMinutes,fdPushMinutes,routineEnabled,wakeTime,bathTime,bedtime,bottlesPerDay,nap1,nap2,nap3,nap4]);
  useEffect(()=>()=>{if(saveTimerRef.current)clearTimeout(saveTimerRef.current);if(savedFlashRef.current)clearTimeout(savedFlashRef.current)},[]);
  const inp=INP_BASE;
  // v11.7.1: Profile usa o MESMO gradient do body + Starfield interno pra compartilhar
  // a identidade visual do app — antes (v11.7) era transparent e mostrava a aba atr\u00e1s.
  return(<div style={{position:"fixed",inset:0,zIndex:200,maxWidth:480,margin:"0 auto",background:"radial-gradient(ellipse 140% 55% at 50% 100%, #1a1f52 0%, transparent 70%), radial-gradient(ellipse at 50% 0%, #10153d 0%, #070b1e 65%), #070b1e",overflowY:"auto",overflowX:"hidden",overscrollBehavior:"contain",WebkitOverflowScrolling:"touch",paddingTop:"env(safe-area-inset-top)",paddingBottom:"calc(100px + env(safe-area-inset-bottom))"}}>
    <Starfield/>
    {/* Fade overlays removed — both top and bottom gradient strips were visually distracting,
        making content look dimmed/buggy rather than giving a clean melt effect. Simple solid scroll. */}
    {/* Header (v11.7.2): back + title + indicador sutil de auto-save.
        Sem bot\u00f5es Save/Cancel \u2014 grava sozinho 900ms depois da \u00faltima edi\u00e7\u00e3o. */}
    {/* v11.9.75: header com identidade — título em gradiente (igual o nome na Home),

    </div>
    {/* v11.7.5: pill flutuante do auto-save. Fica em position:fixed centered-top,
        acompanha o scroll sozinho sem precisar da header ser sticky (que ficava feio). */}
    {autoState!=="idle"&&<div style={{position:"fixed",top:"calc(env(safe-area-inset-top) + 12px)",left:"50%",transform:"translateX(-50%)",zIndex:300,pointerEvents:"none",animation:"pillIn 0.25s ease"}}>
      <span style={{display:"inline-flex",alignItems:"center",gap:6,padding:"7px 14px",borderRadius:22,fontSize:T.fMD,fontWeight:700,letterSpacing:-0.1,background:autoState==="saved"?"rgba(16,30,24,0.92)":"rgba(18,20,48,0.92)",backdropFilter:"blur(14px)",WebkitBackdropFilter:"blur(14px)",border:`1px solid ${autoState==="saved"?"rgba(52,211,153,0.35)":"rgba(139,124,246,0.28)"}`,color:autoState==="saved"?"#6ee7b7":"#c4b5fd",boxShadow:"0 8px 24px -8px rgba(0,0,0,0.5)"}}>
        {autoState==="saved"?<><Icon name="check" size={12} color="#6ee7b7"/>{_lang==="en"?"Saved":"Salvo"}</>:<><span style={{width:6,height:6,borderRadius:"50%",background:"#c4b5fd",animation:"pulse 1.2s ease-in-out infinite"}}/>{autoState==="saving"?(_lang==="en"?"Saving\u2026":"Salvando\u2026"):(_lang==="en"?"Editing\u2026":"Editando\u2026")}</>}
      </span>
    </div>}
    <div style={{padding:"0 20px"}}>
      {/* v11.9.75: hero — avatar + nome (gradiente) + idade. Ancora a identidade da Louise. */}
      <div style={{display:"flex",flexDirection:"column",alignItems:"center",marginBottom:22}}><button onClick={()=>fr.current?.click()} style={{width:88,height:88,borderRadius:"50%",overflow:"hidden",background:T.glass,border:`2px solid ${T.accent}33`,display:"flex",alignItems:"center",justifyContent:"center",boxShadow:"0 4px 20px rgba(0,0,0,0.3)"}}>{photo?<img src={photo} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/>:<Icon name="sun" size={32} color={T.sub}/>}</button><input ref={fr} type="file" accept="image/*" style={{display:"none"}} onChange={handlePhoto}/>{name&&<div style={{fontSize:T.f2XL,fontWeight:800,letterSpacing:-0.4,marginTop:11,background:"linear-gradient(180deg,#ffffff,#c4b5fd)",WebkitBackgroundClip:"text",backgroundClip:"text",WebkitTextFillColor:"transparent",color:"transparent"}}>{name}</div>}{(()=>{const a=calcAge(birth);return a?<div style={{fontSize:T.fSM,color:T.accent,fontWeight:600,marginTop:3,fontVariantNumeric:"tabular-nums"}}>{a.totalDays} {_lang==="en"?"days":"dias"}{a.months>0?` · ${a.months} ${_lang==="en"?"mo":"m"}`:""}</div>:null})()}<span style={{fontSize:T.fXS,color:T.dim,marginTop:6}}>{_lang==="en"?"Tap photo to change":"Toque na foto para trocar"}</span></div>
      {/* ── GROUP: PERFIL ── name/birth/mlGoal + birth data + view growth */}
      <div style={{background:"linear-gradient(180deg,rgba(22,28,60,0.55),rgba(20,26,60,0.32))",border:`1px solid ${T.gBSoft}`,borderRadius:18,padding:"15px 16px",marginBottom:13,boxShadow:T.insetTop}}>
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:13}}>
          <div style={{width:20,height:20,borderRadius:7,background:`${T.purple}1f`,border:`1px solid ${T.purple}40`,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}><Icon name="star" size={11} color={T.purple}/></div>
          <span style={{fontSize:T.fXS,fontWeight:800,letterSpacing:1,textTransform:"uppercase",color:T.purple}}>{_lang==="en"?"Profile":"Perfil"}</span>

        <Fld label={L("dailyMilkGoal")}><input type="number" inputMode="numeric" placeholder={_lang==="en"?"e.g. 600":"Ex: 600"} value={mlGoal} onChange={e=>setMlGoal(e.target.value)} style={inp}/></Fld>

function ChangelogModal({onClose,lang}){
  // Render a bullet: detect highlight prefix "★ " and bold markers **text**
  const renderBullet=(text,idx)=>{
    const highlighted=text.startsWith("\u2605 ");
    const clean=highlighted?text.slice(2):text;
    // Parse **bold** segments
    const parts=[];
    let remaining=clean;
    let key=0;
    while(remaining.length>0){
      const boldStart=remaining.indexOf("**");
      if(boldStart===-1){parts.push(<span key={key++}>{remaining}</span>);break}
      if(boldStart>0)parts.push(<span key={key++}>{remaining.slice(0,boldStart)}</span>);
      const boldEnd=remaining.indexOf("**",boldStart+2);
      if(boldEnd===-1){parts.push(<span key={key++}>{remaining.slice(boldStart)}</span>);break}
      parts.push(<strong key={key++} style={{color:T.lilac,fontWeight:700}}>{remaining.slice(boldStart+2,boldEnd)}</strong>);
      remaining=remaining.slice(boldEnd+2);
    }
    return(<li key={idx} style={{fontSize:T.fMD,color:T.text,lineHeight:1.55,padding:"5px 0 5px 18px",position:"relative",listStyle:"none"}}>
      <span style={{position:"absolute",left:3,top:12,width:6,height:6,borderRadius:"50%",background:highlighted?T.green:T.purple,boxShadow:highlighted?`0 0 8px ${T.green}`:"none"}}/>

  return(<div style={{position:"fixed",inset:0,zIndex:300,background:"rgba(7,11,30,0.75)",backdropFilter:"blur(6px)",WebkitBackdropFilter:"blur(6px)",display:"flex",alignItems:"stretch",justifyContent:"center",padding:"calc(14px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom))"}} onClick={onClose}>

      {/* Header */}
      <div style={{padding:"16px 18px",borderBottom:"1px solid rgba(139,124,246,0.12)",display:"flex",alignItems:"center",gap:12,background:"linear-gradient(180deg,rgba(139,124,246,0.08),transparent)",flexShrink:0}}>
        <div style={{width:38,height:38,borderRadius:11,background:"linear-gradient(135deg,rgba(139,124,246,0.25),rgba(124,58,237,0.15))",border:"1px solid rgba(139,124,246,0.3)",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#c4b5fd" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 2l3 7h7l-5.5 4 2 7L12 16l-6.5 4 2-7L2 9h7z"/></svg>
        </div>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:T.fXS,fontWeight:800,color:"rgba(139,124,246,0.7)",textTransform:"uppercase",letterSpacing:1}}>{lang==="en"?"What's new · Louise Pro":"Novidades · Louise Pro"}</div>
          <div style={{fontSize:T.fLG,fontWeight:800,marginTop:2,color:T.text}}>{lang==="en"?"Version history":"Histórico de versões"}</div>
        </div>
        <button onClick={onClose} style={{width:32,height:32,borderRadius:10,background:"rgba(90,100,180,0.1)",border:`1px solid ${T.gB}`,display:"flex",alignItems:"center",justifyContent:"center",color:T.sub,cursor:"pointer",fontSize:T.fLG,flexShrink:0}}>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>

// StatsPage memoizado (v11.2) — re-render só quando entries/onGrowth mudarem,
// não a cada tick de 5s do App durante timer ativo.
const StatsPage = React.memo(function StatsPage({entries,onGrowth}){
  const[period,setPeriod]=useState(7);
  // v11.9.81: tocar numa barra mostra o valor+data (essencial em 14d+, onde os números
  // somem). selBar = chave da barra tocada ("campo:data"). A COLUNA inteira é o alvo de
  // toque (bem maior que o tracinho fino), e o pill flutua acima da barra selecionada.
  const[selBar,setSelBar]=useState(null);
  const tapBar=k=>setSelBar(p=>p===k?null:k);
  const dayPill=(d,val)=>(<div style={{position:"absolute",bottom:"100%",left:"50%",transform:"translateX(-50%)",marginBottom:6,zIndex:6,whiteSpace:"nowrap",background:"linear-gradient(180deg,rgba(32,38,76,0.98),rgba(20,26,58,0.97))",border:`1px solid ${T.accent}66`,borderRadius:9,padding:"4px 9px",boxShadow:"0 6px 18px -6px rgba(0,0,0,0.6)",pointerEvents:"none",textAlign:"center"}}><div style={{fontSize:T.fXS,color:T.lilac,fontWeight:700,letterSpacing:0.2}}>{new Date(d.date+"T12:00").toLocaleDateString(_lang==="pt"?"pt-BR":"en-US",{weekday:"short",day:"numeric",month:"numeric"}).replace(/\./g,"")}</div><div style={{fontSize:T.fSM,color:"#fff",fontWeight:800,fontVariantNumeric:"tabular-nums",marginTop:1}}>{val}</div></div>);
  const today=todayStr();
  // Build the day window:
  // - For numeric periods (7/14/30): N complete past days (yesterday → N days ago) + today as bonus
  //   This way "7d" means "average of last 7 complete days, with today shown as context"
  // - For "all": every date that has entries (including today)
  const days=period==="all"
    ?[...new Set(entries.map(e=>e.date))].sort()
    :(()=>{
      const arr=[];
      // Past complete days: from N days ago up to yesterday (inclusive)
      for(let i=period;i>=1;i--){
        const d=new Date();d.setDate(d.getDate()-i);
        arr.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`);
      }
      // Today as bonus visual (still in progress, not part of the average)
      arr.push(today);
      return arr;
    })();
  const numDays=days.length||1;
  const data=days.map(dt=>{
    const de=entries.filter(e=>e.date===dt);
    const sleeps=de.filter(e=>(e.type==="sleep"||e.type==="nap")&&e.durationMin);
    const slReal=sumRealSleep(sleeps);
    const slAwake=sumAwakeInSleep(sleeps);
    const simetCount=de.filter(e=>e.type==="medicine"&&e.name&&/simet/i.test(e.name)).length;
    const tumEntries=de.filter(e=>e.type==="tummytime"&&e.durationMin);
    const tumMin=Math.round(tumEntries.reduce((s,e)=>s+(e.durationMin||0),0));
    // v11.9.3: granularidade extra — naps duration, poop/wet split, ww (wake window).
    const napsOnly=de.filter(e=>e.type==="nap"&&e.durationMin);
    const napTotalMin=Math.round(napsOnly.reduce((s,e)=>s+e.durationMin,0));
    const napMaxMin=napsOnly.length?Math.round(Math.max(...napsOnly.map(e=>e.durationMin))):0;
    const diapers=de.filter(e=>e.type==="diaper");
    const poopCount=diapers.filter(e=>e.subtype==="dirty"||e.subtype==="both").length;
    const wetCount=diapers.filter(e=>e.subtype==="wet"||e.subtype==="both").length;
    return{
      date:dt,isToday:dt===today,
      label:numDays<=14?new Date(dt+"T12:00").toLocaleDateString(_lang==="pt"?"pt-BR":"en-US",{weekday:"short"}).replace(".",""):new Date(dt+"T12:00").toLocaleDateString(_lang==="pt"?"pt-BR":"en-US",{day:"numeric",month:"numeric"}).replace(/\/\d{4}/,""),
      ml:de.filter(e=>e.type==="bottle").reduce((s,e)=>s+(e.ml||0),0),
      sl:slReal,
      slAwake:slAwake,
      slBed:slReal+slAwake,
      simet:simetCount,
      tum:tumEntries.length,
      tumMin:tumMin,
      napTotalMin,napMaxMin,poopCount,wetCount
    }
  });
  // ─────────────────────────────────────────────────
  // AVERAGES: exclude today (still in progress) so the math is honest.
  // Today still appears in the chart, but doesn't pull the average down/up.
  // If today is the only day with data, we fall back to including it
  // (otherwise users would see nothing on first launch).
  // ─────────────────────────────────────────────────
  const completeData=data.filter(d=>!d.isToday);
  const usingFallback=completeData.length===0;
  const avgData=usingFallback?data:completeData;
  const numComplete=avgData.length||1;
  const mxMl=Math.max(...data.map(d=>d.ml),1);
  const mxSl=Math.max(...data.map(d=>d.sl+d.slAwake),1); // stack height = real + awake
  const avgMl=Math.round(avgData.reduce((s,d)=>s+d.ml,0)/numComplete);
  const avgSl=Math.round(avgData.reduce((s,d)=>s+d.sl,0)/numComplete);
  const avgAwake=Math.round(avgData.reduce((s,d)=>s+d.slAwake,0)/numComplete);
  const avgBed=avgSl+avgAwake;
  // Wakings count per night (only nights with bedtime data, excluding today)
  const avgDays=avgData.map(d=>d.date);
  const totalWakings=avgDays.reduce((s,dt)=>s+countWakings(entries.filter(e=>e.date===dt)),0);
  const nightsWithSleep=avgDays.filter(dt=>entries.some(e=>e.date===dt&&e.type==="sleep"&&e.durationMin)).length;
  const avgWakings=nightsWithSleep>0?Math.round((totalWakings/nightsWithSleep)*10)/10:0;
  // Trend: compare COMPLETE current period to COMPLETE previous period (apples to apples)
  // Previous period = the N days before the current period started
  const prevDays=period!=="all"?Array.from({length:numComplete},(_,i)=>{const d=new Date();d.setDate(d.getDate()-numComplete-1-((numComplete-1)-i));return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}):[];
  const prevMl=prevDays.length?Math.round(prevDays.reduce((s,dt)=>s+entries.filter(e=>e.date===dt&&e.type==="bottle").reduce((ss,e)=>ss+(e.ml||0),0),0)/prevDays.length):0;

  const exportCSV=()=>{const h="Data,Hora,Tipo,Detalhe,Notas\n";const rows=entries.map(e=>{let d="";if(e.ml)d=`${e.ml}ml`;else if(e.durationMin)d=fmtDur(e.durationMin);else if(e.name)d=e.name;else if(e.value)d=`${e.value}°C`;else if(e.subtype)d=e.subtype;return`${e.date},${e.time},${TL(e.type)||e.type},${d},${e.notes||""}`}).join("\n");const blob=new Blob([h+rows],{type:"text/csv"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=`louise-pro-${todayStr()}.csv`;a.click();URL.revokeObjectURL(url)};
