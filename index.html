  <!-- Resource hints (v10.0.4): preload critical scripts in parallel with HTML parse
       and warm up TCP+TLS to the Firestore host so the first live query is faster.
       On 2nd+ loads these are redundant (SW cache serves the scripts) but they're

  <!-- ERROR & LOADING HANDLER -->

  <script>
  window.onerror=function(msg,src,line,col,err){
    // v11.9.112: SELF-HEAL. Um SyntaxError no boot = bundle corrompido (quase sempre
    // um cache ruim de deploy antigo). Em vez de mostrar tela morta, limpa TODOS os
    // caches + desregistra o service worker + recarrega — UMA vez por sessão (flag em
    // sessionStorage evita loop infinito caso a versão no servidor esteja mesmo quebrada).
    try{
      if(/SyntaxError|Unexpected (identifier|token|string|number|end)/i.test(String(msg||'')) && !sessionStorage.getItem('lp_selfheal')){
        sessionStorage.setItem('lp_selfheal','1');
        var reload=function(){try{location.reload()}catch(_){}};
        var jobs=[];
        if(window.caches&&caches.keys){jobs.push(caches.keys().then(function(ks){return Promise.all(ks.map(function(k){return caches.delete(k)}))}).catch(function(){}));}
        if(navigator.serviceWorker&&navigator.serviceWorker.getRegistrations){jobs.push(navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.map(function(r){return r.unregister()}))}).catch(function(){}));}
        Promise.all(jobs).then(reload);
        setTimeout(reload,2500);
        var h=document.createElement('div');h.style.cssText='position:fixed;inset:0;z-index:99999;background:#070b1e;color:#8b90b8;display:flex;align-items:center;justify-content:center;font-family:monospace;font-size:13px;text-align:center;padding:24px';h.textContent='Atualizando Louise Pro…';document.body.appendChild(h);
        return false;
      }
    }catch(_){}
    var d=document.getElementById('error-display');
    if(!d){d=document.createElement('div');d.id='error-display';d.style.cssText='position:fixed;inset:0;z-index:9999;background:#0a0e28;color:#f87171;padding:40px 20px;font-family:monospace;font-size:13px;overflow:auto;white-space:pre-wrap';document.body.appendChild(d);d.innerHTML='<div style="font-size:20px;font-weight:bold;color:#fbbf24;margin-bottom:16px">⚠ Louise Pro — Error</div>';}
    d.innerHTML+='<div style="margin-bottom:12px;padding:12px;background:rgba(248,113,113,0.1);border-radius:8px;border-left:3px solid #f87171"><b>'+msg+'</b>\nLine: '+line+' Col: '+col+'\n'+(err&&err.stack?err.stack:'')+'</div>';
    return false;
  };
  window.addEventListener('unhandledrejection',function(e){
    window.onerror('Promise: '+(e.reason&&e.reason.message||e.reason),null,0,0,e.reason);
  });
  // Toggle body.app-hidden whenever the PWA visibility changes. Paired with
  // the CSS rule in <style>, this freezes all animations while the app is
  // backgrounded — useful on iOS PWA where background throttling is weak.
  document.addEventListener('visibilitychange',function(){
    if(document.body){document.body.classList.toggle('app-hidden',document.hidden);}
  });
  // v11.9.7: tom noturno automatico. Aplica body.is-night entre 22h e 06h.
  // Re-checa cada 5min. Transition CSS de 1.2s torna a mudanca quase imperceptivel.
  function _updateNightClass(){
    if(!document.body)return;
    var h=new Date().getHours();
    var night=h>=22||h<6;
    document.body.classList.toggle('is-night',night);
  }
  _updateNightClass();
  setInterval(_updateNightClass,5*60*1000);
  // v11.9.30+v11.9.31: trava orientacao em portrait. Manifest ja tem "portrait-primary"
  // (PWA standalone respeita). iOS PWA Safari 16.4+ suporta lock(); versoes antigas e
  // browser tab fallam silently — overlay CSS abaixo cobre. Re-tenta em orientationchange
  // pra pegar momentos onde iOS solta o lock.
  function _tryLockPortrait(){
    try{
      if(screen&&screen.orientation&&screen.orientation.lock){
        screen.orientation.lock('portrait').catch(function(){});
      }
    }catch(_){}
  }
  _tryLockPortrait();

  // isso forca a volta pro portrait quase imediato. Em browser tab, no-op silencioso.
  try{

  }catch(_){}
  // Auto-reload when a newly installed Service Worker takes control.
  // Without this, after a deploy the old SW keeps serving the stale
  // HTML until the user manually refreshes. The `controllerchange`
  // event fires exactly once per SW takeover — we guard against reload
  // loops with a session flag.
  if('serviceWorker' in navigator){
    var _swReloading=false;
    navigator.serviceWorker.addEventListener('controllerchange',function(){
      if(_swReloading)return;
      _swReloading=true;

      try{
        var b=document.createElement('div');

        b.innerHTML='<span style="display:inline-block;width:16px;height:16px;border:2px solid rgba(5,8,32,0.3);border-top-color:#050820;border-radius:50%;animation:swSpin .8s linear infinite"></span><span>Atualizando Louise Pro\u2026</span>';
        var st=document.createElement('style');
        st.textContent='@keyframes swBannerIn{0%{opacity:0;transform:translateY(-10px)}100%{opacity:1;transform:translateY(0)}}@keyframes swSpin{to{transform:rotate(360deg)}}';
        document.head.appendChild(st);
        document.body.appendChild(b);
      }catch(e){}
      setTimeout(function(){window.location.reload()},800);
    });
  }
  </script>

<script>
// Intercept Babel errors (Babel logs to console.error, not window.onerror)
var _origErr=console.error;
console.error=function(){
  _origErr.apply(console,arguments);
  var msg=Array.from(arguments).join(' ');

    d.innerHTML='<div style="font-size:18px;font-weight:bold;color:#fbbf24;margin-bottom:16px">⚠ Babel Error</div><div style="color:#f87171;padding:12px;background:rgba(248,113,113,0.1);border-radius:8px">'+msg.substring(0,2000)+'</div>';
    d.style.color='#f87171';
  }
};
dbg('Initializing Firebase...');
// Verify Firebase loaded
if (typeof firebase === 'undefined') {
  dbg('ERROR: Firebase not loaded - no internet?');
  throw new Error('Firebase not loaded');
}

// ── FIREBASE INIT ──
try {
firebase.initializeApp({
  apiKey: "AIzaSyBPiWTlC0ZKLEX5Z8PqKM2c3zaXN8p7DH8",
  authDomain: "louise-pro.firebaseapp.com",
  databaseURL: "https://louise-pro-default-rtdb.firebaseio.com",
  projectId: "louise-pro",
  storageBucket: "louise-pro.firebasestorage.app",
  messagingSenderId: "670065554630",
  appId: "1:670065554630:web:e8bdf489a3db28b8fe53c7"
});
const db = firebase.firestore();

// OFFLINE PERSISTENCE (v10.5.2): cacheia entries/config no IndexedDB.
// Impacto no cold start iPhone PWA: antes de receber do servidor (200-800ms), o app
// já renderiza com o último snapshot em cache. Sensação de "abriu instantâneo".
// synchronizeTabs: multi-aba ou PWA + Safari abertos não brigam pelo lock.
// Catch silencioso: em browsers sem suporte (raríssimo), segue sem persistência.
db.enablePersistence({synchronizeTabs: true}).catch(()=>{});

// Firebase functions (global, accessed by React code)
window.FB = {
  // v11.9.0: window de N dias (default 90). Antes lia TODA a colleção no cold start —
  // ~1650 reads hoje, escalando pra 22k/ano. 90d janela cobre engine (7d), stats curtos
  // (4-30d) e history visivível. Janela 90d é fixa; pra ver >90d, re-adicionar lazy load.
  subEntries(cb, daysBack=90) {
    let query = db.collection('entries').orderBy('date','desc');
    if (daysBack && daysBack > 0) {
      // Cutoff date local (YYYY-MM-DD). Calculado uma vez no setup; entries de "hoje"
      // continuam aparecendo pq today >= cutoff (se app fica aberto cross-midnight,
      // novos entries chegam normal; cutoff fica estático mas isso é ok pra 90d).
      const d = new Date();
      d.setDate(d.getDate() - daysBack);
      const cutoff = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
      query = query.where('date','>=',cutoff);
    }
    return query.onSnapshot(snap => {
      const data = snap.docs.map(d => ({...d.data(), _docId: d.id}));
      data.sort((a,b) => (`${b.date}T${b.time}`).localeCompare(`${a.date}T${a.time}`));
      cb(data);
    });
  },
  // v11.9.34: loadOlderEntries removido — dead code (auditoria DB v11.9.25). Era idea
  // legítima pra Stats/History antigos, nunca foi conectado na UI. Se um dia precisar,
  // re-adicionar é trivial. Por hora, app mais enxuto.
  async addEntry(e) {
    // Remove undefined values (Firestore rejects them)
    const clean = Object.fromEntries(Object.entries(e).filter(([_,v]) => v !== undefined));
    await db.collection('entries').doc(e.id).set(clean); 
  },
  async delEntry(id) { await db.collection('entries').doc(id).delete(); },
  subProfile(cb) { return db.collection('config').doc('profile').onSnapshot(s => cb(s.exists ? s.data() : null)); },
  // MERGE: campos não incluídos em `p` ficam preservados. Blinda contra callers que passam
  // payload parcial (ex: side-paths que só atualizam lastSeenVersion) ou state stale de
  // outra aba/dispositivo. SEM merge qualquer save parcial limpava name/photo/etc. v10.5.0.
  async saveProfile(p) { await db.collection('config').doc('profile').set(p, {merge:true}); },
  subMeds(cb) { return db.collection('config').doc('meds').onSnapshot(s => cb(s.exists ? s.data()?.list : null)); },
  async saveMeds(m) { await db.collection('config').doc('meds').set({list:m}); },
  subTimer(cb) { return db.collection('config').doc('active').onSnapshot(s => cb(s.exists ? s.data() : null)); },
  async saveTimer(t) { await db.collection('config').doc('active').set(t||{cleared:true}); },
  subInbox(cb) { return db.collection('config').doc('inbox').onSnapshot(s => cb(s.exists ? s.data() : null)); },
  // MERGE defensivo: mesmo padrão do saveProfile — preserva campos não incluídos em `data`.
  async saveInbox(data) { await db.collection('config').doc('inbox').set(data, {merge:true}); },
  // Push notification token storage — each token is a separate doc in subcollection
  // Path: config/pushTokens/tokens/{tokenId}
  // Worker reads from this path to fan out push notifications.
  async savePushToken(token, lang) {
    if (!token) return;
    // Use a hash of the token as document ID to keep paths short and dedupe across devices
    const docId = btoa(token).replace(/[+/=]/g, '').slice(0, 40);
    await db.collection('config').doc('pushTokens').collection('tokens').doc(docId).set({
      token: token,
      lang: lang || 'en',
      updatedAt: new Date().toISOString()
    });
    // v11.9.25: GC tokens orfaos (>180d sem refresh). FCM rotaciona tokens em ~270d, e
    // re-instalacao do app ou troca de browser geram novos. Sem GC a sub-collection cresce
    // indefinidamente e o backend manda push pra tokens mortos. Fire-and-forget.
    try {
      const cutoff = new Date(Date.now() - 180*86400000).toISOString();
      const oldDocs = await db.collection('config').doc('pushTokens').collection('tokens')
        .where('updatedAt', '<', cutoff).get();
      for (const d of oldDocs.docs) {
        if (d.id !== docId) await d.ref.delete();
      }
    } catch(_) { /* best-effort, sem retry */ }
  },
  // Reminders: medication reminders that fire push notifications at scheduled times.
  // Path: config/reminders/items/{reminderId}
  // Worker checks this collection every minute and fires FCM if horario matches.
  subReminders(cb) {
    return db.collection('config').doc('reminders').collection('items').onSnapshot(snap => {
      const list = snap.docs.map(d => ({...d.data(), _id: d.id}));
      cb(list);
    });
  },
  async addReminder(reminder) {
    const id = reminder._id || ('rem_' + Date.now() + '_' + Math.random().toString(36).slice(2,7));
    const clean = {...reminder};
    delete clean._id;
    await db.collection('config').doc('reminders').collection('items').doc(id).set(clean);
    return id;
  },
  async delReminder(id) {
    await db.collection('config').doc('reminders').collection('items').doc(id).delete();
  },
  // ── BACKUP / RESTORE (v11.2) ──
  // Exporta TODO o state da Louise pro formato JSON que pode ser salvo em disco / iCloud /
  // Dropbox / etc. Importa restaura. Nossa rede de seguranca caso o Firestore tenha quota
  // issue, conta suspensa, ou alguem deletar por acidente.
  async exportAll() {
    // v11.9.25: tenta cache primeiro (Firestore offline persistence ja tem snapshot).
    // Auto-backup diario antes lia do server toda manha (~1650 reads). Cache zera o custo
    // quando ja existe (caso comum). Fallback pro server se cache vazio (raro - primeira
    // execução pos-install ou apos cache clear).
    const tryGet = async (ref) => {
      try { const s = await ref.get({ source: 'cache' }); if (s && (s.exists || (s.docs && s.docs.length))) return s; } catch(_){}
      return await ref.get();
    };
    const entriesSnap = await tryGet(db.collection('entries'));
    const entries = entriesSnap.docs.map(d => ({...d.data(), _docId: d.id}));
    const profileSnap = await tryGet(db.collection('config').doc('profile'));
    const profile = profileSnap.exists ? profileSnap.data() : null;
    const medsSnap = await tryGet(db.collection('config').doc('meds'));
    const meds = medsSnap.exists ? (medsSnap.data().list || []) : [];
    const inboxSnap = await tryGet(db.collection('config').doc('inbox'));
    const inbox = inboxSnap.exists ? inboxSnap.data() : null;
    const remindersSnap = await tryGet(db.collection('config').doc('reminders').collection('items'));
    const reminders = remindersSnap.docs.map(d => ({...d.data(), _id: d.id}));
    return {
      _meta: { version: 1, exportedAt: new Date().toISOString(), app: 'louise-pro' },
      entries, profile, meds, inbox, reminders
    };
  },
  async importAll(data) {
    if (!data || !data._meta || data._meta.app !== 'louise-pro') throw new Error('Invalid backup file');
    // v11.9.26: WriteBatch — antes era loop com await por doc (1650 entries × ~50ms = ~80s
    // de roundtrips). Batches agrupam até 500 ops/round-trip — ~4 batches pra 1650 entries.
    // Restore vai de ~80s pra ~5s. Limite Firestore: 500 ops por commit.
    const BATCH_MAX = 500;
    const allOps = [];
    if (Array.isArray(data.entries)) {
      for (const e of data.entries) {
        const clean = { ...e }; delete clean._docId;
        const id = e.id || e._docId;
        if (!id) continue;
        allOps.push({ ref: db.collection('entries').doc(id), data: clean, opts: null });
      }
    }
    if (data.profile) {
      allOps.push({ ref: db.collection('config').doc('profile'), data: data.profile, opts: { merge: false } });
    }
    if (Array.isArray(data.meds)) {
      allOps.push({ ref: db.collection('config').doc('meds'), data: { list: data.meds }, opts: null });
    }
    if (data.inbox) {
      allOps.push({ ref: db.collection('config').doc('inbox'), data: data.inbox, opts: { merge: false } });
    }
    if (Array.isArray(data.reminders)) {
      for (const r of data.reminders) {
        const clean = { ...r }; delete clean._id;
        if (!r._id) continue;
        allOps.push({ ref: db.collection('config').doc('reminders').collection('items').doc(r._id), data: clean, opts: null });
      }
    }
    // Chunk + commit
    for (let i = 0; i < allOps.length; i += BATCH_MAX) {
      const chunk = allOps.slice(i, i + BATCH_MAX);
      const batch = db.batch();
      for (const op of chunk) {
        if (op.opts) batch.set(op.ref, op.data, op.opts);
        else batch.set(op.ref, op.data);
      }
      await batch.commit();
    }
  },
  // Backup em Firestore (v11.4): salva snapshot num doc \u00fanico `config/backups/latest` que \u00e9
  // sobrescrito a cada backup. Compartilhado entre os 2 devices. Tamanho m\u00e1ximo do doc
  // Firestore \u00e9 1 MiB — enquanto os entries n\u00e3o passarem de ~4000 registros, cabe.
  async saveBackup(data) {
    const payload = JSON.stringify(data);
    const size = payload.length;
    if (size > 900000) throw new Error('Backup muito grande para salvar no Firestore (' + Math.round(size/1024) + 'KB). Use "Baixar c\u00f3pia local".');
    const updatedAt = new Date().toISOString();
    // v11.9.0: doc principal carrega o snapshot inteiro (~900KB). Doc separado `backupMeta`
    // tem s\u00f3 {updatedAt, size}, leitura cheap pra mostrar status no Profile sem baixar 900KB.
    await db.collection('config').doc('backups').set({ snapshot: data, updatedAt, size });
    await db.collection('config').doc('backupMeta').set({ updatedAt, size });
    return { size };
  },
  // Metadata-only \u2014 pra mostrar "\u00faltima backup: X horas atr\u00e1s" sem baixar o snapshot inteiro.
  // Caso o doc backupMeta n\u00e3o exista (backup antigo pr\u00e9-v11.9.0), faz fallback pro doc full
  // mas s\u00f3 na primeira vez \u2014 ap\u00f3s o pr\u00f3ximo saveBackup, backupMeta passa a existir.
  async loadBackupMeta() {
    const meta = await db.collection('config').doc('backupMeta').get();
    if (meta.exists) return meta.data();
    // Fallback: backup antigo s\u00f3 tem o doc full. L\u00ea s\u00f3 pra extrair metadata.
    const full = await db.collection('config').doc('backups').get();
    if (!full.exists) return null;
    const d = full.data();
    return { updatedAt: d.updatedAt, size: d.size };
  },
  // Snapshot completo \u2014 s\u00f3 usado ao restaurar.
  async loadBackup() {
    const snap = await db.collection('config').doc('backups').get();
    if (!snap.exists) return null;
    const d = snap.data();
    return { data: d.snapshot, updatedAt: d.updatedAt, size: d.size };
  },
};
dbg('Firebase ready');
} catch(e) { dbg('Firebase Error: '+e.message); throw e; }
