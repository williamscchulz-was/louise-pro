<script>
// Intercept Babel errors (Babel logs to console.error, not window.onerror)
var _origErr=console.error;
console.error=function(){
  _origErr.apply(console,arguments);
  var msg=Array.from(arguments).join(' ');
  if(msg.includes('SyntaxError')||msg.includes('Unexpected')||msg.includes('babel')){
    var d=document.getElementById('load-debug')||document.getElementById('error-display');
    if(!d){d=document.createElement('div');d.id='error-display';d.style.cssText='position:fixed;inset:0;z-index:9999;background:#0a0e28;color:#f87171;padding:40px 20px;font-family:monospace;font-size:12px;overflow:auto;white-space:pre-wrap';document.body.appendChild(d)}

    d.style.color='#f87171';
  }
};
dbg('Initializing Firebase...');
// Verify Firebase loaded
if (typeof firebase === 'undefined') {
  dbg('ERROR: Firebase not loaded - no internet?');
  throw new Error('Firebase not loaded');
}

// ── FIREBASE INIT ──

  apiKey: "AIzaSyBPiWTlC0ZKLEX5Z8PqKM2c3zaXN8p7DH8",
  authDomain: "louise-pro.firebaseapp.com",
  databaseURL: "https://louise-pro-default-rtdb.firebaseio.com",
  projectId: "louise-pro",
  storageBucket: "louise-pro.firebasestorage.app",
  messagingSenderId: "670065554630",
  appId: "1:670065554630:web:e8bdf489a3db28b8fe53c7"
});
const db = firebase.firestore();

// Firebase functions (global, accessed by React code)
window.FB = {
  subEntries(cb) {
    return db.collection('entries').orderBy('date','desc').onSnapshot(snap => {
      const data = snap.docs.map(d => ({...d.data(), _docId: d.id}));
      data.sort((a,b) => (`${b.date}T${b.time}`).localeCompare(`${a.date}T${a.time}`));
      cb(data);
    });
  },
  async addEntry(e) { 
    // Remove undefined values (Firestore rejects them)
    const clean = Object.fromEntries(Object.entries(e).filter(([_,v]) => v !== undefined));
    await db.collection('entries').doc(e.id).set(clean); 
  },
  async delEntry(id) { await db.collection('entries').doc(id).delete(); },
  subProfile(cb) { return db.collection('config').doc('profile').onSnapshot(s => cb(s.exists ? s.data() : null)); },
  async saveProfile(p) { await db.collection('config').doc('profile').set(p); },
  subMeds(cb) { return db.collection('config').doc('meds').onSnapshot(s => cb(s.exists ? s.data()?.list : null)); },
  async saveMeds(m) { await db.collection('config').doc('meds').set({list:m}); },
  subTimer(cb) { return db.collection('config').doc('active').onSnapshot(s => cb(s.exists ? s.data() : null)); },
  async saveTimer(t) { await db.collection('config').doc('active').set(t||{cleared:true}); },
};
dbg('Firebase ready');
} catch(e) { dbg('Firebase Error: '+e.message); throw e; }
</script>

function interpolateLMS(table, ageMonths) {
  if (ageMonths <= table[0][0]) return { L: table[0][1], M: table[0][2], S: table[0][3] };
  if (ageMonths >= table[table.length-1][0]) { const l = table[table.length-1]; return { L: l[1], M: l[2], S: l[3] }; }
  for (let i = 0; i < table.length - 1; i++) {
    if (ageMonths >= table[i][0] && ageMonths <= table[i+1][0]) {
      const t = (ageMonths - table[i][0]) / (table[i+1][0] - table[i][0]);
      return { L: table[i][1]+(table[i+1][1]-table[i][1])*t, M: table[i][2]+(table[i+1][2]-table[i][2])*t, S: table[i][3]+(table[i+1][3]-table[i][3])*t };
    }
  }
  const l = table[table.length-1]; return { L: l[1], M: l[2], S: l[3] };
}

function calcZScore(value, lms) {
  if (!value || !lms) return null;
  const { L, M, S } = lms;
  if (Math.abs(L) < 0.001) return Math.log(value / M) / S;
  return (Math.pow(value / M, L) - 1) / (L * S);
}

function zToPercentile(z) {
  if (z === null) return null;
  // Approximation of standard normal CDF
  return Math.round(100 / (1 + Math.exp(-1.7155277 * z - 0.2716 * z * z * z)));
}

function getPercentile(value, table, ageMonths) {
  const lms = interpolateLMS(table, ageMonths);
  const z = calcZScore(value, lms);
  return { z, percentile: zToPercentile(z), median: lms.M };
}

// Split sleep entry that crosses midnight into two entries
function splitMidnight(entry){
  if(!entry.durationMin || (entry.type!=="sleep"&&entry.type!=="nap")) return [entry];
  const [h,m]=(entry.time||"00:00").split(":").map(Number);
  const startMin=h*60+m;
  const endMin=startMin+entry.durationMin;
  if(endMin<=1440) return [entry]; // doesn't cross midnight
  const beforeMidnight=1440-startMin;
  const afterMidnight=entry.durationMin-beforeMidnight;
  const nextDay=dateOffset(entry.date,1);
  return[
    {...entry, durationMin:beforeMidnight, id:entry.id},
    {...entry, date:nextDay, time:"00:00", durationMin:afterMidnight, id:entry.id+"_b"},
  ];
}

function Ring({activeTimer,napSug,tick,recentEvents,lang,showOrbit}){
  const[tip,setTip]=useState(null);
  useEffect(()=>{if(tip!==null){const t=setTimeout(()=>setTip(null),3000);return()=>clearTimeout(t)}},[tip]);
  const sz=340,cx=sz/2,cy=sz/2,R=148;
  const gapDeg=55,startAng=90+gapDeg/2,totalArc=360-gapDeg;
  const dotSz=46,sleepSz=44;
  let lbl="",sub="",col1=T.dim,col2=T.dim,isBedtime=false;
  if(activeTimer){
    const el=Math.max(0,Math.floor((Date.now()-new Date(activeTimer.startTime).getTime())/1000));const mins=Math.floor(el/60);
    lbl=mins<60?`${mins} min`:`${Math.floor(mins/60)}h ${String(mins%60).padStart(2,"0")}m`;
    if(activeTimer.type==="nursing"){sub=lang==="en"?"Nursing":"Amamentando";col1="#2563eb";col2="#60a5fa"}
    else if(activeTimer.type==="nap"){sub=lang==="en"?"Napping":"Soneca";col1="#7c3aed";col2="#c084fc"}
    else{sub=lang==="en"?"Bedtime":"Boa noite";col1="#7c3aed";col2="#c084fc";isBedtime=true}
  } else if(napSug){
    lbl=fmtDur(napSug.el);sub=lang==="en"?"Awake for":"Acordado(a)";
    if(napSug.over){col1="#ea580c";col2="#fb923c"}else if(napSug.wind){col1="#d97706";col2="#fbbf24"}else{col1="#059669";col2="#34d399"}
  } else{sub="";lbl="\u2014"}
  const hasProgress=col1!==T.dim;
  const toMin=t=>{const[h,m]=(t||"12:00").split(":").map(Number);return h*60+m};
  const evs=(recentEvents||[]);
  // Day window: from wake-up to midnight
  let wakeMin=6*60;let hasWakeup=false;
  const wakeEv=evs.find(e=>e.type==="wakeup");
  if(wakeEv){wakeMin=toMin(wakeEv.time);hasWakeup=true}
  else{const ls=evs.filter(e=>(e.type==="sleep"||e.type==="nap")&&e.durationMin>0).sort((a,b)=>(b.date+"T"+b.time).localeCompare(a.date+"T"+a.time))[0];if(ls){const em=toMin(ls.time)+ls.durationMin;if(em>=5*60&&em<=12*60){wakeMin=em;hasWakeup=true}}
  else{const firstEv=[...evs].sort((a,b)=>a.time.localeCompare(b.time))[0];if(firstEv)wakeMin=Math.max(0,toMin(firstEv.time)-15)}}
  const dayStart=wakeMin;
  let dayEnd=24*60;
  let bedMin=null;
  const bedEv=[...evs].filter(e=>e.type==="sleep").sort((a,b)=>`${a.date}T${a.time}`.localeCompare(`${b.date}T${b.time}`))[0];
  if(bedEv){let bm=toMin(bedEv.time);if(bm<dayStart)bm+=1440;bedMin=bm;if(bm>dayStart)dayEnd=bm}
  if(!bedMin&&activeTimer&&activeTimer.type==="sleep"){const st=new Date(activeTimer.startTime);const bm=st.getHours()*60+st.getMinutes();const adjBm=bm<dayStart?bm+1440:bm;bedMin=adjBm;if(adjBm>dayStart)dayEnd=adjBm}
  const daySpan=Math.max(1,dayEnd-dayStart);
  const toAng=mins=>{const t=Math.max(0,Math.min(1,(mins-dayStart)/daySpan));return startAng+t*totalArc};
  const descArc=(sA,eA)=>{const s=sA*Math.PI/180,e=eA*Math.PI/180;return`M ${cx+R*Math.cos(s)} ${cy+R*Math.sin(s)} A ${R} ${R} 0 ${eA-sA>180?1:0} 1 ${cx+R*Math.cos(e)} ${cy+R*Math.sin(e)}`};
  const sleepEvs=evs.filter(e=>e.type==="nap"&&e.durationMin>0);
  const dotEvs=evs.filter(e=>e.type==="bottle"||e.type==="nursing"||e.type==="diaper"||e.type==="medicine");
  const sleepArcs=sleepEvs.map(ev=>{
    const mins=toMin(ev.time),dur=ev.durationMin;
    if(mins+dur<dayStart||mins>dayStart+daySpan)return null;
    const a1=toAng(Math.max(mins,dayStart)),a2=toAng(Math.min(mins+dur,dayStart+daySpan));
    const midAng=(a1+a2)/2;const midRad=midAng*Math.PI/180;
    return{ev,path:descArc(a1,a2),mx:cx+R*Math.cos(midRad),my:cy+R*Math.sin(midRad),col:TYPES[ev.type]?.color||T.purple};
  }).filter(Boolean);
  const MIN_GAP=22;
  const rawDots=dotEvs.map(ev=>{
    const cfg=TYPES[ev.type];if(!cfg)return null;
    const mins=toMin(ev.time);
    if(mins<dayStart||mins>dayStart+daySpan)return null;
    const angDeg=toAng(mins);const angRad=angDeg*Math.PI/180;
    return{ev,cfg,angDeg,x:cx+R*Math.cos(angRad),y:cy+R*Math.sin(angRad)};
  }).filter(Boolean);
  const groups=[];
  rawDots.forEach(d=>{const g=groups.find(gr=>Math.abs(gr[0].angDeg-d.angDeg)<MIN_GAP);if(g)g.push(d);else groups.push([d])});
  const dots=groups.map(gr=>({primary:gr[0],items:gr}));
  // Determine last event globally: dot vs sleep arc (compare end times)
  const _lastEv=(()=>{let maxT="",type="none",dIdx=-1,sIdx=-1;dots.forEach((gr,idx)=>{gr.items.forEach(it=>{const t=`${it.ev.date}T${it.ev.time}`;if(t>maxT){maxT=t;type="dot";dIdx=idx}})});sleepArcs.forEach((sa,idx)=>{const endMs=new Date(`${sa.ev.date}T${sa.ev.time}`).getTime()+sa.ev.durationMin*60000;const d=new Date(endMs);const t=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")+"T"+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");if(t>maxT){maxT=t;type="sleep";sIdx=idx}});return{type,dIdx,sIdx}})();
  const lastDotIdx=_lastEv.type==="dot"?_lastEv.dIdx:-1;
  const lastSleepArcIdx=_lastEv.type==="sleep"?_lastEv.sIdx:-1;
  const totalSleepMin=evs.filter(e=>(e.type==="sleep"||e.type==="nap")&&e.durationMin).reduce((s,e)=>s+e.durationMin,0);

  // Anchor: sun at wake-up (ring start), moon at bedtime (ring end)
  const wakeTimeStr=`${String(Math.floor(wakeMin/60)).padStart(2,"0")}:${String(wakeMin%60).padStart(2,"0")}`;
  const sunAng=toAng(wakeMin);const sunRad=sunAng*Math.PI/180;
  const anchorSun=hasWakeup?{x:cx+R*Math.cos(sunRad),y:cy+R*Math.sin(sunRad),time:wakeTimeStr}:null;
  let anchorMoon=null;
  if(bedMin){const dispMin=bedMin%1440;const bedTimeStr=`${String(Math.floor(dispMin/60)).padStart(2,"0")}:${String(dispMin%60).padStart(2,"0")}`;const moonAng=toAng(bedMin);const moonRad=moonAng*Math.PI/180;anchorMoon={x:cx+R*Math.cos(moonRad),y:cy+R*Math.sin(moonRad),time:bedTimeStr}}

  // Live timer arc (nap only, during daytime)
  let timerArc=null;
  if(activeTimer&&activeTimer.type==="nap"){
    const st=new Date(activeTimer.startTime);
    const startMins=st.getHours()*60+st.getMinutes();
    const now=new Date();
    const nowMins=now.getHours()*60+now.getMinutes();
    if(startMins>=dayStart){
      const a1=toAng(startMins),a2=toAng(Math.min(nowMins,dayStart+daySpan-1));
      if(a2>a1){const midAng=(a1+a2)/2;const midRad=midAng*Math.PI/180;const tipRad=a2*Math.PI/180;timerArc={path:descArc(a1,a2),col:T.purple,mx:cx+R*Math.cos(midRad),my:cy+R*Math.sin(midRad),tipX:cx+R*Math.cos(tipRad),tipY:cy+R*Math.sin(tipRad)}}
    }
  }

  return(<div style={{position:"relative",width:sz,margin:"0 auto"}}>
    <div style={{position:"relative",width:sz,height:sz}}>
      <svg width={sz} height={sz} style={{overflow:"visible"}}>
        <defs><filter id="slpG"><feGaussianBlur stdDeviation="8" result="b"/><feFlood floodColor={T.purple} floodOpacity="0.35" result="c"/><feComposite in="c" in2="b" operator="in" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
        <path d={descArc(startAng,startAng+totalArc)} fill="none" stroke="rgba(40,55,120,0.18)" strokeWidth={20} strokeLinecap="round"/>
        {/* Sleep pills */}
        {sleepArcs.map((sa,i)=><path key={"sg"+i} d={sa.path} fill="none" stroke={sa.col} strokeWidth={36} strokeLinecap="round" opacity={0.08} filter="url(#slpG)"/>)}
        {sleepArcs.map((sa,i)=><path key={"sb"+i} d={sa.path} fill="none" stroke={sa.col} strokeWidth={30} strokeLinecap="round" opacity={0.4}/>)}

function CuriosityCard({age,lang,tick}){
  const[vis,setVis]=useState(false);const[fading,setFading]=useState(false);const shownRef=useRef(null);
  useEffect(()=>{
    if(!age)return;
    const h=new Date().getHours();
    if(h<9||h>=10){setVis(false);return}
    const key=`${age.totalDays}-${h}`;
    if(shownRef.current===key)return;
    shownRef.current=key;setVis(true);setFading(false);
  },[age,tick]);
  useEffect(()=>{
    if(!vis)return;
    const t1=setTimeout(()=>setFading(true),13500);
    const t2=setTimeout(()=>setVis(false),15000);
    return()=>{clearTimeout(t1);clearTimeout(t2)};
  },[vis]);
  if(!vis||!age)return null;
  const dayNum=age.totalDays;const monthNum=age.totalMonths;
  const colors=["#fbbf24","#34d399","#38bdf8","#a78bfa","#f472b6","#fb923c"];
  let txt=null,col=colors[0],tagLabel="",daysLeft=null;
  if(dayNum>=1&&dayNum<=30){
    const c=CURIOSITIES[dayNum-1];if(!c)return null;
    txt=lang==="en"?c.en:c.pt;col=colors[(dayNum-1)%colors.length];
    tagLabel=lang==="en"?`Day ${dayNum}`:`Dia ${dayNum}`;daysLeft=30-dayNum;
  }else if(monthNum>=2&&monthNum<=12){
    const ms=MILESTONES.find(m=>m.m===monthNum);if(!ms)return null;
    txt=lang==="en"?ms.en:ms.pt;col=colors[(monthNum-1)%colors.length];
    tagLabel=lang==="en"?`${monthNum} months`:`${monthNum} meses`;
  }
  if(!txt)return null;
  return(<div style={{margin:"0 16px 12px",padding:"12px 14px",borderRadius:14,background:`linear-gradient(135deg,${col}08,${col}04)`,border:`1px solid ${col}15`,position:"relative",overflow:"hidden",animation:fading?"curiosityOut .5s ease forwards":"curiosityIn .5s ease"}}>
    <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:8}}>
      <svg width="14" height="14" viewBox="0 0 24 24" fill={`${col}40`} stroke={col} strokeWidth="1.5"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="1" y1="12" x2="3" y2="12"/></svg>
      <span style={{fontSize:9,fontWeight:700,letterSpacing:1,textTransform:"uppercase",color:col}}>{tagLabel}</span>
      {daysLeft!==null&&<span style={{fontSize:8,color:T.dim,marginLeft:"auto"}}>{lang==="en"?`${daysLeft} days left`:`${daysLeft} dias restantes`}</span>}
    </div>
    <div style={{fontSize:13,fontWeight:700,marginBottom:3,lineHeight:1.3}}>{txt.t}</div>
    <div style={{fontSize:11,color:T.sub,lineHeight:1.5}}>{txt.b}</div>
  </div>);

function EntryRow({entry,onDelete,onEdit,napNum}){const[swipe,setSwipe]=useState(0);const[swiping,setSwiping]=useState(false);const startX=useRef(0);const cfg=TYPES[entry.type]||{label:entry.type,icon:"star",color:T.text,bg:T.glass};let detail="";if(entry.ml)detail=`${entry.ml} ml`;else if(entry.durationMin)detail=fmtDur(entry.durationMin);else if(entry.subtype)detail=L(entry.subtype)||entry.subtype;else if(entry.name)detail=entry.name+(entry.dose?` · ${entry.dose}`:"");else if(entry.value)detail=`${entry.value}°C`;else if(entry.weightKg||entry.lengthCm||entry.headCm){const parts=[];if(entry.weightKg)parts.push(`${entry.weightKg}kg`);if(entry.lengthCm)parts.push(`${entry.lengthCm}cm`);if(entry.headCm)parts.push(`${_lang==="en"?"Head":"Cab."} ${entry.headCm}cm`);detail=parts.join(" · ")}if(entry.type==="nursing"&&entry.side){if(entry.leftMin||entry.rightMin){detail=(detail?detail+" · ":"")+"L:"+String(entry.leftMin||0)+"m R:"+String(entry.rightMin||0)+"m"}else{detail=(detail?detail+" · ":"")+(L(entry.side)||entry.side)}};const napLabel=napNum?(_lang==="en"?["","1st","2nd","3rd","4th","5th","6th","7th","8th"][napNum]||napNum+"th":[""," 1a"," 2a"," 3a"," 4a"," 5a"," 6a"," 7a"," 8a"][napNum]||napNum+"a"):null;

  <div style={{textAlign:"right",flexShrink:0}}>{(entry.type==="sleep"||entry.type==="nap")&&entry.durationMin?(()=>{const endMs=new Date(`${entry.date}T${entry.time}`).getTime()+entry.durationMin*60000;const endD=new Date(endMs);const endT=`${String(endD.getHours()).padStart(2,"0")}:${String(endD.getMinutes()).padStart(2,"0")}`;const endDt=`${endD.getFullYear()}-${String(endD.getMonth()+1).padStart(2,"0")}-${String(endD.getDate()).padStart(2,"0")}`;return<><div style={{fontSize:13,fontWeight:600}}>{entry.time}–{endT}</div><div style={{fontSize:11,color:T.sub,fontWeight:500}}>{timeSince(endDt,endT)}</div></>})():<><div style={{fontSize:13,fontWeight:600}}>{entry.time}</div><div style={{fontSize:11,color:T.sub,fontWeight:500}}>{timeSince(entry.date,entry.time)}</div></>}</div>
</div></div>)}

  };

        <button onClick={()=>setDateIdx(Math.max(0,dateIdx-1))} disabled={isToday} style={{width:32,height:32,borderRadius:10,background:"rgba(22,28,60,0.8)",border:`1px solid ${T.gB}`,display:"flex",alignItems:"center",justifyContent:"center",opacity:isToday?0.3:1}}><Icon name="forward" size={14} color={T.sub}/></button>
      </div>
    </div>
    {/* Type filters */}
    <div style={{display:"flex",gap:4,marginBottom:14,overflowX:"auto",paddingBottom:2}}>

    </div>
    {/* Mini day timeline */}
    {(()=>{
      const sleeps=dayE.filter(e=>(e.type==="nap"||e.type==="sleep")&&e.durationMin>0).sort((a,b)=>a.time.localeCompare(b.time));
      if(sleeps.length===0)return null;
      const wk=dayE.find(e=>e.type==="wakeup");
      const dayS=wk?toMinutes(wk.time):sleeps.length>0?Math.max(0,toMinutes(sleeps[0].time)-30):6*60;
      const bed=dayE.find(e=>e.type==="sleep");
      const dayEn=bed?toMinutes(bed.time)+(bed.durationMin||0):24*60;
      const span=Math.max(1,dayEn-dayS);
      const segs=[];let cur=dayS;
      sleeps.forEach(s=>{const sMin=toMinutes(s.time);if(sMin>cur)segs.push({t:"awake",s:cur,e:sMin});segs.push({t:s.type==="sleep"?"bed":"nap",s:sMin,e:sMin+s.durationMin});cur=sMin+s.durationMin});
      if(cur<dayEn)segs.push({t:bed?"bed":"awake",s:cur,e:dayEn});
      if(segs.length<2)return null;
      const hrs=[dayS,dayS+Math.floor(span/3),dayS+Math.floor(span*2/3),dayEn];

          {segs.map((s,i)=>{const w=Math.max(0.5,((s.e-s.s)/span)*100);const col=s.t==="awake"?"rgba(52,211,153,0.15)":s.t==="nap"?"rgba(167,139,250,0.3)":"rgba(139,124,246,0.4)";return<div key={i} style={{flex:`${w} 0 0%`,height:"100%",background:col,borderRadius:i===0?"4px 0 0 4px":i===segs.length-1?"0 4px 4px 0":"0"}}/>})}
        </div>
        <div style={{display:"flex",justifyContent:"space-between",marginTop:3,fontSize:8,color:T.dim}}>
          {hrs.map((h,i)=><span key={i}>{String(Math.floor((h%1440)/60)).padStart(2,"0")}:{String(Math.floor(h%60)).padStart(2,"0")}</span>)}
        </div>
      </div>
    })()}
    {filtered.length===0&&<p style={{color:T.dim,textAlign:"center",padding:40,fontSize:13}}>{L("noEntries")}{filter!=="all"?(_lang==="en"?" of this type":" desse tipo"):""}</p>}
    {filtered.map(e=><EntryRow key={e.id} entry={e} onDelete={onDelete} onEdit={onEdit}/>)}
  </div>);
}

// ── GROWTH PAGE with WHO percentiles ──
function GrowthPage({entries,birthDate,profile,onBack,onAddEntry}){
  const growthEntries=entries.filter(e=>e.type==="growth").sort((a,b)=>`${a.date}T${a.time}`.localeCompare(`${b.date}T${b.time}`));
  const age=calcAge(birthDate);
  const ageMonths=age?(age.months+(age.days/30)):0;
  const[showForm,setShowForm]=useState(false);
  const[wK,setWK]=useState("");const[lC,setLC]=useState("");const[hC,setHC]=useState("");

  // Build all data points: birth + entries
  const allPoints=[];
  if(profile.birthWeight||profile.birthLength||profile.birthHead){
    allPoints.push({ageM:0,date:birthDate,weightKg:profile.birthWeight,lengthCm:profile.birthLength,headCm:profile.birthHead,label:_lang==="en"?"Birth":"Nasc."});
  }
  growthEntries.forEach(e=>{
    const eAge=calcAge(birthDate);
    if(!eAge)return;
    const d1=new Date(birthDate),d2=new Date(e.date);
    const mths=(d2.getFullYear()-d1.getFullYear())*12+d2.getMonth()-d1.getMonth()+(d2.getDate()-d1.getDate())/30;
    allPoints.push({ageM:Math.max(0,mths),date:e.date,weightKg:e.weightKg,lengthCm:e.lengthCm,headCm:e.headCm,label:new Date(e.date+"T12:00").toLocaleDateString(_lang==="pt"?"pt-BR":"en-US",{day:"numeric",month:"short"})});
  });
  const latest=allPoints[allPoints.length-1];

  const doAdd=()=>{
    if(!wK&&!lC&&!hC)return;
    onAddEntry({type:"growth",date:todayStr(),time:nowTime(),id:uid(),weightKg:wK?parseFloat(wK):undefined,lengthCm:lC?parseFloat(lC):undefined,headCm:hC?parseFloat(hC):undefined});
    setWK("");setLC("");setHC("");setShowForm(false);
  };

  const quickAdd=(field,value)=>{
    const entry={type:"growth",date:todayStr(),time:nowTime(),id:uid()};
    entry[field]=value;
    onAddEntry(entry);
  };

  // Mini chart for a metric
  function GrowthChart({label,field,table,color}){
    const pts=allPoints.filter(p=>p[field]);
    if(pts.length<1)return null;
    // WHO P3, P50, P97 curves
    const maxAge=Math.max(ageMonths+1,3);
    const whoSteps=[];for(let m=0;m<=maxAge;m+=maxAge/20){
      const lms=interpolateLMS(table,m);
      const z3=lms.M*Math.pow(1+lms.L*lms.S*(-1.88),1/lms.L);
      const z97=lms.M*Math.pow(1+lms.L*lms.S*1.88,1/lms.L);
      whoSteps.push({m,p3:Math.abs(lms.L)>0.001?z3:lms.M*Math.exp(-1.88*lms.S),p50:lms.M,p97:Math.abs(lms.L)>0.001?z97:lms.M*Math.exp(1.88*lms.S)});
    }
    const allVals=[...whoSteps.map(w=>w.p97),...whoSteps.map(w=>w.p3),...pts.map(p=>p[field])];
    const minV=Math.min(...allVals)*0.9,maxV=Math.max(...allVals)*1.05;
    const W=320,H=140;
    const x=m=>10+(m/maxAge)*(W-20);
    const y=v=>H-10-((v-minV)/(maxV-minV))*(H-20);
    const pathStr=(arr,key)=>arr.map((p,i)=>`${i===0?"M":"L"}${x(p.m).toFixed(1)},${y(p[key]).toFixed(1)}`).join(" ");
    return(<div style={{marginBottom:16}}>
      <div style={{fontSize:12,fontWeight:700,color,marginBottom:6}}>{label}</div>
      <svg width={W} height={H} viewBox={`0 0 ${W} ${H}`} style={{width:"100%",height:"auto",background:T.glass,borderRadius:12,border:`1px solid ${T.gB}`}}>

      </div>}
    </div>);
  }

  const inp={width:"100%",padding:"12px",background:"rgba(14,18,48,0.8)",border:`1px solid ${T.gB}`,borderRadius:10,color:T.text,fontSize:15,outline:"none",textAlign:"center"};

  return(<div style={{padding:"calc(16px + env(safe-area-inset-top)) 20px 0"}}>

      <button onClick={()=>setShowForm(!showForm)} style={{padding:"6px 12px",borderRadius:10,background:"rgba(163,230,53,0.1)",border:"1px solid rgba(163,230,53,0.2)",fontSize:12,fontWeight:700,color:"#a3e635"}}>{showForm?L("cancel"):(_lang==="en"?"+ Measure":"+ Medição")}</button>

      <div style={{fontSize:12,fontWeight:700,color:T.sub,marginBottom:12}}>{_lang==="en"?"New measurement":"Nova medição"}</div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:12}}>

        <Fld label={`${L("head")} (cm)`}><input type="number" inputMode="decimal" step="0.1" placeholder="37" value={hC} onChange={e=>setHC(e.target.value)} style={inp}/></Fld>
      </div>
      <button onClick={doAdd} style={{width:"100%",padding:12,borderRadius:10,background:"#a3e635",color:T.bg1,fontSize:14,fontWeight:700}}>{_lang==="en"?"Save measurement":L("save")+" medição"}</button>
    </div>}

    {/* Percentile cards */}
    {latest&&<div style={{fontSize:11,color:T.sub,marginBottom:10}}>
      {latest.label===(_lang==="en"?"Birth":"Nasc.")?(_lang==="en"?"Birth data":L("birthData")):`${_lang==="en"?"Last":"Últ."}: ${latest.label}`} · {ageMonths.toFixed(1)} {_lang==="en"?"mo":"meses"}

    <PercentileCard label={L("length")} value={latest?.lengthCm} unit="cm" table={WHO_GIRLS.length} icon="ruler" field="lengthCm" onQuickAdd={quickAdd}/>

    {/* Growth charts */}
    {allPoints.length>0&&<>

      <GrowthChart label={`${L("weight")} (kg)`} field="weightKg" table={WHO_GIRLS.weight} color={T.green}/>
      <GrowthChart label={`${L("length")} (cm)`} field="lengthCm" table={WHO_GIRLS.length} color={T.blue}/>
      <GrowthChart label={`${L("head")} (cm)`} field="headCm" table={WHO_GIRLS.head} color={T.amber}/>
    </>}

    {/* History table */}
    {allPoints.length>0&&<><div style={{fontSize:12,fontWeight:600,color:T.dim,marginTop:8,marginBottom:10,textTransform:"uppercase",letterSpacing:0.8}}>Histórico</div>

        <span style={{fontSize:11,color:T.sub,minWidth:50}}>{p.label}</span>
        <div style={{flex:1,display:"flex",gap:10,fontSize:12}}>
          {p.weightKg&&<span style={{color:T.green}}>{p.weightKg}kg</span>}
          {p.lengthCm&&<span style={{color:T.blue}}>{p.lengthCm}cm</span>}
          {p.headCm&&<span style={{color:T.amber}}>Cab. {p.headCm}</span>}
        </div>
      </div>)}
    </>}
    <div style={{marginTop:16,padding:12,background:T.glass,borderRadius:12,border:`1px solid ${T.gB}`,fontSize:10,color:T.dim,lineHeight:1.6}}>
      Curvas OMS para meninas 0-24m. Linha tracejada = P50 (mediana). Faixa = P3-P97.
    </div>
  </div>);
}

// ── MAIN APP ──
function App(){
  const[entries,setEntries]=useState([]);const[savedMeds,setSavedMeds]=useState([]);
  const[profile,setProfile]=useState({name:"",birthDate:"2026-03-08",photo:"",mlGoal:0});

  const[page,setPage]=useState("home");const[showAdd,setShowAdd]=useState(false);const[formType,setFormType]=useState(null);const[editEntry,setEditEntry]=useState(null);const[showOrbit,setShowOrbit]=useState(false);
  const[showProfile,setShowProfile]=useState(false);const[showSleepInfo,setShowSleepInfo]=useState(false);

    return()=>{u1();u2();u3();u4()};
  },[]);

  const showToast=(msg,fn)=>{undoRef.current=fn;setToast(msg)};
  const handleUndo=()=>{if(undoRef.current)undoRef.current();setToast(null)};
  const addEntry=useCallback(async e=>{
    if(navigator.vibrate)navigator.vibrate(8);
    const parts=splitMidnight(e);
    for(const p of parts) await FB.addEntry(p);
    setFormType(null);setShowAdd(false);setEditEntry(null);
    let tmsg=`${TL(e.type)||e.type} ${editEntry?L("updated"):L("registered")}`;
    if(!editEntry){
      const td=todayStr();const ta=entries.filter(x=>x.date===td);
      if(e.type==="bottle"){const ml2=ta.filter(x=>x.type==="bottle").reduce((s,x)=>s+(x.ml||0),0)+(e.ml||0);tmsg=`${_lang==="en"?"Bottle logged!":"Mamadeira registrada!"} ${ml2}ml ${_lang==="en"?"today":"hoje"}`}
      if(e.type==="diaper"){const dc=ta.filter(x=>x.type==="diaper").length+1;tmsg=`${_lang==="en"?"Diaper logged!":"Fralda registrada!"} ${dc}x ${_lang==="en"?"today":"hoje"}`}
    }
    showToast(tmsg,async()=>{for(const p of parts) await FB.delEntry(p.id)});
    setShowOrbit(true);setTimeout(()=>setShowOrbit(false),1200);
  },[editEntry,entries]);

  const startEdit=useCallback((entry)=>{

    setFormType(entry.type);
    setShowAdd(false);
  },[]);
  const deleteEntry=useCallback(async id=>{const entry=entries.find(e=>e.id===id);await FB.delEntry(id);showToast(`${TL(entry?.type)||""} ${L("removed")}`,async()=>{if(entry)await FB.addEntry(entry)})},[entries]);
  const quickWakeup=useCallback(()=>addEntry({type:"wakeup",date:todayStr(),time:nowTime(),id:uid()}),[addEntry]);
  const duplicateLast=useCallback(()=>{if(!entries.length)return;const l=entries[0];addEntry({...l,id:uid(),date:todayStr(),time:nowTime(),_docId:undefined})},[entries,addEntry]);
  const startTimer=useCallback(async(type,side)=>{const data={type,startTime:new Date().toISOString()};if(type==="nursing"){data.side=side||"left";data.leftMs=0;data.rightMs=0;data.sideStart=new Date().toISOString()}await FB.saveTimer(data);setShowAdd(false);setFormType(null)},[]);
  const switchSide=useCallback(async(newSide)=>{if(!activeTimer||activeTimer.type!=="nursing")return;const now=Date.now();const elapsed=activeTimer.paused?0:(now-new Date(activeTimer.sideStart).getTime());const updated={...activeTimer,side:newSide,sideStart:new Date().toISOString(),paused:false};if(activeTimer.side==="left")updated.leftMs=(activeTimer.leftMs||0)+elapsed;else updated.rightMs=(activeTimer.rightMs||0)+elapsed;await FB.saveTimer(updated)},[activeTimer]);
  const pauseNursing=useCallback(async()=>{if(!activeTimer||activeTimer.type!=="nursing")return;if(activeTimer.paused){await FB.saveTimer({...activeTimer,paused:false,sideStart:new Date().toISOString()})}else{const now=Date.now();const elapsed=now-new Date(activeTimer.sideStart).getTime();const updated={...activeTimer,paused:true};if(activeTimer.side==="left")updated.leftMs=(activeTimer.leftMs||0)+elapsed;else updated.rightMs=(activeTimer.rightMs||0)+elapsed;await FB.saveTimer(updated)}},[activeTimer]);
  const stopTimer=useCallback(async()=>{if(!activeTimer)return;const s=new Date(activeTimer.startTime);if(activeTimer.type==="nursing"){const now=Date.now();const elapsed=activeTimer.paused?0:(now-new Date(activeTimer.sideStart).getTime());let lMs=(activeTimer.leftMs||0),rMs=(activeTimer.rightMs||0);if(!activeTimer.paused){if(activeTimer.side==="left")lMs+=elapsed;else rMs+=elapsed}const totalMin=Math.max(1,Math.round((lMs+rMs)/60000));const lMin=Math.round(lMs/60000),rMin=Math.round(rMs/60000);const side=lMs>0&&rMs>0?"both":(lMs>0?"left":"right");const entry={type:"nursing",date:`${s.getFullYear()}-${String(s.getMonth()+1).padStart(2,"0")}-${String(s.getDate()).padStart(2,"0")}`,time:`${String(s.getHours()).padStart(2,"0")}:${String(s.getMinutes()).padStart(2,"0")}`,durationMin:totalMin,side,leftMin:lMin,rightMin:rMin,id:uid()};await FB.addEntry(entry);await FB.saveTimer(null);showToast(`${_lang==="en"?"Nursing":"Amam."} ${totalMin}min (L:${lMin} R:${rMin})`,null)}else{const mins=Math.max(1,Math.round((Date.now()-s.getTime())/6e4));const entry={type:activeTimer.type,date:`${s.getFullYear()}-${String(s.getMonth()+1).padStart(2,"0")}-${String(s.getDate()).padStart(2,"0")}`,time:`${String(s.getHours()).padStart(2,"0")}:${String(s.getMinutes()).padStart(2,"0")}`,durationMin:mins,id:uid()};const parts=splitMidnight(entry);for(const p of parts) await FB.addEntry(p);await FB.saveTimer(null);showToast(`${mins}min registrado`,null)}},[activeTimer]);

  const today=todayStr();

  const totalDiapers=todayE.filter(e=>e.type==="diaper").length;
  const napNums=useMemo(()=>{const naps=[...todayE].reverse().filter(e=>e.type==="nap");const m={};naps.forEach((n,i)=>{m[n.id]=i+1});return m},[todayE]);
  const age=calcAge(profile.birthDate);const babyName=profile.name||"Bebê";

    if(wk){wm=toMinutes(wk.time)}else{const ls=todayE.filter(e=>(e.type==="sleep"||e.type==="nap")&&e.durationMin>0).sort((a,b)=>b.time.localeCompare(a.time))[0];if(ls){const em=toMinutes(ls.time)+ls.durationMin;if(em>=300&&em<=720)wm=em}}

        <div style={{padding:"calc(12px + env(safe-area-inset-top)) 20px 0",display:"flex",alignItems:"center",gap:12}}>
          <div style={{position:"relative"}}><button onClick={()=>setShowProfile(true)} style={{width:52,height:52,borderRadius:16,overflow:"hidden",border:`1.5px solid ${T.accent}20`,background:T.glass,display:"flex",alignItems:"center",justifyContent:"center",boxShadow:"0 2px 12px rgba(0,0,0,0.3)"}}>{profile.photo?<img src={profile.photo} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/>:<Icon name="sun" size={22} color={T.sub}/>}</button>{daysLeft!==null&&daysLeft>0&&<button onClick={()=>setShowSleepInfo(true)} style={{position:"absolute",top:-5,right:-8,minWidth:24,height:24,borderRadius:12,background:`linear-gradient(135deg,${T.accent},#a78bfa)`,color:"#fff",fontSize:10,fontWeight:800,display:"flex",alignItems:"center",justifyContent:"center",padding:"0 5px",boxShadow:`0 2px 8px ${T.accent}55`,border:`2px solid ${T.bg1}`}}>{daysLeft}</button>}{sleepRec?.phase===2&&<button onClick={()=>setShowSleepInfo(true)} style={{position:"absolute",top:-2,right:-6,width:20,height:20,borderRadius:10,background:T.green,display:"flex",alignItems:"center",justifyContent:"center",border:`2px solid ${T.bg1}`}}><Icon name="check" size={10} color={T.bg1}/></button>}</div>
          <div style={{flex:1}}><h1 style={{fontSize:17,fontWeight:800,margin:0,letterSpacing:-0.3}}>{babyName}</h1><div style={{display:"flex",alignItems:"center",gap:6,marginTop:3}}><span style={{fontSize:10,color:T.accent,fontWeight:600}}>{age&&<>{age.months>0?`${age.months} ${_lang==="en"?(age.months===1?"month":"months"):(age.months===1?"mês":"meses")}${_lang==="en"?" and ":" e "}`:""}{age.days} {_lang==="en"?"days":"dias"}</>}</span><span style={{width:3,height:3,borderRadius:"50%",background:T.dim}}/><span style={{fontSize:10,color:T.dim}}>{new Date().toLocaleDateString(_lang==="pt"?"pt-BR":"en-US",{day:"numeric",month:"short"})}</span></div></div>
        </div>
        <CuriosityCard age={age} lang={lang} tick={tick}/>
        <div style={{padding:"4px 0 0"}}><Ring activeTimer={activeTimer} napSug={napSug} tick={tick} recentEvents={cycleE} lang={lang} showOrbit={showOrbit}/></div>
        <div style={{display:"flex",gap:6,padding:"0 20px",marginBottom:12}}>{!activeTimer&&<><button onClick={()=>{setFormType("bottle");setShowAdd(false)}} style={{flex:1,padding:"12px 0 8px",borderRadius:14,background:`${T.green}08`,border:`1px solid ${T.green}14`,display:"flex",flexDirection:"column",alignItems:"center",gap:5}}><Icon name="bottle" size={18} color={T.green}/><span style={{fontSize:9,fontWeight:700,color:T.green}}>{_lang==="en"?"Bottle":"Mamad."}</span></button><button onClick={()=>startTimer("nursing",nextNursingSide)} style={{flex:1,padding:"12px 0 8px",borderRadius:14,background:`${T.blue}08`,border:`1px solid ${T.blue}14`,display:"flex",flexDirection:"column",alignItems:"center",gap:5,position:"relative"}}><Icon name="breast" size={18} color={T.blue}/><span style={{fontSize:9,fontWeight:700,color:T.blue}}>{_lang==="en"?"Nurse":"Amam."}</span>{lastNursingSide&&<span style={{position:"absolute",top:4,right:6,fontSize:7,fontWeight:800,color:T.blue,opacity:0.5}}>{nextNursingSide==="left"?"L→":"R→"}</span>}</button><button onClick={()=>startTimer("nap")} style={{flex:1,padding:"12px 0 8px",borderRadius:14,background:`${T.accent}08`,border:`1px solid ${T.accent}14`,display:"flex",flexDirection:"column",alignItems:"center",gap:5}}><Icon name="cloud" size={18} color={T.accent}/><span style={{fontSize:9,fontWeight:700,color:T.accent}}>{_lang==="en"?"Nap":"Soneca"}</span></button><button onClick={()=>startTimer("sleep")} style={{flex:1,padding:"12px 0 8px",borderRadius:14,background:`${T.purple}08`,border:`1px solid ${T.purple}14`,display:"flex",flexDirection:"column",alignItems:"center",gap:5}}><Icon name="moon" size={18} color={T.purple}/><span style={{fontSize:9,fontWeight:700,color:T.purple}}>{_lang==="en"?"Sleep":"Sono"}</span></button></>}</div>
        {napSug?.wind&&<div style={{margin:"0 20px 12px",padding:"10px 14px",borderRadius:12,background:T.amberS,border:`1px solid ${T.amber}22`,display:"flex",alignItems:"center",gap:10,animation:"pulse 2s infinite"}}><Icon name="bell" size={18} color={T.amber}/><div><div style={{fontSize:12,fontWeight:700,color:T.amber}}>{_lang==="en"?"Get ready for sleep":"Preparar para dormir"}</div><div style={{fontSize:10,color:T.sub}}>{_lang==="en"?`~${napSug.rem}min left`:`~${napSug.rem}min restantes`}</div></div></div>}
        {napSug?.over&&<div style={{margin:"0 20px 12px",padding:"10px 14px",borderRadius:12,background:T.orangeS,border:`1px solid ${T.orange}22`,display:"flex",alignItems:"center",gap:10,animation:"pulse 1.5s infinite"}}><Icon name="zap" size={18} color={T.orange}/><div><div style={{fontSize:12,fontWeight:700,color:T.orange}}>{_lang==="en"?"Sleep window passed":"Janela de sono passou"}</div><div style={{fontSize:10,color:T.sub}}>{_lang==="en"?`${fmtDur(napSug.el)} awake`:`${fmtDur(napSug.el)} acordado(a)`}</div></div></div>}
        {!activeTimer&&sleepRec?.phase===2&&daySchedule.length>0&&daySchedule.filter(s=>s.status==="next").map((s,i)=><div key={"ns"+i} style={{margin:"0 20px 12px",padding:"10px 14px",borderRadius:12,background:`${T.accent}10`,border:`1px solid ${T.accent}18`,display:"flex",alignItems:"center",gap:10}}><Icon name="star" size={18} color={T.accent} fill={T.accent}/><div><div style={{fontSize:12,fontWeight:700,color:T.accent}}>{s.bed?(_lang==="en"?"Bedtime ~":"Sono ~"):(_lang==="en"?"Next nap ~":"Prox. soneca ~")}{minToTime(s.startMin)}</div><div style={{fontSize:10,color:T.sub}}>{s.bed?"":`${s.pos}${_lang==="en"?["","st","nd","rd"][s.pos]||"th":"a"} · `}WW {fmtDur(s.ww)}{s.durRange?" · "+s.durRange:""}</div></div></div>)}
        {sleepRec?.phase===2&&dayInsights.map((h,i)=><div key={"hi"+i} style={{margin:"0 20px 12px",padding:"10px 14px",borderRadius:12,background:h.type==="good"?T.greenS:T.orangeS,border:`1px solid ${h.type==="good"?T.green:T.orange}22`,display:"flex",alignItems:"center",gap:10}}><Icon name={h.type==="good"?"check":"zap"} size={18} color={h.type==="good"?T.green:T.orange}/><div><div style={{fontSize:12,fontWeight:700,color:h.type==="good"?T.green:T.orange}}>{h.title}</div><div style={{fontSize:10,color:T.sub}}>{h.sub}</div></div></div>)}
        <div style={{padding:"0 20px",marginBottom:12}}><div style={{padding:"12px 14px",borderRadius:14,background:"rgba(22,28,60,0.4)",border:`1px solid ${T.gB}`}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:8}}><div style={{display:"flex",alignItems:"center",gap:6}}><Icon name="clock" size={14} color={T.accent}/><span style={{fontSize:11,color:T.sub,fontWeight:500}}>{L("dailyGoal")}</span></div><div><span style={{fontSize:18,fontWeight:800,color:T.accent}}>{totalMl}</span><span style={{fontSize:12,color:T.dim}}> / {profile.mlGoal||680} ml</span></div></div>
          <div style={{height:8,borderRadius:4,background:"rgba(139,124,246,0.08)",overflow:"hidden"}}><div style={{height:"100%",width:`${Math.min(100,profile.mlGoal?(totalMl/profile.mlGoal)*100:0)}%`,background:`linear-gradient(90deg,#7c3aed,${T.accent})`,borderRadius:4,boxShadow:`0 0 12px ${T.accent}33`}}/></div>
          <div style={{display:"flex",justifyContent:"space-between",marginTop:4,fontSize:8,color:T.dim}}><span>{profile.mlGoal?Math.round((totalMl/(profile.mlGoal))*100):0}%</span><span>{Math.max(0,(profile.mlGoal||680)-totalMl)}ml {_lang==="en"?"remaining":"restantes"}</span></div>
        </div></div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6,padding:"0 20px",marginBottom:14}}>{[{i:"bottle",v:`${totalMl}`,u:"ml",c:T.green,t:["bottle"],tap:"bottle",l:_lang==="en"?"Bottle":"Mamad."},{i:"breast",v:totalNursingMin>0?fmtDur(totalNursingMin):`${totalNursing}x`,c:T.blue,t:["nursing"],tap:"nursing",l:_lang==="en"?"Nursing":"Amam."},{i:"moon",v:fmtDur(totalSleep),c:T.purple,t:["sleep","nap"],tap:"nap",l:_lang==="en"?"Sleep":"Sono"},{i:"diaper",v:`${totalDiapers}`,c:T.pink,t:["diaper"],tap:"diaper",l:_lang==="en"?"Diaper":"Fralda"}].map((p,idx)=>{const last=entries.find(e=>p.t.includes(e.type));let ago=null;if(last){if(p.t.includes("sleep")&&last.durationMin){const endMs=new Date(`${last.date}T${last.time}`).getTime()+last.durationMin*60000;const endD=new Date(endMs);const ed=`${endD.getFullYear()}-${String(endD.getMonth()+1).padStart(2,"0")}-${String(endD.getDate()).padStart(2,"0")}`;const et=`${String(endD.getHours()).padStart(2,"0")}:${String(endD.getMinutes()).padStart(2,"0")}`;ago=timeSince(ed,et)}else{ago=timeSince(last.date,last.time)}}return<button key={idx} onClick={()=>{if(p.tap==="nap"&&!activeTimer)startTimer("nap");else if(p.tap==="nursing"&&!activeTimer)startTimer("nursing",nextNursingSide);else if(!activeTimer)setFormType(p.tap)}} style={{padding:"10px",borderRadius:12,background:`${p.c}06`,border:`1px solid ${p.c}0a`,textAlign:"left"}}><div style={{display:"flex",alignItems:"center",gap:5,marginBottom:3}}><Icon name={p.i} size={12} color={p.c}/><span style={{fontSize:9,color:T.dim}}>{p.l}</span></div><div style={{fontSize:16,fontWeight:800,color:p.c}}>{p.v}{p.u?<span style={{fontSize:11,opacity:0.6}}>{p.u}</span>:null}</div>{ago&&<div style={{fontSize:12,color:`${p.c}88`,fontWeight:600,marginTop:3}}>{ago}</div>}</button>})}</div>
        <div style={{padding:"0 20px"}}><div style={{fontSize:11,fontWeight:600,color:T.dim,marginBottom:8,textTransform:"uppercase",letterSpacing:0.8}}>{L("today")}</div>{todayE.length===0&&<div style={{textAlign:"center",padding:"32px 20px",color:T.dim}}><Icon name="star" size={32} color={T.dim} fill={T.dim}/><div style={{fontSize:13,marginTop:8}}>{_lang==="en"?"Tap + to add":"Toque + para registrar"}</div></div>}{todayE.map((e,i)=>{const prev=todayE[i-1];let gap=null;if(prev){const t1=new Date(`${e.date}T${e.time}`).getTime();let t2=new Date(`${prev.date}T${prev.time}`).getTime();if(prev.durationMin)t2+=prev.durationMin*60000;const diffMin=Math.abs(Math.round((t1-t2)/60000));if(diffMin>=30){const isSleep=(e.type==="nap"||e.type==="sleep")&&e.durationMin;gap=<div style={{display:"flex",alignItems:"center",gap:10,padding:"4px 16px",margin:"2px 0"}}><div style={{flex:1,height:1,background:`linear-gradient(90deg,transparent,${isSleep?T.accent:T.accent}0a,transparent)`}}/><span style={{fontSize:8,color:isSleep?T.accent:T.dim,letterSpacing:0.5}}>{isSleep?"WW ":""}{fmtDur(diffMin)}</span><div style={{flex:1,height:1,background:`linear-gradient(90deg,transparent,${isSleep?T.accent:T.accent}0a,transparent)`}}/></div>}}return<React.Fragment key={e.id}>{gap}<EntryRow entry={e} onDelete={deleteEntry} onEdit={startEdit} napNum={napNums[e.id]||null}/></React.Fragment>})}</div>
      </div>}
      {page==="history"&&<HistoryPage entries={entries} onDelete={deleteEntry} onEdit={startEdit}/>}
      {page==="stats"&&<StatsPage entries={entries} onGrowth={()=>goTo("growth")}/>}
      {page==="growth"&&<GrowthPage entries={entries} birthDate={profile.birthDate} profile={profile} onBack={()=>goTo("stats")} onAddEntry={addEntry}/>}
      {/* Bottom spacer so content clears nav bar */}
      <div style={{height:activeTimer?120:70}}/>
    </div>

    {/* Fade gradient above nav */}
    <div style={{position:"fixed",bottom:0,left:0,right:0,maxWidth:480,margin:"0 auto",height:120,background:`linear-gradient(to bottom, transparent 0%, ${T.bg1}cc 60%, ${T.bg1} 100%)`,pointerEvents:"none",zIndex:39}}/>

    <Modal open={showSleepInfo} onClose={()=>setShowSleepInfo(false)}>
      {sleepRec?.phase===1&&<><div style={{textAlign:"center",marginBottom:16}}><Icon name="star" size={40} color={T.accent} fill={T.accent}/></div><div style={{textAlign:"center",fontSize:22,fontWeight:800,marginBottom:6}}>{sleepRec.dl} {_lang==="en"?"days":"dias"}</div><div style={{textAlign:"center",fontSize:13,color:T.sub,marginBottom:16}}>{_lang==="en"?`until ${babyName}'s sleep plan`:`para o plano de sono de ${babyName}`}</div><div style={{height:4,borderRadius:2,background:T.bg1,marginBottom:16,overflow:"hidden",filter:`drop-shadow(0 0 5px ${T.accent}44)`}}><div style={{height:"100%",width:`${Math.max(0,Math.min(100,((60-sleepRec.dl)/60)*100))}%`,background:T.accent,borderRadius:2}}/></div><div style={{fontSize:12,color:T.sub,lineHeight:1.6}}>{_lang==="en"?"At 2 months the circadian rhythm matures. Keep tracking.":"Aos 2 meses o ritmo circadiano amadurece. Continue registrando."}</div><div style={{marginTop:14,padding:"10px 12px",borderRadius:10,background:"rgba(14,18,48,0.6)",fontSize:11,color:T.dim}}>{_lang==="en"?"Window":"Janela"}: {sleepRec.g.min}–{sleepRec.g.max} min · {sleepRec.g.naps} {_lang==="en"?"naps/day":"sonecas/dia"}</div>
        {age&&age.totalDays>=1&&age.totalDays<=30&&CURIOSITIES[age.totalDays-1]&&<><div style={{height:1,background:`${T.accent}18`,margin:"16px 0"}}/><div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}><Icon name="sun" size={16} color={T.amber}/><span style={{fontSize:9,fontWeight:700,letterSpacing:1,textTransform:"uppercase",color:T.amber}}>{_lang==="en"?`Day ${age.totalDays}`:`Dia ${age.totalDays}`}</span></div><div style={{fontSize:13,fontWeight:700,marginBottom:4}}>{(_lang==="en"?CURIOSITIES[age.totalDays-1].en:CURIOSITIES[age.totalDays-1].pt).t}</div><div style={{fontSize:11,color:T.sub,lineHeight:1.5}}>{(_lang==="en"?CURIOSITIES[age.totalDays-1].en:CURIOSITIES[age.totalDays-1].pt).b}</div></>}
      </>}
      {sleepRec?.phase===2&&<><div style={{textAlign:"center",marginBottom:12}}><Icon name="check" size={36} color={T.green}/></div><div style={{textAlign:"center",fontSize:16,fontWeight:700,marginBottom:14}}>{_lang==="en"?"Sleep plan active":"Plano de sono ativo"}</div>{sleepRec.a?<><div style={{padding:10,borderRadius:10,background:T.greenS,textAlign:"center",marginBottom:14}}><div style={{fontSize:9,color:T.sub,textTransform:"uppercase",marginBottom:4}}>{_lang==="en"?"Recommended WW":"Janela recomendada"}</div><div style={{fontSize:18,fontWeight:800,color:T.green}}>{fmtDur(sleepRec.a.rec)}</div></div><div style={{fontSize:11,color:T.dim,marginBottom:14}}>{_lang==="en"?`Based on ${sleepRec.a.pts} observations`:`Baseado em ${sleepRec.a.pts} observações`}</div></>:<div style={{fontSize:12,color:T.sub,marginBottom:14}}>{_lang==="en"?"Track more data to personalize.":"Registre mais dados para personalizar."}</div>}
        {sleepPattern&&sleepRec?.phase===2&&daySchedule.length>0&&<>
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}><Icon name="clock" size={16} color={T.accent}/><span style={{fontSize:13,fontWeight:700,color:T.accent}}>{_lang==="en"?"Today's routine":"Rotina do dia"}</span><span style={{fontSize:9,color:T.dim,marginLeft:"auto"}}>{_lang==="en"?`${sleepPattern.days} days`:`${sleepPattern.days} dias`}</span></div>
          {daySchedule.map((s,i)=><div key={i} style={{display:"flex",alignItems:"center",gap:10,padding:"7px 0",borderTop:i>0?`1px solid ${T.gB}`:"none"}}>
            <span style={{fontSize:16,fontWeight:800,minWidth:48,color:s.status==="done"?T.text:s.status==="next"?T.accent:T.dim}}>{minToTime(s.startMin)}</span>
            <div style={{flex:1}}>
              <div style={{fontSize:12,fontWeight:600,color:s.status==="done"?T.text:s.status==="next"?T.text:T.dim}}>{s.bed?(_lang==="en"?"Bedtime":"Sono"):(_lang==="en"?`${["","1st","2nd","3rd","4th","5th","6th"][s.pos]||s.pos+"th"} nap`:`${s.pos}a soneca`)}</div>
              {!s.bed&&<div style={{fontSize:10,color:T.dim}}>WW {fmtDur(s.ww)}{s.durRange?" · "+s.durRange:s.durMin>0?" · "+fmtDur(s.durMin):""}</div>}
            </div>
            <span style={{fontSize:10,fontWeight:600,padding:"3px 8px",borderRadius:6,background:s.status==="done"?T.greenS:s.status==="next"?`${T.accent}20`:`${T.dim}15`,color:s.status==="done"?T.green:s.status==="next"?T.accent:T.dim}}>{s.status==="done"?"Done":s.status==="next"?"Next":"Later"}</span>
          </div>)}
        </>}
      </>}
    </Modal>

    <Sheet open={showAdd&&!formType} onClose={()=>setShowAdd(false)}>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:"10px 0",padding:"0 16px"}}>{["wakeup","bottle","nursing","sleep","nap","diaper","bath","medicine","temperature"].map((type,i)=>{const cfg=TYPES[type];const last=entries.find(e=>e.type===type);const agoRaw=last?timeSince(last.date,last.time):null;const ago=agoRaw==="now"?"Just now":agoRaw;return(<button key={type} onClick={()=>setFormType(type)} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:10,padding:"12px 4px 8px",animation:`slideUp .3s ease ${i*0.035}s both`}}>
        <div style={{width:70,height:70,borderRadius:"50%",background:`radial-gradient(circle at 35% 30%, rgba(50,60,120,0.95), rgba(18,22,55,0.98))`,border:`1.5px solid ${cfg.color}25`,display:"flex",alignItems:"center",justifyContent:"center",boxShadow:`0 4px 20px rgba(0,0,0,0.4), 0 0 24px ${cfg.color}18, 0 0 48px ${cfg.color}08, inset 0 1px 0 rgba(200,210,255,0.08), inset 0 -2px 4px rgba(0,0,0,0.2)`,position:"relative",overflow:"hidden",filter:`drop-shadow(0 0 5px ${cfg.color}44)`}}>
          {/* Inner glow spot */}
          <div style={{position:"absolute",top:"15%",left:"25%",width:"40%",height:"30%",background:`radial-gradient(ellipse,${cfg.color}12,transparent)`,borderRadius:"50%",filter:"blur(6px)"}}/>
          <Icon name={cfg.icon} size={27} color={cfg.color}/>
        </div>
        <div style={{textAlign:"center"}}><div style={{fontSize:12,fontWeight:600,color:T.text,lineHeight:1.3}}>{cfg.label[_lang]||cfg.label.en}</div>{ago&&<div style={{fontSize:12,color:T.sub,fontWeight:500,marginTop:2}}>{ago}</div>}</div>
      </button>)})}</div>
    </Sheet>

    <Sheet open={!!formType} onClose={()=>{setFormType(null);setEditEntry(null)}}>
      {formType&&<AddForm type={formType} onSave={addEntry} savedMeds={savedMeds} onSaveMeds={async m=>await FB.saveMeds(m)} editEntry={editEntry} lastBottleMl={lastBottleMl} topMl={topMl}/>}
    </Sheet>

    {showProfile&&<ProfilePage profile={profile} onSave={async p=>await FB.saveProfile(p)} onBack={()=>setShowProfile(false)} onGrowth={()=>{setShowProfile(false);goTo("growth")}}/>}
    <TimerBar activeTimer={activeTimer} onStop={stopTimer} onSwitch={switchSide} onPause={pauseNursing}/>

    <nav style={{position:"fixed",bottom:"var(--sab)",left:"50%",transform:"translateX(-50%)",display:"flex",alignItems:"center",gap:4,padding:"6px 10px",background:"rgba(8,10,28,0.95)",backdropFilter:"blur(20px)",WebkitBackdropFilter:"blur(20px)",borderRadius:40,border:"1px solid rgba(80,90,160,0.06)",boxShadow:"0 4px 24px rgba(0,0,0,0.6)",zIndex:50}}>
      {[{icon:"home",label:"HOME",active:page==="home"&&!showAdd,action:()=>goTo("home")},{icon:"clock",label:_lang==="en"?"HISTORY":"HIST.",active:page==="history",action:()=>goTo("history")}].map(n=><button key={n.icon} onClick={n.action} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:2,padding:"6px 10px",borderRadius:14,background:n.active?"rgba(139,124,246,0.12)":"transparent"}}><Icon name={n.icon} size={18} color={n.active?T.accent:T.dim}/>{n.active&&<span style={{fontSize:7,fontWeight:700,color:T.accent,letterSpacing:0.5}}>{n.label}</span>}</button>)}
      <button onClick={()=>{setShowAdd(!showAdd);setFormType(null);setPage("home")}} style={{width:46,height:46,borderRadius:"50%",background:`linear-gradient(135deg,#7c3aed,${T.accent})`,display:"flex",alignItems:"center",justifyContent:"center",boxShadow:`0 4px 20px ${T.accent}55`,transition:"transform .2s cubic-bezier(0.34,1.56,0.64,1)",transform:showAdd?"rotate(45deg) scale(1.05)":"scale(1)",margin:"-4px 2px"}}><Icon name="plus" size={22} color="#fff"/></button>
      {[{icon:"chart",label:"STATS",active:page==="stats"||page==="growth",action:()=>goTo("stats")},{icon:"gear",label:_lang==="en"?"SETTINGS":"CONFIG",active:false,action:()=>setShowProfile(true)}].map(n=><button key={n.icon} onClick={n.action} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:2,padding:"6px 10px",borderRadius:14,background:n.active?"rgba(139,124,246,0.12)":"transparent"}}><Icon name={n.icon} size={18} color={n.active?T.accent:T.dim}/>{n.active&&<span style={{fontSize:7,fontWeight:700,color:T.accent,letterSpacing:0.5}}>{n.label}</span>}</button>)}
    </nav>
  </div>);
}

// Remove loading screen
var _ld=document.getElementById('load-debug');if(_ld)_ld.remove();
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
