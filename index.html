    SMART HINTS (9 dicas inteligentes)
    • Feed before nap - correlacao feed-nap >=60%
    • Bedtime approaching - 30-45min antes do bedtime habitual
    • Bath time soon - 20-40min antes se banho e rotina 3+ dias
    • Last feed of the day - 15-45min antes do bedtime
    • Excellent nap! - soneca >=130% da media e >=45min
    • Feed overdue - passou 40% alem do intervalo usual
    • Cluster feeding detected - 3 mamadas em <=90min
    • Diaper check / Few diapers today - sem troca 4h+ ou <4 apos 18h
    • Feed volume WHO - ml total abaixo/acima do recomendado

    WAKING INTELLIGENCE
    • Analise de wakings: avgPerNight, mostCommonTime (cluster +/-30min),
      mostCommonType, trend (improving/worsening)
    • Classificacao automatica: feed / diaper / other (comfort)
    • Insights: Sleeping through, Night wake pattern, Waking cause pattern,
      Wakings decreasing! / Mais despertares ultimamente
    • Trend detection: compara metade recente vs metade antiga

    Todas as dicas respeitam contexto (nao mostra se dormindo/ja feito),
    tem anti-ruido, sao bilingues EN/PT e usam auto-dismiss 15s.

  <script>
  window.onerror=function(msg,src,line,col,err){
    var d=document.getElementById('error-display');
    if(!d){d=document.createElement('div');d.id='error-display';d.style.cssText='position:fixed;inset:0;z-index:9999;background:#0a0e28;color:#f87171;padding:40px 20px;font-family:monospace;font-size:13px;overflow:auto;white-space:pre-wrap';document.body.appendChild(d);d.innerHTML='<div style="font-size:20px;font-weight:bold;color:#fbbf24;margin-bottom:16px">⚠ Louise Pro — Error</div>';}
    d.innerHTML+='<div style="margin-bottom:12px;padding:12px;background:rgba(248,113,113,0.1);border-radius:8px;border-left:3px solid #f87171"><b>'+msg+'</b>\nLine: '+line+' Col: '+col+'\n'+(err&&err.stack?err.stack:'')+'</div>';
    return false;
  };
  window.addEventListener('unhandledrejection',function(e){
    window.onerror('Promise: '+(e.reason&&e.reason.message||e.reason),null,0,0,e.reason);
  });
  </script>

<script>
// Intercept Babel errors (Babel logs to console.error, not window.onerror)
var _origErr=console.error;
console.error=function(){
  _origErr.apply(console,arguments);
  var msg=Array.from(arguments).join(' ');
  if(msg.includes('SyntaxError')||msg.includes('Unexpected')||msg.includes('babel')){

function Ring({activeTimer,napSug,tick,recentEvents,lang,showOrbit,screenLockActive}){
  const[tip,setTip]=useState(null);
  useEffect(()=>{if(tip!==null){const t=setTimeout(()=>setTip(null),3000);return()=>clearTimeout(t)}},[tip]);
  const sz=340,cx=sz/2,cy=sz/2,R=148;
  const gapDeg=55,startAng=90+gapDeg/2,totalArc=360-gapDeg;
  const dotSz=46,sleepSz=44;
  let lbl="",sub="",col1=T.dim,col2=T.dim,isBedtime=false;
  if(activeTimer){
    const el=Math.max(0,Math.floor((Date.now()-new Date(activeTimer.startTime).getTime())/1000));const mins=Math.floor(el/60);
    lbl=mins<60?`${mins} min`:`${Math.floor(mins/60)}h ${String(mins%60).padStart(2,"0")}m`;
    if(activeTimer.type==="nursing"){sub=lang==="en"?"Nursing":"Amamentando";col1="#2563eb";col2="#60a5fa"}
    else if(activeTimer.type==="nap"){sub=lang==="en"?"Napping":"Soneca";col1="#7c3aed";col2="#c084fc"}
    else{sub=lang==="en"?"Bedtime":"Boa noite";col1="#7c3aed";col2="#c084fc";isBedtime=true}
  } else if(napSug){
    lbl=fmtDur(napSug.el);sub=lang==="en"?"Awake for":"Acordado(a)";
    if(napSug.state==="overdue"){col1="#dc2626";col2="#f87171"}
    else if(napSug.state==="stretching"){col1="#ea580c";col2="#fb923c"}
    else if(napSug.state==="sweet"){col1="#059669";col2="#34d399"}
    else if(napSug.state==="opening"){col1="#d97706";col2="#fbbf24"}
    else{col1="#059669";col2="#34d399"}
  } else{sub="";lbl="\u2014"}
  const hasProgress=col1!==T.dim;
  const toMin=t=>{const[h,m]=(t||"12:00").split(":").map(Number);return h*60+m};
  const evs=(recentEvents||[]);
  // Day window: from wake-up to midnight
  let wakeMin=6*60;let hasWakeup=false;
  const wakeEv=evs.find(e=>e.type==="wakeup");
  if(wakeEv){wakeMin=toMin(wakeEv.time);hasWakeup=true}
  else{const ls=evs.filter(e=>(e.type==="sleep"||e.type==="nap")&&e.durationMin>0).sort((a,b)=>(b.date+"T"+b.time).localeCompare(a.date+"T"+a.time))[0];if(ls){const em=toMin(ls.time)+ls.durationMin;if(em>=5*60&&em<=12*60){wakeMin=em;hasWakeup=true}}
  else{const firstEv=[...evs].sort((a,b)=>a.time.localeCompare(b.time))[0];if(firstEv)wakeMin=Math.max(0,toMin(firstEv.time)-15)}}
  const dayStart=wakeMin;
  let dayEnd=24*60;
  let bedMin=null;
  const bedEv=[...evs].filter(e=>e.type==="sleep").sort((a,b)=>`${a.date}T${a.time}`.localeCompare(`${b.date}T${b.time}`))[0];
  if(bedEv){let bm=toMin(bedEv.time);if(bm<dayStart)bm+=1440;bedMin=bm;if(bm>dayStart)dayEnd=bm}
  if(!bedMin&&activeTimer&&activeTimer.type==="sleep"){const st=new Date(activeTimer.startTime);const bm=st.getHours()*60+st.getMinutes();const adjBm=bm<dayStart?bm+1440:bm;bedMin=adjBm;if(adjBm>dayStart)dayEnd=adjBm}
  const daySpan=Math.max(1,dayEnd-dayStart);
  const toAng=mins=>{const t=Math.max(0,Math.min(1,(mins-dayStart)/daySpan));return startAng+t*totalArc};
  const descArc=(sA,eA)=>{const s=sA*Math.PI/180,e=eA*Math.PI/180;return`M ${cx+R*Math.cos(s)} ${cy+R*Math.sin(s)} A ${R} ${R} 0 ${eA-sA>180?1:0} 1 ${cx+R*Math.cos(e)} ${cy+R*Math.sin(e)}`};
  const sleepEvs=evs.filter(e=>e.type==="nap"&&e.durationMin>0);
  const dotEvs=evs.filter(e=>e.type==="bottle"||e.type==="nursing"||e.type==="diaper"||e.type==="medicine");
  const sleepArcs=sleepEvs.map(ev=>{
    const mins=toMin(ev.time),dur=ev.durationMin;
    if(mins+dur<dayStart||mins>dayStart+daySpan)return null;
    const a1=toAng(Math.max(mins,dayStart)),a2=toAng(Math.min(mins+dur,dayStart+daySpan));
    const midAng=(a1+a2)/2;const midRad=midAng*Math.PI/180;
    return{ev,path:descArc(a1,a2),mx:cx+R*Math.cos(midRad),my:cy+R*Math.sin(midRad),col:TYPES[ev.type]?.color||T.purple};
  }).filter(Boolean);
  const MIN_GAP=22;
  const rawDots=dotEvs.map(ev=>{
    const cfg=TYPES[ev.type];if(!cfg)return null;
    const mins=toMin(ev.time);
    if(mins<dayStart||mins>dayStart+daySpan)return null;
    const angDeg=toAng(mins);const angRad=angDeg*Math.PI/180;
    return{ev,cfg,angDeg,x:cx+R*Math.cos(angRad),y:cy+R*Math.sin(angRad)};
  }).filter(Boolean);
  const groups=[];
  rawDots.forEach(d=>{const g=groups.find(gr=>Math.abs(gr[0].angDeg-d.angDeg)<MIN_GAP);if(g)g.push(d);else groups.push([d])});
  const dots=groups.map(gr=>({primary:gr[0],items:gr}));
  // Determine last event globally: dot vs sleep arc (compare end times)
  const _lastEv=(()=>{let maxT="",type="none",dIdx=-1,sIdx=-1;dots.forEach((gr,idx)=>{gr.items.forEach(it=>{const t=`${it.ev.date}T${it.ev.time}`;if(t>maxT){maxT=t;type="dot";dIdx=idx}})});sleepArcs.forEach((sa,idx)=>{const endMs=new Date(`${sa.ev.date}T${sa.ev.time}`).getTime()+sa.ev.durationMin*60000;const d=new Date(endMs);const t=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")+"T"+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");if(t>maxT){maxT=t;type="sleep";sIdx=idx}});return{type,dIdx,sIdx}})();
  const lastDotIdx=_lastEv.type==="dot"?_lastEv.dIdx:-1;
  const lastSleepArcIdx=_lastEv.type==="sleep"?_lastEv.sIdx:-1;
  const totalSleepMin=evs.filter(e=>(e.type==="sleep"||e.type==="nap")&&e.durationMin).reduce((s,e)=>s+e.durationMin,0);

  // Anchor: sun at wake-up (ring start), moon at bedtime (ring end)
  const wakeTimeStr=`${String(Math.floor(wakeMin/60)).padStart(2,"0")}:${String(wakeMin%60).padStart(2,"0")}`;
  const sunAng=toAng(wakeMin);const sunRad=sunAng*Math.PI/180;
  const anchorSun=hasWakeup?{x:cx+R*Math.cos(sunRad),y:cy+R*Math.sin(sunRad),time:wakeTimeStr}:null;
  let anchorMoon=null;
  if(bedMin){const dispMin=bedMin%1440;const bedTimeStr=`${String(Math.floor(dispMin/60)).padStart(2,"0")}:${String(dispMin%60).padStart(2,"0")}`;const moonAng=toAng(bedMin);const moonRad=moonAng*Math.PI/180;anchorMoon={x:cx+R*Math.cos(moonRad),y:cy+R*Math.sin(moonRad),time:bedTimeStr}}

  // Live timer arc (nap only, during daytime)
  let timerArc=null;
  if(activeTimer&&activeTimer.type==="nap"){
    const st=new Date(activeTimer.startTime);
    const startMins=st.getHours()*60+st.getMinutes();
    const now=new Date();
    const nowMins=now.getHours()*60+now.getMinutes();
    if(startMins>=dayStart){
      const a1=toAng(startMins),a2=toAng(Math.min(nowMins,dayStart+daySpan-1));
      if(a2>a1){const midAng=(a1+a2)/2;const midRad=midAng*Math.PI/180;const tipRad=a2*Math.PI/180;timerArc={path:descArc(a1,a2),col:T.purple,mx:cx+R*Math.cos(midRad),my:cy+R*Math.sin(midRad),tipX:cx+R*Math.cos(tipRad),tipY:cy+R*Math.sin(tipRad)}}
    }
  }

  return(<div style={{position:"relative",width:sz,margin:"0 auto"}}>
    <div style={{position:"relative",width:sz,height:sz}}>
      <svg width={sz} height={sz} style={{overflow:"visible"}}>
        <defs><filter id="slpG"><feGaussianBlur stdDeviation="8" result="b"/><feFlood floodColor={T.purple} floodOpacity="0.35" result="c"/><feComposite in="c" in2="b" operator="in" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
        <path d={descArc(startAng,startAng+totalArc)} fill="none" stroke="rgba(40,55,120,0.18)" strokeWidth={20} strokeLinecap="round"/>
        {/* Sleep pills */}
        {sleepArcs.map((sa,i)=><path key={"sg"+i} d={sa.path} fill="none" stroke={sa.col} strokeWidth={36} strokeLinecap="round" opacity={0.08} filter="url(#slpG)"/>)}
        {sleepArcs.map((sa,i)=><path key={"sb"+i} d={sa.path} fill="none" stroke={sa.col} strokeWidth={30} strokeLinecap="round" opacity={0.4}/>)}
        {sleepArcs.map((sa,i)=><path key={"sf"+i} d={sa.path} fill="none" stroke="rgba(16,12,40,0.85)" strokeWidth={24} strokeLinecap="round"/>)}
        {/* Dashed flow on last sleep arc */}

function CuriosityCard({age,lang,tick}){
  const[vis,setVis]=useState(false);const[fading,setFading]=useState(false);const shownRef=useRef(null);
  useEffect(()=>{
    if(!age)return;
    const h=new Date().getHours();
    if(h<9||h>=10){setVis(false);return}
    const key=`${age.totalDays}-${h}`;
    if(shownRef.current===key)return;
    shownRef.current=key;setVis(true);setFading(false);
  },[age,tick]);
  useEffect(()=>{
    if(!vis)return;
    const t1=setTimeout(()=>setFading(true),13500);
    const t2=setTimeout(()=>setVis(false),15000);
    return()=>{clearTimeout(t1);clearTimeout(t2)};
  },[vis]);
  if(!vis||!age)return null;
  const dayNum=age.totalDays;const monthNum=age.months;const weekNum=age.totalWeeks;
  const colors=["#fbbf24","#34d399","#38bdf8","#a78bfa","#f472b6","#fb923c"];
  let txt=null,col=colors[0],tagLabel="",daysLeft=null;
  // Priority 1: daily curiosities (days 1-30)
  if(dayNum>=1&&dayNum<=30){
    const c=CURIOSITIES[dayNum-1];if(!c)return null;
    txt=lang==="en"?c.en:c.pt;col=colors[(dayNum-1)%colors.length];
    tagLabel=lang==="en"?`Day ${dayNum}`:`Dia ${dayNum}`;daysLeft=30-dayNum;
  }
  // Priority 2: monthly milestones (on the exact day of the month anniversary)
  else if(monthNum>=2&&monthNum<=12&&age.days===0){
    const ms=MILESTONES.find(m=>m.m===monthNum);
    if(ms){
      txt=lang==="en"?ms.en:ms.pt;col=colors[(monthNum-1)%colors.length];
      tagLabel=lang==="en"?`${monthNum} months`:`${monthNum} meses`;
    }
  }
  // Priority 3: weekly curiosities (weeks 5-52, i.e. days 31-364)
  if(!txt&&weekNum>=5&&weekNum<=52){
    const idx=weekNum-5;
    const wc=WEEKLY_CURIOSITIES&&WEEKLY_CURIOSITIES[idx];
    if(wc){
      txt=lang==="en"?wc.en:wc.pt;col=colors[(weekNum-1)%colors.length];
      tagLabel=lang==="en"?`Week ${weekNum}`:`Semana ${weekNum}`;
    }
  }
  if(!txt)return null;
  return(<div style={{margin:"0 16px 12px",padding:"12px 14px",borderRadius:14,background:`linear-gradient(135deg,${col}08,${col}04)`,border:`1px solid ${col}15`,position:"relative",overflow:"hidden",animation:fading?"curiosityOut .5s ease forwards":"curiosityIn .5s ease"}}>
    <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:8}}>
      <svg width="14" height="14" viewBox="0 0 24 24" fill={`${col}40`} stroke={col} strokeWidth="1.5"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="1" y1="12" x2="3" y2="12"/></svg>
      <span style={{fontSize:9,fontWeight:700,letterSpacing:1,textTransform:"uppercase",color:col}}>{tagLabel}</span>
      {daysLeft!==null&&<span style={{fontSize:8,color:T.dim,marginLeft:"auto"}}>{lang==="en"?`${daysLeft} days left`:`${daysLeft} dias restantes`}</span>}
    </div>
    <div style={{fontSize:13,fontWeight:700,marginBottom:3,lineHeight:1.3}}>{txt.t}</div>
    <div style={{fontSize:11,color:T.sub,lineHeight:1.5}}>{txt.b}</div>
  </div>);
}

function InsightCards({insights,phase}){
  const[vis,setVis]=useState(false);const[fading,setFading]=useState(false);const shownRef=useRef(null);
  useEffect(()=>{
    if(!insights||insights.length===0||phase!==2){setVis(false);return}
    const key=insights.map(h=>h.title).join("|");

        :<Fld label={L("wokeAt")}><input type="time" value={endTime} onChange={e=>setEndTime(e.target.value)} style={{...inp,colorScheme:"dark",fontSize:28,fontWeight:800,textAlign:"center",padding:"14px 16px"}}/></Fld>}
        {durMode==="end"&&endTime&&time&&<div style={{fontSize:11,color:T.sub,marginBottom:12,textAlign:"center"}}>{(()=>{const[sh,sm]=time.split(":").map(Number);const[eh,em]=endTime.split(":").map(Number);let d=(eh*60+em)-(sh*60+sm);if(d<=0)d+=1440;return`Duração: ${fmtDur(d)}${d>720?" (próximo dia)":""}`})()}</div>}
      </>}
      {type==="diaper"&&<Fld label={_lang==="en"?"Type":"Tipo"}><Seg opts={[{v:"wet",l:L("wet")},{v:"dirty",l:L("dirty")},{v:"both",l:L("both")}]} val={diaperT} set={setDiaperT} color={cfg.color}/></Fld>}
      {type==="medicine"&&<>

          {savedMeds.map((m,i)=><button key={i} onClick={()=>{setMedN(m.name);setMedD(m.dose||"");setShowML(false)}} style={{flex:"1 1 calc(50% - 4px)",padding:"10px 14px",borderRadius:12,background:medN===m.name?`${T.amber}20`:T.glass,border:`1px solid ${medN===m.name?`${T.amber}55`:T.gB}`,textAlign:"left",boxShadow:medN===m.name?`0 0 12px ${T.amber}15`:"none"}}>
            <div style={{fontSize:13,fontWeight:700,color:medN===m.name?T.amber:T.text}}>{m.name}</div>
            {m.dose&&<div style={{fontSize:11,color:medN===m.name?T.amber:T.dim,opacity:0.7,marginTop:2}}>{m.dose}</div>}
          </button>)}
          <button onClick={()=>{setMedN("");setMedD("");setShowML(true)}} style={{flex:"1 1 calc(50% - 4px)",padding:"10px 14px",borderRadius:12,background:showML?`${T.amber}20`:"transparent",border:`1px dashed ${showML?`${T.amber}55`:T.gB}`,display:"flex",alignItems:"center",justifyContent:"center",gap:6}}>

        <Fld label={L("dose")}><input type="text" placeholder="Ex: 3 gotas" value={medD} onChange={e=>setMedD(e.target.value)} style={inp}/></Fld></>}

      {type==="growth"&&<><Fld label={`${L("weight")} (kg)`}><input type="number" inputMode="decimal" step="0.01" placeholder="Ex: 4.5" value={weightKg} onChange={e=>setWeightKg(e.target.value)} style={{...inp,fontSize:28,fontWeight:800,textAlign:"center"}}/></Fld><Fld label={`${_lang==="en"?"Length":"Comprimento"} (cm)`}><input type="number" inputMode="decimal" step="0.1" placeholder="Ex: 55.0" value={lengthCm} onChange={e=>setLengthCm(e.target.value)} style={{...inp,fontSize:28,fontWeight:800,textAlign:"center"}}/></Fld><Fld label={`${L("head")} (cm)`}><input type="number" inputMode="decimal" step="0.1" placeholder="Ex: 37.0" value={headCm} onChange={e=>setHeadCm(e.target.value)} style={{...inp,fontSize:28,fontWeight:800,textAlign:"center"}}/></Fld></>}
      <Fld label={L("notes")}><textarea placeholder={_lang==="en"?"Note...":"Anotação..."} value={notes} onChange={e=>setNotes(e.target.value)} rows={2} style={{...inp,resize:"vertical"}}/></Fld>
      <button onClick={doSave} style={{width:"100%",padding:14,borderRadius:12,background:cfg.color,color:T.bg1,fontSize:15,fontWeight:700}}>{isEdit?L("update"):L("save")}</button>
    </div>
  </div>);
}

function InboxPanel({inbox,onClose,onMarkRead,onMarkAllRead,lang}){
  const items=(inbox.items||[]).slice().sort((a,b)=>(b.timestamp||0)-(a.timestamp||0));
  const unreadCount=items.filter(it=>!it.read).length;
  const todayLabel=new Date().toLocaleDateString(lang==="pt"?"pt-BR":"en-US",{weekday:"short",day:"numeric",month:"short"}).toUpperCase().replace(".","");
  const iconByType={good:"check",warn:"zap",info:"star"};
  const colorByType={good:T.green,warn:T.orange,info:T.blue};
  const bgByType={good:T.greenS,warn:T.orangeS,info:`${T.blue}1a`};
  const fmtAgo=ts=>{
    if(!ts)return"";
    const diff=Math.floor((Date.now()-ts)/60000);
    if(diff<1)return lang==="en"?"now":"agora";
    if(diff<60)return `${diff}min`;
    const h=Math.floor(diff/60),m=diff%60;
    return m>0?`${h}h${m}m`:`${h}h`;
  };
  return(<div style={{position:"fixed",inset:0,zIndex:210,maxWidth:480,margin:"0 auto",background:"rgba(5,8,24,0.96)",backdropFilter:"blur(24px)",WebkitBackdropFilter:"blur(24px)",display:"flex",flexDirection:"column",paddingTop:"env(safe-area-inset-top)",paddingBottom:"env(safe-area-inset-bottom)",animation:"fadeIn .25s ease"}}>
    {/* Header */}
    <div style={{display:"flex",alignItems:"center",gap:12,padding:"18px 20px 14px",borderBottom:"1px solid rgba(139,124,246,0.08)"}}>
      <div style={{width:36,height:36,borderRadius:11,background:"rgba(139,124,246,0.12)",border:"1px solid rgba(139,124,246,0.2)",display:"flex",alignItems:"center",justifyContent:"center"}}>
        <Icon name="bell" size={17} color={T.accent}/>
      </div>
      <div style={{flex:1}}>
        <div style={{fontSize:17,fontWeight:800,letterSpacing:-0.2,color:T.text}}>{lang==="en"?"Notifications":"Notificações"}</div>
        <div style={{fontSize:10,color:T.dim,marginTop:2,letterSpacing:0.5}}>{lang==="en"?"TODAY · ":"HOJE · "}{todayLabel}</div>
      </div>
      <button onClick={onClose} style={{width:34,height:34,borderRadius:11,background:T.glass,border:`1px solid ${T.gB}`,display:"flex",alignItems:"center",justifyContent:"center"}}>
        <Icon name="x" size={16} color={T.sub}/>
      </button>
    </div>

    {/* Toolbar */}
    {items.length>0&&<div style={{padding:"12px 20px 10px",display:"flex",alignItems:"center",gap:10}}>
      <span style={{fontSize:10,color:unreadCount>0?T.accent:T.dim,padding:"3px 10px",borderRadius:10,background:unreadCount>0?"rgba(139,124,246,0.12)":"rgba(85,90,128,0.08)",fontWeight:700,letterSpacing:0.5,border:`1px solid ${unreadCount>0?"rgba(139,124,246,0.2)":"rgba(85,90,128,0.15)"}`}}>
        {unreadCount>0?`${unreadCount} ${lang==="en"?"new":"novas"}`:(lang==="en"?"All read":"Todas lidas")}
      </span>
      {unreadCount>0&&<button onClick={onMarkAllRead} style={{marginLeft:"auto",fontSize:10,color:T.sub,padding:"5px 12px",borderRadius:8,background:"transparent",border:"1px solid rgba(139,124,246,0.15)",fontWeight:600}}>{lang==="en"?"Mark all read":"Marcar todas"}</button>}
    </div>}

    {/* List or empty state */}
    <div style={{flex:1,overflowY:"auto",WebkitOverflowScrolling:"touch"}}>
      {items.length===0?(
        <div style={{textAlign:"center",padding:"80px 24px 40px",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>
          <div style={{width:72,height:72,margin:"0 auto 18px",borderRadius:22,background:"rgba(139,124,246,0.06)",border:"1px solid rgba(139,124,246,0.12)",display:"flex",alignItems:"center",justifyContent:"center"}}>
            <Icon name="bell" size={32} color={T.dim}/>
          </div>
          <div style={{fontSize:15,fontWeight:800,marginBottom:6,color:T.text}}>{lang==="en"?"All caught up":"Tudo em dia"}</div>
          <div style={{fontSize:11,color:T.sub,lineHeight:1.6,maxWidth:260}}>{lang==="en"?"New hints from the routine engine will appear here during the day.":"Novas dicas do engine aparecerão aqui durante o dia."}</div>
          <div style={{display:"inline-flex",alignItems:"center",gap:5,marginTop:14,padding:"5px 10px",borderRadius:8,background:"rgba(139,124,246,0.06)",fontSize:9,color:T.accent,fontWeight:700,letterSpacing:0.5}}>
            <Icon name="clock" size={10} color={T.accent}/>
            {lang==="en"?"RESETS AT MIDNIGHT":"RESET À MEIA-NOITE"}
          </div>
        </div>
      ):items.map(it=>{
        const col=colorByType[it.type]||T.blue;
        const bg=bgByType[it.type]||T.blueS;
        const ic=iconByType[it.type]||"star";
        const unread=!it.read;
        return(<button key={it.key} onClick={()=>unread&&onMarkRead(it.key)} style={{display:"flex",alignItems:"flex-start",gap:12,padding:"14px 20px 14px 24px",borderBottom:"1px solid rgba(139,124,246,0.04)",position:"relative",width:"100%",textAlign:"left",background:unread?"rgba(139,124,246,0.04)":"transparent",cursor:unread?"pointer":"default"}}>
          {unread&&<div style={{position:"absolute",left:9,top:"50%",transform:"translateY(-50%)",width:5,height:5,borderRadius:"50%",background:"#60a5fa",boxShadow:"0 0 8px #60a5fa, 0 0 2px #60a5fa",animation:"pulse 2s ease-in-out infinite"}}/>}
          <div style={{width:34,height:34,borderRadius:11,background:bg,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,opacity:unread?1:0.5}}>
            <Icon name={ic} size={15} color={col}/>
          </div>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:13,fontWeight:700,marginBottom:3,color:unread?T.text:T.sub,lineHeight:1.3}}>{it.title}</div>
            <div style={{fontSize:11,color:unread?T.sub:T.dim,lineHeight:1.45}}>{it.sub}</div>
            <div style={{fontSize:9,color:T.dim,marginTop:5,fontWeight:600,letterSpacing:0.5}}>{fmtAgo(it.timestamp)}</div>
          </div>
        </button>);
      })}
    </div>
  </div>);
}

function ProfilePage({profile,onSave,onBack,onGrowth,onShowChangelog,hasUnreadChangelog}){
  const[name,setName]=useState(profile.name||"");
  const[birth,setBirth]=useState(profile.birthDate||"");
  const[photo,setPhoto]=useState(profile.photo||"");
  const[mlGoal,setMlGoal]=useState(String(profile.mlGoal||""));
  const[birthWeight,setBirthWeight]=useState(String(profile.birthWeight||""));
  const[birthLength,setBirthLength]=useState(String(profile.birthLength||""));
  const[birthHead,setBirthHead]=useState(String(profile.birthHead||""));
  const[langSel,setLangSel]=useState(profile.lang||"en");
  const[keepScreenOn,setKeepScreenOn]=useState(profile.keepScreenOn!==false);
  const[hapticEnabled,setHapticEnabled]=useState(profile.hapticEnabled!==false);
  const[pushEnabled,setPushEnabled]=useState(profile.pushEnabled===true);
  const[pushPermission,setPushPermission]=useState(()=>typeof Notification!=="undefined"?Notification.permission:"unsupported");
  const[pushBusy,setPushBusy]=useState(false);
  const pushSupported=PushNotifs.isSupported();
  const handlePushToggle=async()=>{
    if(pushBusy)return;
    if(!pushSupported){
      // Show inline message — can't toggle
      return;
    }
    if(pushEnabled){
      // Disable: just flip the flag (token stays in Firestore for now, won't auto-clean)
      setPushEnabled(false);
      Haptic.light();
      return;
    }
    // Enable: must request permission via user gesture
    setPushBusy(true);
    Haptic.medium();
    try{
      const granted=await PushNotifs.requestPermission();
      setPushPermission(typeof Notification!=="undefined"?Notification.permission:"unsupported");
      if(granted){
        setPushEnabled(true);
        // Try to fetch token (may return null if FCM SDK not loaded — that's OK)
        const token=await PushNotifs.getToken();
        if(token)await PushNotifs.saveToken(token);
        Haptic.success();
      }else{
        Haptic.warning();
      }
    }catch(e){/* fail silent */}
    setPushBusy(false);
  };
  const fr=useRef(null);
  const handlePhoto=e=>{const f=e.target.files?.[0];if(!f)return;const rd=new FileReader();rd.onload=ev=>{const img=new Image();img.onload=()=>{const c=document.createElement("canvas"),mx=200;let w=img.width,h=img.height;if(w>h){h=(h/w)*mx;w=mx}else{w=(w/h)*mx;h=mx}c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);setPhoto(c.toDataURL("image/jpeg",0.8))};img.src=ev.target.result};rd.readAsDataURL(f)};
  const doSave=()=>{onSave({name:name.trim(),birthDate:birth,photo,mlGoal:parseInt(mlGoal)||0,birthWeight:parseFloat(birthWeight)||0,birthLength:parseFloat(birthLength)||0,birthHead:parseFloat(birthHead)||0,lang:langSel,keepScreenOn,hapticEnabled,pushEnabled});onBack()};
  const inp={width:"100%",padding:"14px 16px",background:"rgba(14,18,48,0.8)",border:`1px solid ${T.gB}`,borderRadius:12,color:T.text,fontSize:15,outline:"none"};
  return(<div style={{position:"fixed",inset:0,zIndex:200,maxWidth:480,margin:"0 auto",background:`radial-gradient(ellipse at 50% 0%,#10153d,${T.bg1} 65%)`,overflowY:"auto",overflowX:"hidden",overscrollBehavior:"contain",WebkitOverflowScrolling:"touch",paddingTop:"env(safe-area-inset-top)",paddingBottom:"calc(40px + env(safe-area-inset-bottom))"}}>
    <div style={{display:"flex",alignItems:"center",gap:14,padding:"16px 20px"}}><button onClick={onBack} style={{width:36,height:36,borderRadius:10,background:T.glass,border:`1px solid ${T.gB}`,display:"flex",alignItems:"center",justifyContent:"center"}}><Icon name="back" size={18} color={T.sub}/></button><span style={{fontSize:17,fontWeight:700}}>{L("profile")}</span></div>
    <div style={{padding:"0 20px"}}>
      <div style={{display:"flex",flexDirection:"column",alignItems:"center",marginBottom:24}}><button onClick={()=>fr.current?.click()} style={{width:88,height:88,borderRadius:"50%",overflow:"hidden",background:T.glass,border:`2px solid ${T.accent}33`,display:"flex",alignItems:"center",justifyContent:"center",boxShadow:"0 4px 20px rgba(0,0,0,0.3)"}}>{photo?<img src={photo} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/>:<Icon name="sun" size={32} color={T.sub}/>}</button><input ref={fr} type="file" accept="image/*" style={{display:"none"}} onChange={handlePhoto}/><span style={{fontSize:11,color:T.dim,marginTop:8}}>{_lang==="en"?"Tap to change":"Toque para alterar"}</span></div>
      <div style={{background:"rgba(22,28,60,0.4)",borderRadius:16,border:`1px solid ${T.gB}`,padding:16,marginBottom:12}}>
        <Fld label={L("name")}><input type="text" placeholder={_lang==="en"?"e.g. Louise":"Ex: Louise"} value={name} onChange={e=>setName(e.target.value)} style={inp}/></Fld>
        <Fld label={L("birthDate")}><input type="date" value={birth} onChange={e=>setBirth(e.target.value)} style={{...inp,colorScheme:"dark",maxWidth:"100%",WebkitAppearance:"none",textAlign:"center"}}/></Fld>
        <Fld label={L("dailyMilkGoal")}><input type="number" inputMode="numeric" placeholder={_lang==="en"?"e.g. 600":"Ex: 600"} value={mlGoal} onChange={e=>setMlGoal(e.target.value)} style={inp}/></Fld>
      </div>
      <div style={{background:"rgba(22,28,60,0.4)",borderRadius:16,border:`1px solid ${T.gB}`,padding:16,marginBottom:12}}>
        <Fld label={langSel==="en"?"Language":"Idioma"}>
          <div style={{display:"flex",gap:4,background:"rgba(14,18,48,0.6)",borderRadius:10,padding:3,border:`1px solid ${T.gB}`}}>
            <button onClick={()=>setLangSel("en")} style={{flex:1,padding:"10px 0",borderRadius:8,fontSize:13,fontWeight:700,background:langSel==="en"?T.accent:"transparent",color:langSel==="en"?"#fff":T.sub}}>English</button>
            <button onClick={()=>setLangSel("pt")} style={{flex:1,padding:"10px 0",borderRadius:8,fontSize:13,fontWeight:700,background:langSel==="pt"?T.accent:"transparent",color:langSel==="pt"?"#fff":T.sub}}>Português</button>
          </div>
        </Fld>
      </div>
      <div style={{background:"rgba(22,28,60,0.4)",borderRadius:16,border:`1px solid ${T.gB}`,padding:16,marginBottom:12}}>
        {/* Wake Lock toggle */}
        <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",gap:12}}>
          <div style={{flex:1}}>
            <div style={{fontSize:13,fontWeight:700,marginBottom:4}}>{langSel==="en"?"Keep screen on":"Manter tela ligada"}</div>
            <div style={{fontSize:11,color:T.dim,lineHeight:1.4}}>{langSel==="en"?"During night wake & nursing timers":"Durante night wake e amamentação"}</div>
          </div>
          <button onClick={()=>setKeepScreenOn(!keepScreenOn)} style={{position:"relative",width:48,height:28,borderRadius:14,background:keepScreenOn?T.accent:"rgba(14,18,48,0.8)",border:`1px solid ${keepScreenOn?T.accent:T.gB}`,transition:"all .2s",flexShrink:0,cursor:"pointer",padding:0}}>
            <div style={{position:"absolute",top:2,left:keepScreenOn?22:2,width:22,height:22,borderRadius:"50%",background:"#fff",transition:"left .2s",boxShadow:"0 1px 3px rgba(0,0,0,0.4)"}}/>
          </button>
        </div>
        {/* Separator */}
        <div style={{height:1,background:"rgba(90,100,180,0.12)",margin:"14px 0"}}/>
        {/* Haptic toggle */}
        <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",gap:12}}>
          <div style={{flex:1}}>
            <div style={{fontSize:13,fontWeight:700,marginBottom:4}}>{langSel==="en"?"Haptic feedback":"Vibração"}</div>
            <div style={{fontSize:11,color:T.dim,lineHeight:1.4}}>{langSel==="en"?"Subtle vibration when logging events":"Vibração sutil ao registrar eventos"}</div>
          </div>
          <button onClick={()=>{setHapticEnabled(!hapticEnabled);if(!hapticEnabled){Haptic.setEnabled(true);Haptic.medium()}else{Haptic.setEnabled(false)}}} style={{position:"relative",width:48,height:28,borderRadius:14,background:hapticEnabled?T.accent:"rgba(14,18,48,0.8)",border:`1px solid ${hapticEnabled?T.accent:T.gB}`,transition:"all .2s",flexShrink:0,cursor:"pointer",padding:0}}>

        {/* Separator */}
        <div style={{height:1,background:"rgba(90,100,180,0.12)",margin:"14px 0"}}/>
        {/* Push notifications toggle */}
        <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",gap:12}}>
          <div style={{flex:1}}>
            <div style={{fontSize:13,fontWeight:700,marginBottom:4,color:pushSupported?T.text:T.dim}}>{langSel==="en"?"Notifications":"Notificações"}</div>
            <div style={{fontSize:11,color:T.dim,lineHeight:1.4}}>
              {!pushSupported?(langSel==="en"?"Install to home screen first (iOS 16.4+)":"Instale na tela inicial primeiro (iOS 16.4+)"):
               pushPermission==="denied"?(langSel==="en"?"Permission denied — enable in iOS Settings":"Permissão negada — ative nos Ajustes do iOS"):
               pushEnabled?(langSel==="en"?"System ready — no notifications sent yet":"Sistema pronto — nenhuma notificação enviada ainda"):
               (langSel==="en"?"Tap to enable when available":"Toque para ativar quando disponível")}
            </div>
          </div>
          <button onClick={handlePushToggle} disabled={!pushSupported||pushBusy||pushPermission==="denied"} style={{position:"relative",width:48,height:28,borderRadius:14,background:pushEnabled&&pushSupported?T.accent:"rgba(14,18,48,0.8)",border:`1px solid ${pushEnabled&&pushSupported?T.accent:T.gB}`,transition:"all .2s",flexShrink:0,cursor:pushSupported&&!pushBusy&&pushPermission!=="denied"?"pointer":"not-allowed",padding:0,opacity:!pushSupported||pushPermission==="denied"?0.4:1}}>
            <div style={{position:"absolute",top:2,left:pushEnabled&&pushSupported?22:2,width:22,height:22,borderRadius:"50%",background:"#fff",transition:"left .2s",boxShadow:"0 1px 3px rgba(0,0,0,0.4)"}}/>
          </button>

function ChangelogModal({onClose,lang}){
  // Render a bullet: detect highlight prefix "★ " and bold markers **text**
  const renderBullet=(text,idx)=>{
    const highlighted=text.startsWith("\u2605 ");
    const clean=highlighted?text.slice(2):text;
    // Parse **bold** segments
    const parts=[];
    let remaining=clean;
    let key=0;
    while(remaining.length>0){
      const boldStart=remaining.indexOf("**");
      if(boldStart===-1){parts.push(<span key={key++}>{remaining}</span>);break}
      if(boldStart>0)parts.push(<span key={key++}>{remaining.slice(0,boldStart)}</span>);
      const boldEnd=remaining.indexOf("**",boldStart+2);
      if(boldEnd===-1){parts.push(<span key={key++}>{remaining.slice(boldStart)}</span>);break}
      parts.push(<strong key={key++} style={{color:"#c4b5fd",fontWeight:700}}>{remaining.slice(boldStart+2,boldEnd)}</strong>);
      remaining=remaining.slice(boldEnd+2);
    }
    return(<li key={idx} style={{fontSize:12,color:T.text,lineHeight:1.55,padding:"5px 0 5px 18px",position:"relative",listStyle:"none"}}>
      <span style={{position:"absolute",left:3,top:12,width:6,height:6,borderRadius:"50%",background:highlighted?T.green:T.purple,boxShadow:highlighted?`0 0 8px ${T.green}`:"none"}}/>
      {parts}
    </li>);
  };
  // Format date by language
  const fmtDate=(dateStr)=>{
    if(dateStr.includes("→"))return dateStr;
    const d=new Date(dateStr+"T12:00");
    if(lang==="en")return d.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});
    return d.toLocaleDateString("pt-BR",{day:"2-digit",month:"short",year:"numeric"}).replace(".","");
  };
  return(<div style={{position:"fixed",inset:0,zIndex:300,background:"rgba(7,11,30,0.75)",backdropFilter:"blur(6px)",WebkitBackdropFilter:"blur(6px)",display:"flex",alignItems:"stretch",justifyContent:"center",padding:"calc(14px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom))"}} onClick={onClose}>
    <div onClick={e=>e.stopPropagation()} style={{background:T.bg1,borderRadius:20,border:"1px solid rgba(139,124,246,0.25)",boxShadow:"0 20px 60px rgba(0,0,0,0.6)",display:"flex",flexDirection:"column",width:"100%",maxWidth:460,maxHeight:"100%",overflow:"hidden"}}>
      {/* Header */}
      <div style={{padding:"16px 18px",borderBottom:"1px solid rgba(139,124,246,0.12)",display:"flex",alignItems:"center",gap:12,background:"linear-gradient(180deg,rgba(139,124,246,0.08),transparent)",flexShrink:0}}>
        <div style={{width:38,height:38,borderRadius:11,background:"linear-gradient(135deg,rgba(139,124,246,0.25),rgba(124,58,237,0.15))",border:"1px solid rgba(139,124,246,0.3)",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#c4b5fd" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 2l3 7h7l-5.5 4 2 7L12 16l-6.5 4 2-7L2 9h7z"/></svg>
        </div>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:9,fontWeight:800,color:"rgba(139,124,246,0.7)",textTransform:"uppercase",letterSpacing:1}}>{lang==="en"?"What's new · Louise Pro":"Novidades · Louise Pro"}</div>
          <div style={{fontSize:15,fontWeight:800,marginTop:2,color:T.text}}>{lang==="en"?"Version history":"Histórico de versões"}</div>
        </div>
        <button onClick={onClose} style={{width:32,height:32,borderRadius:10,background:"rgba(90,100,180,0.1)",border:`1px solid ${T.gB}`,display:"flex",alignItems:"center",justifyContent:"center",color:T.sub,cursor:"pointer",fontSize:16,flexShrink:0}}>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      {/* Scroll */}
      <div style={{flex:1,overflowY:"auto",WebkitOverflowScrolling:"touch",padding:"16px 18px 20px"}}>
        {CHANGELOG.map((entry,i)=>{
          const data=entry[lang]||entry.pt;
          const isCurrent=entry.v===APP_VERSION;
          return(<div key={entry.v} style={{paddingBottom:18,paddingTop:i>0?18:0,borderTop:i>0?"1px solid rgba(139,124,246,0.08)":"none"}}>
            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10,flexWrap:"wrap"}}>
              <span style={{fontSize:15,fontWeight:800,color:T.text,fontVariantNumeric:"tabular-nums"}}>{entry.v==="earlier"?(lang==="en"?"Earlier":"Anteriores"):`v${entry.v}`}</span>
              <span style={{fontSize:11,color:T.sub,fontWeight:500}}>{fmtDate(entry.date)}</span>
              {isCurrent&&<span style={{display:"inline-flex",alignItems:"center",gap:4,padding:"2px 8px",borderRadius:8,background:"rgba(52,211,153,0.12)",color:T.green,fontSize:9,fontWeight:800,textTransform:"uppercase",letterSpacing:0.5,border:"1px solid rgba(52,211,153,0.25)"}}>{lang==="en"?"Current":"Atual"}</span>}
            </div>
            <ul style={{margin:0,padding:0}}>{data.bullets.map((b,j)=>renderBullet(b,j))}</ul>
          </div>);
        })}
      </div>
    </div>
  </div>);
}

function StatsPage({entries,onGrowth}){
  const[period,setPeriod]=useState(7);
  const days=period==="all"?[...new Set(entries.map(e=>e.date))].sort():Array.from({length:period},(_,i)=>{const d=new Date();d.setDate(d.getDate()-((period-1)-i));return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`});
  const numDays=days.length||1;
  const data=days.map(dt=>{
    const de=entries.filter(e=>e.date===dt);
    const sleeps=de.filter(e=>(e.type==="sleep"||e.type==="nap")&&e.durationMin);
    const slReal=sumRealSleep(sleeps);
    const slAwake=sumAwakeInSleep(sleeps);
    return{
      date:dt,isToday:dt===todayStr(),
      label:numDays<=14?new Date(dt+"T12:00").toLocaleDateString(_lang==="pt"?"pt-BR":"en-US",{weekday:"short"}).replace(".",""):new Date(dt+"T12:00").toLocaleDateString(_lang==="pt"?"pt-BR":"en-US",{day:"numeric",month:"numeric"}).replace(/\/\d{4}/,""),
      ml:de.filter(e=>e.type==="bottle").reduce((s,e)=>s+(e.ml||0),0),
      sl:slReal,        // real sleep (was: total bedtime including wakings)
      slAwake:slAwake,  // night-waking time
      slBed:slReal+slAwake // total time in bed
    }
  });
  const mxMl=Math.max(...data.map(d=>d.ml),1);
  const mxSl=Math.max(...data.map(d=>d.sl+d.slAwake),1); // stack height = real + awake
  const avgMl=Math.round(data.reduce((s,d)=>s+d.ml,0)/numDays);
  const avgSl=Math.round(data.reduce((s,d)=>s+d.sl,0)/numDays);
  const avgAwake=Math.round(data.reduce((s,d)=>s+d.slAwake,0)/numDays);
  const avgBed=avgSl+avgAwake;
  // Wakings count per night (only nights with bedtime data)
  const totalWakings=days.reduce((s,dt)=>s+countWakings(entries.filter(e=>e.date===dt)),0);
  const nightsWithSleep=days.filter(dt=>entries.some(e=>e.date===dt&&e.type==="sleep"&&e.durationMin)).length;
  const avgWakings=nightsWithSleep>0?Math.round((totalWakings/nightsWithSleep)*10)/10:0;
  // Trend: compare to previous period (using REAL sleep)
  const prevDays=period!=="all"?Array.from({length:period},(_,i)=>{const d=new Date();d.setDate(d.getDate()-period-((period-1)-i));return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}):[];
  const prevMl=prevDays.length?Math.round(prevDays.reduce((s,dt)=>s+entries.filter(e=>e.date===dt&&e.type==="bottle").reduce((ss,e)=>ss+(e.ml||0),0),0)/prevDays.length):0;
  const prevSl=prevDays.length?Math.round(prevDays.reduce((s,dt)=>s+sumRealSleep(entries.filter(e=>e.date===dt)),0)/prevDays.length):0;
  const trendMl=prevMl>0?Math.round(((avgMl-prevMl)/prevMl)*100):0;
  const trendSl=prevSl>0?Math.round(((avgSl-prevSl)/prevSl)*100):0;
  // Extra daily avgs
  const avgDiapers=Math.round(days.reduce((s,dt)=>s+entries.filter(e=>e.date===dt&&e.type==="diaper").length,0)/numDays*10)/10;
  const avgFeedings=Math.round(days.reduce((s,dt)=>s+entries.filter(e=>e.date===dt&&(e.type==="bottle"||e.type==="nursing")).length,0)/numDays*10)/10;
  const avgNaps=Math.round(days.reduce((s,dt)=>s+entries.filter(e=>e.date===dt&&e.type==="nap").length,0)/numDays*10)/10;
  const exportCSV=()=>{const h="Data,Hora,Tipo,Detalhe,Notas\n";const rows=entries.map(e=>{let d="";if(e.ml)d=`${e.ml}ml`;else if(e.durationMin)d=fmtDur(e.durationMin);else if(e.name)d=e.name;else if(e.value)d=`${e.value}°C`;else if(e.subtype)d=e.subtype;return`${e.date},${e.time},${TL(e.type)||e.type},${d},${e.notes||""}`}).join("\n");const blob=new Blob([h+rows],{type:"text/csv"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=`louise-pro-${todayStr()}.csv`;a.click();URL.revokeObjectURL(url)};
  const TrendBadge=({val})=>val===0?null:<div style={{display:"flex",alignItems:"center",gap:3,marginTop:4}}><Icon name={val>0?"arrowUp":"arrowDown"} size={10} color={val>0?T.green:T.orange}/><span style={{fontSize:9,fontWeight:600,color:val>0?T.green:T.orange}}>{val>0?"+":""}{val}%</span><span style={{fontSize:8,color:T.dim}}>vs {_lang==="en"?"prev":"ant"}</span></div>;
  return(<div style={{padding:"calc(16px + env(safe-area-inset-top)) 20px 0"}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
      <h2 style={{fontSize:17,fontWeight:700,margin:0}}>{L("summary")}</h2>
      <div style={{display:"flex",gap:6}}>
        <button onClick={onGrowth} style={{display:"flex",alignItems:"center",gap:4,padding:"6px 10px",borderRadius:8,background:"rgba(163,230,53,0.08)",border:"1px solid rgba(163,230,53,0.12)",fontSize:11,fontWeight:600,color:"#a3e635"}}><Icon name="ruler" size={12} color="#a3e635"/>{L("growth")}</button>
        <button onClick={exportCSV} style={{display:"flex",alignItems:"center",gap:4,padding:"6px 10px",borderRadius:8,background:"rgba(22,28,60,0.6)",border:`1px solid ${T.gB}`,fontSize:11,fontWeight:600,color:T.sub}}>CSV</button>
      </div>
    </div>
    <div style={{background:"rgba(22,28,60,0.4)",borderRadius:14,border:`1px solid ${T.gB}`,padding:4,marginBottom:14}}>
      {[{v:7,l:"7d"},{v:14,l:"14d"},{v:30,l:"30d"},{v:"all",l:L("all")}].map(p=>
        <button key={p.v} onClick={()=>setPeriod(p.v)} style={{width:"25%",padding:"8px 0",borderRadius:10,fontSize:12,fontWeight:700,background:period===p.v?T.accent:"transparent",color:period===p.v?"#fff":T.sub}}>{p.l}</button>
      )}
    </div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:12}}>
      <div style={{background:`${T.green}08`,borderRadius:14,border:`1px solid ${T.green}0a`,padding:12}}><div style={{display:"flex",alignItems:"center",gap:6,marginBottom:6}}><Icon name="bottle" size={14} color={T.green}/><span style={{fontSize:9,color:T.sub}}>{_lang==="en"?"Avg milk/day":"Média leite/dia"}</span></div><div style={{fontSize:22,fontWeight:800,color:T.green}}>{avgMl} <span style={{fontSize:12,opacity:0.6}}>ml</span></div><TrendBadge val={trendMl}/></div>
      <div style={{background:`${T.purple}08`,borderRadius:14,border:`1px solid ${T.purple}0a`,padding:12}}>
        <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:6}}><Icon name="moon" size={14} color={T.purple}/><span style={{fontSize:9,color:T.sub}}>{_lang==="en"?"Real sleep/day":"Sono real/dia"}</span></div>
        <div style={{fontSize:22,fontWeight:800,color:T.purple}}>{fmtDur(avgSl)}</div>
        <TrendBadge val={trendSl}/>
        {avgAwake>0&&<div style={{marginTop:8,paddingTop:6,borderTop:`1px solid ${T.purple}15`,display:"flex",flexDirection:"column",gap:3}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline"}}><span style={{fontSize:8,color:T.dim}}>{_lang==="en"?"In bed":"Na cama"}</span><span style={{fontSize:10,fontWeight:600,color:T.sub,fontVariantNumeric:"tabular-nums"}}>{fmtDur(avgBed)}</span></div>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline"}}><span style={{fontSize:8,color:T.dim}}>{_lang==="en"?"Awake":"Acordada"}</span><span style={{fontSize:10,fontWeight:600,color:"#60a5fa",fontVariantNumeric:"tabular-nums"}}>{fmtDur(avgAwake)}{avgWakings>0?` · ${avgWakings}x`:""}</span></div>
        </div>}
      </div>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:16}}>
      <div style={{background:"rgba(22,28,60,0.4)",borderRadius:12,border:`1px solid ${T.gB}`,padding:"10px 8px",textAlign:"center"}}><div style={{fontSize:8,color:T.dim,textTransform:"uppercase",letterSpacing:0.5,marginBottom:4}}>{_lang==="en"?"Diapers/day":"Fraldas/dia"}</div><div style={{fontSize:18,fontWeight:800,color:T.pink}}>{avgDiapers}</div></div>
      <div style={{background:"rgba(22,28,60,0.4)",borderRadius:12,border:`1px solid ${T.gB}`,padding:"10px 8px",textAlign:"center"}}><div style={{fontSize:8,color:T.dim,textTransform:"uppercase",letterSpacing:0.5,marginBottom:4}}>{_lang==="en"?"Feedings/day":"Mamadas/dia"}</div><div style={{fontSize:18,fontWeight:800,color:T.blue}}>{avgFeedings}</div></div>
      <div style={{background:"rgba(22,28,60,0.4)",borderRadius:12,border:`1px solid ${T.gB}`,padding:"10px 8px",textAlign:"center"}}><div style={{fontSize:8,color:T.dim,textTransform:"uppercase",letterSpacing:0.5,marginBottom:4}}>{_lang==="en"?"Naps/day":"Sonecas/dia"}</div><div style={{fontSize:18,fontWeight:800,color:T.accent}}>{avgNaps}</div></div>
    </div>
    {[{t:_lang==="en"?"Milk (ml)":"Leite (ml)",f:"ml",max:mxMl,c:T.green,stacked:false},{t:_lang==="en"?"Sleep · real + awake":"Sono · real + acordada",f:"sl",max:mxSl,c:T.purple,stacked:true}].map(ch=>(
      <div key={ch.f} style={{marginBottom:22}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
          <span style={{fontSize:12,fontWeight:600,color:T.sub}}>{ch.t}</span>
          {ch.stacked&&avgAwake>0&&<div style={{display:"flex",gap:10}}>
            <span style={{display:"flex",alignItems:"center",gap:4,fontSize:9,color:T.sub,fontWeight:600}}><span style={{width:8,height:8,borderRadius:2,background:`linear-gradient(180deg,${T.purple},#7c3aed)`}}/>{_lang==="en"?"Real":"Real"}</span>
            <span style={{display:"flex",alignItems:"center",gap:4,fontSize:9,color:T.sub,fontWeight:600}}><span style={{width:8,height:8,borderRadius:2,background:"rgba(96,165,250,0.6)",border:"1px solid #60a5fa"}}/>{_lang==="en"?"Awake":"Acordada"}</span>
          </div>}
        </div>
        <div style={{display:"flex",gap:numDays>20?1:numDays>14?2:5,alignItems:"flex-end",height:100,background:"rgba(22,28,60,0.4)",borderRadius:14,padding:"12px 4px 6px",border:`1px solid ${T.gB}`,overflow:"hidden",position:"relative"}}>
          {data.map(d=>{
            if(ch.stacked){
              const v=d.sl;const aw=d.slAwake;const total=v+aw;
              const totalPct=Math.max((total/ch.max)*65,2);
              const realPct=total>0?(v/total)*totalPct:totalPct;
              const awakePct=total>0?(aw/total)*totalPct:0;
              return<div key={d.date} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:2,minWidth:0}}>
                {numDays<=14&&<span style={{fontSize:10,color:T.sub,fontWeight:600}}>{v>0?fmtDur(v):""}</span>}
                <div style={{width:"85%",maxWidth:numDays>20?8:20,height:totalPct,borderRadius:numDays>20?2:5,overflow:"hidden",display:"flex",flexDirection:"column",justifyContent:"flex-end",background:T.bg3,opacity:d.isToday?1:0.7,transition:"height .5s"}}>
                  {aw>0&&<div style={{height:awakePct,background:"rgba(96,165,250,0.55)",borderBottom:"1px solid #60a5fa"}}/>}
                  <div style={{height:realPct,background:v>0?`linear-gradient(180deg,${T.purple},#7c3aed)`:T.bg3,borderRadius:numDays>20?"2px 2px 0 0":"5px 5px 0 0"}}/>
                </div>
                {numDays<=14&&<span style={{fontSize:8,color:d.isToday?T.accent:T.dim,fontWeight:d.isToday?700:400}}>{d.isToday?(_lang==="en"?"Today":"Hoje"):d.label}</span>}
              </div>
            }else{
              const v=d[ch.f];return<div key={d.date} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:2,minWidth:0}}>
                {numDays<=14&&<span style={{fontSize:10,color:T.sub,fontWeight:600}}>{v>0?v:""}</span>}
                <div style={{width:"85%",maxWidth:numDays>20?8:20,height:Math.max((v/ch.max)*65,2),borderRadius:numDays>20?2:5,background:v>0?ch.c:T.bg3,transition:"height .5s",opacity:d.isToday?1:0.7}}/>
                {numDays<=14&&<span style={{fontSize:8,color:d.isToday?T.accent:T.dim,fontWeight:d.isToday?700:400}}>{d.isToday?(_lang==="en"?"Today":"Hoje"):d.label}</span>}
              </div>
            }
          })}
        </div>
        {numDays>14&&<div style={{display:"flex",justifyContent:"space-between",padding:"4px 4px 0",fontSize:8,color:T.dim}}><span>{data[0]?.label}</span><span>{data[Math.floor(data.length/2)]?.label}</span><span>{data[data.length-1]?.label}</span></div>}
      </div>
    ))}
  </div>);
}

function HistoryPage({entries,onDelete,onEdit}){
  const[dateIdx,setDateIdx]=useState(0);
  const[filter,setFilter]=useState("all");
  const viewDate=dateOffset(todayStr(),-dateIdx);
  const dayE=entries.filter(e=>e.date===viewDate);
  const filtered=filter==="all"?dayE:dayE.filter(e=>{
    if(filter==="feed")return e.type==="bottle"||e.type==="nursing";
    if(filter==="sleep")return e.type==="sleep"||e.type==="nap"||e.type==="wakeup"||e.type==="nightwaking";
    return e.type===filter;
  });
  const dMl=dayE.filter(e=>e.type==="bottle").reduce((s,e)=>s+(e.ml||0),0);
  const dSl=sumRealSleep(dayE);
  const dLbl=new Date(viewDate+"T12:00").toLocaleDateString(_lang==="pt"?"pt-BR":"en-US",{weekday:"long",day:"numeric",month:"long"});
  const isToday=dateIdx===0;
  const filters=[{v:"all",l:L("all"),c:T.accent},{v:"feed",l:L("milk"),c:T.green},{v:"sleep",l:L("sleepLabel"),c:T.purple},{v:"diaper",l:typeLabel("diaper",_lang),c:T.pink},{v:"medicine",l:_lang==="en"?"Meds":"Med.",c:T.amber}];
  return(<div style={{padding:"calc(16px + env(safe-area-inset-top)) 20px 0"}}>
    <h2 style={{fontSize:17,fontWeight:700,marginBottom:12}}>{L("history")}</h2>
    {/* Date navigator card */}
    <div style={{background:"rgba(22,28,60,0.4)",borderRadius:14,border:`1px solid ${T.gB}`,padding:"14px 16px",marginBottom:12}}>
      <div style={{display:"flex",alignItems:"center",gap:8}}>
        <button onClick={()=>setDateIdx(dateIdx+1)} style={{width:32,height:32,borderRadius:10,background:"rgba(22,28,60,0.8)",border:`1px solid ${T.gB}`,display:"flex",alignItems:"center",justifyContent:"center"}}><Icon name="back" size={14} color={T.sub}/></button>
        <div style={{flex:1,textAlign:"center"}}><div style={{fontSize:15,fontWeight:700,color:isToday?T.accent:T.text}}>{isToday?L("today"):dLbl}</div><div style={{display:"flex",justifyContent:"center",gap:8,fontSize:10,color:T.sub,marginTop:3}}>{dMl>0&&<span style={{display:"flex",alignItems:"center",gap:3}}><Icon name="bottle" size={10} color={T.green}/>{dMl}ml</span>}{dSl>0&&<><span style={{width:3,height:3,borderRadius:"50%",background:T.dim,alignSelf:"center"}}/><span style={{display:"flex",alignItems:"center",gap:3}}><Icon name="moon" size={10} color={T.purple}/>{fmtDur(dSl)}</span></>}<span style={{width:3,height:3,borderRadius:"50%",background:T.dim,alignSelf:"center"}}/><span>{dayE.length} {L("reg")}</span></div></div>
        <button onClick={()=>setDateIdx(Math.max(0,dateIdx-1))} disabled={isToday} style={{width:32,height:32,borderRadius:10,background:"rgba(22,28,60,0.8)",border:`1px solid ${T.gB}`,display:"flex",alignItems:"center",justifyContent:"center",opacity:isToday?0.3:1}}><Icon name="forward" size={14} color={T.sub}/></button>
      </div>
    </div>
    {/* Type filters */}
    <div style={{display:"flex",gap:4,marginBottom:14,overflowX:"auto",paddingBottom:2}}>
      {filters.map(f=><button key={f.v} onClick={()=>setFilter(f.v)} style={{padding:"6px 12px",borderRadius:8,fontSize:11,fontWeight:600,whiteSpace:"nowrap",background:filter===f.v?`${f.c}20`:"transparent",color:filter===f.v?f.c:T.dim,border:`1px solid ${filter===f.v?f.c+"30":T.gB}`}}>{f.l}</button>)}
    </div>
    {/* Mini day timeline */}
    {(()=>{
      const sleeps=dayE.filter(e=>(e.type==="nap"||e.type==="sleep")&&e.durationMin>0).sort((a,b)=>a.time.localeCompare(b.time));
      if(sleeps.length===0)return null;
      const wk=dayE.find(e=>e.type==="wakeup");
      const dayS=wk?toMinutes(wk.time):sleeps.length>0?Math.max(0,toMinutes(sleeps[0].time)-30):6*60;
      const bed=dayE.find(e=>e.type==="sleep");
      const dayEn=bed?toMinutes(bed.time)+(bed.durationMin||0):24*60;
      const span=Math.max(1,dayEn-dayS);
      const segs=[];let cur=dayS;
      sleeps.forEach(s=>{const sMin=toMinutes(s.time);if(sMin>cur)segs.push({t:"awake",s:cur,e:sMin});segs.push({t:s.type==="sleep"?"bed":"nap",s:sMin,e:sMin+s.durationMin});cur=sMin+s.durationMin});
      if(cur<dayEn)segs.push({t:bed?"bed":"awake",s:cur,e:dayEn});
      if(segs.length<2)return null;
      const hrs=[dayS,dayS+Math.floor(span/3),dayS+Math.floor(span*2/3),dayEn];
      return<div style={{padding:"10px 12px",background:T.glass,borderRadius:12,border:`1px solid ${T.gB}`,marginBottom:14}}>
        <div style={{display:"flex",alignItems:"center",gap:1,height:20,borderRadius:5,overflow:"hidden"}}>
          {segs.map((s,i)=>{const w=Math.max(0.5,((s.e-s.s)/span)*100);const col=s.t==="awake"?"rgba(52,211,153,0.15)":s.t==="nap"?"rgba(167,139,250,0.3)":"rgba(139,124,246,0.4)";return<div key={i} style={{flex:`${w} 0 0%`,height:"100%",background:col,borderRadius:i===0?"4px 0 0 4px":i===segs.length-1?"0 4px 4px 0":"0"}}/>})}
        </div>
        <div style={{display:"flex",justifyContent:"space-between",marginTop:3,fontSize:8,color:T.dim}}>
          {hrs.map((h,i)=><span key={i}>{String(Math.floor((h%1440)/60)).padStart(2,"0")}:{String(Math.floor(h%60)).padStart(2,"0")}</span>)}
        </div>
      </div>
    })()}
    {filtered.length===0&&<p style={{color:T.dim,textAlign:"center",padding:40,fontSize:13}}>{L("noEntries")}{filter!=="all"?(_lang==="en"?" of this type":" desse tipo"):""}</p>}
    {filtered.filter(e=>!e.nightWake).map(e=>(e.type==="sleep"&&e.wakings&&e.wakings.length>0)?<SleepBlock key={e.id} entry={e} onDelete={onDelete} onEdit={onEdit} entries={entries}/>:<EntryRow key={e.id} entry={e} onDelete={onDelete} onEdit={onEdit}/>)}
  </div>);
}

// ── GROWTH PAGE with WHO percentiles ──
function GrowthPage({entries,birthDate,profile,onBack,onAddEntry}){
  const growthEntries=entries.filter(e=>e.type==="growth").sort((a,b)=>`${a.date}T${a.time}`.localeCompare(`${b.date}T${b.time}`));
  const age=calcAge(birthDate);
  const ageMonths=age?(age.months+(age.days/30)):0;
  const[showForm,setShowForm]=useState(false);
  const[wK,setWK]=useState("");const[lC,setLC]=useState("");const[hC,setHC]=useState("");

  // Build all data points: birth + entries
  const allPoints=[];
  if(profile.birthWeight||profile.birthLength||profile.birthHead){
    allPoints.push({ageM:0,date:birthDate,weightKg:profile.birthWeight,lengthCm:profile.birthLength,headCm:profile.birthHead,label:_lang==="en"?"Birth":"Nasc."});
  }
  growthEntries.forEach(e=>{
    const eAge=calcAge(birthDate);
    if(!eAge)return;
    const d1=new Date(birthDate),d2=new Date(e.date);
    const mths=(d2.getFullYear()-d1.getFullYear())*12+d2.getMonth()-d1.getMonth()+(d2.getDate()-d1.getDate())/30;
    allPoints.push({ageM:Math.max(0,mths),date:e.date,weightKg:e.weightKg,lengthCm:e.lengthCm,headCm:e.headCm,label:new Date(e.date+"T12:00").toLocaleDateString(_lang==="pt"?"pt-BR":"en-US",{day:"numeric",month:"short"})});
  });
  const latest=allPoints[allPoints.length-1];

  const doAdd=()=>{
    if(!wK&&!lC&&!hC)return;
    onAddEntry({type:"growth",date:todayStr(),time:nowTime(),id:uid(),weightKg:wK?parseFloat(wK):undefined,lengthCm:lC?parseFloat(lC):undefined,headCm:hC?parseFloat(hC):undefined});
    setWK("");setLC("");setHC("");setShowForm(false);
  };

  const quickAdd=(field,value)=>{
    const entry={type:"growth",date:todayStr(),time:nowTime(),id:uid()};
    entry[field]=value;
    onAddEntry(entry);
  };

  // Mini chart for a metric
  function GrowthChart({label,field,table,color}){
    const pts=allPoints.filter(p=>p[field]);
    if(pts.length<1)return null;
    // WHO P3, P50, P97 curves
    const maxAge=Math.max(ageMonths+1,3);
    const whoSteps=[];for(let m=0;m<=maxAge;m+=maxAge/20){
      const lms=interpolateLMS(table,m);
      const z3=lms.M*Math.pow(1+lms.L*lms.S*(-1.88),1/lms.L);
      const z97=lms.M*Math.pow(1+lms.L*lms.S*1.88,1/lms.L);
      whoSteps.push({m,p3:Math.abs(lms.L)>0.001?z3:lms.M*Math.exp(-1.88*lms.S),p50:lms.M,p97:Math.abs(lms.L)>0.001?z97:lms.M*Math.exp(1.88*lms.S)});
    }
    const allVals=[...whoSteps.map(w=>w.p97),...whoSteps.map(w=>w.p3),...pts.map(p=>p[field])];
    const minV=Math.min(...allVals)*0.9,maxV=Math.max(...allVals)*1.05;
    const W=320,H=140;
    const x=m=>10+(m/maxAge)*(W-20);
    const y=v=>H-10-((v-minV)/(maxV-minV))*(H-20);
    const pathStr=(arr,key)=>arr.map((p,i)=>`${i===0?"M":"L"}${x(p.m).toFixed(1)},${y(p[key]).toFixed(1)}`).join(" ");
    return(<div style={{marginBottom:16}}>
      <div style={{fontSize:12,fontWeight:700,color,marginBottom:6}}>{label}</div>
      <svg width={W} height={H} viewBox={`0 0 ${W} ${H}`} style={{width:"100%",height:"auto",background:T.glass,borderRadius:12,border:`1px solid ${T.gB}`}}>
        <path d={pathStr(whoSteps,"p3")+" L"+x(maxAge)+","+y(whoSteps[whoSteps.length-1].p97)+" "+pathStr([...whoSteps].reverse(),"p97")} fill={`${color}08`} stroke="none"/>
        <path d={pathStr(whoSteps,"p50")} fill="none" stroke={`${color}44`} strokeWidth="1" strokeDasharray="4,3"/>
        <path d={pathStr(whoSteps,"p3")} fill="none" stroke={`${color}22`} strokeWidth="0.5"/>
        <path d={pathStr(whoSteps,"p97")} fill="none" stroke={`${color}22`} strokeWidth="0.5"/>
        {pts.map((p,i)=><circle key={i} cx={x(p.ageM)} cy={y(p[field])} r={4} fill={color} stroke={T.bg1} strokeWidth={2}/>)}
        {pts.length>1&&<path d={pts.map((p,i)=>`${i===0?"M":"L"}${x(p.ageM).toFixed(1)},${y(p[field]).toFixed(1)}`).join(" ")} fill="none" stroke={color} strokeWidth="2"/>}
        <text x={W-4} y={y(whoSteps[whoSteps.length-1].p50)+4} textAnchor="end" fill={`${color}66`} fontSize="8">P50</text>
        <text x={W-4} y={y(whoSteps[whoSteps.length-1].p97)+4} textAnchor="end" fill={`${color}44`} fontSize="7">P97</text>
        <text x={W-4} y={y(whoSteps[whoSteps.length-1].p3)+4} textAnchor="end" fill={`${color}44`} fontSize="7">P3</text>
      </svg>
    </div>);
  }

  function PercentileCard({label,value,unit,table,icon,field,onQuickAdd}){
    const[adding,setAdding]=useState(false);
    const[val,setVal]=useState("");
    if(!value&&!adding)return(<div style={{background:T.glass,borderRadius:14,padding:14,marginBottom:8,border:`1px solid ${T.gB}`,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
      <div style={{display:"flex",alignItems:"center",gap:8}}><Icon name={icon} size={14} color={T.dim}/><span style={{fontSize:13,fontWeight:600,color:T.dim}}>{label}</span></div>
      <button onClick={()=>setAdding(true)} style={{padding:"6px 12px",borderRadius:8,background:"rgba(163,230,53,0.1)",border:"1px solid rgba(163,230,53,0.2)",fontSize:11,fontWeight:700,color:"#a3e635"}}>+ Registrar</button>
    </div>);
    const result=value?getPercentile(value,table,ageMonths):null;
    const p=result?.percentile;
    const pColor=!p?T.dim:p<3||p>97?T.red:p<15||p>85?T.orange:T.green;
    return(<div style={{background:T.glass,borderRadius:14,padding:14,marginBottom:8,border:`1px solid ${T.gB}`}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
        <div style={{display:"flex",alignItems:"center",gap:8}}><Icon name={icon} size={14} color={pColor}/><span style={{fontSize:13,fontWeight:700}}>{label}</span></div>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          {value&&<span style={{fontSize:18,fontWeight:800}}>{value} {unit}</span>}
          <button onClick={()=>setAdding(!adding)} style={{width:28,height:28,borderRadius:8,background:"rgba(163,230,53,0.1)",border:"1px solid rgba(163,230,53,0.15)",display:"flex",alignItems:"center",justifyContent:"center"}}><Icon name="plus" size={12} color="#a3e635"/></button>
        </div>
      </div>
      {value&&<><div style={{display:"flex",alignItems:"center",gap:10}}>
        <div style={{flex:1,height:6,borderRadius:3,background:T.bg3,overflow:"hidden",position:"relative"}}>
          <div style={{position:"absolute",left:"3%",width:1,height:"100%",background:T.dim,opacity:0.3}}/>
          <div style={{position:"absolute",left:"50%",width:1,height:"100%",background:T.dim,opacity:0.5}}/>
          <div style={{position:"absolute",left:"97%",width:1,height:"100%",background:T.dim,opacity:0.3}}/>
          <div style={{position:"absolute",left:`${Math.max(1,Math.min(99,p))}%`,transform:"translateX(-50%)",width:8,height:8,borderRadius:"50%",background:pColor,top:-1,boxShadow:`0 0 6px ${pColor}88`}}/>
        </div>
        <span style={{fontSize:14,fontWeight:800,color:pColor,minWidth:35,textAlign:"right"}}>P{p}</span>
      </div>
      <div style={{fontSize:10,color:T.sub,marginTop:4}}>{_lang==="en"?"WHO Median":"Mediana OMS"}: {result.median.toFixed(1)} {unit}</div></>}
      {adding&&<div style={{display:"flex",gap:8,marginTop:10,alignItems:"center"}}>
        <input type="number" inputMode="decimal" step="0.01" placeholder={`${label} em ${unit}`} value={val} onChange={e=>setVal(e.target.value)} autoFocus style={{flex:1,padding:"10px 12px",background:"rgba(14,18,48,0.8)",border:`1px solid ${T.gB}`,borderRadius:10,color:T.text,fontSize:15,outline:"none",textAlign:"center"}}/>
        <button onClick={()=>{if(!val)return;onQuickAdd(field,parseFloat(val));setVal("");setAdding(false)}} style={{padding:"10px 16px",borderRadius:10,background:"#a3e635",color:T.bg1,fontSize:13,fontWeight:700}}>{L("save")}</button>
      </div>}
    </div>);
  }

  const inp={width:"100%",padding:"12px",background:"rgba(14,18,48,0.8)",border:`1px solid ${T.gB}`,borderRadius:10,color:T.text,fontSize:15,outline:"none",textAlign:"center"};

  return(<div style={{padding:"calc(16px + env(safe-area-inset-top)) 20px 0"}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
      <div style={{display:"flex",alignItems:"center",gap:10}}><button onClick={onBack} style={{width:32,height:32,borderRadius:10,background:T.glass,border:`1px solid ${T.gB}`,display:"flex",alignItems:"center",justifyContent:"center"}}><Icon name="back" size={16} color={T.sub}/></button><h2 style={{fontSize:17,fontWeight:700,margin:0}}>{L("growth")}</h2></div>
      <button onClick={()=>setShowForm(!showForm)} style={{padding:"6px 12px",borderRadius:10,background:"rgba(163,230,53,0.1)",border:"1px solid rgba(163,230,53,0.2)",fontSize:12,fontWeight:700,color:"#a3e635"}}>{showForm?L("cancel"):(_lang==="en"?"+ Measure":"+ Medição")}</button>
    </div>

    {showForm&&<div style={{background:T.glass,borderRadius:14,padding:16,marginBottom:16,border:`1px solid ${T.gB}`}}>
      <div style={{fontSize:12,fontWeight:700,color:T.sub,marginBottom:12}}>{_lang==="en"?"New measurement":"Nova medição"}</div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:12}}>
        <Fld label={`${L("weight")} (kg)`}><input type="number" inputMode="decimal" step="0.01" placeholder="4.5" value={wK} onChange={e=>setWK(e.target.value)} style={inp}/></Fld>
        <Fld label={`${_lang==="en"?"Length":"Comp."} (cm)`}><input type="number" inputMode="decimal" step="0.1" placeholder="55" value={lC} onChange={e=>setLC(e.target.value)} style={inp}/></Fld>
        <Fld label={`${L("head")} (cm)`}><input type="number" inputMode="decimal" step="0.1" placeholder="37" value={hC} onChange={e=>setHC(e.target.value)} style={inp}/></Fld>
      </div>
      <button onClick={doAdd} style={{width:"100%",padding:12,borderRadius:10,background:"#a3e635",color:T.bg1,fontSize:14,fontWeight:700}}>{_lang==="en"?"Save measurement":L("save")+" medição"}</button>
    </div>}

    {/* Percentile cards */}
    {latest&&<div style={{fontSize:11,color:T.sub,marginBottom:10}}>
      {latest.label===(_lang==="en"?"Birth":"Nasc.")?(_lang==="en"?"Birth data":L("birthData")):`${_lang==="en"?"Last":"Últ."}: ${latest.label}`} · {ageMonths.toFixed(1)} {_lang==="en"?"mo":"meses"}
    </div>}
    <PercentileCard label={L("weight")} value={latest?.weightKg} unit="kg" table={WHO_GIRLS.weight} icon="target" field="weightKg" onQuickAdd={quickAdd}/>
    <PercentileCard label={L("length")} value={latest?.lengthCm} unit="cm" table={WHO_GIRLS.length} icon="ruler" field="lengthCm" onQuickAdd={quickAdd}/>
    <PercentileCard label={L("head")} value={latest?.headCm} unit="cm" table={WHO_GIRLS.head} icon="target" field="headCm" onQuickAdd={quickAdd}/>

    {/* Growth charts */}
    {allPoints.length>0&&<>
      <div style={{fontSize:12,fontWeight:600,color:T.dim,marginTop:16,marginBottom:10,textTransform:"uppercase",letterSpacing:0.8}}>{_lang==="en"?"Growth curves":"Curvas de crescimento"}</div>
      <GrowthChart label={`${L("weight")} (kg)`} field="weightKg" table={WHO_GIRLS.weight} color={T.green}/>
      <GrowthChart label={`${L("length")} (cm)`} field="lengthCm" table={WHO_GIRLS.length} color={T.blue}/>
      <GrowthChart label={`${L("head")} (cm)`} field="headCm" table={WHO_GIRLS.head} color={T.amber}/>
    </>}

    {/* History table */}
    {allPoints.length>0&&<><div style={{fontSize:12,fontWeight:600,color:T.dim,marginTop:8,marginBottom:10,textTransform:"uppercase",letterSpacing:0.8}}>Histórico</div>
      {[...allPoints].reverse().map((p,i)=><div key={i} style={{display:"flex",alignItems:"center",gap:12,padding:"8px 12px",marginBottom:4,background:T.glass,borderRadius:10,border:`1px solid ${T.gB}`}}>
        <span style={{fontSize:11,color:T.sub,minWidth:50}}>{p.label}</span>
        <div style={{flex:1,display:"flex",gap:10,fontSize:12}}>
          {p.weightKg&&<span style={{color:T.green}}>{p.weightKg}kg</span>}
          {p.lengthCm&&<span style={{color:T.blue}}>{p.lengthCm}cm</span>}
          {p.headCm&&<span style={{color:T.amber}}>Cab. {p.headCm}</span>}
        </div>
      </div>)}
    </>}
    <div style={{marginTop:16,padding:12,background:T.glass,borderRadius:12,border:`1px solid ${T.gB}`,fontSize:10,color:T.dim,lineHeight:1.6}}>
      Curvas OMS para meninas 0-24m. Linha tracejada = P50 (mediana). Faixa = P3-P97.
    </div>
  </div>);
}

                {isNap&&!isBed&&<div style={{fontSize:9,color:T.dim}}>WW {fmtDur(s.ww)}{s.durRange?" · "+s.durRange:s.duration>0?" · "+fmtDur(s.duration||s.durMin):""}</div>}
              </div>
              <span style={{fontSize:9,fontWeight:600,padding:"2px 7px",borderRadius:5,background:s.status==="done"?T.greenS:s.status==="next"?`${color}20`:`${T.dim}12`,color:statusColor}}>{s.status==="done"?(_lang==="en"?"Done":"Feito"):s.status==="next"?(_lang==="en"?"Next":"Prox."):(_lang==="en"?"Later":"Depois")}</span>
            </div>
          })}
        </>}
      </>}
    </Modal>

    <Sheet open={showAdd&&!formType} onClose={()=>setShowAdd(false)}>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:"10px 0",padding:"0 16px"}}>{["wakeup","bottle","nursing","sleep","nap","diaper","bath","medicine","temperature"].map((type,i)=>{const cfg=TYPES[type];const last=entries.find(e=>e.type===type);const agoRaw=last?timeSince(last.date,last.time):null;const ago=agoRaw==="now"?"Just now":agoRaw;return(<button key={type} onClick={()=>setFormType(type)} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:10,padding:"12px 4px 8px",animation:`slideUp .3s ease ${i*0.035}s both`}}>
        <div style={{width:70,height:70,borderRadius:"50%",background:`radial-gradient(circle at 35% 30%, rgba(50,60,120,0.95), rgba(18,22,55,0.98))`,border:`1.5px solid ${cfg.color}25`,display:"flex",alignItems:"center",justifyContent:"center",boxShadow:`0 4px 20px rgba(0,0,0,0.4), 0 0 24px ${cfg.color}18, 0 0 48px ${cfg.color}08, inset 0 1px 0 rgba(200,210,255,0.08), inset 0 -2px 4px rgba(0,0,0,0.2)`,position:"relative",overflow:"hidden",filter:`drop-shadow(0 0 5px ${cfg.color}44)`}}>
          {/* Inner glow spot */}
          <div style={{position:"absolute",top:"15%",left:"25%",width:"40%",height:"30%",background:`radial-gradient(ellipse,${cfg.color}12,transparent)`,borderRadius:"50%",filter:"blur(6px)"}}/>
          <Icon name={cfg.icon} size={27} color={cfg.color}/>
        </div>
        <div style={{textAlign:"center"}}><div style={{fontSize:12,fontWeight:600,color:T.text,lineHeight:1.3}}>{cfg.label[_lang]||cfg.label.en}</div>{ago&&<div style={{fontSize:12,color:T.sub,fontWeight:500,marginTop:2}}>{ago}</div>}</div>
      </button>)})}</div>
    </Sheet>

    <Sheet open={!!formType} onClose={()=>{setFormType(null);setEditEntry(null)}}>
      {formType&&<AddForm type={formType} onSave={addEntry} savedMeds={savedMeds} onSaveMeds={async m=>await FB.saveMeds(m)} editEntry={editEntry} lastBottleMl={lastBottleMl} topMl={topMl}/>}
    </Sheet>

    {showProfile&&<ProfilePage profile={profile} onSave={async p=>await FB.saveProfile(p)} onBack={()=>setShowProfile(false)} onGrowth={()=>{setShowProfile(false);goTo("growth")}} onShowChangelog={()=>setShowChangelog(true)} hasUnreadChangelog={hasUnreadChangelog}/>}
    {showInbox&&<InboxPanel inbox={inbox} onClose={()=>setShowInbox(false)} onMarkRead={markInboxRead} onMarkAllRead={markAllInboxRead} lang={lang}/>}
    {showChangelog&&<ChangelogModal onClose={closeChangelog} lang={lang}/>}
    {showUpdateToast&&!showChangelog&&<UpdateToast fromVersion={profile.lastSeenVersion} toVersion={APP_VERSION} onView={openChangelog} onDismiss={dismissUpdateToast} lang={lang}/>}
    <TimerBar activeTimer={activeTimer} onStop={stopTimer} onSwitch={switchSide} onPause={pauseNursing}/>

    <nav style={{position:"fixed",bottom:"4px",left:"50%",transform:"translateX(-50%)",display:"flex",alignItems:"center",gap:6,padding:"8px 16px",background:"rgba(8,10,28,0.95)",backdropFilter:"blur(20px)",WebkitBackdropFilter:"blur(20px)",borderRadius:40,border:"1px solid rgba(80,90,160,0.06)",boxShadow:"0 4px 24px rgba(0,0,0,0.6)",zIndex:50}}>
      {[{icon:"home",label:"HOME",active:page==="home"&&!showAdd,action:()=>goTo("home")},{icon:"clock",label:_lang==="en"?"HISTORY":"HIST.",active:page==="history",action:()=>goTo("history")}].map(n=><button key={n.icon} onClick={n.action} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:2,padding:"8px 14px",borderRadius:16,background:n.active?"rgba(139,124,246,0.12)":"transparent"}}><Icon name={n.icon} size={20} color={n.active?T.accent:T.dim}/>{n.active&&<span style={{fontSize:8,fontWeight:700,color:T.accent,letterSpacing:0.5}}>{n.label}</span>}</button>)}
      <button onClick={()=>{setShowAdd(!showAdd);setFormType(null);setPage("home")}} style={{width:50,height:50,borderRadius:"50%",background:`linear-gradient(135deg,#7c3aed,${T.accent})`,display:"flex",alignItems:"center",justifyContent:"center",boxShadow:`0 4px 20px ${T.accent}55`,transition:"transform .2s cubic-bezier(0.34,1.56,0.64,1)",transform:showAdd?"rotate(45deg) scale(1.05)":"scale(1)",margin:"-4px 2px"}}><Icon name="plus" size={24} color="#fff"/></button>
      {[{icon:"chart",label:"STATS",active:page==="stats"||page==="growth",action:()=>goTo("stats")},{icon:"gear",label:_lang==="en"?"SETTINGS":"CONFIG",active:false,action:()=>setShowProfile(true)}].map(n=><button key={n.icon} onClick={n.action} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:2,padding:"8px 14px",borderRadius:16,background:n.active?"rgba(139,124,246,0.12)":"transparent"}}><Icon name={n.icon} size={20} color={n.active?T.accent:T.dim}/>{n.active&&<span style={{fontSize:8,fontWeight:700,color:T.accent,letterSpacing:0.5}}>{n.label}</span>}</button>)}
    </nav>
  </div>);
}

// Remove loading screen
var _ld=document.getElementById('load-debug');if(_ld)_ld.remove();
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

</body>
</html>
